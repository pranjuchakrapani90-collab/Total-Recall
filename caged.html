<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e">
<title>CAGED Course · Guitar Studio</title>

<style>
:root{
  --bg:#f4f7fb;--paper:#fff;--ink:#172033;--muted:#697386;--line:#e5e7eb;

  --body:system-ui,-apple-system,"Segoe UI",sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--body)}
[hidden]{display:none!important}
header.top{background:linear-gradient(135deg,#0f766e,#4f46e5);color:#fff;padding:22px 16px}
.hin{max-width:980px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.toprow{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.backlink{font-size:13px;color:#fff;opacity:.9;text-decoration:none}
.eyebrow{font:600 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:#ccfbf1}
h1{font:750 clamp(26px,5vw,36px)/1.1 var(--body);margin:4px 0 0}
.stats{display:flex;gap:16px;flex-wrap:wrap}
.stat{text-align:right}.stat b{display:block;font:700 24px/1 var(--mono)}.stat span{font-size:12px;color:#ccfbf1}
.stat.met b{color:#a7f3d0}
.studio{display:inline-flex;gap:4px;margin-top:12px;background:#ffffff2e;border-radius:12px;padding:4px;flex-wrap:wrap}
.studio a{color:#fff;text-decoration:none;font:650 14px var(--body);padding:8px 14px;border-radius:9px;white-space:nowrap}
.studio a.on{background:#fff;color:var(--teal)}
.studio a:not(.on):hover{background:#ffffff1f}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 110px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;margin-bottom:16px;min-width:0}
.card h2{font:700 22px/1.2 var(--body);margin:0}
.card h3{font:650 16px/1.3 var(--body);margin:0}
.num{font:500 12px var(--mono);color:var(--muted)}
.card p{margin:0;max-width:72ch}
.muted{color:var(--muted)}
button,select{font:650 14px var(--body);cursor:pointer;border:0;border-radius:10px;background:var(--teal-soft);color:var(--teal);padding:9px 14px}
select{padding:8px 10px;border:1px solid var(--line);background:#fff;color:var(--ink)}
button:disabled{opacity:.45;cursor:default}
.play{background:var(--teal);color:#fff}
.play.on{background:var(--brass)}
.big{padding:12px 18px;font-size:15px}
.good{background:var(--good);color:#fff}
.linkb{background:none;padding:0;color:var(--teal);text-decoration:underline;font-weight:500}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:600 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:6px 9px;border-radius:999px;background:var(--teal-soft);color:var(--teal)}
.chip.t{background:var(--brass-soft);color:#5b21b6}.chip.g{background:var(--good-soft);color:var(--good)}.chip.a{background:var(--amber-soft);color:var(--amber)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.gbar{height:10px;border-radius:6px;background:var(--teal-soft);overflow:hidden}
.gbar i{display:block;height:100%;width:0;background:var(--good);transition:width .5s}
.tip{background:var(--brass-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.lesson-txt p{margin:0 0 10px}
.lesson-txt p:last-child{margin:0}
ol.how{margin:0;padding-left:22px}ol.how li{margin:2px 0}
details.more summary{cursor:pointer;color:var(--teal);font-weight:600}
/* levels */
.levels{display:flex;flex-direction:column;gap:10px}
.lvl{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.lvl.lock{opacity:.6}
.lvl.cur{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal)}
.lvl.fin{border-left:5px solid var(--good)}
.lvh{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.lvh b{font-size:16px}.lvh span{font-size:12px;color:var(--muted)}
.lvl p{margin:4px 0 8px;font-size:14px;color:var(--muted)}
.sec-t{font:700 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:10px 0 2px}
.lessons{display:flex;flex-wrap:wrap;gap:8px}
.les{font:500 13px var(--body);padding:7px 11px;border-radius:999px;background:var(--bg);color:var(--ink);position:relative;overflow:hidden}
.les i{position:absolute;left:0;bottom:0;height:3px;background:var(--teal)}
.les.ok{background:var(--good-soft);color:var(--good)}
.les.next{background:var(--teal);color:#fff}
.les.next i{background:#fff}
/* reps */
.stages{display:flex;flex-direction:column;gap:8px}
.stage{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stage .sl{font:700 12px var(--mono);min-width:118px;color:var(--muted)}
.stage.lock .sl{opacity:.6}
.rep{font:650 13px var(--body);padding:7px 11px;border-radius:10px;background:var(--bg);color:var(--ink);border:2px solid transparent}
.rep.ok{background:var(--good-soft);color:var(--good)}
.rep.sel{border-color:var(--teal)}
.rep.lockd{opacity:.5}
.repinfo{font-size:14px;background:var(--teal-soft);border-radius:10px;padding:10px 12px}
/* session */
.sess{display:flex;flex-direction:column;gap:6px}
.si{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:8px 10px;flex-wrap:wrap}
.si.ok{background:var(--good-soft);border-color:#a7f3d0}
.si .st{font-size:13px;color:var(--muted)}
/* fretboard */
.fbwrap{overflow-x:auto;border-radius:10px;background:#fbf8f3;border:1px solid #eadfcc}
svg.fb{display:block;min-width:100%}
.fb .str{stroke:#8a7a63;stroke-width:1.2}
.fb .fr{stroke:#c9b99c;stroke-width:2}
.fb .nut{stroke:#5b4b33;stroke-width:5}
.fb .inl{fill:#e7dcc8}
.fb .fn{font:600 11px var(--mono);fill:#8a7a63;text-anchor:middle}
.fb .sn{font:600 10px var(--mono);fill:#8a7a63;text-anchor:end}
.fb .d circle,.fb .d rect{stroke:#fff;stroke-width:1.5}
.fb .d text{font:700 11px var(--mono);fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.fb .d.i1 rect{fill:var(--root)}
.fb .d.i3 circle{fill:var(--dot)}.fb .d.ib3 circle{fill:var(--b3)}.fb .d.ib7 circle{fill:var(--b7)}.fb .d.i5 circle{fill:#334155}
.fb .d.sc circle{fill:var(--scale)}.fb .d.sc rect{fill:#5eead4}
.fb .d.rel rect{fill:#fff;stroke:var(--root);stroke-width:2}.fb .d.rel text{fill:var(--root)}
.fb .d.gh circle{fill:#fff;stroke:#9ca3af;stroke-dasharray:3 2;stroke-width:1.5}.fb .d.gh text{fill:#9ca3af}
.fb .d.gm circle{fill:#fff;stroke:var(--root);stroke-dasharray:3 2;stroke-width:1.5}.fb .d.gm text{fill:var(--root)}
.fb .d.hit circle,.fb .d.hit rect{stroke:#f59e0b;stroke-width:4}
.fb .band{opacity:.12}
.fb .bandl{font:800 13px var(--body);text-anchor:middle}
.fb .dim{opacity:.18}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.legend i.sq{border-radius:3px}
.ctl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.ctl b{font:700 15px var(--mono);color:var(--ink);min-width:3ch}
.ctl input[type=range]{width:160px}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
input{accent-color:var(--teal)}
/* tab */
.tabscroll{overflow-x:auto}
.tab{display:flex;flex-wrap:wrap;row-gap:6px;font:600 13px var(--mono)}
.tbar{display:flex;position:relative;padding:18px 4px 0 2px;border-radius:8px;cursor:pointer}
.tbar::before,.tbar::after{content:"";position:absolute;top:27px;height:90px;border-left:2px solid var(--line)}

.tbar.sel{background:var(--teal-soft);box-shadow:inset 0 0 0 2px var(--teal)}

.bno{position:absolute;top:1px;right:6px;font:700 11px var(--mono);color:var(--muted)}
.chd{position:absolute;top:1px;left:26px;right:22px;font:700 12px var(--body);color:var(--teal);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbar.nc .chd{left:4px}

.col{display:grid;grid-template-rows:repeat(6,18px) 16px 16px 16px;flex:none;width:clamp(15px,calc((min(100vw,940px) - 108px) / var(--n,8)),36px);border-radius:4px}
.c{position:relative;text-align:center;line-height:18px}

.c i.r{color:var(--root);font-weight:800}.c i.cs{color:#64748b}.c i.s{color:#475569}
.c i sup{font-size:8px;color:var(--brass);margin-right:1px}
.cnt{font:500 10px/16px var(--mono);text-align:center;color:#c4c9d4}
.col.bt .cnt{color:#8c94a3;font-weight:700}
.ivr{font:700 10px/16px var(--mono);text-align:center;color:var(--teal);white-space:nowrap;letter-spacing:-.5px}
.ivr.b3{color:var(--b3)}.ivr.b7{color:var(--b7)}.ivr.sc{color:var(--scale)}
.pk{font:700 11px/16px var(--mono);text-align:center;color:#64748b}
.col.on{background:var(--teal-soft)}
.col.tick{background:#e6f6f4}.col.tick .cnt{color:var(--teal)}
.barsbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.barsbar button{padding:7px 11px;font-size:13px}
.barsbar b{color:var(--teal);font-size:14px}
/* now bar */
.nowbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 18px #141e3714}
#nbPlay{min-width:96px}
.nbtxt{display:flex;flex-direction:column;flex:1;min-width:0;line-height:1.3;overflow:hidden}
.nbinfo{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nbgoal{font:600 12px var(--mono);color:var(--muted);white-space:nowrap}

.nbtempo{display:flex;align-items:center;gap:6px;font:600 13px var(--mono);flex:none}
.nbtempo button{padding:6px 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:30;background:var(--good);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px);text-align:center}
.navf{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.mapctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.shbtn{padding:6px 10px;font-size:13px;border:2px solid transparent}

.prog3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.prog3 div{background:var(--bg);border-radius:10px;padding:8px 10px}

.prog3 span{font-size:11px;color:var(--muted)}
@media(max-width:560px){.stage .sl{min-width:100%}.ctl input[type=range]{width:120px}}

  <span class="nbtempo"><button type="button" data-tdelta="-5" aria-label="Slower">−</button><span id="nbT">60</span><button type="button" data-tdelta="5" aria-label="Faster">+</button></span></div>
<script>
"use strict";
/*ENGINE-START*/
/* ===================== Theory: strings, notes, the five CAGED shapes =====================
   Every shape is written once, in its own open-position key (C shape in C, A shape in A …), as [string, fret offset].
   Moving a shape up the neck adds the same number of frets to every note (n). Intervals are worked out from pitch. */
const OPEN={1:64,2:59,3:55,4:50,5:45,6:40};
const NM=["C","Db","D","Eb","E","F","F#","G","Ab","A","Bb","B"];
const IVN=["1","b2","2","b3","3","4","b5","5","b6","6","b7","7"];
const QN={maj:"major",min:"minor",dom:"7th"},QS={maj:"",min:"m",dom:"7"};
const QT={maj:[0,4,7],min:[0,3,7],dom:[0,4,7,10]};
const mod=(a,b)=>((a%b)+b)%b;
const r12=x=>Math.round(x*48)/48;
const STR={1:"high e",2:"B",3:"G",4:"D",5:"A",6:"low E"};
const SH={
 C:{k:0,rs:[5,2],v:{
  maj:{chord:[[5,3],[4,2],[3,0],[2,1],[1,0]],full:[[6,0],[6,3],[5,3],[4,2],[3,0],[2,1],[1,0],[1,3]]},
  min:{chord:[[5,3],[4,1],[3,0],[2,1]],full:[[6,-1],[6,3],[5,3],[4,1],[3,0],[2,1],[1,-1],[1,3]]},
  dom:{chord:[[5,3],[4,2],[3,3],[2,1],[1,0]],full:[[6,0],[6,3],[5,1],[5,3],[4,2],[3,0],[3,3],[2,1],[1,0],[1,3]]}}},
 A:{k:9,rs:[5,3],v:{
  maj:{chord:[[5,0],[4,2],[3,2],[2,2],[1,0]],full:[[6,0],[5,0],[5,4],[4,2],[3,2],[2,2],[1,0]],desc:[[6,0],[5,0],[4,-1],[4,2],[3,2],[2,2],[1,0]]},
  min:{chord:[[5,0],[4,2],[3,2],[2,1],[1,0]],full:[[6,0],[5,0],[5,3],[4,2],[3,2],[2,1],[1,0]]},
  dom:{chord:[[5,0],[4,2],[3,0],[2,2],[1,0]],full:[[6,0],[6,3],[5,0],[5,4],[4,2],[3,0],[3,2],[2,2],[1,0],[1,3]],desc:[[6,0],[6,3],[5,0],[4,-1],[4,2],[3,0],[3,2],[2,2],[1,0],[1,3]]}}},
 G:{k:7,rs:[6,3,1],v:{
  maj:{chord:[[6,3],[5,2],[4,0],[3,0],[2,0],[1,3]],full:[[6,3],[5,2],[4,0],[3,0],[2,0],[2,3],[1,3]]},
  min:{chord:[[6,3],[5,1],[4,0],[3,0],[2,3],[1,3]],full:[[6,3],[5,1],[4,0],[3,0],[3,3],[2,3],[1,3]]},
  dom:{chord:[[6,3],[5,2],[4,0],[3,0],[2,0],[1,1]],full:[[6,1],[6,3],[5,2],[4,0],[4,3],[3,0],[2,0],[2,3],[1,1],[1,3]]}}},
 E:{k:4,rs:[6,4,1],v:{
  maj:{chord:[[6,0],[5,2],[4,2],[3,1],[2,0],[1,0]],full:[[6,0],[6,4],[5,2],[4,2],[3,1],[2,0],[1,0],[1,4]],desc:[[6,0],[5,-1],[5,2],[4,2],[3,1],[2,0],[1,0],[1,4]]},
  min:{chord:[[6,0],[5,2],[4,2],[3,0],[2,0],[1,0]],full:[[6,0],[6,3],[5,2],[4,2],[3,0],[2,0],[1,0],[1,3]]},
  dom:{chord:[[6,0],[5,2],[4,0],[3,1],[2,0],[1,0]],full:[[6,0],[6,4],[5,2],[4,0],[4,2],[3,1],[2,0],[2,3],[1,0],[1,4]],desc:[[6,0],[5,-1],[5,2],[4,0],[4,2],[3,1],[2,0],[2,3],[1,0],[1,4]]}}},
 D:{k:2,rs:[4,2],v:{
  maj:{chord:[[4,0],[3,2],[2,3],[1,2]],full:[[6,2],[5,0],[4,0],[4,4],[3,2],[2,3],[1,2]],desc:[[6,2],[5,0],[4,0],[3,-1],[3,2],[2,3],[1,2]]},
  min:{chord:[[4,0],[3,2],[2,3],[1,1]],full:[[6,1],[5,0],[4,0],[4,3],[3,2],[2,3],[1,1]]},
  dom:{chord:[[4,0],[3,2],[2,1],[1,2]],full:[[6,2],[5,0],[5,3],[4,0],[4,4],[3,2],[2,1],[2,3],[1,2]],desc:[[6,2],[5,0],[5,3],[4,0],[3,-1],[3,2],[2,1],[2,3],[1,2]]}}},
};
const ORD=["C","A","G","E","D"];
const shName=(S,q)=>S+(q==="min"?"m":q==="dom"?"7":"")+" shape";
function span(S,q){const v=SH[S].v[q],o=[...v.chord,...v.full,...(v.desc||[])].map(x=>x[1]);return [Math.min(...o),Math.max(...o)];}
/* where a shape sits for a key: n = frets above its open position. near = a fret to stay close to (bring the chord to you) */
function posN(S,key,q,near){const [lo,hi]=span(S,q),n=mod(key-SH[S].k,12);
  const c=[n-12,n,n+12].filter(x=>x+lo>=0&&x+hi<=18);
  if(near==null)return c.includes(n)?n:c[c.length-1];
  return c.slice().sort((a,b)=>Math.abs(a+(lo+hi)/2-near)-Math.abs(b+(lo+hi)/2-near))[0];}
const nt=(s,f,key)=>({s,f,m:OPEN[s]+f,iv:IVN[mod(OPEN[s]+f-key,12)]});
function shapeNotes(S,key,q,n,form){const v=SH[S].v[q],L=v[form]||v.full;return L.map(([s,o])=>nt(s,n+o,key)).sort((a,b)=>a.m-b.m||b.s-a.s);}
const chordName=(key,q)=>NM[mod(key,12)]+QS[q];
/* a chord placed on the neck */
function place(root,q,S,near){
  if(!S){let best=null;ORD.forEach(X=>{const n=posN(X,root,q,near==null?5:near),[lo,hi]=span(X,q),d=Math.abs(n+(lo+hi)/2-(near==null?5:near));if(!best||d<best.d-1e-9)best={S:X,n,d};});S=best.S;}
  const n=posN(S,root,q,near);
  return {S,n,key:mod(root,12),q,name:chordName(root,q),
    chord:shapeNotes(S,root,q,n,"chord"),full:shapeNotes(S,root,q,n,"full"),desc:shapeNotes(S,root,q,n,"desc"),
    win:[n+span(S,q)[0],n+span(S,q)[1]]};
}
function allPositions(S,key,q){const [lo,hi]=span(S,q),n0=mod(key-SH[S].k,12),out=[];
  [n0-12,n0,n0+12].forEach(n=>{if(n+lo>=0&&n+hi<=17)out.push(n);});return out;}
/* every CAGED position of one chord, low to high */
function ladder(key,q,maxF){const L=[];ORD.forEach(S=>allPositions(S,key,q).forEach(n=>L.push({S,n})));
  return L.filter(x=>x.n+span(x.S,q)[1]<=(maxF||17)).sort((a,b)=>a.n-b.n||ORD.indexOf(a.S)-ORD.indexOf(b.S));}

/* ===================== Building lines: events on a beat grid ===================== */
class Line{
  constructor(){this.ev=[];this.b=0;this.ch=[];this.bk=[];this.ghost=[];this.last=null;}
  lab(name,x){this.ch.push({b:r12(this.b),name,...(x||{})});return this;}
  note(n,d,o){const e={...n,b:r12(this.b),d,...(o||{})};this.ev.push(e);this.b=r12(this.b+d);this.last=e;return this;}

   how:["Plan the route first, with the guitar silent.","Land every chord perfectly the first time. Correcting after landing doesn't count.","Do it backwards too: the reps go up and come back down."]},
  {id:"j3",t:"Jump over a shape: minor chords",g:"jump",step:2,mode:"chord",rate:"q",reps:kL([[4,0,9],[2,7,5],[11,10,1]],"min"),
   txt:["The same jumping exercise with minor shapes: Cm shape → (Am) → Gm shape → (Em) → Dm shape.","The minor shapes connect exactly like the major ones; only the 3s have dropped a fret."],
   how:["Find each minor shape's root strings before you jump.","Say the chord name each time ('E minor, G-minor shape').","Go up, then come back down."]},
  {id:"j4",t:"Jump over a shape: 7th chords",g:"jump",step:2,mode:"chord",rate:"q",reps:kL([[9,2,7],[4,0,5],[11,10,3]],"dom"),
   txt:["7th chord shapes connect in the same order. Their grips change a little more (some have only four or five strings), so the jump is harder to see.","An A7 played as a G7 shape at fret 2, jump to the D7 shape at fret 7, jump to the A7 shape at fret 12: lots of distance. Spot the roots first."],
   how:["Spot the root of the next shape, then the rest of the grip.","Strum only the strings the 7th grip uses.","Back down the neck the same way."]},
  {id:"j5",t:"Jumping full arpeggios: major",g:"jump",step:2,mode:"arp",rate:"e",reps:kL([[2,0,7],[9,5,4],[11,3,10]],"maj"),
   txt:["Same jumps, now with full arpeggios. In each shape: start on the <b>lowest note</b>, go all the way up and all the way down, walk back up to the root, strum the chord, then jump.","Every arpeggio has a different number of notes, so the shapes don't take the same time. That's fine. Keep the eighth notes steady and let the bar fill out."],
   how:["Plan all three shapes before you start.","While strumming the chord, look at the next shape and its lowest note.","Up the neck and back down."]},
  {id:"j6",t:"Jumping full arpeggios: minor",g:"jump",step:2,mode:"arp",rate:"e",reps:kL([[0,9,4],[2,7,5],[11,1,10]],"min"),
   txt:["C minor in the Am shape (fret 3), jump to the Em shape (fret 8), jump to the Cm shape (fret 13–15). Then back.","Some minor arpeggios start on the b3, below the root. That's normal: always start from the lowest note in the shape."],
   how:["Say each shape name before playing it.","Strum the minor chord between arpeggios.","Up and back."]},
  {id:"j7",t:"Jumping full arpeggios: 7th",g:"jump",step:2,mode:"arp",rate:"e",reps:kL([[9,2,7],[4,0,5],[11,10,3]],"dom"),
   txt:["The hardest version: full 7th arpeggios through jumping shapes. Say the intervals as you go: 'flat 7, 1, 3, 5, flat 7…'. Saying them is how you track them in real time.","Remember the shortcut: it's the major arpeggio with the b7 dropped in, two frets below each root."],
   how:["Major arpeggio first if you get lost, then add the b7s.","Slow is fine. Stopping is not; keep the beat.","Up and back."]},
 ]},
 {id:"t",n:"Practice: thick side, thin side",d:"Break every arpeggio into two overlapping halves: the thick side (low E to G) and the thin side (D to high e). Then you can come in anywhere, in either direction.",ls:[
  {id:"t1",t:"The thick side",g:"side",side:"thick",rate:"e",reps:kSh([[["E",5],["A",5],["C",3]],[["G",5],["D",5],["E",8]],[["A",7],["C",7],["D",3]]],"maj"),
   txt:["If you only ever practise an arpeggio from the low E to the high e, you'll freeze when a solo drops you in the middle of it. So split it.","The <b>thick side</b> runs from the <b>low E to the G string</b>. It's also where bass lines and riffs come from, as you'll see in the playbook."],
   how:["Up the thick side, then back down.","Stop on the G string, don't drift onto the B.","Each rep changes the shape: name it before playing."]},
  {id:"t2",t:"The thin side",g:"side",side:"thin",rate:"e",reps:kSh([[["E",5],["A",5],["C",3]],[["G",5],["D",5],["E",8]],[["A",7],["C",7],["D",3]]],"maj"),
   txt:["The <b>thin side</b> runs from the <b>D string to the high e</b>. It overlaps the thick side on the D and G strings: the overlap is your bridge between the two halves.","Most lead lines live on the thin side."],
   how:["Start on the D string.","Up to the high e and back.","Notice which notes on the D and G strings you also played on the thick side."]},
  {id:"t3",t:"Thick and thin together",g:"side",side:"both",rate:"e",reps:kSh([[["E",5],["A",5],["C",5]],[["G",5],["D",5],["E",8]],[["A",7],["C",7],["D",3]]],"maj"),
   txt:["Thick side up and down, then thin side up and down: the same arpeggio as two pieces. Mentally divide them, then put them back together.","When improvising you'll often enter the middle of a shape. Having practised both halves, you can flow either way."],
   how:["Thick side, up and back.","Thin side, up and back.","Picture where they overlap (D and G strings) the whole time."]},
  {id:"t4",t:"Thick and thin: minor",g:"side",side:"both",rate:"e",reps:kSh([[["E",5],["A",5],["C",5]],[["G",7],["D",5],["E",8]],[["A",7],["C",7],["D",3]]],"min"),
   txt:["The same split for every minor arpeggio. Take your least favourite minor shape and make friends with it: thick to thin, thin to thick."],
   how:["Name the chord and the shape first.","Thick side, then thin side.","Find the b3 on each side before you start."]},
  {id:"t5",t:"Thick and thin: 7th",g:"side",side:"both",rate:"e",reps:kSh([[["E",5],["A",5],["C",5]],[["G",7],["D",5],["E",8]],[["A",7],["C",7],["D",3]]],"dom"),
   txt:["7th arpeggios split the same way. Find the b7 on each side: there's usually one on the thick side and one on the thin side."],
   how:["Spot the b7s first.","Thick, then thin.","Say the intervals as you play."]},
  {id:"t6",t:"Come in from the middle",g:"middle",rate:"e",reps:kSh([[["E",5,"maj"],["A",5,"min"],["C",3,"maj"]],[["G",5,"dom"],["D",5,"maj"],["E",8,"min"]],[["A",7,"dom"],["C",7,"min"],["D",3,"maj"]]]),
   txt:["The test of this level: start on a 3 or a 5 in the <b>middle</b> of the shape (G or D string), run up to the top, all the way down to the bottom, and back up to where you started.","This is exactly what happens in a solo: you arrive in the middle of an arpeggio and have to know where to go."],
   how:["Find the starting note before you play: it's labelled in the chord line above the tab.","Up, all the way down, back to the start.","Change direction without hesitating."]},
 ]},
 {id:"b",n:"Practice: bring the chords to you",d:"Stay in one four- or five-fret area and find every chord of a progression there. Then keep the beat going through all their arpeggios.",ls:[
  {id:"b1",t:"A – D – E in one place: chords",g:"prog",mode:"chords",beats:8,tonic:9,prog:[[0,"maj","E"],[5,"maj","A"],[7,"maj","C"]],rate:"q",reps:kL([[9,7,0],[11,2,5],[4,10,1]],"maj"),
   txt:["Playing A at fret 5, D at fret 5 and then jumping up to E at fret 7 is a big no-no when you improvise. Your hand leaves the place where your ideas are.","Instead, <b>bring the chords to you</b>: E-shape A at fret 5, A-shape D at fret 5, and for E, ask 'what connects to the other side of the A shape?' The C shape: E chord around frets 4–7.","Use the shape connections and the root strings to find each chord. The first time it might take half an hour. That's fine; it gets faster every time."],
   how:["Find all three chords without moving your hand more than a fret or two.","Play eight beats on each chord.","When it feels easy, try the same three chords in another area of the neck."]},
  {id:"b2",t:"A – D – E in one place: arpeggios",g:"prog",mode:"arps",beats:8,tonic:9,prog:[[0,"maj","E"],[5,"maj","A"],[7,"maj","C"]],rate:"e",reps:kL([[9,7,0],[11,2,5],[4,10,1]],"maj"),
   txt:["Same chords, same place, now as continuous eighth notes through each chord's full arpeggio. Eight beats per chord.","<b>Start each chord on its root</b>, wherever the nearest root is, so you hear the chord change on the downbeat. Then go up or down, as you like."],
   how:["Keep the beat going through the changes, never stop.","If you hit a wrong note, keep going.","Listen: does the line clearly change chord on beat 1?"]},
  {id:"b3",t:"A – D – E higher up",g:"prog",mode:"arps",beats:8,tonic:9,prog:[[0,"maj","D"],[5,"maj","G"],[7,"maj","A"]],rate:"e",reps:kL([[9,7,0],[11,2,5],[4,10,1]],"maj"),
   txt:["The same progression in a different area: A as a D shape (frets 7–10), D as a G shape, E as an A shape. You should be able to bring the chords to you anywhere on the neck."],
   how:["Find the three shapes before starting.","Root first on every chord.","Eight beats each, steady."]},
  {id:"b4",t:"Am – G – D7: minor, major, 7th",g:"prog",mode:"arps",beats:8,tonic:9,prog:[[0,"min","E"],[10,"maj","D"],[5,"dom","A"]],rate:"e",reps:kL([[9,4,2],[7,11,0],[5,1,6]],"min"),
   txt:["Now a progression mixing all three chord types, all around the 5th fret: <b>Am</b> as an Em shape, <b>G</b> as a D shape, <b>D7</b> as an A7 shape.","Find G near fret 5: you know G is at fret 3 (E shape), and what connects above an E shape? The D shape. For D7: there's a D on the A string at fret 5, and the A string is the A7 shape's root string."],
   how:["Chords first (eight beats each) until the moves are automatic.","Then the arpeggios as written.","Start every chord on a root."]},
  {id:"b5",t:"Thick side first, thin side second",g:"prog",mode:"sides",beats:4,tonic:9,prog:[[0,"min","E"],[10,"maj","D"],[5,"dom","A"]],rate:"e",reps:kL([[9,4,2],[7,11,0],[5,1,6]],"min"),
   txt:["Through the progression twice: first time around only the <b>thick side</b> of each arpeggio, second time only the <b>thin side</b>.","This is the first taste of soloing with arpeggios: the progression's chords, played as melody, without leaving your spot."],
   how:["Thick side: low E to G string.","Thin side: D string to high e.","Same tempo, no stops."]},
  {id:"b6",t:"Any progression, anywhere",g:"prog",mode:"arps",beats:4,tonic:0,rate:"e",reps:[[{k:0,q:"maj",p:0,near:5},{k:9,q:"min",p:1,near:7},{k:7,q:"maj",p:2,near:9}],[{k:2,q:"maj",p:3,near:4},{k:4,q:"min",p:4,near:8},{k:5,q:"maj",p:5,near:10}],[{k:7,q:"maj",p:6,near:12},{k:9,q:"maj",p:7,near:5},{k:11,q:"min",p:8,near:6}]],
   txt:["The final practice session: a different progression in a different area of the neck every rep. The course chooses the shapes by proximity, the way you'll do it yourself: for each chord, the shape closest to where your hand already is.","Before pressing play, look at the chord names and try to find the shapes yourself. Then check against the fretboard."],
   how:["Read the progression (it's written in the rep).","Find each chord near the given fret, silently.","Play the arpeggios, root first, four beats each."]},
 ]},
 {id:"r",n:"Playbook: the rhythm section",d:"Plays 1–3. Music is a pyramid: drums at the bottom, then bass, then rhythm, then lead. We start where guitar starts, with bass lines and riffs made from arpeggios.",ls:[
  {id:"r1",t:"Play 1: one-chord bass groove (minor)",g:"groove",tonic:9,prog:[[0,"min","E"]],pats:[["0--0 1-2- 3-2- 1-0-","0--0 1-2- 3--4 -3-2"]],rate:"s",reps:kL([[9,7,11],[0,2,4],[5,10,1]],"min"),
   txt:["In jam band vamps, or when the band drops down behind a singer, someone plays a little bass line on one chord. On guitar you build it from the <b>thick side</b> of the chord's arpeggio.","Here: A minor, Em shape at fret 5. Root, b3, 5, octave, b3: syncopated, in sixteenths. Everyone else is holding the chord, and your line is made of the same ingredients, so it can't clash.","Come in on a root. The only interval you need to think about here is the 1."],
   how:["Play along with the backing chord turned on.","Lock the rhythm in first; play it on one note if you need to.","Then improvise your own groove from the same notes."]},
  {id:"r2",t:"Play 1: one-chord groove (major, 7th, D shape)",g:"groove",qr:1,tonic:7,prog:[[0,"maj","E"]],pats:[["0-0- 1-2. 3-.- 2-1-","0-0- 1-2. 3-4- 3-2-"]],rate:"s",reps:[[{k:7,q:"maj"},{k:9,q:"maj"},{k:5,q:"maj"}],[{k:11,q:"dom"},{k:9,q:"dom"},{k:4,q:"dom"}],[{k:5,q:"maj",S:"D"},{k:7,q:"maj",S:"D"},{k:10,q:"maj",S:"D"}]],
   txt:["Same idea on a major chord (G, E shape), then on 7th chords (B7 in the E7 shape: 1 3 5 b7 make a classic jam-band bass line), then on a <b>D-shape</b> chord, where the thick side starts on the 3: 3 5 1 3.","Pick the chord's root strings in advance, so you know where your groove can start."],
   how:["Find the thick side of each shape.","Play the written groove, then improvise for a few loops.","Try a groove that ends on the b7 for the 7th chords."]},
  {id:"r3",t:"Play 2: two-chord groove",g:"groove",tonic:9,prog:[[0,"min","E"],[10,"maj","E"]],pats:["0-1- 2-3- 4-3- 0---","0-1- 2-3- 4-3- 0---"],rate:"s",reps:kL([[9,4,2],[7,11,0],[5,1,6]],"min"),
   txt:["Two chords going back and forth: <b>Am to G</b>. In a bass role you <b>chase the root</b>: E-minor shape at fret 5 for Am, E shape at fret 3 for G.","The trick is the same theme on both chords: 1 b3 5 1 b3 1, then 1 3 5 1 3 1. A symmetrical groove, and only the 3 changes."],
   how:["Play the written groove.","Then make up your own theme and move it between the chords.","Get a looper or use the backing chords and groove for a few minutes."]},
  {id:"r4",t:"Play 2: multi-chord bass line",g:"groove",tonic:11,prog:[[0,"maj","E"],[10,"maj","E"]],pats:[["0--1 -2-3 -2-1 0-a-"],["0--1 -2-3 -2-1 0-a-"]],rate:"s",reps:kL([[11,9,7],[2,4,0],[5,10,1]],"maj"),
   txt:["B to A, both E shapes: the same groove shape slid two frets. Then try your own: look at the chord shape you're on, take its thick side, and make a line that starts on the root.","The 'a' in the line is the note just below the root in the shape, which is often the 5, a strong pickup into the next bar."],
   how:["Loop the written line.","Change one rhythm, keep the notes.","Change one note, keep the rhythm."]},
  {id:"r5",t:"Play 3: two chords, one riff (D shape)",g:"riff",tonic:7,prog:[[0,"maj","D"],[10,"maj","D"]],rh:"x--x --x- x-x- -x--",frag:[0,1,2,3,2,3],rate:"s",reps:kL([[7,9,2],[5,0,4],[10,11,3]],"maj"),
   txt:["A favourite rock move: play the first chord with a strong rhythm, then <b>hit the second chord once and finish the bar with a piece of its arpeggio</b>.","G (D shape at fret 5) to F (D shape at fret 3). The fragment comes from the thin side of the F arpeggio, played downwards from the top."],
   how:["Rhythm on chord 1, palm-mute lightly if you like.","One strum on chord 2, then the fragment.","Write your own fragment from the same arpeggio."]},
  {id:"r6",t:"Play 3: minor and 7th riffs",g:"riff",qr:1,tonic:2,prog:[[0,"min","E"],[10,"min","E"]],rh:"x-x- -x-x x--x --x-",frag:[0,1,2,3,4,3],rate:"s",reps:[[{k:2,q:"min"},{k:4,q:"min"},{k:9,q:"min"}],[{k:11,q:"dom",p7:1},{k:9,q:"dom",p7:1},{k:4,q:"dom",p7:1}],[{k:7,q:"min"},{k:0,q:"min"},{k:5,q:"dom",p7:1}]],
   txt:["The same play with minor chords (D minor to C minor, both E-minor shapes) and with 7th chords (B7 to A7, E7 shapes).","Use the 7th shapes you found easiest; this is rhythm guitar, so comfort wins."],
   how:["Rhythm on the first chord.","Hit, then arpeggio on the second.","Swap which chord gets the arpeggio."]},
 ]},
 {id:"p",n:"Playbook: chords into lines",d:"Plays 4–5. Make the chords disappear into pure arpeggios, then sew the arpeggios together by proximity: voice leading.",ls:[
  {id:"p1",t:"Play 4: make the chords disappear",g:"prog",mode:"dis",beats:4,dirs:[1,-1,1],tonic:7,R:8,prog:[[0,"min","C"],[5,"maj","E"],[10,"maj","A"]],rate:"e",reps:kL([[7,9,2],[0,4,5],[11,10,1]],"min"),
   txt:["A famous jam-band intro is just <b>G minor, C, F</b>, but the guitarist never plays the chords. He plays the <b>Cm-shape arpeggio</b> for Gm (thick to thin), the <b>E-shape</b> arpeggio for C (thin to thick), and the <b>A-shape</b> for F, all around frets 6–12.","It sounds like magic until you see it: it's exactly the 'bring the chords to you' practice, played as a composed line."],
   how:["Find the three shapes around fret 8.","Gm up from the root, C down from the top, F up again.","Then write your own: any 2–4 chords, chords replaced by arpeggios."]},
  {id:"p2",t:"Play 4: your own progression as arpeggios",g:"prog",mode:"dis",beats:4,tonic:0,R:5,prog:[[0,"maj"],[7,"maj"],[9,"min"],[5,"maj"]],rate:"e",reps:kL([[0,7,2],[9,4,5],[10,3,11]],"maj"),
   txt:["I – V – vi – IV, the most common progression in pop, with every chord replaced by its arpeggio, alternating up and down, all in one area of the neck.","Afterwards, make up your own direction pattern: up-up-down-down, or start each one from the 3."],
   how:["See all four shapes first.","Follow the directions in the tab.","Then compose your own version."]},
  {id:"p3",t:"Play 5: proximity playing",g:"prog",mode:"prox",beats:8,tonic:9,prog:[[0,"maj","E"],[5,"maj"]],R:6,rate:"e",reps:kL([[9,2,4],[7,0,11],[5,10,1]],"maj"),
   txt:["Arpeggio lines sound melodic when the chords <b>swing into each other</b>. The secret is called <b>voice leading</b>, or proximity playing: when the chord changes, don't jump to the new arpeggio's root; start on the <b>nearest note</b> of the new arpeggio to where you are.","Often it's a half step away: you end the A arpeggio on the G string fret 6 (C♯) and the D arpeggio is right there at fret 7 (D). One tiny step, and the change sounds sewn together."],
   how:["Play the line and listen to the moment of the chord change.","Find where you ended and the closest note of the next chord.","Make up your own line with the same rule."]},
  {id:"p4",t:"Play 5: proximity with minor chords",g:"prog",mode:"prox",beats:8,tonic:11,prog:[[0,"min"],[10,"min","D"]],R:8,rate:"e",reps:kL([[11,4,2],[9,7,0],[6,1,5]],"min"),
   txt:["B minor to A minor. Rather than jumping down to an A minor elsewhere, bring it to you: the <b>Dm-shape</b> A minor sits right next to the B minor.","Sew the two arpeggios together with the closest note."],
   how:["Find both shapes.","Play the line, then improvise your own with the same rule.","Try ending the first chord on its b3 and stepping to the next chord's nearest tone."]},
  {id:"p5",t:"Play 5: four chords, one line",g:"prog",mode:"prox",beats:4,tonic:9,prog:[[0,"min"],[8,"maj"],[3,"maj"],[10,"maj"]],R:6,rate:"e2",reps:kL([[9,4,2],[7,11,0],[5,1,6]],"min"),
   txt:["Am – F – C – G as one continuous eighth-note line, every chord change voice-led. This is the skill the soloing plays are built on."],
   how:["Listen for the smooth joins.","Keep the line moving; no gaps at the changes.","Then improvise your own four-chord line."]},
  {id:"p6",t:"Guide tones through 7th chords",g:"prog",mode:"gt",beats:4,tonic:2,prog:[[0,"dom"],[5,"dom"],[0,"dom"],[7,"dom"]],R:7,rate:"e2",reps:kL([[2,9,4],[7,0,5],[10,3,11]],"dom"),
   txt:["The strongest notes to land on at a chord change are the <b>3 and the b7</b>, the notes that define a 7th chord. They're called <b>guide tones</b>.","In this line, every chord change lands on the nearest 3 or b7 of the new chord. It's a blues-style progression (I7 – IV7 – I7 – V7) and you'll hear how it spells out the changes."],
   how:["Find the 3s and b7s of each chord first.","Play the line, listening to each landing note.","Try to hum the guide tones alone."]},
 ]},
 {id:"s",n:"Playbook: soloing with chord tones",d:"Plays 6–8. Solo with a scale, keep an eye on the chords, and drop the arpeggios in where they count: highlights, motifs and the juice of 7th chords.",ls:[
  {id:"s1",t:"The minor pentatonic, form 1",g:"penta",rate:"e",reps:kL([[9,7,11],[0,2,4],[5,10,6]],"min"),
   txt:["The soloing plays use the <b>minor pentatonic scale, form 1</b>: two notes per string, root on the low E. For A minor at fret 5: 5-8, 5-7, 5-7, 5-7, 5-8, 5-8.","The same five notes are also the <b>major pentatonic</b> of the key three frets up (A minor = C major): the b3 of the minor is the root of the major. Those notes are shown as hollow squares on the fretboard so you can link the two.","Form 1 sits around the E-minor shape chord (and the G-shape chord of the relative major). That's how the scale and the chords connect."],
   how:["Up and down, alternate picking on each string.","Say the root each time you hit it.","Find the Em-shape chord inside the box."]},
  {id:"s2",t:"Play 6: highlight the first chord",g:"hilite",tgt:0,tonic:9,prog:[[0,"min","E"],[3,"maj","G"],[10,"maj","D"],[8,"maj","C"]],times:1,rate:"e2",reps:kL([[9,7,4],[2,11,0],[5,10,6]],"min"),
   txt:["Progression: <b>Am – C – G – F</b>. Scale: A minor pentatonic, form 1, at fret 5. First, bring the chords to you around fret 5: Am (Em shape), C (G shape), G (D shape), F (C shape).","Then <b>highlight one chord at a time</b>: when Am comes round, play only Am chord tones; everything else is pentatonic. You can enter the arpeggio from the thick side, the thin side or the middle."],
   how:["Turn on the backing chords and listen to the loop first.","Play the written line.","Improvise: pentatonic on three chords, chord tones on Am."]},
  {id:"s3",t:"Play 6: highlight the second chord",g:"hilite",tgt:1,tonic:9,prog:[[0,"min","E"],[3,"maj","G"],[10,"maj","D"],[8,"maj","C"]],rate:"e2",reps:kL([[9,7,4],[2,11,0],[5,10,6]],"min"),
   txt:["Same loop, now the <b>C chord</b> gets its chord tones (G shape around fret 5) and Am, G and F get the pentatonic."],
   how:["Keep track of the chords with your eyes.","When C arrives, switch to its arpeggio.","Back to the scale after."]},
  {id:"s4",t:"Play 6: highlight the third chord",g:"hilite",tgt:2,tonic:9,prog:[[0,"min","E"],[3,"maj","G"],[10,"maj","D"],[8,"maj","C"]],rate:"e2",reps:kL([[9,7,4],[2,11,0],[5,10,6]],"min"),
   txt:["The <b>G chord</b> (D shape) gets the chord tones. The D shape is the awkward one, but here you only need a little cluster of it."],
   how:["Find the D-shape G around fret 5.","Highlight it every time it comes.","Pentatonic for the rest."]},
  {id:"s5",t:"Play 6: highlight the fourth chord",g:"hilite",tgt:3,tonic:9,prog:[[0,"min","E"],[3,"maj","G"],[10,"maj","D"],[8,"maj","C"]],rate:"e2",reps:kL([[9,7,4],[2,11,0],[5,10,6]],"min"),
   txt:["The <b>F chord</b> (C shape barred at fret 5) gets the chord tones."],
   how:["Find the C-shape F.","Highlight it.","Then pick your favourite chord to highlight and improvise."]},
  {id:"s6",t:"Play 6: every chord's tones",g:"hilite",tgt:"all",tonic:9,prog:[[0,"min","E"],[3,"maj","G"],[10,"maj","D"],[8,"maj","C"]],rate:"e2",reps:kL([[9,7,4],[2,11,0],[5,10,6]],"min"),
   txt:["All four chords highlighted: a full chord-tone solo through the progression. It's a little robotic on purpose; in real solos you'll mix it with the scale. But it proves you can see every chord while playing."],

  return {...E,ev:audioList(E).filter(e=>e.b>=s-1e-6&&e.b<en-1e-6).map(e=>({...e,b:e.b-s})),total:en-s,off:s};}
function start(){
  const L=byId(view.id);if(!L)return;audio();stop();const [si,ri]=curRep(L),R=L.reps[si][ri];
  const E0=exOf(L,R),E=slice(E0),ci=st.set.countin?4:0;
  play={L,E,E0,tempo:tempoOf(L),t0:ctx.currentTime+.12,ci,i:0,cyc:0,cb:-ci,vis:[],lf:performance.now(),off:E.off||0,seg:-1};
  play.timer=setInterval(sched,25);sched();play.raf=requestAnimationFrame(draw);setBar();
  try{if(navigator.wakeLock)navigator.wakeLock.request("screen").then(l=>{play&&(play.wake=l);}).catch(()=>{});}catch(e){}}
function stop(){if(!play)return;flush();scheduleSync();clearInterval(play.timer);cancelAnimationFrame(play.raf);try{play.wake&&play.wake.release();}catch(e){}
  play=null;document.querySelectorAll(".col.on,.col.tick").forEach(c=>c.classList.remove("on","tick"));document.querySelectorAll(".d.hit").forEach(c=>c.classList.remove("hit"));setBar();}
const bt=b=>play.t0+(b+play.ci)*spb();
function sched(){
  if(!play)return;const hz=ctx.currentTime+.15,E=play.E;
  for(;;){
    const base=play.cyc*E.total,tn=play.i<E.ev.length?bt(base+E.ev[play.i].b):Infinity,tc=bt(play.cb);
    const t=Math.min(tn,tc);if(t>hz)break;
    if(tc<=tn){if(play.cb<0||st.set.click)click(tc,(((play.cb%4)+4)%4)===0);play.cb++;
      if(play.cb>=base+E.total&&play.i>=E.ev.length){if(st.set.loop||sel){play.cyc++;play.i=0;}else{const p=play;setTimeout(()=>{if(play===p)stop();},(tc-ctx.currentTime)*1000+400);play.cb=Infinity;}}
      continue;}
    const e=E.ev[play.i++];note(e,tn,e.d*spb()*(e.role==="bk"?1:1.3));if(e.role!=="bk")play.vis.push([tn,e]);}}
function draw(){if(!play)return;let hit=null;
  while(play.vis.length&&play.vis[0][0]<=ctx.currentTime){hit=play.vis.shift()[1];}
  if(hit){document.querySelectorAll(".col.on").forEach(c=>c.classList.remove("on"));const c=document.querySelector(`.col[data-s="${Math.round((hit.b+play.off)*SUB)}"]`);if(c){c.classList.add("on");follow(c);}
    const sg=segOf(play.E0,hit.b+play.off);if(sg!==fbSeg){fbSeg=sg;paintFB();}
    document.querySelectorAll(".d.hit").forEach(x=>x.classList.remove("hit"));
    const same=play.E.ev.filter(e=>e.role!=="bk"&&Math.abs(e.b-hit.b)<1e-6);same.forEach(e=>{const d=document.querySelector(`.d[data-k="${e.s}-${e.f}"]`);if(d)d.classList.add("hit");});}
  let b=(ctx.currentTime-play.t0)/spb()-play.ci;if(b>=0&&(st.set.loop||sel))b=b%play.E.total;
  const g=b>=0&&b<play.E.total?Math.floor((b+play.off)*SUB+1e-6):null;
  if(g!==play.tg){play.tg=g;document.querySelectorAll(".col.tick").forEach(c=>c.classList.remove("tick"));if(g!=null){const c=document.querySelector(`.col[data-s="${g}"]`);if(c)c.classList.add("tick");}}
  play.raf=requestAnimationFrame(draw);}
let lastRow=null;
function follow(el){const row=el.closest(".tbar"),r=row.getBoundingClientRect(),bot=window.innerHeight-80;
  if(row!==lastRow&&(r.top<10||r.bottom>bot)){lastRow=row;window.scrollTo({top:window.scrollY+r.top-70,behavior:"smooth"});}}

const mmss=s=>{s=Math.floor(s);return Math.floor(s/60)+":"+pad(s%60);};
let toastDay=null;
function toast(msg,ms){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,ms||4000);}

function paintGoal(){const k=dkey(new Date()),g=goalMin()*60;let s=daySec(k);if(play)s+=Math.min(90,(performance.now()-play.lf)/1000);const met=s>=g;
  const nb=document.getElementById("nbGoal");nb.textContent=met?`✓ ${mmss(s)} played`:`⏱ ${mmss(s)} / ${mmss(g)}`;nb.classList.toggle("met",met);

/* ===================== Fretboard diagram ===================== */
let fbSeg=0;
function segs(E){const c=E.ch.slice().sort((a,b)=>a.b-b.b);return c.map((x,i)=>({b:x.b,e:i+1<c.length?c[i+1].b:E.total,name:x.name}));}
function segOf(E,b){const S=segs(E);let i=0;S.forEach((s,j)=>{if(b>=s.b-1e-6)i=j;});return i;}
const SHC={C:"#2563eb",A:"#db2777",G:"#16a34a",E:"#ea580c",D:"#7c3aed"};
function fbGeom(lo,hi){const W=48,X0=36,Y0=18,H=24;const x=f=>f===0?X0-14:X0+(f-lo-.5)*W,xl=fr=>X0+(fr-lo)*W;return {W,X0,Y0,H,x,xl,w:X0+(hi-lo)*W+14,h:Y0+5*H+34,y:s=>Y0+(s-1)*H};}
function fbFrame(G,lo,hi){let h="";
  [3,5,7,9,15,17].forEach(f=>{if(f>lo&&f<=hi)h+=`<circle class="inl" cx="${G.x(f)}" cy="${G.y(3.5)}" r="6"/>`;});
  if(12>lo&&12<=hi)h+=`<circle class="inl" cx="${G.x(12)}" cy="${G.y(2)+G.H/2}" r="6"/><circle class="inl" cx="${G.x(12)}" cy="${G.y(4)+G.H/2}" r="6"/>`;
  for(let fr=lo;fr<=hi;fr++)h+=`<line class="${fr===0?"nut":"fr"}" x1="${G.xl(fr)}" x2="${G.xl(fr)}" y1="${G.y(1)}" y2="${G.y(6)}"/>`;
  for(let s=1;s<=6;s++)h+=`<line class="str" x1="${G.X0-4}" x2="${G.xl(hi)}" y1="${G.y(s)}" y2="${G.y(s)}" style="stroke-width:${.8+s*.25}"/><text class="sn" x="${lo===0?G.X0-26:G.X0-6}" y="${G.y(s)+3}">${"eBGDAE"[s-1]}</text>`;
  for(let f=Math.max(1,lo+1);f<=hi;f++)h+=`<text class="fn" x="${G.x(f)}" y="${G.y(6)+22}">${f}</text>`;
  return h;}
function dotSVG(G,n,cls){const lab=st.set.lab==="note"?NM[mod(n.m,12)]:n.iv,ic="i"+n.iv,x=G.x(n.f),y=G.y(n.s);
  const shape=n.iv==="1"||(cls.includes("rel"))?`<rect x="${x-11}" y="${y-11}" width="22" height="22" rx="5"/>`:`<circle cx="${x}" cy="${y}" r="11"/>`;
  return `<g class="d ${ic} ${cls}" data-k="${n.s}-${n.f}">${shape}<text x="${x}" y="${y+.5}">${esc(lab)}</text></g>`;}
function fbSVG(E,seg){
  const S=segs(E),cur=S[seg]||{b:0,e:E.total},pts=new Map(),put=(n,cls,pri)=>{const k=n.s+"-"+n.f,o=pts.get(k);if(!o||pri>o.pri)pts.set(k,{n,cls,pri});};
  (E.ghost||[]).forEach(n=>{if(n.gh==="maj3"&&!st.set.cmp)return;put(n,n.gh==="maj3"?"gm":"gh",1);});
  if(E.box)E.box.notes.forEach(n=>put(n,"sc dim2",0));
  E.ev.forEach(e=>{const inSeg=e.b>=cur.b-1e-6&&e.b<cur.e-1e-6;put(e,(e.sc?"sc":"")+(inSeg?"":" dim"),inSeg?3:2);});
  if(E.rel)E.ev.forEach(e=>{if(e.iv==="b3")put(e,"rel sc",4);});
  const fs=[...pts.values()].map(x=>x.n.f),lo=Math.max(0,Math.min(...fs)-1),hi=Math.max(Math.max(...fs)+1,lo+5),G=fbGeom(lo,hi);
  let h=`<svg class="fb" viewBox="0 0 ${G.w} ${G.h}" width="${G.w}" height="${G.h}" role="img" aria-label="Fretboard">${fbFrame(G,lo,hi)}`;
  [...pts.values()].sort((a,b)=>a.pri-b.pri).forEach(({n,cls})=>{h+=dotSVG(G,n,cls.replace("dim2","dim"));});
  return h+"</svg>";}
function paintFB(){const el=document.getElementById("fb");if(!el)return;const L=byId(view.id);if(!L)return;const [si,ri]=curRep(L),E=exOf(L,L.reps[si][ri]);
  el.innerHTML=fbSVG(E,fbSeg);const S=segs(E),t=document.getElementById("fbSeg");if(t)t.innerHTML=S.length>1?`Showing <b>${esc((S[fbSeg]||S[0]).name)}</b> (${fbSeg+1} of ${S.length}). Other parts are faded.`:"";}
function legendHTML(E){return `<div class="legend"><span><i class="sq" style="background:var(--root)"></i>1 root</span><span><i style="background:var(--dot)"></i>3</span><span><i style="background:var(--b3)"></i>b3</span><span><i style="background:#334155"></i>5</span><span><i style="background:var(--b7)"></i>b7</span>${E.box||E.rel?`<span><i style="background:var(--scale)"></i>scale note (numbered from the key)</span>`:""}${E.rel?`<span><i class="sq" style="background:#fff;border:2px solid var(--root)"></i>root of the relative major</span>`:""}${(E.ghost||[]).some(g=>g.gh==="ext")?`<span><i style="background:#fff;border:1.5px dashed #9ca3af"></i>extended chord tones</span>`:""}${(E.ghost||[]).some(g=>g.gh==="maj3")?`<span><i style="background:#fff;border:1.5px dashed var(--root)"></i>where the major 3 was</span>`:""}</div>`;}
/* whole-neck CAGED map */
function mapSVG(){const {k,q,off}=st.map,lo=0,hi=17,G=fbGeom(lo,hi),tones=QT[q].map(x=>mod(k+x,12));
  const lad=ladder(k,q,17),mem={};let h=`<svg class="fb" viewBox="0 0 ${G.w} ${G.h+18}" width="${G.w}" height="${G.h+18}" role="img" aria-label="CAGED map">`;
  lad.forEach(p=>{const P=placeAt(p.S,k,q,p.n);[...P.full,...P.desc].forEach(n=>{(mem[n.s+"-"+n.f]=mem[n.s+"-"+n.f]||new Set()).add(p.S);});
    const a=Math.max(0,P.win[0]),b=P.win[1],x1=a===0?G.X0-26:G.xl(a-1),x2=G.xl(b);

  h+=fbFrame(G,lo,hi);
  for(let s=1;s<=6;s++)for(let f=0;f<=hi;f++){const m=OPEN[s]+f;if(!tones.includes(mod(m,12)))continue;const n=nt(s,f,k),ms=mem[s+"-"+f];
    const vis=ms&&[...ms].some(S=>!off[S]);h+=dotSVG(G,n,vis?"":"dim");}

function mapCard(){const {k,q,off}=st.map;return `<section class="card"><div class="row between"><h3>CAGED map: any chord, whole neck</h3><span class="num">reference</span></div>
  <p class="muted">Every chord tone of one chord across the neck, with the five shape areas shaded. Tap a shape to hide or show it and see how each one joins the next.</p>
  <div class="mapctl"><select id="mapK" aria-label="Key">${NM.map((n,i)=>`<option value="${i}"${i===k?" selected":""}>${n}</option>`).join("")}</select>
    <select id="mapQ" aria-label="Chord type">${["maj","min","dom"].map(x=>`<option value="${x}"${x===q?" selected":""}>${QN[x]}</option>`).join("")}</select>
    ${ORD.map(S=>`<button type="button" class="shbtn${off[S]?" off":""}" data-shp="${S}" style="color:${SHC[S]};background:${SHC[S]}1a">${S} shape</button>`).join("")}
    <label class="chk"><input type="checkbox" data-lab="1"${st.set.lab==="note"?" checked":""}> Note names</label></div>

/* ===================== Tab ===================== */
function gridOf(ev){for(const s of [2,3,4,6,12])if(ev.every(e=>Math.abs(e.b*s-Math.round(e.b*s))<1e-3))return s;return 12;}
function cntLbl(pos,sub){const beat=Math.floor(pos+1e-6),f=pos-beat,b=String(beat%4+1),is=x=>Math.abs(f-x)<1e-3;
  if(f<1e-6)return b;if(sub%3===0){if(is(1/3))return "tri";if(is(2/3))return "let";}
  if(is(.5))return "&";if(sub%4===0){if(is(.25))return "e";if(is(.75))return "a";}return "";}
function picks(ev){const res=new Map();let prev=null,dir=null;
  ev.slice().sort((a,b)=>a.b-b.b||b.s-a.s).forEach(e=>{
    if(e.role==="c"){res.set(e,e.st===0?"↓":"");prev=null;dir=null;return;}
    if(e.tech){res.set(e,"");prev=e;return;}
    let d;if(!prev)d="↓";else if(e.s!==prev.s)d=e.s<prev.s?"↓":"↑";else d=dir==="↓"?"↑":"↓";
    res.set(e,d);dir=d;prev=e;});
  return res;}
function tabHTML(E){
  const ev=E.ev,sub=gridOf(ev);SUB=sub;const per=4*sub,nb=Math.ceil(E.total/4-1e-6),at={},pk=picks(ev);
  ev.forEach(e=>{const k=Math.round(e.b*sub);(at[k]=at[k]||[]).push(e);});
  const labels={};E.ch.forEach(c=>{const bi=Math.floor(c.b/4+1e-6);(labels[bi]=labels[bi]||[]).push(c.name);});
  let h="";
  for(let br=0;br<nb;br++){const on=sel&&br>=sel.a&&br<=sel.b,lab=labels[br]?labels[br].join(" → "):"";
    h+=`<div class="tbar${on?" sel":""}" style="--n:${per}" data-bar="${br}" title="${esc(lab||"Tap to loop this bar")}">${lab?`<span class="chd">${esc(lab)}</span>`:""}<span class="bno">${br+1}</span><div class="clef" aria-hidden="true"><b>T</b><b>A</b><b>B</b></div>`;
    for(let i=0;i<per;i++){const g=br*per+i,es=at[g]||[],pos=g/sub;
      h+=`<div class="col${i%sub===0?" bt":""}" data-s="${g}">`;
      for(let s=1;s<=6;s++){const e=es.find(x=>x.s===s);
        h+=`<div class="c">${e?`<i class="${e.iv==="1"?"r":e.role==="c"?"cs":e.sc?"s":""}">${e.tech==="p"?"<sup>p</sup>":e.tech==="h"?"<sup>h</sup>":e.tech==="/"?"<sup>/</sup>":e.tech==="\\"?"<sup>\\</sup>":""}${e.f}</i>`:""}</div>`;}
      const single=es.filter(e=>e.role!=="c"),iv=single.length?single.map(e=>e.iv).join(""):"",ivc=single.length===1?(single[0].iv==="b3"?" b3":single[0].iv==="b7"?" b7":single[0].sc?" sc":""):"";
      const pks=es.map(e=>pk.get(e)).filter(Boolean)[0]||"";
      h+=`<div class="cnt">${cntLbl(pos,sub)}</div><div class="ivr${ivc}">${esc(iv)}</div><div class="pk">${pks}</div></div>`;}
    h+="</div>";}
  return h;}
function fixClefs(){document.querySelectorAll(".tab").forEach(t=>{let last=null;[...t.children].forEach(b=>{b.classList.toggle("nc",b.offsetTop===last);last=b.offsetTop;});});}
window.addEventListener("resize",()=>setTimeout(fixClefs,100));

/* ===================== Today's session: five reps, fixed until all are done ===================== */
function buildSess(){const items=[];
  for(const L of ALL){if(items.length>=4)break;if(!levelOpen(L.lv)||lessonDone(L))continue;
    for(let si=0;si<L.reps.length&&items.length<4;si++){if(!stageOpen(L,si))break;L.reps[si].forEach((r,ri)=>{const id=rid(L,si,ri);if(items.length<4&&!isDone(id))items.push({id});});}}
  const doneIds=Object.keys(st.done).filter(id=>byId(id.split(":")[0]));
  if(doneIds.length)items.push({id:doneIds[Math.floor(Math.random()*doneIds.length)],rev:1});
  st.sess={items,at:Date.now(),ok:{}};st.sessT=Date.now();save();}
const sessOk=(it,i)=>it.rev?!!(st.sess.ok&&st.sess.ok[i]):isDone(it.id);
const sessDone=()=>st.sess&&st.sess.items.length&&st.sess.items.every(sessOk);
function sessCard(){
  if(!st.sess||!st.sess.items.length)return `<section class="card"><div class="num">Today's session</div><h2>Five reps, chosen for you</h2>

    <div class="row"><button type="button" class="play big" data-newsess="1">Start a session ▸</button></div></section>`;
  const n=st.sess.items.filter(sessOk).length,all=sessDone();

    <div class="sess">${st.sess.items.map((it,i)=>{const [lid,si,ri]=it.id.split(":"),L=byId(lid);if(!L)return "";const R=L.reps[si][ri],ok=sessOk(it,i);
      return `<div class="si${ok?" ok":""}"><span><b>${ok?"✓ ":""}${it.rev?"Review · ":""}${esc(L.t)}</b><br><span class="st">${L.id} · ${repShort(L,R).replace(/<[^>]+>/g," ")} · Stage ${ROM[si]} · ${target(L,+si)} bpm</span></span>
        <button type="button" data-open="${lid}" data-rep="${si}:${ri}"${it.rev?` data-rev="${i}"`:""}>${ok?"Again":"Open ▸"}</button></div>`;}).join("")}</div>
    ${all?`<div class="row"><button type="button" class="play big" data-newsess="1">Start the next session ▸</button></div>`:""}</section>`;}

    return `${sec?`<div class="sec-t">${sec}</div>`:""}<div class="lvl${un?"":" lock"}${fin?" fin":""}${cur?" cur":""}"><div class="lvh"><b>Level ${li+1}: ${esc(Lv.n)}</b><span>${fin?"✓ complete":un?`${dn} of ${tot} reps`:"🔒 finish the level before"}</span></div>
      <details${cur||(fin&&false)?" open":""}><summary class="muted" style="cursor:pointer;font-size:13px;margin:4px 0">${esc(Lv.d)}</summary><div class="lessons" style="margin-top:8px">${ls.map(L=>{const c=lessonCount(L),t=lessonTotal(L),ok=c===t;
        return `<button type="button" class="les${ok?" ok":L.id===nx.id?" next":""}" data-open="${L.id}" title="${c} of ${t} reps">${ok?"✓ ":un?"":"🔒 "}${L.id} ${esc(L.t)}<i style="width:${c/t*100}%"></i></button>`;}).join("")}</div></details></div>`;}).join("")}</div></section>
  ${mapCard()}
  ${aboutCard()}
  ${syncCard()}`;}
function lessonView(L){
  const Lv=LEVELS[L.lv],idx=Lv.ls.findIndex(x=>x.id===L.id),all=ALL.indexOf(L),prev=ALL[all-1],next=ALL[all+1],[si,ri]=curRep(L),R=L.reps[si][ri],E=exOf(L,R);
  const lockLv=!levelOpen(L.lv),lockSt=!stageOpen(L,si),id=rid(L,si,ri),done=isDone(id),tg=target(L,si),tp=tempoOf(L);
  const revI=view.rev!=null?view.rev:null,rev=revI!=null&&st.sess&&st.sess.items[revI]&&st.sess.items[revI].id===id;
  const nb=Math.ceil(E.total/4-1e-6),sub=gridOf(E.ev);
  let btn;
  if(lockLv)btn=`<button type="button" class="big" disabled>🔒 Finish level ${L.lv} to tick reps here</button>`;
  else if(lockSt)btn=`<button type="button" class="big" disabled>🔒 Finish stage ${ROM[si-1]} first</button>`;
  else if(tp<tg)btn=`<button type="button" class="big" data-settempo="${tg}">Raise to ${tg} bpm to tick (now ${tp})</button>`;
  else if(rev)btn=st.sess.ok&&st.sess.ok[revI]?`<button type="button" class="big" disabled>✓ Review done</button>`:`<button type="button" class="good big" data-revdone="${revI}">✓ Review clean at ${tp} bpm</button>`;
  else btn=done?`<button type="button" data-undone="${id}">✓ Done · mark as not done</button>`:`<button type="button" class="good big" data-done="${id}">✓ Clean at ${tp} bpm in ${esc(repShort(L,R).replace(/<[^>]+>/g," ").trim())}</button>`;
  return `<section class="card"><div class="num">Level ${L.lv+1} · ${esc(Lv.n)} · lesson ${idx+1} of ${Lv.ls.length} · ${L.id}</div>
    <h2>${esc(L.t)}</h2>
    ${lockLv?`<p class="tip">🔒 Preview. This level opens when you finish Level ${L.lv}. You can read, listen and play along; ticking reps unlocks with your progress.</p>`:""}
    <div class="chips"><span class="chip">${lessonCount(L)} of ${lessonTotal(L)} reps</span><span class="chip t">${sub===3||sub===6?"triplets":sub===4?"16ths":sub===12?"mixed rhythm":E.ev.every(e=>e.role==="c")?"chords":"8ths"}</span><span class="chip a">stage tempos ${TEMPI[L.rate].join(" → ")} bpm</span><span class="chip">${nb} bars</span></div>
    <div class="lesson-txt">${L.txt.map(p=>`<p>${p}</p>`).join("")}</div>
    <div><h3 style="margin-bottom:4px">How to practise</h3><ol class="how">${L.how.map(x=>`<li>${x}</li>`).join("")}</ol></div></section>
  <section class="card"><div class="row between"><h3>Your reps</h3><span class="num">tick each one when it's clean at the stage tempo</span></div>
    <div class="stages">${L.reps.map((S,s)=>{const op=stageOpen(L,s),sd=stageDone(L,s);
      return `<div class="stage${op?"":" lock"}"><span class="sl">${sd?"✓ ":op?"":"🔒 "}Stage ${ROM[s]} · ${target(L,s)} bpm</span>${S.map((r,j)=>{const d=isDone(rid(L,s,j));
        return `<button type="button" class="rep${d?" ok":""}${s===si&&j===ri?" sel":""}${op?"":" lockd"}" data-rep="${s}:${j}" data-open="${L.id}">${d?"✓ ":""}${repShort(L,r)}</button>`;}).join("")}</div>`;}).join("")}</div>
    <p class="repinfo">Now: ${repLong(L,R,E)} · Stage ${ROM[si]}, target <b>${tg} bpm</b>${done?" · <b>done</b>":""}</p></section>
  <section class="card"><div class="row between"><h3>Fretboard</h3><span class="row" style="gap:12px"><label class="chk"><input type="checkbox" data-lab="1"${st.set.lab==="note"?" checked":""}> Note names</label>${(E.ghost||[]).some(g=>g.gh==="maj3")||R.q==="min"||L.q==="min"?`<label class="chk"><input type="checkbox" id="cmp"${st.set.cmp?" checked":""}> Show the major 3</label>`:""}</span></div>
    <div class="fbwrap" id="fb"></div><p class="muted" id="fbSeg" style="font-size:13px"></p>${legendHTML(E)}</section>
  <section class="card"><div class="row"><label class="ctl">Tempo <input type="range" id="tempo" min="30" max="180" step="1" value="${tp}"> <b id="tempoV">${tp}</b> bpm</label>
      <label class="chk"><input type="checkbox" id="click"${st.set.click?" checked":""}> Metronome</label>
      <label class="chk"><input type="checkbox" id="countin"${st.set.countin?" checked":""}> Count-in</label>
      <label class="chk"><input type="checkbox" id="loop"${st.set.loop?" checked":""}> Loop</label>
      ${E.bk&&E.bk.length?`<label class="chk"><input type="checkbox" id="back"${st.set.back?" checked":""}> Backing chords</label>`:""}</div>
    <div class="legend"><span>Under each count: the interval, then the pick stroke</span><span><b>p</b> pull-off · <b>/</b> slide up · <b>\\</b> slide down</span></div>
    <div class="barsbar"><span class="num">Bar practice</span><b id="selLbl">${sel?(sel.a===sel.b?`Looping bar ${sel.a+1}`:`Looping bars ${sel.a+1}–${sel.b+1}`):"Whole exercise"}</b>
      <button type="button" data-bars="add">＋ Add next bar</button><button type="button" data-bars="next">Next bar only ▶</button><button type="button" data-bars="all"${sel?"":" disabled"}>All bars</button></div>
    <div class="tabscroll"><div class="tab${sel?" hassel":""}">${tabHTML(E)}</div></div>
    <div class="navf">${prev?`<button type="button" data-open="${prev.id}">◂ ${prev.id}</button>`:"<span></span>"}<button type="button" class="linkb" data-home="1">All levels</button>
      ${btn}
      ${next?`<button type="button" data-open="${next.id}">${next.id} ▸</button>`:""}</div></section>`;}
function render(){
  stop();const v=document.getElementById("view");
  if(view.k==="lesson"){const L=byId(view.id);v.innerHTML=lessonView(L);const [si,ri]=curRep(L),E=exOf(L,L.reps[si][ri]);fbSeg=sel?segOf(E,sel.a*4):0;paintFB();}
  else v.innerHTML=homeView();
  header();setBar();paintGoal();requestAnimationFrame(fixClefs);}
function setBar(){const nb=document.getElementById("nowbar"),L=view.k==="lesson"&&byId(view.id);nb.hidden=!L;document.body.style.paddingBottom=L?"80px":"0";
  if(!L)return;const b=document.getElementById("nbPlay");b.textContent=play?"■ Stop":"▶ Play";b.classList.toggle("on",!!play);const [si,ri]=curRep(L),R=L.reps[si][ri];
  document.getElementById("nbInfo").textContent=play?(sel?(sel.a===sel.b?`Looping bar ${sel.a+1}`:`Looping bars ${sel.a+1}–${sel.b+1}`):`Playing ${L.id} · ${repShort(L,R).replace(/<[^>]+>/g," ")}`):`${L.id} · ${repShort(L,R).replace(/<[^>]+>/g," ")} · Stage ${ROM[si]}`;
  document.getElementById("nbT").textContent=tempoOf(L);}
function open(id,rep,rev){const L=byId(id);if(!L)return;if(rep){st.sel[id]=rep;}view={k:"lesson",id,rev:rev!=null?Number(rev):null};sel=null;save(true);render();window.scrollTo({top:0});}
function setSel(s){const wasPlaying=!!play;sel=s;render();if(wasPlaying)start();}
function setTempo(L,v){st.tempo[L.id]=Math.max(30,Math.min(180,v));st.tUpd=Date.now();save();}
document.addEventListener("click",e=>{
  const o=e.target.closest("[data-open]");if(o){const rep=o.dataset.rep;if(view.k==="lesson"&&view.id===o.dataset.open&&rep&&!o.dataset.rev){st.sel[view.id]=rep;sel=null;save(true);render();return;}open(o.dataset.open,rep,o.dataset.rev);return;}
  if(e.target.closest("[data-home]")){view={k:"home"};sel=null;render();window.scrollTo({top:0});return;}
  if(e.target.closest("#nbPlay")){play?stop():start();return;}
  const td=e.target.closest("[data-tdelta]");if(td){const L=byId(view.id);setTempo(L,tempoOf(L)+Number(td.dataset.tdelta));
    if(play){stop();start();}render();return;}
  const stt=e.target.closest("[data-settempo]");if(stt){const L=byId(view.id);setTempo(L,Number(stt.dataset.settempo));render();return;}
  const d=e.target.closest("[data-done]");if(d){const id=d.dataset.done,L=byId(id.split(":")[0]),wasL=lessonDone(L),wasLv=levelDone(L.lv);
    st.done[id]=dkey(new Date());st.doneT[id]=Date.now();const nr=nextRepOf(L);if(nr)st.sel[L.id]=nr.join(":");save();
    if(lessonDone(L)&&!wasL){toast(levelDone(L.lv)&&!wasLv?`🎉 Level ${L.lv+1} complete! Level ${L.lv+2<=LEVELS.length?L.lv+2:""} is open.`:`✓ Lesson ${L.id} complete.`,5000);}
    else if(sessDone())toast("✓ Today's session complete.",4000);else toast("✓ Rep ticked.",1500);render();return;}
  const rv=e.target.closest("[data-revdone]");if(rv){st.sess.ok=st.sess.ok||{};st.sess.ok[rv.dataset.revdone]=true;st.sessT=Date.now();save();toast(sessDone()?"✓ Today's session complete.":"✓ Review done.",2500);render();return;}
  const u=e.target.closest("[data-undone]");if(u){delete st.done[u.dataset.undone];st.offT[u.dataset.undone]=Date.now();save();render();return;}
  if(e.target.closest("[data-newsess]")){buildSess();render();return;}
  const sp=e.target.closest("[data-shp]");if(sp){st.map.off[sp.dataset.shp]=!st.map.off[sp.dataset.shp];save(true);sp.classList.toggle("off");document.getElementById("map").innerHTML=mapSVG();return;}
  if(e.target.closest("[data-syncnow]")){cloudSync();return;}
  if(e.target.closest("[data-syncoff]")){try{localStorage.removeItem(SYNC_KEY);}catch(x){}setSync("off");render();return;}
  if(e.target.closest("[data-syncon]")){const v=(document.getElementById("syncIn").value||"").trim();if(v.length<8){setSync("err","use a sync code of at least 8 characters");return;}try{localStorage.setItem(SYNC_KEY,v);}catch(x){}cloudSync().then(render);return;}
  const bb=e.target.closest("[data-bars]");if(bb){const L=byId(view.id),[si,ri]=curRep(L),E=exOf(L,L.reps[si][ri]),n=Math.ceil(E.total/4-1e-6),op=bb.dataset.bars;
    if(op==="all")setSel(null);else if(op==="add")setSel(sel?{a:sel.a,b:Math.min(n-1,sel.b+1)}:{a:0,b:Math.min(n-1,1)});
    else{const x=sel?Math.min(n-1,sel.b+1):0;setSel({a:x,b:x});}return;}
  const tb=e.target.closest(".tbar");if(tb){const b=Number(tb.dataset.bar);
    if(e.shiftKey&&sel)setSel({a:Math.min(sel.a,b),b:Math.max(sel.b,b)});else if(sel&&sel.a===b&&sel.b===b)setSel(null);else setSel({a:b,b});return;}
});
document.addEventListener("input",e=>{if(e.target.id==="tempo"){const L=byId(view.id);setTempo(L,Number(e.target.value));document.getElementById("tempoV").textContent=e.target.value;document.getElementById("nbT").textContent=e.target.value;}});
document.addEventListener("change",e=>{const t=e.target;if(t.id==="tempo"){if(play){stop();start();}render();}
  if(["click","countin","loop","back"].includes(t.id)){st.set[t.id]=t.checked;save(true);if(play&&t.id==="back"){stop();start();}}
  if(t.id==="cmp"){st.set.cmp=t.checked;save(true);paintFB();}
  if(t.dataset.lab){st.set.lab=t.checked?"note":"iv";save(true);if(view.k==="lesson")paintFB();const m=document.getElementById("map");if(m)m.innerHTML=mapSVG();}
  if(t.id==="mapK"||t.id==="mapQ"){st.map.k=Number(document.getElementById("mapK").value);st.map.q=document.getElementById("mapQ").value;save(true);document.getElementById("map").innerHTML=mapSVG();}});
document.addEventListener("keydown",e=>{if(e.key!==" "||["INPUT","BUTTON","SELECT"].includes(e.target.tagName)||view.k!=="lesson")return;e.preventDefault();play?stop():start();});
document.addEventListener("visibilitychange",()=>{if(document.hidden)stop();else cloudSync();});
setInterval(()=>{if(!document.hidden&&!play)cloudSync();},60000);
const q0=new URLSearchParams(location.search).get("lesson");
if(q0&&byId(q0))view={k:"lesson",id:q0};
render();
cloudSync();
/*APP-END*/
</script>
</body></html>
