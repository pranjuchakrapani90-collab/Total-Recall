/* ---- Total Recall & Melodies look ---- */
body{font-family:var(--body)}
header.top{display:block;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;padding:22px 16px}

.wrap{padding-block:18px 60px}

.ghost{background:#eef0ff}
.linkb{background:none;color:var(--accent);padding:0}
.seg[aria-pressed="true"],.stp.cur{background:var(--accent);color:#fff;border-color:var(--accent)}
.stp{border:1px solid var(--line);background:#fff;border-radius:999px}
.stp.ok{background:var(--good-soft);border-color:#a7f3d0;color:#065f46}
.tbtn{background:#f5f3ff;color:#5b21b6;border:1px solid #ddd6fe}
.card,.ex,.stage,.ctx,.panel{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 5px 18px #141e3710}
.stage{box-shadow:none;background:#fafaff}
.ctx{border-radius:12px;box-shadow:none}
.card h2{font-weight:750}

const CAGED=[
  {n:"C",fr:{6:[0,1,3],5:[0,2,3],4:[0,2,3],3:[0,2],2:[0,1,3],1:[0,1,3]},fg:{6:[1,2,4],5:[1,3,4],4:[1,3,4],3:[1,3],2:[1,2,4],1:[1,2,4]}},
  {n:"A",fr:{6:[3,5],5:[2,3,5],4:[2,3,5],3:[2,4,5],2:[3,5,6],1:[3,5]},fg:{6:[2,4],5:[1,2,4],4:[1,2,4],3:[1,3,4],2:[1,3,4],1:[1,3]}},
  {n:"G",fr:{6:[5,7,8],5:[5,7,8],4:[5,7],3:[4,5,7],2:[5,6,8],1:[5,7,8]},fg:{6:[1,3,4],5:[1,3,4],4:[1,3],3:[1,2,4],2:[1,2,4],1:[1,3,4]}},
  {n:"E",fr:{6:[7,8,10],5:[7,8,10],4:[7,9,10],3:[7,9,10],2:[8,10],1:[7,8,10]},fg:{6:[1,2,4],5:[1,2,4],4:[1,3,4],3:[1,3,4],2:[2,4],1:[1,2,4]}},
  {n:"D",fr:{6:[10,12,13],5:[10,12],4:[9,10,12],3:[9,10,12],2:[10,12,13],1:[10,12,13]},fg:{6:[1,3,4],5:[1,3],4:[1,2,4],3:[1,2,4],2:[1,3,4],1:[1,3,4]}},
];
const shapeName=p=>CAGED[((p-1)%5+5)%5].n+" shape";
const parentTonic=(scale,tonic)=>scale==="minpent"?(tonic+3)%12:tonic;
function cagedNotes(majorTonic,p){
  const sh=CAGED[((p-1)%5+5)%5],all=Object.values(sh.fr).flat();let shift=((majorTonic%12)+12)%12;
  if(Math.min(...all)+shift-12>=0)shift-=12;
  const notes=[];for(const s of [6,5,4,3,2,1])sh.fr[s].forEach((f,i)=>notes.push({s,f:f+shift,m:OPEN[s]+f+shift,fg:f+shift===0?0:sh.fg[s][i]}));
  return notes.sort((a,b)=>a.m-b.m);
}
function positionNotes(scale,tonic,p){
  const ints=SCALES[scale].ints,inScale=m=>ints.includes(((m-tonic)%12+12)%12);
  const notes=cagedNotes(parentTonic(scale,tonic),p).filter(n=>inScale(n.m));
  notes.forEach(n=>{n.deg=ints.indexOf(((n.m-tonic)%12+12)%12);});
  return {notes,f:Math.min(...notes.map(n=>n.f))};
}
function buildSeq(c,alt,N){
  const mx=Math.max(...c),mn=Math.min(...c),out=[];
  for(let i=Math.max(0,-mn);i+mx<=N-1;i++){const p=(alt&&i%2)?[...c].reverse():c;p.forEach(o=>out.push(i+o));}
  for(let i=N-1;i-mx>=0;i--){if(i-mn>N-1)continue;const k=N-1-i;const p=(alt&&k%2)?[...c].reverse():c;p.forEach(o=>out.push(i-o));}
  return out;
}

const pad=n=>String(n).padStart(2,"0");
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmt=k=>{const[y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});};
function rng(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19;}
  return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296;};}
const keyOf=it=>(it.k==="v"?"v":"s")+it.i;

function normalize(x){ // sessions saved by earlier versions of the page
  if(!x.items){x.items=(x.ex||[]).map((i,j)=>({k:"s",i,rh:x.rh?x.rh[j]:j}));}
  x.done=(x.done||[]).map(d=>typeof d==="number"?"s"+d:d);x.scale=x.scale||"major";if(x.position>5)x.position=((x.position-1)%5)+1;
  delete x.ex;delete x.rh;return x;
}

function planSession(){
  const past=Object.values(sessions).sort((a,b)=>a.started<b.started?1:-1),prev=past[0];
  const now=new Date(),id=String(now.getTime()),r=rng(id);
  // tempo: move one rung up the ladder after a completed session; hold at the top until the stage is fully covered
  let stage=0,step=0;
  if(prev&&prev.step!=null){stage=prev.stage;step=prev.step;
    if(stage<STAGES.length&&prev.done.length===5){const L=ladder(stage);
      if(step<L.length-1)step++;
      else if(coverage(stage).full){stage++;step=0;}}}
  const tempo=stage<STAGES.length?ladder(stage)[step]:null;
  const inStage=past.filter(d=>stageOf(d)===Math.min(stage,STAGES.length-1));
  const doneSet=new Set();inStage.forEach(d=>d.done.forEach(k=>doneSet.add(k)));
  const fresh=sc=>EX.some((e,i)=>CATS[e.cat].scales.includes(sc)&&!doneSet.has("s"+i))||VOC.some((v,i)=>v.s===sc&&!doneSet.has("v"+i));
  let cyc=prev?((prev.cyc!=null?prev.cyc:0)+1)%SCALE_CYCLE.length:0;
  for(let t=0;t<SCALE_CYCLE.length&&!fresh(SCALE_CYCLE[cyc]);t++)cyc=(cyc+1)%SCALE_CYCLE.length;
  const scale=SCALE_CYCLE[cyc];
  const sc=SCALES[scale];
  // position: least recently used for this scale, never the previous session's
  const lastUse={};past.filter(d=>d.scale===scale).forEach(d=>{if(!(d.position in lastUse))lastUse[d.position]=d.started;});
  const order=[...Array(sc.npos)].map((_,i)=>i+1).filter(p=>!(prev&&prev.scale===scale&&prev.position===p))
    .sort((a,b)=>{const la=lastUse[a]||"",lb=lastUse[b]||"";return la<lb?-1:la>lb?1:a-b;});
  // history of plays
  const plays={},last={},prevKeys=new Set(prev?prev.items.map(keyOf):[]);
  inStage.forEach(d=>d.done.forEach(k=>{plays[k]=(plays[k]||0)+1;if(!last[k]||d.started>last[k])last[k]=d.started;}));
  const rank=(a,b)=>a.p-b.p||(a.l<b.l?-1:a.l>b.l?1:0)||a.x-b.x;
  // three sequences, from groups that suit the scale, all different groups
  const seqC=EX.map((e,i)=>({i,cat:e.cat,k:"s"+i,x:r()})).filter(o=>CATS[o.cat].scales.includes(scale)&&!prevKeys.has(o.k))
    .map(o=>({...o,p:plays[o.k]||0,l:last[o.k]||""})).sort(rank);
  const seq=[],used=new Set();
  for(const o of seqC){if(seq.length===3)break;if(!used.has(o.cat)){seq.push(o.i);used.add(o.cat);}}
  for(const o of seqC){if(seq.length===3)break;if(!seq.includes(o.i))seq.push(o.i);}
  seq.sort((a,b)=>EX[a].cat-EX[b].cat||a-b);
  // three rhythms, none from the previous session
  const rUsed={},prevR=new Set(prev?prev.items.filter(x=>x.k==="s").map(x=>x.rh):[]);
  inStage.forEach(d=>d.items.forEach(x=>{if(x.k==="s"&&d.done.includes(keyOf(x)))rUsed[x.rh]=(rUsed[x.rh]||0)+1;}));
  const rh=RHY.map((_,i)=>({i,p:prevR.has(i)?1:0,u:rUsed[i]||0,x:r()})).sort((a,b)=>a.p-b.p||a.u-b.u||a.x-b.x).slice(0,3).map(o=>o.i);
  // two vocabulary phrases for this scale
  const voc=VOC.map((v,i)=>({i,k:"v"+i,s:v.s,x:r()})).filter(o=>o.s===scale&&!prevKeys.has(o.k))
    .map(o=>({...o,p:plays[o.k]||0,l:last[o.k]||""})).sort(rank).slice(0,2).map(o=>o.i).sort((a,b)=>a-b);
  const items=[...seq.map((i,j)=>({k:"s",i,rh:rh[j]})),...voc.map(i=>({k:"v",i}))];
  return {id,started:dkey(now)+"T"+pad(now.getHours())+":"+pad(now.getMinutes())+":"+pad(now.getSeconds()),scale,cyc,stage,step,tempo,position:order[0],items,done:[],finished:false};
}

function countLbl(b,R){
  R=R||{};const bpb=R.bpb||4,e=1e-4,f=b-Math.floor(b+e);
  if(R.compound)return String((Math.round(b*3)%6)+1);
  const beat=(Math.floor(b+e)%bpb)+1;
  if(Math.abs(f)<e||Math.abs(f-1)<e)return String(beat);
  if(R.swing&&Math.abs(f-2/3)<e)return "&";
  if(Math.abs(f-.25)<e)return "e";if(Math.abs(f-.5)<e)return "&";if(Math.abs(f-.75)<e)return "a";
  if(Math.abs(f-1/3)<e)return "tri";if(Math.abs(f-2/3)<e)return "let";return "·";
}
function cycleGrid(R){
  const L=cycLen(R),int=v=>Math.abs(v-Math.round(v))<1e-6;
  const step=R.p.every(x=>int(x.d*4))?(R.p.every(x=>int(x.d*2))?.5:.25):1/3;
  let span=L;while(!int(span))span+=L;
  const hits={};let b=0;while(b<span-1e-6){R.p.forEach(x=>{if(!x.r)hits[Math.round(b/step)]=x.a||0;b+=x.d;});}
  let h="";const n=Math.round(span/step);
  for(let i=0;i<n;i++){const pos=i*step,lbl=R.compound?String(i%6+1):countLbl(pos,R).replace("·","");
    const on=i in hits;h+=`<span class="g${on?" h":""}${on&&hits[i]?" a":""}${Math.abs(pos-Math.round(pos))<1e-6&&i?" bt":""}">${lbl}</span>`;}
  return h;
}
const homeChord=()=>({root:0,q:HOME[today.scale]});
const rootIdx=()=>posData.notes.findIndex(n=>n.deg===0);

function seqEvents(it,ro){
  const R=RHY[it.rh]||RHY[0],bpb=R.bpb||4,L=R.p.length,root=rootIdx();
  let seq;
  if(ro){const per=R.p.filter(x=>!x.r).length,reps=Math.max(1,Math.ceil(2*bpb/cycLen(R)));seq=Array(per*reps).fill(root);}
  else seq=buildSeq(EX[it.i]?EX[it.i].c:it.c,EX[it.i]?EX[it.i].alt:0,posData.notes.length);
  const ev=[];let t=0,k=0,pi=0;
  while(k<seq.length){const s=R.p[pi%L];
    if(s.r)ev.push({rest:1,b:t,d:s.d});else{ev.push({n:seq[k],b:t,d:s.d,a:s.a});k++;}
    t+=s.d;pi++;}
  let end=Math.ceil(t-1e-6);
  if(!ro){if(end>t+1e-6)ev.push({rest:1,b:t,d:end-t});ev.push({n:root,b:end,d:1,a:2,last:true});end+=1;}
  const total=Math.ceil(end/bpb-1e-6)*bpb,hc=homeChord(),ch=[];
  for(let b=0;b<total;b+=bpb)ch.push({b,d:bpb,...hc});
  return {ev,ch,total,bpb,R};
}
function vocEvents(vi,phraseOnly){
  const V=VOC[vi],ph=parsePh(V.ph),len=ph.reduce((s,x)=>s+x.d,0),L=Math.ceil(len/4-1e-6)*4;
  const N=posData.notes.length,sl=SCALES[today.scale].ints.length,offs=ph.filter(x=>!x.r).map(x=>x.o);
  const mn=Math.min(...offs),mx=Math.max(...offs);
  const prog=phraseOnly?[{sh:0,...homeChord()}]:PROG[today.scale];
  const ev=[],ch=[];let prevS=null;
  prog.forEach((c,ci)=>{
    const t0=ci*L,want=((c.sh%sl)+sl)%sl;
    const cands=posData.notes.map((n,i)=>i).filter(i=>posData.notes[i].deg===want&&i+mn>=0&&i+mx<=N-1);
    ch.push({b:t0,d:L,root:c.root,q:c.q,label:true});
    if(!cands.length){ev.push({rest:1,b:t0,d:L});return;}
    const target=prevS===null?(N-1-(mx-mn))/2-mn:prevS;
    const s=cands.sort((a,b)=>Math.abs(a-target)-Math.abs(b-target))[0];prevS=s;
    let t=t0;ph.forEach(x=>{ev.push(x.r?{rest:1,b:t,d:x.d}:{n:s+x.o,b:t,d:x.d,a:x.a});t+=x.d;});
    if(t<t0+L-1e-6)ev.push({rest:1,b:t,d:t0+L-t});
  });
  let total=prog.length*L;
  if(!phraseOnly){const r0=rootIdx(),rs=posData.notes.map((n,i)=>i).filter(i=>posData.notes[i].deg===0);
    const r=rs.sort((a,b)=>Math.abs(a-(prevS||r0))-Math.abs(b-(prevS||r0)))[0];
    ev.push({n:r,b:total,d:2,a:2,last:true});ev.push({rest:1,b:total+2,d:2});
    ch.push({b:total,d:4,root:0,q:PROG[today.scale][0].q,label:true});total+=4;}
  return {ev,ch,total,bpb:4,R:null};
}
function eventsFor(id,ro,test){
  if(id==="pos")return posEvents(test);

function tabHTML(E,id){
  const {ev,ch,bpb,R}=E,labels={};ch.forEach(c=>{if(c.label)labels[Math.round(c.b/bpb)]=chordName(c.root,c.q);});
  const SL=`<div class="sl">${[1,2,3,4,5,6].map(s=>`<span>${SNAME[s]}</span>`).join("")}<span></span></div>`;let h="",bar=-1;
  ev.forEach((e,k)=>{
    const br=Math.floor(e.b/bpb+1e-6);
    if(br!==bar){h+=(bar>=0?"</div>":"")+`<div class="tbar">${labels[br]?`<span class="chd">${labels[br]}</span>`:""}${SL}`;bar=br;}
    const w=Math.round(Math.max(24,18+e.d*44));
    h+=`<div class="col${e.rest?" rest":""}" style="width:${w}px" data-id="${id}" data-k="${k}">`;
    if(e.rest){for(let s=1;s<=6;s++)h+=`<div class="c"></div>`;h+=`<div class="cnt">rest</div></div>`;return;}

    h+=`<div class="cnt${e.a?" acc":""}">${countLbl(e.b,R)}</div></div>`;
  });
  return h+"</div>";
}

function finalScore(p){
  const X=p.exp,dets=L.notes.filter(d=>d.t>=p.testStart-0.3&&d.t<=X[X.length-1].t+1.2),cal=S.latency!=null;
  const prior=cal?S.latency:p.live.off,lo=cal?S.latency-0.08:-0.05,hi=cal?S.latency+0.08:0.6;
  let best=null;
  for(let off=lo;off<=hi+1e-9;off+=0.01){const r=matchAt(X,dets,off);
    if(!best||r.ok>best.ok||(r.ok===best.ok&&Math.abs(off-prior)<Math.abs(best.off-prior)))best={...r,off};}
  const ok=best.res.filter(r=>r.st==="ok"),dts=ok.map(r=>r.dt);
  return {score:Math.round(ok.length/X.length*100),ok:ok.length,total:X.length,bad:best.res.filter(r=>r.st==="bad").length,
    miss:best.res.filter(r=>r.st==="miss").length,extra:dets.length-best.used.size,delay:Math.round(best.off*1000),cal,
    avgDt:dts.length?Math.round(dts.reduce((a,b)=>a+b,0)/dts.length*1000):0,res:best.res,at:new Date().toISOString()};
}
async function startTest(id){
  if(!await ensureListening()){render();const r=document.getElementById("res-"+id);if(r)r.innerHTML=`<p class="warn">${L.error||"The microphone isn't available."}</p>`;return;}
  L.notes=[];L.onsets=[];
  start(id,false,true);
}
function finishTest(p){
  const r=finalScore(p),key=p.id==="pos"?"box":keyOf(today.items[Number(p.id.slice(1))]);
  today.scores=today.scores||{};const prev=today.scores[key];
  today.scores[key]={best:Math.max(r.score,prev?prev.best:0),last:r.score,tries:(prev?prev.tries:0)+1,passed:!!(prev&&prev.passed)||r.score>=S.pass};
  persistDay();lastResult[p.id]=r;render();paintResult(p.id,r,true);
}
function stoppedEarly(p){
  const lv=p.live;if(!lv)return;const done=lv.st.filter(Boolean).length,ok=lv.st.filter(x=>x==="ok").length;
  const el=document.getElementById("res-"+p.id);
  if(el)el.innerHTML=`<div class="score fail"><b>–</b><div><div class="sh">Stopped before the end</div><div class="sd">${done} of ${p.exp.length} notes checked, ${ok} right. Play to the end to get a score.</div></div></div>`;
  const tp=document.getElementById("tp-"+p.id);if(tp)tp.hidden=true;
}
const lastResult={};
function paintResult(id,r,scroll){
  if(!r)return;
  if(id!=="pos")r.res.forEach(x=>{const c=document.querySelector(`.col[data-id="${id}"][data-k="${x.k}"]`);if(c){c.classList.remove("r-ok","r-bad","r-miss");c.classList.add("r-"+x.st);}});
  const el=document.getElementById("res-"+id);if(!el)return;
  const pass=r.score>=S.pass,wrong=r.res.filter(x=>x.st!=="ok"),probs=wrong.slice(0,6).map(x=>x.st==="miss"?`${midiName(x.want)} not heard`:`${midiName(x.want)} expected, heard ${midiName(x.heard)}`);
  const timing=r.cal?`timing ${r.avgDt>0?"+":""}${r.avgDt} ms on average`:`delay measured at ${r.delay} ms; calibrate earphones for stricter timing`;
  el.innerHTML=`<div class="score ${pass?"pass":"fail"}"><b>${r.score}%</b><div><div class="sh">${pass?"Passed. Next is unlocked.":`Not yet: ${S.pass}% needed. Try again.`}</div>
    <div class="sd">${r.ok} of ${r.total} notes right · ${r.bad} wrong · ${r.miss} missed${r.extra?` · ${r.extra} extra`:""} · ${timing}</div>
    ${probs.length?`<div class="sd">${probs.join(" · ")}${wrong.length>6?" …":""}</div>`:""}</div></div>
    <div class="strip">${r.res.map(x=>`<i class="${x.st}" title="${midiName(x.want)}"></i>`).join("")}</div>`;
  if(scroll)el.scrollIntoView({behavior:"smooth",block:"center"});
}
async function calibrate(){
  const st=document.getElementById("calStatus");const say=t=>{if(st)st.textContent=t;};
  if(!await ensureListening()){say(L.error);return;}
  stop();const c=audioCtx(),sp=60/90,t0=c.currentTime+0.4,clicks=[];
  for(let i=0;i<12;i++){const t=t0+i*sp;click(t,i%4===0);if(i>=4)clicks.push(t);}
  L.onsets=[];say("Listen to 4 clicks, then pluck any single note exactly on each of the next 8 clicks…");
  await new Promise(r=>setTimeout(r,(12*sp+1)*1000));
  const offs=clicks.map(cl=>{let b=null;L.onsets.forEach(o=>{const d=o-cl;if(d>-0.15&&d<0.6&&(b===null||Math.abs(d)<Math.abs(b)))b=d;});return b;}).filter(x=>x!==null).sort((a,b)=>a-b);
  if(offs.length<5){say(`Only ${offs.length} of 8 plucks were heard. Play a little louder, keep the room quiet, and try again.`);return;}
  const med=offs[Math.floor(offs.length/2)],spread=offs[offs.length-1]-offs[0];
  S.latency=Math.round(med*1000)/1000;persistSettings();
  say(`Done: your earphones and microphone add ${Math.round(med*1000)} ms. Scores now allow for that.${spread>0.12?" Your plucks varied quite a bit; calibrate again if scores feel off.":""}`);
  const lv=document.getElementById("latV");if(lv)lv.textContent=Math.round(med*1000)+" ms";
}
let tunerTimer=null;
async function toggleTuner(){
  const out=document.getElementById("tuner"),btn=document.getElementById("tunerBtn");
  if(tunerTimer){clearInterval(tunerTimer);tunerTimer=null;if(btn)btn.textContent="Check the microphone";if(out)out.textContent="";return;}
  if(!await ensureListening()){if(out)out.textContent=L.error;return;}
  render();
  const o=()=>document.getElementById("tuner"),b=()=>document.getElementById("tunerBtn");if(b())b().textContent="Stop the check";
  tunerTimer=setInterval(()=>{const el=o();if(!el){clearInterval(tunerTimer);tunerTimer=null;return;}
    const lvl=Math.max(0,Math.min(1,((L.level||-100)+70)/55)),p=L.head>2048?yinAt(L.head-2048):null;
    const sounding=(L.level||-100)>L.floor+12&&p&&p.clar>0.8;
    el.innerHTML=`<span class="meter"><i style="width:${Math.round(lvl*100)}%"></i></span> ${sounding?`Hearing <b>${midiName(Math.round(69+12*Math.log2(p.f/440)))}</b> (${p.f.toFixed(1)} Hz)`:"Play a single note…"}`;
  },120);
}


/* ===================== Device sync (shares Total Recall's sync code and encrypted cloud bridge) ===================== */
const SYNC_KEY="totalRecallSyncCode_v1",SYNC_URL=localStorage.getItem("totalRecallTickTickUrl")||"https://total-recall-ticktick.pranjuchakrapani90.workers.dev";
const LOCAL_ONLY=["micId","latency"]; // microphone and earphone delay belong to each device
const SY={busy:false,again:false,timer:0,state:"off",msg:"",last:null};
const b64=a=>{let s="";new Uint8Array(a).forEach(x=>s+=String.fromCharCode(x));return btoa(s);};
const unb64=s=>{const r=atob(s),u=new Uint8Array(r.length);for(let i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return u;};
async function syncKeyOf(code){const h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(code+"#melodies"));return crypto.subtle.importKey("raw",h,{name:"AES-GCM"},false,["encrypt","decrypt"]);}
async function encryptState(state,code){const iv=crypto.getRandomValues(new Uint8Array(12)),k=await syncKeyOf(code),c=await crypto.subtle.encrypt({name:"AES-GCM",iv},k,new TextEncoder().encode(JSON.stringify(state)));return JSON.stringify({v:1,iv:b64(iv),data:b64(c)});}
async function decryptState(blob,code){const x=JSON.parse(blob||"{}"),k=await syncKeyOf(code),p=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(x.iv)},k,unb64(x.data));return JSON.parse(new TextDecoder().decode(p));}
const syncCode=()=>{try{return localStorage.getItem(SYNC_KEY)||"";}catch(e){return "";}};
function sharedSettings(){const o={...S};LOCAL_ONLY.forEach(k=>delete o[k]);return o;}
function mergeRemote(remote){
  let changed=false;
  Object.values(remote.sessions||{}).forEach(r=>{const l=sessions[r.id];
    if(!l||(r.upd||0)>(l.upd||0)){sessions[r.id]=normalize(JSON.parse(JSON.stringify(r)));changed=true;}});
  if(remote.settings&&(remote.settings._upd||0)>(S._upd||0)){const keep={};LOCAL_ONLY.forEach(k=>keep[k]=S[k]);Object.assign(S,remote.settings,keep);changed=true;}
  if(changed&&store&&store._w)store._w();
  return changed;
}
function setSync(state,msg){SY.state=state;SY.msg=msg||"";if(state==="ok")SY.last=new Date();
  const el=document.getElementById("syncBadge");if(el){el.textContent=state==="busy"?"☁ Syncing…":state==="ok"?"☁ Synced":state==="err"?"☁ Sync problem":"☁ Sync off";el.className="sbadge "+state;el.title=SY.msg;}
  const st=document.getElementById("syncState");if(st)st.innerHTML=syncStateHTML();}
function syncStateHTML(){
  if(!syncCode())return "Sync is off. Progress stays on this device.";
  if(SY.state==="err")return `Couldn't sync: ${SY.msg.replace(/</g,"&lt;")}. It will retry automatically.`;
  if(SY.state==="busy")return "Syncing…";
  return SY.last?`Synced at ${SY.last.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})}. Changes on any device appear on the others.`:"Sync is on.";
}
function scheduleSync(){if(!syncCode())return;clearTimeout(SY.timer);SY.timer=setTimeout(()=>cloudSync(),1500);}
async function cloudSync(){
  const code=syncCode();if(!code){setSync("off");return false;}
  if(SY.busy){SY.again=true;return false;}
  SY.busy=true;setSync("busy");let changed=false;
  try{
    const url=SYNC_URL+(SYNC_URL.indexOf("?")>=0?"&":"?")+"mode=sync",headers={"Content-Type":"application/json","X-Total-Recall-Sync":code+"#melodies"};
    const r=await fetch(url,{method:"POST",headers,body:JSON.stringify({state:{app:"melodies"}}),cache:"no-store"});
    if(!r.ok)throw new Error("the sync bridge answered HTTP "+r.status);
    const data=await r.json();if(data.error)throw new Error(data.error);
    if(data.blob)changed=mergeRemote(await decryptState(data.blob,code));
    const blob=await encryptState({v:1,sessions,settings:sharedSettings()},code);
    const w=await fetch(url,{method:"PUT",headers,body:blob,cache:"no-store"});
    if(!w.ok)throw new Error("upload failed with HTTP "+w.status);
    setSync("ok");
  }catch(e){setSync("err",String(e&&e.message||e));}
  finally{SY.busy=false;if(SY.again){SY.again=false;scheduleSync();}}
  if(changed&&today)applyRemote();
  return changed;
}
function pickOpen(){return Object.values(sessions).filter(x=>!x.finished).sort((a,b)=>(b.done.length-a.done.length)||(a.started<b.started?-1:1))[0];}
let pendingRemote=false;
function applyRemote(){
  if(play){pendingRemote=true;return;}
  pendingRemote=false;
  const open=pickOpen();
  if(open&&open.id!==today.id){today=open;resetTempo();view="setup";}
  else if(sessions[today.id])today=sessions[today.id];
  else if(open)today=open;
  render();
}
async function turnOnSync(code){
  code=(code||"").trim();if(code.length<8){setSync("err","use a sync code of at least 8 characters");return;}
  try{localStorage.setItem(SYNC_KEY,code);}catch(e){}
  await cloudSync();render();
}
function turnOffSync(){try{localStorage.removeItem(SYNC_KEY);}catch(e){}setSync("off");render();}
function syncPanel(){
  const on=!!syncCode();
  return `<div class="listen"><h3>Device sync</h3>
    <p class="tnote" id="syncState">${syncStateHTML()}</p>
    ${on?`<div class="lrow"><button type="button" data-syncnow="1">Sync now</button><button type="button" class="linkb" data-syncoff="1">Turn sync off on this device</button></div>
      <p class="tnote">Uses your Total Recall sync code. Sessions, scores, practice time and settings sync; the microphone choice and earphone calibration stay per device.</p>`
    :`<div class="lrow"><input type="password" id="syncIn" placeholder="Your Total Recall sync code" autocomplete="off" style="flex:1;min-width:0"><button type="button" class="play" data-syncon="1">Turn on sync</button></div>
      <p class="tnote">Use the same code as Total Recall's Device Sync on every device. If you already set it in Total Recall on this device, this page uses it automatically.</p>`}
  </div>`;
}

/* ===================== Controls ===================== */
document.addEventListener("click",e=>{
  const p=e.target.closest("[data-play],[data-rhy]");if(p){const ro=!!p.dataset.rhy,id=ro?p.dataset.rhy:p.dataset.play;
    (play&&play.id===id&&play.ro===ro)?stop():start(id,ro);return;}
  const g=e.target.closest("[data-go]");if(g){const v=g.dataset.go;go(/^\d$/.test(v)?Number(v):v);return;}
  const tb=e.target.closest("[data-test]");if(tb){const id=tb.dataset.test;if(play&&play.test&&play.id===id)stop();else startTest(id);return;}
  if(e.target.closest("[data-tuner]")){toggleTuner();return;}
  if(e.target.closest("[data-syncnow]")){cloudSync();return;}
  if(e.target.closest("[data-syncoff]")){turnOffSync();return;}
  if(e.target.closest("[data-syncon]")){const i=document.getElementById("syncIn");turnOnSync(i?i.value:"");return;}
  if(e.target.closest("[data-calibrate]")){calibrate();return;}
  const lb=e.target.closest("[data-labels]");if(lb){S.labels=lb.dataset.labels;persistSettings();render();return;}
  if(e.target.closest("[data-boxdone]")){today.boxDone=true;persistDay();go(0);return;}
  const d=e.target.closest("[data-itemdone]");if(d){const j=Number(d.dataset.itemdone);markDone(j,true);go(j===4?"summary":j+1);return;}
  const u=e.target.closest("[data-undo]");if(u){markDone(Number(u.dataset.undo),false);render();return;}
  if(e.target.closest("[data-newsession]")){stop();today.finished=true;persistDay();
    today=planSession();sessions[today.id]=today;persistDay();extra=null;resetTempo();go("setup");}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="key"){S.keyPc=Number(t.value);persistSettings();render();}
  else if(["click","loop","countin","chords","guide"].includes(t.id)){S[t.id]=t.checked;persistSettings();}
  else if(t.id==="listen"){S.listen=t.checked;persistSettings();render();}
  else if(t.id==="pass"){S.pass=Number(t.value);persistSettings();}
  else if(t.id==="mic"){S.micId=t.value;persistSettings();stopListening();ensureListening().then(render);}
});
document.addEventListener("input",e=>{
  if(e.target.id!=="tempo")return;curTempo=Number(e.target.value);document.getElementById("tempoV").textContent=curTempo;
  if(today&&today.tempo==null){S.tempo=curTempo;persistSettings();}setTempoNote();
});
document.addEventListener("submit",e=>{if(e.target.id!=="buildForm")return;e.preventDefault();if(!today)return;
  const err=document.getElementById("cellErr"),toks=document.getElementById("cellIn").value.trim().split(/[\s,–—-]+/).filter(Boolean);
  if(toks.length<2||toks.length>12||toks.some(t=>!/^\d{1,2}$/.test(t))){err.textContent="Enter 2 to 12 numbers, for example 1 3 4 5.";return;}
  const c=toks.map(t=>Number(t)-1);
  if(!buildSeq(c,0,posData.notes.length).length){err.textContent="That cell is too wide for one position. Try smaller numbers.";return;}
  err.textContent="";if(play&&play.id==="x")stop();extra={c,i:-1,rh:Number(document.getElementById("xr").value)};
  document.getElementById("extra").innerHTML=seqCard("x",extra,0,true);});
document.addEventListener("keydown",e=>{
  if(e.key!==" "||["INPUT","SELECT","TEXTAREA","BUTTON","SUMMARY"].includes(e.target.tagName))return;
  const b=document.querySelector("#view [data-play]");if(!b)return;e.preventDefault();b.click();
});
document.addEventListener("visibilitychange",()=>{if(document.hidden)stop();else cloudSync();});
setInterval(()=>{if(!document.hidden&&!play)cloudSync();},60000);

/* ===================== Boot ===================== */
(async()=>{
  store=await initStore();
  let loaded={ds:{},st:null};try{loaded=await store.load();}catch(e){}
  sessions=loaded.ds||{};Object.values(sessions).forEach(normalize);
  if(loaded.st)Object.assign(S,loaded.st);
  if(syncCode())await Promise.race([cloudSync(),new Promise(r=>setTimeout(r,6000))]);
  const open=pickOpen();
  if(open){today=open;if(today.step==null){today.stage=0;today.step=0;today.tempo=ladder(0)[0];}persistDay();}else{today=planSession();sessions[today.id]=today;persistDay();}
  resetTempo();view="setup";render();
  document.getElementById("syncNote").textContent=store.kind==="db"
    ?"Your sessions and settings are saved to your Claude account, so they follow you between phone and computer."
    :"Progress is saved on this device"+(syncCode()?" and synced to your other devices with your Total Recall sync code.":". Turn on Device sync on the first card to share it with your other devices.");
})();
