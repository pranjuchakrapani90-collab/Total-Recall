name: Fix collapsible recall history control

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add history toggle handler
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = "$('startPeople').addEventListener('click',startPeople);"
          handler = "$('historyToggle').addEventListener('click',function(){var h=$('history'),open=!h.classList.contains('hidden');h.classList.toggle('hidden',open);$('historyToggle').textContent=open?'Show previous recall history':'Hide previous recall history'});"
          if handler not in s:
              if marker not in s:
                  raise SystemExit('Could not find JavaScript insertion point')
              s = s.replace(marker, marker + handler, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-history-toggle.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Make previous recall history expandable"
          git push
