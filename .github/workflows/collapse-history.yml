name: Collapse Previous Recall History

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch history UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<div id="historyBox" class="hidden"><h3>Previous recall history</h3><div id="history"></div></div>'
          new = '<div id="historyBox" class="hidden"><button id="historyToggle" type="button" class="secondary small">Show previous recall history</button><div id="history" class="hidden" style="margin-top:10px"></div></div>'
          if old in s:
              s = s.replace(old, new, 1)
          old_js = "var h=mode==='resp'?(sub?taskHistory((taskGroups[p.key]||[])[subIdx]):[]):hist(p);$('historyBox').classList.toggle('hidden',!h.length);$('history').innerHTML=h.slice().reverse().slice(0,5).map(function(x){return '<div class=\"history\"><small>'+new Date(x.date).toLocaleString()+'</small><br>'+esc(x.note||'Recalled — no comment added.')+'</div>'}).join('')}"
          new_js = "var h=mode==='resp'?(sub?taskHistory((taskGroups[p.key]||[])[subIdx]):[]):hist(p);$('historyBox').classList.toggle('hidden',!h.length);$('history').classList.add('hidden');$('historyToggle').textContent='Show previous recall history';$('history').innerHTML=h.slice().reverse().slice(0,5).map(function(x){return '<div class=\"history\"><small>'+new Date(x.date).toLocaleString()+'</small><br>'+esc(x.note||'Recalled — no comment added.')+'</div>'}).join('')}"
          if old_js in s:
              s = s.replace(old_js, new_js, 1)
          marker = "$('startPeople').addEventListener('click',startPeople);"
          listener = "$('historyToggle').addEventListener('click',function(){var h=$('history');var hidden=h.classList.toggle('hidden');$('historyToggle').textContent=hidden?'Show previous recall history':'Hide previous recall history'});"
          if listener not in s and marker in s:
              s = s.replace(marker, listener + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/collapse-history.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Collapse previous recall history by default"
          git push
