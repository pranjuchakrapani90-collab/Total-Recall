name: Fix completed task flashcards
on:
  push:
    branches: [main]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace completed review with dedicated flashcard mode
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          html_marker='<section id="done" class="hidden">'
          if 'id="completedSession"' not in s:
              completed_html='''<section id="completedSession" class="hidden"><div class="panel"><div class="row" style="justify-content:space-between"><button id="completedHomeBtn" class="secondary small">← Dashboard</button><span id="completedProgress" class="muted"></span></div><div id="completedFlash" class="flash" style="margin-top:15px"><div id="completedCounter" class="counter"></div><div id="completedCard" class="name"></div><div id="completedHint" class="hint"></div></div><button id="completedDeleteBtn" class="danger small" style="margin-top:10px">Delete this task</button><h3>What do you recall about completing this task?</h3><textarea id="completedNote" placeholder="Write anything you recall about completing this task..."></textarea><div class="row" style="justify-content:space-between;margin-top:18px"><button id="completedSkip" class="secondary">Skip</button><button id="completedNext">Save & Next →</button></div></div></section>'''
              s=s.replace(html_marker,completed_html+html_marker,1)
          start=s.index('async function reviewCompletedTasks()')
          end=s.index("$('reviewWeek').value=isoWeekValue(new Date());",start)+len("$('reviewWeek').value=isoWeekValue(new Date());")
          new=r'''var completedCards=[],completedIdx=0,completedWeek=null;
async function reviewCompletedTasks(){var range=weekRange($('reviewWeek').value);if(!range){alert('Please select a week first.');return}completedWeek=range;$('completedStatus').classList.remove('hidden');$('completedStatus').textContent='Loading completed TickTick tasks for '+range.start+' to '+range.end+'…';$('completedResults').innerHTML='';var u=TICK_URL+(TICK_URL.indexOf('?')>=0?'&':'?')+'mode=completed&start='+encodeURIComponent(range.start)+'&end='+encodeURIComponent(range.end);try{var r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('TickTick bridge returned HTTP '+r.status);var data=await r.json();if(data.error)throw new Error(data.error);var tasks=(data.tasks||[]).filter(function(t){return !COMPLETED_SUPPRESS[String(t.title||'').trim().toLowerCase()]});$('completedStatus').textContent=tasks.length+' unique completed task'+(tasks.length===1?'':'s')+' found for '+range.start+' to '+range.end+'.';if(!tasks.length){$('completedResults').innerHTML='<div class="muted">No completed tasks found for this week.</div>';return}completedCards=tasks;completedIdx=0;$('completedResults').innerHTML='';hide('home');hide('session');hide('done');show('completedSession');drawCompletedCard();}catch(e){$('completedStatus').textContent='Could not load completed tasks: '+e.message;$('completedResults').innerHTML='<div class="warning">Check that the TickTick Worker is deployed and its access token is working.</div>'}}
function drawCompletedCard(){var t=completedCards[completedIdx]||{};$('completedProgress').textContent='Completed task '+(completedIdx+1)+' of '+completedCards.length;$('completedCounter').textContent='Completed Task Review';$('completedCard').textContent=t.title||'Untitled task';var dates=(t.completionDates||[]).map(function(d){return new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})}).join(' • ');$('completedHint').textContent=(t.completionCount>1?'Completed '+t.completionCount+' times':'Completed once')+(dates?' • '+dates:'')+(t.tags&&t.tags.length?' • '+t.tags.join(', '):'');$('completedNote').value='';}
function finishCompletedReview(){completedCards=[];completedIdx=0;hide('completedSession');show('home');}
$('reviewCompletedBtn').addEventListener('click',reviewCompletedTasks);
$('completedNext').addEventListener('click',function(){if(!completedCards.length)return;completedIdx++;if(completedIdx>=completedCards.length){finishCompletedReview();return}drawCompletedCard();});
$('completedSkip').addEventListener('click',function(){if(!completedCards.length)return;completedIdx++;if(completedIdx>=completedCards.length){finishCompletedReview();return}drawCompletedCard();});
$('completedDeleteBtn').addEventListener('click',function(){if(!completedCards.length)return;var t=completedCards[completedIdx]||{},k=String(t.title||'').trim().toLowerCase();if(!k)return;if(!confirm('Hide this task from Completed Task Review? It will remain in TickTick.'))return;COMPLETED_SUPPRESS[k]=true;localStorage.setItem(COMPLETED_SUPPRESS_KEY,JSON.stringify(COMPLETED_SUPPRESS));completedCards.splice(completedIdx,1);if(completedIdx>=completedCards.length){finishCompletedReview();return}drawCompletedCard();});
$('completedHomeBtn').addEventListener('click',finishCompletedReview);
$('reviewWeek').value=isoWeekValue(new Date());'''
          s=s[:start]+new+s[end:]
          p.write_text(s)
          PY
      - name: Commit and remove patch workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "No index change"; exit 1; fi
          git commit -m "Show completed tasks as dedicated flashcards"
          git push
          git rm .github/workflows/fix-completed-flashcards.yml
          git commit -m "Remove completed flashcard patch workflow"
          git push
