name: Fix recurring review
on:
  push:
    paths:
      - '.github/workflows/fix-recurring-review.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch worker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ticktick-worker.js')
          s=p.read_text()
          old="""        // Build a day-by-day map of scheduled occurrences. We deliberately
        // include status 0 AND 2: if a recurring occurrence was completed on
        // the following day, it was still scheduled and therefore the prior
        // day's completion must not be treated as the end of the task series.
        const scheduledByDay = new Map();
        for (let day = addDays(start,1); day <= addDays(end,1); day = addDays(day,1)) {
          const nextFetched = await fetchScheduledTasksForDay(day, env.TICKTICK_ACCESS_TOKEN);
          const nextRaw = Array.isArray(nextFetched.result) ? nextFetched.result : ((nextFetched.result && nextFetched.result.tasks) || []);
          const set = new Set();
          for (const task of nextRaw) {
            const dueDate = dateInZone(task && (task.dueDate || task.due || ''), tz);
            if (dueDate !== day) continue;
            set.add(continuationKey(task));
          }
          scheduledByDay.set(day,set);
        }
"""
          new="""        // Build the historical schedule from the completed occurrences we
        // already fetched, plus currently open tasks for each following day.
        // This is important because a completed recurring occurrence is no
        // longer open, but it still proves that the task was scheduled that day.
        // Therefore a completion only counts as a finished item when there is
        // NO occurrence of the same continuing task on the next calendar day.
        const scheduledByDay = new Map();
        for (let day = start; day <= addDays(end,1); day = addDays(day,1)) scheduledByDay.set(day,new Set());

        for (const task of raw) {
          const dueDate = dateInZone(task && (task.dueDate || task.due || ''), tz);
          if (!dueDate || !scheduledByDay.has(dueDate)) continue;
          scheduledByDay.get(dueDate).add(continuationKey(task));
        }

        for (let day = addDays(start,1); day <= addDays(end,1); day = addDays(day,1)) {
          const nextFetched = await fetchTasksForRange(day, day, env.TICKTICK_ACCESS_TOKEN);
          const nextRaw = Array.isArray(nextFetched.result) ? nextFetched.result : ((nextFetched.result && nextFetched.result.tasks) || []);
          for (const task of nextRaw) {
            const dueDate = dateInZone(task && (task.dueDate || task.due || ''), tz);
            if (dueDate !== day) continue;
            scheduledByDay.get(day).add(continuationKey(task));
          }
        }
"""
          if old not in s:
            raise SystemExit('target block not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ticktick-worker.js
          git commit -m 'Fix recurring review using historical occurrences' || exit 0
          git push
      - name: Remove patch workflow
        if: always()
        run: |
          git rm .github/workflows/fix-recurring-review.yml || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Remove temporary recurring review patch workflow' || true
          git push || true
