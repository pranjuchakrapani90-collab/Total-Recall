name: Patch completed task flashcards
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          start=s.index('async function reviewCompletedTasks()')
          marker="$('reviewWeek').value=isoWeekValue(new Date());$('reviewCompletedBtn').addEventListener('click',reviewCompletedTasks);"
          end=s.index(marker,start)+len(marker)
          new=r'''async function reviewCompletedTasks(){var range=weekRange($('reviewWeek').value);if(!range){alert('Please select a week first.');return}$('completedStatus').classList.remove('hidden');$('completedStatus').textContent='Loading completed TickTick tasks for '+range.start+' to '+range.end+'…';$('completedResults').innerHTML='';var u=TICK_URL+(TICK_URL.indexOf('?')>=0?'&':'?')+'mode=completed&start='+encodeURIComponent(range.start)+'&end='+encodeURIComponent(range.end);try{var r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('TickTick bridge returned HTTP '+r.status);var data=await r.json();if(data.error)throw new Error(data.error);var tasks=(data.tasks||[]).filter(function(t){return !COMPLETED_SUPPRESS[String(t.title||'').trim().toLowerCase()]});$('completedStatus').textContent=tasks.length+' unique completed task'+(tasks.length===1?'':'s')+' found for '+range.start+' to '+range.end+'.';if(!tasks.length){$('completedResults').innerHTML='<div class="muted">No completed tasks found for this week.</div>';return}cards=tasks.map(function(t){return {name:t.title||'',completedTask:t,history:[],sources:[]}});idx=0;sub=false;mode='completed';saved=0;show('session');hide('home');hide('done');$('deleteBtn').textContent='Delete this task';$('deleteBtn').classList.remove('hidden');$('prompt').textContent='What do you recall about completing this task?';$('note').value='';$('historyBox').classList.add('hidden');$('completedResults').innerHTML='';drawCompletedCard();}catch(e){$('completedStatus').textContent='Could not load completed tasks: '+e.message;$('completedResults').innerHTML='<div class="warning">Check that the TickTick Worker is deployed and its access token is working.</div>'}}
function drawCompletedCard(){if(mode!=='completed'||!cards.length)return;var t=cards[idx]||{};$('progress').textContent='Completed task '+(idx+1)+' of '+cards.length;$('counter').textContent='Completed task review';$('card').textContent=t.name||'Untitled task';$('hint').textContent=(t.completedTask&&t.completedTask.completionDates&&t.completedTask.completionDates.length?'Completed: '+t.completedTask.completionDates.join(' • '):'Completed task')+(t.completedTask&&t.completedTask.tags&&t.completedTask.tags.length?' • '+t.completedTask.tags.join(', '):'');$('source').classList.add('hidden');$('note').value='';$('historyBox').classList.add('hidden');$('deleteBtn').classList.remove('hidden');}
function finishCompletedReview(){mode='people';cards=[];idx=0;sub=false;hide('deleteBtn');hide('session');show('home');$('completedStatus').classList.remove('hidden');}
$('reviewCompletedBtn').addEventListener('click',reviewCompletedTasks);
$('next').addEventListener('click',function(){if(mode!=='completed')return;if(cards.length&&cards[idx])saved++;idx++;if(idx>=cards.length){finishCompletedReview();return}drawCompletedCard();});
$('skip').addEventListener('click',function(){if(mode!=='completed')return;idx++;if(idx>=cards.length){finishCompletedReview();return}drawCompletedCard();});
$('deleteBtn').addEventListener('click',function(){if(mode!=='completed'||!cards.length)return;var t=cards[idx]||{},k=String(t.name||'').trim().toLowerCase();if(!k)return;if(!confirm('Hide this task from Completed Task Review? It will remain in TickTick.'))return;COMPLETED_SUPPRESS[k]=true;localStorage.setItem(COMPLETED_SUPPRESS_KEY,JSON.stringify(COMPLETED_SUPPRESS));cards.splice(idx,1);if(idx>=cards.length){finishCompletedReview();return}drawCompletedCard();});
$('homeBtn').addEventListener('click',function(){if(mode==='completed')finishCompletedReview();});
$('reviewWeek').value=isoWeekValue(new Date());'''
          s=s[:start]+new+s[end:]
          p.write_text(s)
          PY
      - name: Commit and remove patch workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/patch-completed-flashcards.yml
          git commit -m "Show completed tasks as flashcards"
          git push
