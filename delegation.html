<!doctype html>
<html lang="en"><head><meta charset="utf-8"><script src="pos-guard.js"></script><script src="kvsync.js?v=20261102p"></script><script src="tasks-local.js?v=20261102t"></script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1c1b19">
<title>Delegation · Pranju OS</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="icon" href="icon-192.png" sizes="192x192"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Delegation (29 Oct 2026): review open TickTick tasks one by one, give each to a person,
   and every person becomes a flash card — their name in the middle, their tasks around it,
   the way he draws them in his diary. Data lives in localStorage "deleg", synced by kvsync.js. */
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
body>header{padding:calc(10px + env(safe-area-inset-top,0px)) 16px 0;position:sticky;top:0;z-index:20}
.hin{max-width:1100px;margin:0 auto}
.backlink{font-size:13px;text-decoration:none}
h1{margin:4px 0 8px;font-size:22px}
.tabs{display:flex;gap:4px}
.tabs button{flex:1;max-width:180px;border:0;background:transparent;color:var(--tr-head-mute);font:650 14px system-ui,sans-serif;padding:10px 6px 11px;border-bottom:3px solid transparent;margin-bottom:-3px;cursor:pointer}
.tabs button.on{color:var(--tr-head-ink);border-bottom-color:var(--tr-head-ink)}
.tabs b{font-weight:600;font-size:12px;opacity:.75;margin-left:4px}
main{max-width:1100px;margin:0 auto;padding:16px 16px 90px}
.muted{color:var(--tr-muted)}
.err{background:#fdf0ee;color:#8a1f11;border-radius:12px;padding:12px 14px;margin-bottom:12px}
.btn{border:1px solid var(--tr-line);background:var(--tr-paper);color:var(--tr-ink);border-radius:10px;padding:10px 14px;font:600 14px system-ui,sans-serif;cursor:pointer}
.btn.pri{background:var(--tr-acc);border-color:var(--tr-acc);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:#b42318;border-color:#f3c7c0}
.btn:disabled{opacity:.45;cursor:default}
input,select{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--tr-line);border-radius:10px;background:#fff;color:var(--tr-ink)}

/* ---------- review ---------- */
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--tr-muted);margin-bottom:10px}
.prog .bar{flex:1;height:6px;border-radius:9px;background:var(--tr-soft);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--tr-acc);border-radius:9px}
.lists{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.lists button{border:1px solid var(--tr-line);background:var(--tr-paper);color:var(--tr-muted);border-radius:999px;padding:5px 11px;font:600 12px system-ui,sans-serif;cursor:pointer}
.lists button.on{background:var(--tr-ink);border-color:var(--tr-ink);color:#fff}
.rv{background:var(--tr-paper);border:1px solid var(--tr-line);border-radius:18px;box-shadow:var(--tr-shadow);padding:18px;max-width:640px}
.rv .proj{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tr-muted)}
.rv .ttl{font-size:19px;font-weight:700;line-height:1.35;margin:6px 0 4px;word-break:break-word}
.rv .tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.rv .tags span{font-size:11px;background:var(--tr-soft);color:var(--tr-muted);border-radius:6px;padding:2px 7px}
.lbl{display:block;font-size:12px;font-weight:700;color:var(--tr-muted);margin:14px 0 6px}
.people{display:flex;gap:8px;flex-wrap:wrap}
.pchip{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--g);background:#fff;color:var(--tr-ink);border-radius:999px;padding:9px 14px;font:650 14px system-ui,sans-serif;cursor:pointer}
.pchip i{width:9px;height:9px;border-radius:50%;background:var(--g)}
.pchip small{font-weight:600;color:var(--tr-muted);font-size:11px}
.pchip:active{background:var(--tr-soft)}
.pchip.add{border-style:dashed;border-color:var(--tr-muted);color:var(--tr-muted)}
.newp{display:grid;grid-template-columns:1fr 120px auto;gap:8px;margin-top:10px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px solid var(--tr-line)}
.acts .sp{flex:1}
.done-all{text-align:center;padding:40px 16px;background:var(--tr-paper);border:1px solid var(--tr-line);border-radius:18px;max-width:640px}
.done-all h2{margin:0 0 6px}
.aside-link{margin-top:14px;font-size:13px}
.aside-link button{border:0;background:none;color:var(--tr-acc-ink);font:600 13px system-ui,sans-serif;cursor:pointer;padding:0}

/* ---------- cards ---------- */
.ctools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.ctools .sp{flex:1}
.ctools label{font-size:13px;color:var(--tr-muted);display:flex;gap:6px;align-items:center}
.ctools input[type=checkbox]{width:auto}
.deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:14px}
.fc{background:var(--tr-paper);border:1px solid var(--tr-line);border-top:4px solid var(--g);border-radius:18px;box-shadow:var(--tr-shadow);padding:10px 12px 14px;position:relative}
.fc-h{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--tr-muted)}
.fc-h .grp{font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--g)}
.fc-h .sp{flex:1}
.fc-h button{border:0;background:var(--tr-soft);color:var(--tr-ink);border-radius:8px;padding:5px 9px;font:600 12px system-ui,sans-serif;cursor:pointer}
.map{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-areas:"t t t" "l c r" "b b b";gap:14px 10px;align-items:center;padding:10px 0 2px;min-height:150px}
.map svg.ln{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.map svg.ln line{stroke:var(--g);stroke-width:1.4;opacity:.55}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.row.t{grid-area:t}.row.b{grid-area:b}
.col{display:flex;flex-direction:column;gap:10px}
.col.l{grid-area:l;align-items:flex-end}.col.r{grid-area:r;align-items:flex-start}
.hub{grid-area:c;position:relative;z-index:1;border:2px solid var(--g);background:#fff;border-radius:50%;min-width:96px;max-width:130px;min-height:62px;padding:10px 14px;display:flex;align-items:center;justify-content:center;text-align:center;font:750 16px/1.15 system-ui,sans-serif;cursor:pointer;word-break:break-word}
.chip{position:relative;z-index:1;border:1.5px solid var(--g);background:#fff;color:var(--tr-ink);border-radius:16px;padding:6px 11px;font:600 13px/1.25 system-ui,sans-serif;text-align:center;cursor:pointer;max-width:100%;word-break:break-word}
.col .chip{max-width:100%}
.row .chip{max-width:78%}
.chip.dn{text-decoration:line-through;color:var(--tr-muted);border-style:dashed;background:var(--tr-soft)}
.chip.dn::before{content:"✓ ";text-decoration:none;color:#15803d;font-weight:800}
.chip.new{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.empty-card{grid-column:1/-1;text-align:center;color:var(--tr-muted);font-size:13px;padding:6px 0}
.nocards{padding:30px 16px;text-align:center;color:var(--tr-muted);background:var(--tr-paper);border:1px dashed var(--tr-line);border-radius:18px}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:#1c1b1966;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim[hidden]{display:none}
.sheet{background:var(--tr-paper);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px #0003}
@media(min-width:700px){.scrim{align-items:center}.sheet{border-radius:20px}}
.sheet h3{margin:0 0 4px;font-size:17px;word-break:break-word}
.sheet .row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.sheet .meta{font-size:12px;color:var(--tr-muted)}
.alist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.alist div{display:flex;gap:10px;align-items:center;border:1px solid var(--tr-line);border-radius:12px;padding:9px 10px;font-size:13px}
.alist div span{flex:1;word-break:break-word}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tr-ink);color:#fff;border-radius:999px;padding:10px 18px;font:600 14px system-ui,sans-serif;z-index:60;box-shadow:0 6px 20px #0004;transition:opacity .3s;pointer-events:none}

/* ---------- one card at a time, like Today's Tasks ---------- */
.fnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 auto 10px;max-width:640px;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--tr-muted);text-transform:uppercase}
.flashwrap{max-width:640px;margin:0 auto}
.flashwrap .fc{padding:14px 14px 18px;min-height:340px;display:flex;flex-direction:column}
.flashwrap .map{flex:1;min-height:280px;gap:18px 12px}
.flashwrap .hub{font-size:20px;min-width:118px;min-height:76px;max-width:150px}
.flashwrap .chip{font-size:14px;padding:8px 12px}
.fbtns{display:flex;justify-content:space-between;gap:10px;max-width:640px;margin:16px auto 0}
.fbtns .btn{min-width:110px}
.seg{display:inline-flex;border:1px solid var(--tr-line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--tr-paper);color:var(--tr-muted);font:600 13px system-ui,sans-serif;padding:6px 12px;cursor:pointer}
.seg button.on{background:var(--tr-ink);color:#fff}

/* ---------- a task as a flip card (same feel as Today's Tasks) ---------- */
.tflash{position:fixed;inset:0;z-index:40;background:var(--tr-bg);overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
.tflash[hidden]{display:none}
.tfIn{max-width:640px;margin:0 auto}
.tfTop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.tfTop .btn{padding:7px 12px;font-size:13px}
.tfCard{height:calc(100dvh - 205px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:300px;perspective:1200px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tfInner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s ease}
.tfCard.flipped .tfInner{transform:rotateY(180deg)}
.tfFace{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;background:var(--tr-paper);border:1px solid var(--tr-line);border-top:4px solid var(--g);box-shadow:var(--tr-shadow);overflow:hidden}
.tfFront{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px 20px}
.tfBackFace{transform:rotateY(180deg);display:flex;flex-direction:column}
.tfReveal{flex:1;overflow:auto}
.tfFlipHint{flex:0 0 auto;font-size:12px;color:var(--tr-muted);padding:10px 14px;border-top:1px solid var(--tr-line);background:#fafaf8;text-align:center}
.tfSrc{position:absolute;top:14px;right:14px;font-size:11px;font-weight:600;color:var(--g);border:1px solid var(--g);border-radius:999px;padding:3px 9px;opacity:.85}
.tfCounter{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--tr-muted)}
.tfKw{margin-top:14px;font-size:15px;font-weight:700;color:var(--g)}
.tfName{margin-top:6px;font-size:28px;max-width:100%;font-weight:800;line-height:1.2;word-break:break-word}
.tfName.dn{text-decoration:line-through;color:var(--tr-muted)}
.tfHint{margin-top:12px;font-size:13px;color:var(--tr-muted)}
.tfActs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tfNav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.tfNav .btn{min-width:110px}
.taskHead{padding:16px 16px 12px;border-bottom:1px solid var(--tr-line)}
.taskHead h4{margin:0;font-size:16px;word-break:break-word}
.tfHeadRow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.taskOpenLink{display:inline-flex;padding:6px 9px;border:1px solid #c7d2fe;border-radius:8px;background:#eef2ff;color:#3730a3;text-decoration:none;font-size:12px;font-weight:700;white-space:nowrap}
.taskMeta{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--tr-muted)}
.taskPill{padding:4px 8px;border-radius:999px;background:var(--tr-soft)}
.taskBody{padding:14px 16px}.taskContent{font-size:15px;line-height:1.55}.taskContent p{margin:0 0 8px}
.tickList{margin:0 0 6px;padding-left:20px}
.taskSection{padding:0 16px 14px}.taskSectionTitle{font-size:13px;font-weight:700;color:#4b5563;margin-bottom:7px}
.taskSubtask{font-size:14px;padding:3px 0}.taskSubtask.done{color:var(--tr-muted);text-decoration:line-through}
.taskComment{padding:10px 11px;border:1px solid var(--tr-line);border-radius:10px;margin-top:7px;font-size:14px}.taskComment p{margin:0 0 4px}.taskComment small{color:var(--tr-muted);font-size:11px}
.taskAttachment{display:flex;align-items:center;gap:10px;background:#eef8f0;border:1px solid #d9eedc;border-radius:10px;padding:8px 10px;margin:6px 0}
.taskAttachmentIcon{width:30px;height:30px;border-radius:7px;background:#43a047;color:#fff;display:grid;place-items:center;font-weight:800;flex:0 0 auto}
.taskAttachmentName{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.taskAttachmentSize{font-size:12px;color:#8a929e}
.taskEmpty{color:var(--tr-muted);font-size:13px}
.taskFooter{padding:10px 16px;border-top:1px solid var(--tr-line);font-size:12px;color:var(--tr-muted)}

/* ---------- one member at a time, full screen ---------- */
.mflash{position:fixed;inset:0;z-index:35;background:var(--tr-bg);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px))}
.mflash[hidden]{display:none}
.mfTop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.mfTop .btn{padding:7px 11px;font-size:13px;text-decoration:none;white-space:nowrap}
.mfCount{text-align:center;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tr-muted)}
.mfCount small{display:block;font-weight:600;letter-spacing:0;text-transform:none;font-size:11px}
.mfCard{flex:1;min-height:0;max-width:720px;width:100%;margin:0 auto;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.mfCard .fc{height:100%;overflow:hidden;display:flex;flex-direction:column;padding:12px 12px 14px}
.mfCard .map{flex:1;min-height:0;gap:calc(var(--cf,15px)*.9) calc(var(--cf,15px)*.6);align-content:center;transform-origin:50% 50%}
.mfCard.in-l .fc{animation:slideL .28s ease}.mfCard.in-r .fc{animation:slideR .28s ease}
@keyframes slideL{from{transform:translateX(-40px);opacity:.2}to{transform:none;opacity:1}}
@keyframes slideR{from{transform:translateX(40px);opacity:.2}to{transform:none;opacity:1}}
.mfHint{text-align:center;font-size:11px;color:var(--tr-muted);margin-top:8px;opacity:.8}
.mfCard .hub{font-size:calc(var(--cf,15px) + 5px);min-width:calc(var(--cf,15px)*6);min-height:calc(var(--cf,15px)*4);max-width:150px;padding:calc(var(--cf,15px)*.5) calc(var(--cf,15px)*.8)}
.mfCard .chip{word-break:normal;overflow-wrap:normal;overflow:hidden;font-size:var(--cf,15px);padding:calc(var(--cf,15px)*.5) calc(var(--cf,15px)*.8)}
.tfCard{touch-action:pan-y}
.chip{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.chip.sl{background:var(--g);color:#fff;border-style:solid;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--g);opacity:1;text-decoration:none}.chip.sl small{color:#fff}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--tr-paper);border-top:1px solid var(--tr-line);box-shadow:0 -8px 24px #0002;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px))}
.selbar .sbh{display:flex;align-items:center;gap:8px;max-width:720px;margin:0 auto 8px}.selbar .sbh b{font-size:15px}.selbar .sbh span{flex:1;font-size:12px;color:var(--tr-muted)}
.selbar .sbh button{border:0;background:var(--tr-soft);border-radius:999px;width:34px;height:34px;font-size:16px;cursor:pointer}
.selbar .sbg{display:grid;grid-template-columns:1fr 1fr;gap:7px;max-width:720px;margin:0 auto}
.selbar .sbg button{border:1.5px solid var(--c,var(--tr-line));background:var(--tr-paper);color:var(--c,var(--tr-ink));border-radius:11px;padding:10px 8px;font:650 13.5px system-ui,sans-serif;cursor:pointer}
.selbar .sbg button:disabled{opacity:.4}
.mlist{display:flex;flex-direction:column;gap:8px;margin-top:10px}.mlist label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--tr-line);border-radius:12px;padding:10px;cursor:pointer}
.mlist input{width:20px;height:20px;flex:0 0 auto;margin-top:2px}.mlist b{display:block;font-size:14px;word-break:break-word}.mlist small{color:var(--tr-muted);font-size:12px}
/* ---------- four outcomes under a task card (31 Oct 2026) ---------- */
.tfCard{height:calc(100dvh - 300px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:260px}
#tfOc{width:100%}
.oc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.oc button{text-align:left;border:1.5px solid var(--c);background:var(--tr-paper);color:var(--tr-ink);border-radius:13px;padding:9px 11px;min-height:58px;cursor:pointer;font:650 14px/1.25 system-ui,sans-serif}
.oc button b{display:block;color:var(--c);font-weight:750}
.oc button small{display:block;margin-top:2px;font-weight:500;font-size:11.5px;color:var(--tr-muted)}
.oc button.on{background:var(--c)}.oc button.on b,.oc button.on small{color:#fff}
.oc button[data-oc="today"]{grid-column:1/-1}
.chip.ar{touch-action:none;cursor:grab;border-style:dashed;animation:wig .9s ease-in-out infinite alternate}.chip.ar.drg{opacity:.3;animation:none}.chip.tgt{outline:3px solid var(--tr-acc);outline-offset:2px}
.ordN{display:inline-grid;place-items:center;min-width:1.4em;height:1.4em;border-radius:999px;background:var(--tr-acc);color:#fff;font:800 .75em system-ui,sans-serif;font-style:normal;margin-right:6px;vertical-align:1px}
.chip.ghost{box-shadow:0 8px 24px #0005;transform:scale(1.06);opacity:.95;animation:none}
@keyframes wig{from{transform:rotate(-1deg)}to{transform:rotate(1deg)}}
.fc-h button.arrOn{background:var(--tr-acc);color:#fff;border-color:var(--tr-acc)}.arrHint{font-size:12px;color:var(--tr-muted);text-align:center;margin:-2px 0 4px}
.chip.ar2::before{content:"🗄 ";text-decoration:none}.chip.ab2::before{content:"🗑 ";text-decoration:none}
.toastUndo{margin-left:14px;border:0;background:none;color:#a5b4fc;font:800 14px system-ui,sans-serif;padding:0;cursor:pointer}
.oc button.arm{background:#eef2ff;box-shadow:0 0 0 3px #c7d2fe}.oc button.arm small{color:#3730a3;font-weight:650}
.ocNote{text-align:center;color:#15803d;font-weight:650;padding:14px;border:1px dashed var(--tr-line);border-radius:12px}
.ocLater{border:1.5px solid #0369a1;border-radius:13px;padding:10px;background:var(--tr-paper)}
.ocLater>b{font-size:13px;color:#0369a1}
.ocQ{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.ocQ .btn{padding:7px 9px;font-size:13px;text-align:left}.ocQ .btn small{display:block;font-weight:500;color:var(--tr-muted);font-size:11px}
.ocPick{display:grid;grid-template-columns:1fr auto auto;gap:6px}.ocPick input{padding:8px 10px}
.chip.fn::before{content:"✔✔ "}
.oc .ocStep{grid-column:1/-1;min-height:50px}
.ocStepBox{border-color:#7c3aed}.ocStepBox>b{color:#15803d;font-size:13px;display:block;word-break:break-word}
.ocStepBox .lbl{display:block;font-size:12.5px;font-weight:700;color:#7c3aed;margin:8px 0 4px}
.ocStepBox #ocNext{width:100%;box-sizing:border-box;padding:9px 10px;font-size:15px}
.ocQ .btn.on{border-color:#7c3aed;box-shadow:0 0 0 2px #ddd6fe}
.chip.ms{border:2px solid #dc2626;background:#fef2f2;color:#991b1b}.chip.ms::before{content:"! ";color:#dc2626;font-weight:900}.chip small{display:block;font-size:.72em;font-weight:600;opacity:.85}

</head><body>
<header><div class="hin">
  <a class="backlink" href="./#resp">← Today's Tasks</a>
  <h1>Delegation</h1>
  <p class="eyebrow" style="margin:0 0 12px;font-size:13px">Member-wise pendency · tasks are given from Today's Tasks</p>
</div></header>
<main><section id="cards"></section></main>
<div class="mflash" id="mflash" hidden><div class="mfTop" id="mfTop"></div><div class="mfCard" id="mfCard"></div><div class="mfHint" id="mfHint">Swipe left or right to move between members</div></div>
<div class="tflash" id="tflash" hidden><div class="tfIn"><div class="tfTop" id="tfTop"></div>
  <div class="tfCard" id="tfCard"><div class="tfInner"><div class="tfFace tfFront" id="tfFront"></div><div class="tfFace tfBackFace"><div class="tfReveal" id="tfReveal"></div><div class="tfFlipHint">Tap to flip back</div></div></div></div>
  <div class="tfActs" id="tfActs"></div>
  <div class="mfHint">Swipe left or right for the next task · tap the card to flip</div></div></div>
<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog"></div></div>
<script>
"use strict";
const KEY="deleg",$=id=>document.getElementById(id);
const GROUPS={me:{n:"Me",c:"#4f46e5"},office:{n:"Office",c:"#0f766e"},family:{n:"Family",c:"#b45309"},other:{n:"Other",c:"#64748b"}};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>"p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const tkey=t=>String(t||"").trim().toLowerCase().replace(/\s+/g," ");
const fmtDate=ms=>{try{return new Date(ms).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"})}catch(e){return ""}};

/* ---------- data (shared with Today's Tasks through localStorage "deleg", synced by kvsync.js) ----------
   people: {id:{name,g,u}}   g = me|office|family|other, u = last used
   assign: {taskId:{t,k,p,at,pr,d,s,on,until,np}}   t full title, k keyword, p person id, pr TickTick list/tag,
           d = day marked "done today, continues" (older entries only have this), s = outcome chosen on the task card:
           cont = work done today, continues tomorrow · fin = done and dusted, never repeats ·
           push = not done, pushed to tomorrow · later = pushed to `until`, then daily until done;
           on = the day the outcome was chosen, np = how many times it has been pushed
   aside:  {taskId:{t,at}}   (from the first version's review; kept as it was)
   prefs:  {showDone:1|0, view:"one"|"all"} */
function load(){let d={};try{d=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){}
  const D={people:d.people||{},assign:d.assign||{},aside:d.aside||{},prefs:d.prefs||{}};
  if(!D.people.me)D.people.me={name:"Me",g:"me",u:0};return D;}
let D=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast("Could not save on this device")}}
function shortKw(title){
  const STOP=new Set("A AN THE TO OF FOR AND OR IN ON AT BY FROM WITH REG REGARDING ABOUT RE PLEASE PLS KINDLY IS ARE BE INTO THIS THAT".split(" "));
  const w=String(title).replace(/[^\w\s\/&.\-]/g," ").split(/\s+/).filter(Boolean);
  let k=w.filter(x=>!STOP.has(x.toUpperCase()));if(!k.length)k=w;
  const WORD=new Set("PAY NEW OLD GET SET PUT BUY FIX RUN CAR BOX DAY ALL ONE TWO OUT OFF END MAP BAG FEE TAX SEE ASK USE ADD CUT TOP LOW HIGH BIG RED DUE NOT YET SEND CALL".split(" "));
  return k.slice(0,3).map(x=>/\d/.test(x)||(x.length<=3&&x===x.toUpperCase()&&!WORD.has(x))?x:x.charAt(0).toUpperCase()+x.slice(1).toLowerCase()).join(" ");}
function peopleSorted(){return Object.entries(D.people).map(([id,p])=>({id,...p})).sort((a,b)=>(b.u||0)-(a.u||0)||a.name.localeCompare(b.name));}
function addPerson(name,g){name=String(name||"").trim();if(!name)return null;
  const ex=Object.entries(D.people).find(([,p])=>p.name.toLowerCase()===name.toLowerCase());
  const id=ex?ex[0]:uid();if(!ex)D.people[id]={name,g:g||"office",u:Date.now()};save();return id;}

/* ---------- TickTick: a delegated task that is no longer open there shows as done ---------- */
function wurl(q){let u=null;try{u=localStorage.getItem("totalRecallTickTickUrl")}catch(e){}u=u||window.TOTAL_RECALL_TICKTICK_URL||"https://total-recall-ticktick.pranjuchakrapani90.workers.dev";return u+(u.indexOf("?")>=0?"&":"?")+q;}
let loaded=false,openIds=new Set(),openTitles=new Set(),projById={};
async function fetchOpen(){try{const r=await fetch(wurl("mode=wa-review&list=tasks"),{cache:"no-store"});const d=await r.json();if(!r.ok||d.error)return;
  const T=(d.tasks||[]).filter(t=>t&&t.id);openIds=new Set(T.map(t=>t.id));T.forEach(t=>{if(t.projectId)projById[t.id]=t.projectId});openTitles=new Set(T.map(t=>tkey(t.title)));loaded=T.length>0;render();}catch(e){}}
const closedTT=(id,a)=>loaded&&!openIds.has(id)&&!openTitles.has(tkey(a.t));
/* ---------- cards ---------- */
let lastNew=null,filterG="all",fi=0;const ORDER={};let ORDN=0,curPid=null;
/* where a delegated task stands today: open · cont · fin · push · later */
function stOf(id,a){const td=todayIST();
  if(a.s==="arch"||a.s==="abn")return a.s;
  if(a.s==="fin"||closedTT(id,a))return "fin";
  if(a.s==="later"&&a.until&&a.until>td)return "later";
  if(a.s==="push"&&a.on===td)return "push";
  if(a.d===td)return "cont";
  return "open";}
const isDone=(id,a)=>{const x=stOf(id,a);return x==="fin"||x==="cont"||x==="arch"||x==="abn"};
/* set to a future date (pushed, pushed to a date, or simply due later): kept off the card until that day (1 Nov 2026) */
function aheadOf(id,a){if(isDone(id,a))return "";const t=window.PosTasks&&PosTasks.on()?PosTasks.get(id):null,td=todayIST();
  if(t&&t.st!==2&&t.du&&t.du>td)return t.du;if(stOf(id,a)==="later")return a.until;return "";}
const isAhead=(id,a)=>!!aheadOf(id,a);
/* left pending (1 Nov 2026): a task that sat on the card on an earlier day with no option tapped. It stays red and goes
   to the top of the card until something is done with it. Returns the first day it was left, or "". */
var FMT_IST=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Kolkata",year:"numeric",month:"2-digit",day:"2-digit"});
const istDay=ms=>{try{return FMT_IST.format(new Date(ms))}catch(e){return ""}};
function missedOf(id,a){if(stOf(id,a)!=="open"||isAhead(id,a))return "";const td=todayIST();
  let since=typeof a.at==="number"?istDay(a.at):String(a.at||"").slice(0,10);if(!since||since>=td)return "";
  const t=window.PosTasks&&PosTasks.on()?PosTasks.get(id):null;
  let last=[a.on,a.d].filter(Boolean).sort().pop()||"";
  if(t&&t.h){const hk=Object.keys(t.h).sort().pop();if(hk&&hk>last)last=hk;}
  if(last&&addDay(last,1)>since)since=addDay(last,1);
  if(a.until&&a.until>since)since=a.until;
  if(t&&t.du&&t.du>since)since=t.du;
  return since<td?since:"";}
/* order on a card (2 Nov 2026): tasks he has arranged by hand first, in his order; then left-pending ones (oldest first);
   then the rest as given. Arranged with the Arrange button on the card: drag a bubble onto another to take its place. */
function orderItems(list){const key=a=>{if(typeof a.o==="number")return [0,a.o];const m=missedOf(a.id,a);return m?[1,m]:[2,0]};
  return list.slice().sort((x,y)=>{const kx=key(x),ky=key(y);return kx[0]-ky[0]||(kx[1]<ky[1]?-1:kx[1]>ky[1]?1:0)});}
let ARR=null;
const missedDays=since=>Math.round((new Date(todayIST()+"T12:00:00Z")-new Date(since+"T12:00:00Z"))/864e5);
function tasksOf(pid){return Object.entries(D.assign).filter(([,a])=>a.p===pid).map(([id,a])=>({id,...a})).sort((a,b)=>a.at-b.at);}
function openCount(pid){return tasksOf(pid).filter(a=>!isDone(a.id,a)&&!isAhead(a.id,a)).length;}
const defCap=n=>n>10?Math.ceil((n-2)/2.6):99;
function layout(items,cap){/* top one, then right, left, bottom, then the sides take turns; overflow goes to the top and bottom rows */
  const L={t:[],r:[],l:[],b:[]},order=["t","r","l","b"];if(cap==null)cap=defCap(items.length);
  items.forEach((x,i)=>{let s=i<4?order[i]:(i%2?"l":"r");if((s==="l"||s==="r")&&L[s].length>=cap)s=L.t.length<=L.b.length?"t":"b";L[s].push(x);});
  /* same shape, but filled in reading order (2 Nov 2026): top rows left→right, then each side row left then right, then the bottom rows */
  const q=items.slice(),R={t:q.splice(0,L.t.length),l:[],r:[],b:[]},nl=L.l.length,nr=L.r.length;
  for(let k=0;k<Math.max(nl,nr);k++){if(k<nl)R.l.push(q.shift());if(k<nr)R.r.push(q.shift());}
  R.b=q;return R;}
const CHIPC={arch:" dn ar2",abn:" dn ab2",cont:" dn",fin:" dn fn",push:" ps",later:" lt",open:""};
function chip(a){const x0=stOf(a.id,a),ah=aheadOf(a.id,a),x=ah?"later":x0,ms=missedOf(a.id,a);return `<button type="button" class="chip${CHIPC[x]}${ms?" ms":""}${ARR===a.p?" ar":""}${SEL.has(a.id)?" sl":""}${a.id===lastNew?" new":""}" data-t="${esc(a.id)}" title="${esc(a.t)}">${ARR===a.p&&a._n?`<i class="ordN">${a._n}</i>`:""}${esc(a.k||shortKw(a.t))}${x==="later"?`<small>${esc(fmtDay(ah||a.until))}</small>`:""}${ms?`<small>left ${missedDays(ms)>1?missedDays(ms)+" days":"yesterday"}</small>`:""}</button>`;}
function cardHtml(p,cap){const g=GROUPS[p.g]||GROUPS.other,all=tasksOf(p.id),dn=all.filter(a=>isDone(a.id,a)).length,
    lt=all.filter(a=>isAhead(a.id,a)).length,mk=a=>missedOf(a.id,a)||"~",
    items=orderItems(p.items).map((x,i)=>({...x,_n:i+1})),L=layout(items,cap),
    ms=all.filter(a=>missedOf(a.id,a)).length;
  return `<div class="fc" style="--g:${g.c}" data-card="${esc(p.id)}"><div class="fc-h"><span class="grp">${esc(g.n)}</span><span>${ms?`<b class="msN">${ms} left from earlier · </b>`:""}${all.length-dn-lt} pending${lt?" · "+lt+" upcoming":""}${dn?" · "+dn+" done":""}</span><span class="sp"></span>${p.items.length>1?`<button type="button" data-arr="${esc(p.id)}" class="${ARR===p.id?"arrOn":""}">${ARR===p.id?"Done":"Arrange"}</button>`:""}${all.length-dn-lt&&ARR!==p.id?`<button type="button" data-share="${esc(p.id)}">Share</button>`:""}</div>
    ${ARR===p.id?'<div class="arrHint">Tap a task to type its number (1 = first) — or drag it onto another. Tap Done when finished.</div>':""}
    <div class="map"><svg class="ln" aria-hidden="true"></svg>
      <div class="row t">${L.t.map(chip).join("")}</div><div class="col l">${L.l.map(chip).join("")}</div>
      <div class="hub" data-person="${esc(p.id)}">${esc(p.name)}</div>
      <div class="col r">${L.r.map(chip).join("")}</div><div class="row b">${L.b.map(chip).join("")}</div>
      ${p.items.length?"":'<div class="empty-card">Nothing pending</div>'}</div></div>`;}
function renderCards(){const el=$("cards"),show=!!D.prefs.showDone,view=D.prefs.view==="all"?"all":"one";
  let h=`<div class="ctools">${["all","office","family","me","other"].map(g=>`<button type="button" class="btn${filterG===g?" pri":""}" data-g="${g}" style="padding:6px 12px;font-size:13px">${g==="all"?"All":GROUPS[g].n}</button>`).join("")}
    <span class="sp"></span><span class="seg"><button type="button" data-v="one" class="${view==="one"?"on":""}">One by one</button><button type="button" data-v="all" class="${view==="all"?"on":""}">All</button></span>
    <label><input type="checkbox" id="showDone" ${show?"checked":""}> Show done &amp; upcoming</label><button class="btn" type="button" id="newPerson" style="padding:6px 12px;font-size:13px">+ Person</button></div>`;
  /* members with something delegated, most pending first */
  /* a member with nothing pending gets no card, unless Show done is on */
  const ppl=peopleSorted().filter(p=>(filterG==="all"||p.g===filterG)&&(show?tasksOf(p.id).length:openCount(p.id))).map(p=>({...p,items:tasksOf(p.id).filter(a=>show||(!isDone(a.id,a)&&!isAhead(a.id,a)))}))
    .sort((a,b)=>openCount(b.id)-openCount(a.id)||a.name.localeCompare(b.name));
  /* most pending first is worked out once when the page opens; after that a member keeps their place, so a card
     doesn't jump to the bottom as its tasks get done (1 Nov 2026). New members join at the end. */
  ppl.forEach(p=>{if(!(p.id in ORDER))ORDER[p.id]=ORDN++;});
  ppl.sort((a,b)=>ORDER[a.id]-ORDER[b.id]);
  if(view==="one"&&curPid){const k=ppl.findIndex(p=>p.id===curPid);if(k>=0)fi=k;}
  if(!ppl.length){const any=peopleSorted().some(p=>(filterG==="all"||p.g===filterG)&&tasksOf(p.id).length);
    h+=any?`<div class="nocards">Nothing pending${filterG!=="all"?" in this group":""} — every delegated task is done. Tick “Show done” to see the finished cards.</div>`
      :`<div class="nocards">Nothing delegated${filterG!=="all"?" in this group":""} yet. In Today's Tasks, open a task card and tap a name under it — that member's card builds up here.</div>`;}
  else if(view==="all")h+='<div class="deck">'+ppl.map(cardHtml).join("")+"</div>";
  el.innerHTML=h;bindTools(el);bindCards(el);
  /* one by one: each member's card fills the screen, swipe or Back/Next to move */
  const mf=$("mflash");MF.n=ppl.length;
  if(view==="one"&&ppl.length){fi=Math.min(Math.max(fi,0),ppl.length-1);
    const pend=ppl.reduce((n,p)=>n+openCount(p.id),0);
    $("mfTop").innerHTML=`<a class="btn" href="./#resp">← Today's Tasks</a><span class="mfCount">Member ${fi+1} of ${ppl.length}<small>${pend} pending in all</small></span><button class="btn" type="button" id="mfAll">All cards</button>`;
    MF.p=ppl[fi];curPid=MF.p.id;$("mfCard").innerHTML=cardHtml(MF.p);
    $("mfAll").onclick=()=>{D.prefs.view="all";save();leaveFull();render()};
    $("mfTop").querySelector("a").onclick=leaveFull;
    $("mfHint").hidden=ppl.length<2;
    mf.hidden=false;document.body.style.overflow="hidden";
  }else{MF.p=null;mf.hidden=true;if($("tflash").hidden)document.body.style.overflow="";}
  const nw=lastNew;requestAnimationFrame(()=>{if(MF.p)fitMember(nw);drawLines()});lastNew=null;}
const MF={n:0,p:null};
function bindCards(root){root.querySelectorAll("[data-arr]").forEach(b=>b.onclick=e=>{e.stopPropagation();ARR=ARR===b.dataset.arr?null:b.dataset.arr;curPid=ARR||curPid;render();});
  root.querySelectorAll(".chip.ar").forEach(dragChip);
  root.querySelectorAll("[data-t]:not(.ar)").forEach(b=>{longPress(b,()=>selToggle(b.dataset.t,true));
    b.onclick=()=>{if(lpEl===b){lpEl=null;return}if(selMode){selToggle(b.dataset.t);return}const c=b.closest("[data-card]");openFlash(c?c.dataset.card:(D.assign[b.dataset.t]||{}).p,b.dataset.t)};});
  root.querySelectorAll("[data-person]").forEach(b=>b.onclick=()=>personSheet(b.dataset.person));
  root.querySelectorAll("[data-share]").forEach(b=>b.onclick=()=>share(b.dataset.share));}
/* drag to arrange (2 Nov 2026) */
function dragChip(c){c.onclick=e=>{e.preventDefault();e.stopPropagation()};
  c.onpointerdown=e=>{if(e.button>0)return;e.preventDefault();e.stopPropagation();const id=c.dataset.t,R=c.getBoundingClientRect();
    const g=c.cloneNode(true);g.classList.add("ghost");g.style.cssText=`position:fixed;visibility:hidden;left:${R.left}px;top:${R.top}px;width:${R.width}px;margin:0;z-index:90;pointer-events:none;font-size:${getComputedStyle(c).fontSize}`;document.body.appendChild(g);
    c.classList.add("drg");const dx=e.clientX-R.left,dy=e.clientY-R.top;let over=null;
    let moved=false;const x0=e.clientX,y0=e.clientY;
    const mv=ev=>{if(!moved&&Math.hypot(ev.clientX-x0,ev.clientY-y0)<8)return;moved=true;g.style.visibility="visible";g.style.left=(ev.clientX-dx)+"px";g.style.top=(ev.clientY-dy)+"px";const el=document.elementFromPoint(ev.clientX,ev.clientY),t=el&&el.closest(".chip.ar");
      const nt=t&&t!==c?t:null;if(nt!==over){if(over)over.classList.remove("tgt");over=nt;if(over)over.classList.add("tgt");}};
    const up=()=>{document.removeEventListener("pointermove",mv);document.removeEventListener("pointerup",up);document.removeEventListener("pointercancel",up);
      g.remove();c.classList.remove("drg");if(!moved){placeSheet(id);return}if(over){over.classList.remove("tgt");moveTask(id,over.dataset.t);}};
    document.addEventListener("pointermove",mv);document.addEventListener("pointerup",up);document.addEventListener("pointercancel",up);};}
const shownIds=pid=>{const show=!!D.prefs.showDone;return orderItems(tasksOf(pid).filter(x=>show||(!isDone(x.id,x)&&!isAhead(x.id,x)))).map(x=>x.id)};
function moveTask(id,target){const a=D.assign[id];if(!a)return;const ids=shownIds(a.p),to=ids.indexOf(target);if(to>=0)placeAt(id,to);}
/* tap a bubble while arranging: type its place number; the others shift down (or up) to make room (2 Nov 2026) */
function placeSheet(id){const a=D.assign[id];if(!a)return;const ids=shownIds(a.p),n=ids.length,cur=ids.indexOf(id)+1;
  openSheet(`<div class="meta">Place in ${esc((D.people[a.p]||{}).name||"")}'s order · now ${cur} of ${n}</div><h3>${esc(a.k||shortKw(a.t))}</h3>
    <label class="lbl" for="plN">New place (1 = first)</label>
    <input id="plN" type="number" inputmode="numeric" min="1" max="${n}" value="${cur}" style="font-size:22px;font-weight:700;text-align:center">
    <div class="ocQ" style="grid-template-columns:repeat(4,1fr);margin-top:10px">${[1,2,3,n].filter((v,i,a)=>v<=n&&a.indexOf(v)===i).map(v=>`<button type="button" class="btn" data-pl="${v}">${v===n&&n>3?"Last":v}</button>`).join("")}</div>
    <div class="row2" style="margin-top:12px"><button class="btn pri" id="plGo" type="button">Move</button><button class="btn ghost" id="plX" type="button">Cancel</button></div>`,sh=>{
      const inp=sh.querySelector("#plN");setTimeout(()=>{inp.focus();inp.select()},40);
      const go=v=>{v=Math.round(Number(v));if(!(v>=1&&v<=n)){toast("Type a number from 1 to "+n);return}closeSheet();placeAt(id,v-1);};
      sh.querySelector("#plGo").onclick=()=>go(inp.value);inp.onkeydown=e=>{if(e.key==="Enter")go(inp.value)};
      sh.querySelectorAll("[data-pl]").forEach(b=>b.onclick=()=>go(b.dataset.pl));
      sh.querySelector("#plX").onclick=closeSheet;});}
function placeAt(id,to){const a=D.assign[id];if(!a)return;const pid=a.p,ids=shownIds(pid);
  const from=ids.indexOf(id);if(from<0)return;ids.splice(from,1);ids.splice(to,0,id);
  ids.forEach((x,i)=>{D.assign[x].o=i});
  tasksOf(pid).forEach(x=>{if(ids.indexOf(x.id)<0&&typeof D.assign[x.id].o==="number")D.assign[x.id].o=ids.length+D.assign[x.id].o;});
  save();render();toast(from===to?"Already at place "+(to+1):"Moved to place "+(to+1)+(to<from?" · the ones after it moved down one":" · the ones before it moved up one"),2200);}
/* fit the whole member card on the screen, like a slide: try a few ways of spreading the bubbles
   (more on the sides / more in the top and bottom rows), pick the one that allows the biggest text,
   and only if even the smallest text won't fit, scale the whole map down */
function fitMember(nw){const box=$("mfCard"),p=MF.p;if(!p||!box.offsetHeight)return;
  const n=p.items.length,caps=[...new Set([defCap(n),99,Math.ceil(n/3),Math.ceil(n/4),Math.ceil(n/6),1].filter(c=>c>0))];
  const put=cap=>{lastNew=nw;box.innerHTML=cardHtml(p,cap);lastNew=null;return box.querySelector(".fc");};
  const fits=fc=>{const R=fc.getBoundingClientRect(),hd=fc.querySelector(".fc-h"),top=hd?hd.getBoundingClientRect().bottom+2:R.top;
    for(const el of fc.querySelectorAll(".map .chip,.map .hub")){const r=el.getBoundingClientRect();
      if(r.left<R.left+1||r.right>R.right-1||r.top<top||r.bottom>R.bottom-2||el.scrollWidth>el.clientWidth+1||el.scrollHeight>el.clientHeight+1)return false;}
    return true;};
  const MAX=20,MIN=9,setF=(fc,f)=>fc.style.setProperty("--cf",f+"px");
  let best={cap:caps[0],f:0};
  for(const cap of n>4?caps:[caps[0]]){const fc=put(cap);setF(fc,MAX);let f;
    if(fits(fc))f=MAX;else{let lo=MIN,hi=MAX;setF(fc,lo);if(!fits(fc))f=0;else{while(hi-lo>.5){const m=(lo+hi)/2;setF(fc,m);if(fits(fc))lo=m;else hi=m;}f=lo;}}
    if(f>best.f+.25)best={cap,f};if(f>=MAX)break;}
  const fc=put(best.cap);setF(fc,best.f||MIN);
  if(!best.f){/* still too much: shrink the whole map to the space below the header */
    const map=fc.querySelector(".map"),els=[...map.querySelectorAll(".chip,.hub")];els.forEach(c=>c.style.overflowWrap="anywhere");
    const R=fc.getBoundingClientRect(),hd=fc.querySelector(".fc-h").getBoundingClientRect(),M=map.getBoundingClientRect();

  $("tfMore").onclick=()=>taskSheet(id);
  TF.loaded=null;}
async function revealFlash(){if(!TF)return;const id=TF.ids[TF.i],a=D.assign[id];if(!a||TF.loaded===id)return;TF.loaded=id;
  const box=$("tfReveal"),pj=a.pj||projById[id]||"";
  if(!pj){box.innerHTML=`<div class="taskHead"><h4>${esc(a.t)}</h4></div><div class="taskBody"><div class="taskEmpty">Details aren't available for this task (it may be closed or deleted).</div></div>`;return}
  try{const r=await fetch(wurl("mode=task-detail&projectId="+encodeURIComponent(pj)+"&taskId="+encodeURIComponent(id)),{cache:"no-store"});
    const d=await r.json();if(!r.ok||d.error)throw new Error(d.error||("HTTP "+r.status));
    if(!TF||TF.ids[TF.i]!==id)return;box.innerHTML=detailHtml(d.task||{},Array.isArray(d.comments)?d.comments:[],pj,id);if(d.task&&d.task.local&&window.PosTasks)PosTasks.mountEditor(box,id);
  }catch(e){if(TF&&TF.ids[TF.i]===id){box.innerHTML=`<div class="taskBody"><div class="err">Couldn't load the task details: ${esc(e.message||e)}</div></div>`;TF.loaded=null;}}}
function richText(raw){const files=[];let s=String(raw||"").replace(/\r/g,"").replace(/!?\[file\]\(([^)]*)\)/g,(m,p)=>{files.push(p);return "\u0000"+(files.length-1)+"\u0000"});
  const lines=s.split(/\n/).map(x=>x.trim()).filter(Boolean);
  return lines.map(x=>{if(/^-{3,}$/.test(x))return "<hr>";
    let h=esc(x.replace(/^[-*]\s+/,"")).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>').replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
    h=h.replace(/\u0000(\d+)\u0000/g,(m,n)=>{let nm=files[+n]||"";try{nm=decodeURIComponent(nm)}catch(e){}nm=nm.split("/").pop()||"Attachment";
      return `<div class="taskAttachment"><div class="taskAttachmentIcon">C</div><div style="min-width:0"><div class="taskAttachmentName">${esc(nm)}</div><div class="taskAttachmentSize">Attachment</div></div></div>`});
    return /^[-*]\s+/.test(x)?`<ul class="tickList"><li>${h}</li></ul>`:`<p>${h}</p>`}).join("");}
function detailHtml(t,comments,pj,id){const url=t.local?"tasks.html#t="+encodeURIComponent(id):"https://ticktick.com/webapp/#p/"+encodeURIComponent(pj)+"/tasks/"+encodeURIComponent(id);
  const content=t.content||t.desc||"",items=Array.isArray(t.items)?t.items:[],atts=Array.isArray(t.attachments)?t.attachments:(Array.isArray(t.files)?t.files:[]);
  let h=`<div class="taskHead"><div class="tfHeadRow"><h4>${esc(t.title||"Task")}</h4><a class="taskOpenLink" href="${url}"${t.local?"":' target="_blank" rel="noopener noreferrer"'}>${t.local?"Edit task ✎":"Open task ↗"}</a></div>
    <div class="taskMeta">${t.list?`<span class="taskPill">${esc(t.list)}</span>`:""}${t.dueDate?`<span class="taskPill">Due ${esc(String(t.dueDate).slice(0,10))}</span>`:""}${t.repeat?`<span class="taskPill">↻ ${esc(t.repeat)}</span>`:""}${(t.tags||[]).map(x=>`<span class="taskPill">#${esc(x)}</span>`).join("")}</div></div>`;
  if(t.local&&window.PosTasks)h+='<div class="pteMount"></div>';else{
  if(content)h+=`<div class="taskBody"><div class="taskContent">${richText(content)}</div></div>`;
  if(items.length)h+=`<div class="taskSection"><div class="taskSectionTitle">Checklist</div>${items.map(x=>{const ok=x.status===1||x.status===2;return `<div class="taskSubtask${ok?" done":""}">${ok?"☑":"☐"} ${esc(x.title||"")}</div>`}).join("")}</div>`;
  if(atts.length)h+=`<div class="taskSection"><div class="taskSectionTitle">Attachments</div>${atts.map(x=>`<div class="taskAttachment"><div class="taskAttachmentIcon">C</div><div style="min-width:0"><div class="taskAttachmentName">${esc(x.name||x.fileName||x.title||"Attachment")}</div></div></div>`).join("")}</div>`;
  if(comments.length)h+=`<div class="taskSection"><div class="taskSectionTitle">Latest comments</div>${comments.map(x=>`<div class="taskComment">${richText(x.content||x.text||x.title||"")}${x.createdTime?`<small>${esc(String(x.createdTime).slice(0,16).replace("T"," "))}</small>`:""}</div>`).join("")}</div>`;
  if(!content&&!items.length&&!atts.length&&!comments.length)h+='<div class="taskBody"><div class="taskEmpty">'+(t.local?'No notes or checklist on this task yet.':'No notes or checklist on this task yet.')+'</div></div>';
  }
  return h+`<div class="taskFooter">${t.local?"Pranju OS task":"Fetched "+esc(new Date().toLocaleTimeString())}</div>`;}
$("tfCard").addEventListener("click",e=>{if(e.target.closest("a,button,input,textarea,label,.pte"))return;const f=$("tfCard").classList.toggle("flipped");if(f)revealFlash();});
const tfGo=d=>{if(!TF)return;const j=TF.i+d;if(j<0||j>=TF.ids.length)return;TF.i=j;drawFlash();};
(()=>{let x0=null;const c=$("tfCard");c.addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true});
  c.addEventListener("touchend",e=>{if(x0==null||!TF)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)<50||c.classList.contains("flipped"))return;
    swipedAt=Date.now();tfGo(dx<0?1:-1);},{passive:true});})();
document.addEventListener("keydown",e=>{if(!TF||!$("scrim").hidden)return;if(e.key==="Escape")closeFlash();if(e.key==="ArrowRight")tfGo(1);if(e.key==="ArrowLeft")tfGo(-1);});

/* ---------- shell ---------- */
function render(){drawSel();renderCards();if(TF&&!$("tflash").hidden)drawFlash();}
/* ---------- long-press a task bubble: select several, then merge / outcome / move (1 Nov 2026) ---------- */
let SEL=new Set(),selMode=false,lpAt=0,lpEl=null;
function longPress(el,fn){let t=0,x0=0,y0=0;const stop=()=>{clearTimeout(t);t=0};
  el.addEventListener("pointerdown",e=>{x0=e.clientX;y0=e.clientY;stop();lpEl=null;t=setTimeout(()=>{t=0;lpAt=Date.now();lpEl=el;try{navigator.vibrate&&navigator.vibrate(25)}catch(_){}fn()},480)});
  el.addEventListener("pointermove",e=>{if(t&&(Math.abs(e.clientX-x0)>10||Math.abs(e.clientY-y0)>10))stop()});
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>el.addEventListener(ev,stop));
  el.addEventListener("contextmenu",e=>e.preventDefault());}
function selToggle(id,fromPress){if(fromPress&&!selMode){selMode=true;SEL=new Set([id]);}else if(SEL.has(id))SEL.delete(id);else SEL.add(id);
  if(!SEL.size)selMode=false;render();}
function selClear(){SEL=new Set();selMode=false;render();}
function drawSel(){let bar=$("selbar");if(!selMode){if(bar)bar.remove();$("mflash").style.paddingBottom="";return}
  if(!bar){bar=document.createElement("div");bar.id="selbar";bar.className="selbar";document.body.appendChild(bar);}
  const n=SEL.size,local=window.PosTasks&&PosTasks.on();
  bar.innerHTML=`<div class="sbh"><b>${n} selected</b><span>tap bubbles to add or remove</span><button type="button" data-sa="x">✕</button></div>
    <div class="sbg"><button type="button" data-sa="merge" ${n<2||!local?"disabled":""}>⇉ Merge into one</button><button type="button" data-sa="move">👤 Move to…</button>
    <button type="button" data-sa="cont" style="--c:${OUT.cont.c}">${OUT.cont.i} Done · continues</button><button type="button" data-sa="fin" style="--c:${OUT.fin.c}">${OUT.fin.i} Done &amp; dusted</button>
    <button type="button" data-sa="push" style="--c:${OUT.push.c}">${OUT.push.i} Push to tomorrow</button><button type="button" data-sa="later" style="--c:${OUT.later.c}">${OUT.later.i} Push to a date</button></div>`;
  bar.querySelectorAll("[data-sa]").forEach(b=>b.onclick=()=>selAct(b.dataset.sa));
  $("mflash").style.paddingBottom=(bar.offsetHeight+8)+"px";}
const selIds=()=>[...SEL].filter(id=>D.assign[id]);
async function many(k,date){const ids=selIds();selClear();toast(OUT[k].n+" · "+ids.length+" task"+(ids.length>1?"s":"")+"…",1500);
  for(const id of ids)await setOutcome(id,k,date,true);toast(OUT[k].n+" · "+ids.length+" task"+(ids.length>1?"s":"")+" ✓",2600);}
function selAct(k){const ids=selIds();if(k==="x"){selClear();return}if(!ids.length){selClear();return}
  if(k==="cont"||k==="push"){many(k);return}
  if(k==="fin"){openSheet(`<h3>Done &amp; dusted · ${ids.length} task${ids.length>1?"s":""}</h3><p class="meta">Each is closed for good: its repeat is removed and it won't come back.</p>
      <div class="alist">${ids.map(id=>`<div><span>${esc(D.assign[id].t)}</span></div>`).join("")}</div>
      <div class="row2"><button class="btn pri" id="sy" type="button">Close ${ids.length} for good</button><button class="btn ghost" id="sn" type="button">Cancel</button></div>`,
      s=>{s.querySelector("#sy").onclick=()=>{closeSheet();many("fin")};s.querySelector("#sn").onclick=closeSheet;});return}
  if(k==="later"){const td=todayIST(),q=[[2,"Day after tomorrow"],[3,"In 3 days"],[7,"In a week"]];
    openSheet(`<h3>Push ${ids.length} task${ids.length>1?"s":""} to…</h3><div class="row2">${q.map(([n,l])=>`<button class="btn" type="button" data-qd="${addDay(td,n)}">${l} · ${fmtDay(addDay(td,n))}</button>`).join("")}</div>
      <label class="lbl" for="sd">Or pick a day</label><input type="date" id="sd" min="${addDay(td,1)}" value="${addDay(td,2)}"><div class="row2"><button class="btn pri" id="sy" type="button">Push</button><button class="btn ghost" id="sn" type="button">Cancel</button></div>`,
      s=>{const go=d=>{if(!d||d<=td){toast("Pick a day after today");return}closeSheet();many("later",d)};
        s.querySelectorAll("[data-qd]").forEach(b=>b.onclick=()=>go(b.dataset.qd));s.querySelector("#sy").onclick=()=>go(s.querySelector("#sd").value);s.querySelector("#sn").onclick=closeSheet;});return}
  if(k==="move"){openSheet(`<h3>Give ${ids.length} task${ids.length>1?"s":""} to</h3><div class="people">${peopleSorted().map(x=>`<button type="button" class="pchip" data-mv="${esc(x.id)}" style="--g:${(GROUPS[x.g]||GROUPS.other).c}"><i></i>${esc(x.name)}</button>`).join("")}</div>
      <div class="row2"><button class="btn ghost" id="sn" type="button">Cancel</button></div>`,s=>{s.querySelector("#sn").onclick=closeSheet;
      s.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{const p=b.dataset.mv;ids.forEach(id=>{D.assign[id].p=p});D.people[p].u=Date.now();save();closeSheet();selClear();toast(ids.length+" moved to "+D.people[p].name)});});return}
  if(k==="merge"){if(ids.length<2)return;const T=PosTasks.all();const list=ids.map(id=>({id,a:D.assign[id],t:T[id]})).sort((x,y)=>String((x.t||{}).cr||x.a.at).localeCompare(String((y.t||{}).cr||y.a.at)));
    const missing=list.filter(x=>!x.t);if(missing.length){toast("Some of these aren't Pranju OS tasks any more — can't merge them");return}
    openSheet(`<h3>Merge ${ids.length} tasks into one</h3><p class="meta">Pick the one to keep. The others are deleted; their notes (dated), checklist items, tags and history are added to it. No sub-tasks.</p>
      <div class="mlist">${list.map((x,i)=>`<label><input type="radio" name="keep" value="${esc(x.id)}"${i===0?" checked":""}><span><b>${esc(x.t.ti)}</b><small>${esc(PosTasks.LISTNAME[x.t.pj]||"")}${x.t.du?" · "+fmtDay(x.t.du):""}${String(x.t.c||"").trim()?" · has notes":""}${i===0?" · oldest":""}</small></span></label>`).join("")}</div>
      <div class="row2"><button class="btn pri" id="sy" type="button">Merge</button><button class="btn ghost" id="sn" type="button">Cancel</button></div>`,
      s=>{s.querySelector("#sn").onclick=closeSheet;s.querySelector("#sy").onclick=()=>{const keep=s.querySelector("input[name=keep]:checked").value;
        try{PosTasks.merge(keep,ids)}catch(e){toast(e.message||String(e),3500);return}
        /* the merged task is pending again on the card unless every one of them was already done */
        const allDone=ids.every(id=>isDone(id,D.assign[id]));
        ids.forEach(id=>{if(id!==keep)delete D.assign[id]});const k2=PosTasks.get(keep);if(k2&&D.assign[keep]){D.assign[keep].t=k2.ti;if(!allDone)clearOutcome(D.assign[keep]);}
        lastNew=keep;save();closeSheet();selClear();toast("Merged into one task ✓",2600);};});return}}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&selMode&&$("scrim").hidden)selClear()});
let tt=0;function toast(m,ms,undo){let t=document.querySelector(".toast");if(!t){t=document.createElement("div");t.className="toast";document.body.appendChild(t)}
  t.textContent=m;t.style.opacity=1;t.style.pointerEvents=undo?"auto":"none";
  if(undo){const u=document.createElement("button");u.type="button";u.className="toastUndo";u.textContent="Undo";u.onclick=e=>{e.stopPropagation();t.style.opacity=0;t.style.pointerEvents="none";undo()};t.appendChild(u)}
  clearTimeout(tt);tt=setTimeout(()=>{t.style.opacity=0;t.style.pointerEvents="none"},ms||1600);}
/* the other phone delegated something: take the change in place */
window.addEventListener("kvsync",e=>{if((e.detail||[]).indexOf(KEY)<0)return;D=load();if($("scrim").hidden)render();});
window.addEventListener("storage",e=>{if(e.key===KEY){D=load();if($("scrim").hidden)render();}});
render();fetchOpen();
</script>
