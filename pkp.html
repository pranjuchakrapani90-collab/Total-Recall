<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1c1b19">
<title>JuniorBees PKP · Pranju OS</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="icon" href="icon-192.png" sizes="192x192"><link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="stylesheet" href="tr-theme.css?v=20261020">
</head><body class="tr-inv">
<header><div class="hin">
  <a class="backlink" href="./#f-invest">← Investments</a>
  <div class="eyebrow">Investments · SIP + buy in dips</div>
  <h1>JuniorBees PKP</h1>
  <span class="pill" id="mkt"><i></i><span>NSE</span></span>
</div></header>
<main class="wrap">
  <div class="bar"><span class="st" id="st"></span><button id="refresh" class="ghost" type="button">↻ Price</button></div>
  <div id="err" class="err" hidden></div>
  <div id="out"></div>
</main>
<script src="gsync.js?v=20261020"></script>
<script src="invest.js?v=20261021"></script>
<script>
"use strict";
const I=Invest,{esc,inr,price,pct,signInr,tone,ok,r2,dshort}=I;
const KEY="pkp",$=id=>document.getElementById(id);
/* the old PKP tab's settings: SIP amount, dip base amount, BID levels below the average price, profit-booking threshold */
const DEF={symbol:"JUNIORBEES",sip:5000,dipBase:5000,bids:[-0.05,-0.10,-0.15,-0.20,-0.25,-0.30,-0.35,-0.40,-0.45,-0.55,-0.60],bookPct:0.01};
const today=()=>I.ist().iso;
let Q=I.quotesCache(),qAt=0;

/* ---------- the numbers (same formulas as the PKP tab) ---------- */
function model(){
  const s=I.load(KEY),S={...DEF,...(s.settings||{})},q=Q[S.symbol]&&ok(Q[S.symbol].price)?Q[S.symbol]:null;
  if(q)qAt=Math.max(qAt,q.at||0);
  const T=Object.entries(s.tx).map(([id,x])=>({id,...x})).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.seq||0)-(b.seq||0));
  let units=0,base=0,level=0,booked=0;const flows=[];
  T.forEach(x=>{
    if(x.type==="buy"){x.sip=!ok(x.bid)||x.bid<=level;units+=x.units;base+=x.amount;if(ok(x.bid))level=x.bid;flows.push([x.date,-x.amount]);}
    else{const avg=units?base/units:0;x.profit=x.units>=units?(x.price-avg)*x.units:x.units*x.price;booked+=x.profit;units-=x.units;if(units<=0){units=0;base=0;}level=0;flows.push([x.date,x.units*x.price]);}
    x.hold=units;x.avg=units?base/units:NaN;x.level=level;});
  const cmp=q?q.price:NaN,avg=units?base/units:NaN,value=units*cmp,pl=units?value-base:0,min=base*S.bookPct;
  const bids=S.bids.map((p,i)=>({n:i+1,pct:p,amt:S.dipBase*(i+1),price:avg*(1+p)}));
  const next=Math.min(level+1,bids.length),nb=bids[next-1];
  const nextQty=nb?Math.ceil(nb.amt/nb.price):NaN;
  const eligible=pl>min?Math.floor(pl/cmp):0,tgtPrice=(base+min)/units,tgtUnits=pl>min?Math.floor(pl/cmp):Math.floor(min/tgtPrice);
  const xr=ok(cmp)&&units?I.xirr([...flows,[today(),value]]):NaN;
  const first=T.find(x=>x.type==="buy");
  /* GTT sell for the profit-booking target (PKP has no trailing stop; its exit is the booking threshold) */
  let gtt=null;if(units&&ok(tgtPrice)){const g=S.gtt||null,sug={trig:r2(tgtPrice),lim:r2(tgtPrice*0.998),units:tgtUnits};let st="warn",todo=true,msg;
    if(g&&ok(cmp)&&cmp>=g.trig){st="bad";msg=`Price ${price(cmp)} is at or above your GTT ${price(g.trig)}. If it triggered, record the sale.`;}
    else if(!g&&ok(cmp)&&cmp>=sug.trig){todo=false;msg=`Price is already above the target: book the profit with an AMO sell; a GTT isn't needed now.`;}
    else if(!g){msg=`No GTT yet. Place a sell GTT: trigger ${price(sug.trig)} · limit ${price(sug.lim)} · ${sug.units} units.`;}
    else if(Math.abs(g.trig-sug.trig)>0.005){msg=`Your average changed: move the GTT from ${price(g.trig)} to ${price(sug.trig)}, limit ${price(sug.lim)}.`;}
    else if(g.units!==sug.units){msg=`GTT is for ${g.units} units; the target needs ${sug.units}.`;}
    else{st="ok";todo=false;msg=`GTT matches the target · set ${dshort(g.date)}.`;}
    gtt={g,sug,st,todo,msg};}
  const sipDay=S.sipDay||inferSipDay(T);
  return {s,S,q,T,sipDay,sipNext:nextSip(T,sipDay),units,base,avg,cmp,value,pl,plp:base?pl/base*100:NaN,booked,abs:base?booked/base*100:NaN,xr,min,bids,level,next,nb,nextQty,eligible,tgtPrice,tgtUnits,
    gtt,sipQty:Math.ceil(S.sip/cmp),appr:first&&ok(cmp)?(cmp/first.price-1)*100:NaN};}

/* ---------- next SIP date ---------- */
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const toTrading=d=>{while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()+1);return d;};
const prevTrading=d=>{d=new Date(d);do d.setDate(d.getDate()-1);while(d.getDay()===0||d.getDay()===6);return d;};
/* the day you usually SIP: most common day among the last 6 SIP buys (1st if none) */
function inferSipDay(T){const c={};T.filter(x=>x.type==="buy"&&x.sip).slice(-6).forEach(x=>{const d=+x.date.slice(8,10);c[d]=(c[d]||0)+1;});
  const k=Object.keys(c).sort((a,b)=>c[b]-c[a]||a-b)[0];return k?+k:1;}
function onDay(y,m,day){const last=new Date(y,m+1,0).getDate();return toTrading(new Date(y,m,Math.min(day,last)));}
function nextSip(T,day){const t=I.ist().iso,y=+t.slice(0,4),m=+t.slice(5,7)-1,ym=t.slice(0,7);
  const done=T.some(x=>x.type==="buy"&&x.sip&&x.date.slice(0,7)===ym);
  let d=done?onDay(y,m+1,day):onDay(y,m,day),late=false;
  if(!done&&iso(d)<t){late=true;d=toTrading(new Date(t+"T00:00:00"));}
  const amo=prevTrading(d);
  return {date:iso(d),done,late,due:iso(onDay(y,m,day)),amo:iso(amo),days:Math.round((new Date(iso(d)+"T00:00:00")-new Date(t+"T00:00:00"))/864e5)};}
const wd=s=>new Date(s+"T00:00:00").toLocaleDateString("en-IN",{weekday:"short"})+" "+dshort(s);

/* ---------- forms ---------- */
function buyForm(pre){pre=pre||{};const M=model();
  I.form({title:pre.id?"Edit buy":pre.title||"Record a buy",note:pre.id?"":"BID level: 0 for a plain SIP; the BID number when you buy at a dip level. It sets the next BID.",
    fields:[{k:"date",label:"Date",type:"date",value:pre.date||today()},{k:"price",label:"Price",type:"number",value:pre.price},{k:"units",label:"Units",type:"number",step:"1",value:pre.units},
      {k:"bid",label:"BID level after this buy",type:"select",value:ok(pre.bid)?pre.bid:M.level,options:[[0,"0 · no dip level"],...M.bids.map(b=>[b.n,"BID "+b.n+" ("+pct(b.pct*100)+")"])]}],
    onSubmit:v=>{if(!(v.price>0)||!(v.units>0))return "Price and units must be above zero.";
      const amt=pre.id&&ok(pre.amount)&&pre.price===v.price&&pre.units===v.units?pre.amount:Math.round(v.price*v.units*100)/100;
      I.upsert(KEY,"tx",pre.id,{date:v.date,type:"buy",price:v.price,units:Math.round(v.units),bid:+v.bid,amount:amt,seq:pre.seq||Date.now()});draw();},
    onDelete:pre.id?()=>{I.remove(KEY,"tx",pre.id);draw();}:null});}
const REASONS=[["system","Profit booking (rule or GTT)"],["cash","Discretionary · needed the cash"],["view","Discretionary · changed my view"],["other","Discretionary · other"]];
function sellForm(pre){pre=pre||{};const M=model();
  I.form({title:pre.id?"Edit sale":pre.reason==="system"?"Record a profit booking":"Sell",note:pre.id?"":"A partial sale books the whole amount as profit and keeps the base investment, like the sheet. Selling all units closes the holding.",
    fields:[{k:"date",label:"Date",type:"date",value:pre.date||today()},{k:"price",label:"Sell price",type:"number",value:pre.price},{k:"units",label:"Units sold",type:"number",step:"1",value:pre.units,hint:`You hold ${M.units} units.`},
      {k:"reason",label:"Reason",type:"select",value:pre.reason||(pre.id?"system":"view"),options:REASONS}],
    onSubmit:v=>{if(!(v.price>0)||!(v.units>0))return "Price and units must be above zero.";const u=Math.round(v.units);
      if(!pre.id&&u>M.units)return `You hold ${M.units} units.`;
      if(!pre.id&&v.reason!=="system"){const pl=M.units*v.price-M.base;
        if(pl<=M.min&&!confirm(`At ${price(v.price)} the notional profit is ${signInr(pl)}, below the ${inr(M.min)} booking threshold. The plan would keep holding.\n\nSell anyway?`))return "Not sold.";}
      I.upsert(KEY,"tx",pre.id,{date:v.date,type:"sell",price:v.price,units:u,reason:v.reason,seq:pre.seq||Date.now()});
      if(pre.fromGtt)I.setSettings(KEY,{gtt:null});draw();},
    onDelete:pre.id?()=>{I.remove(KEY,"tx",pre.id);draw();}:null});}
function gttForm(){const M=model(),x=M.gtt;if(!x)return;const g=x.g,s=x.sug;
  I.form({title:"GTT · "+M.S.symbol,note:`Profit-booking target now: trigger ${price(s.trig)} · limit ${price(s.lim)} · ${s.units} units. It moves after every buy, so update the GTT then.`,
    fields:[{k:"trig",label:"Trigger price",type:"number",value:g?g.trig:s.trig},{k:"lim",label:"Limit price",type:"number",value:g?g.lim:s.lim},
      {k:"units",label:"Units",type:"number",step:"1",value:g?g.units:s.units},{k:"date",label:"Set on",type:"date",value:today()}],
    onSubmit:v=>{if(!(v.trig>0)||!(v.lim>0)||!(v.units>0))return "Fill in trigger, limit and units.";if(v.units>M.units)return `You hold ${M.units} units.`;
      I.setSettings(KEY,{gtt:{trig:v.trig,lim:v.lim,units:Math.round(v.units),date:v.date}});draw();},
    onDelete:g?()=>{I.setSettings(KEY,{gtt:null});draw();}:null,delLabel:"Remove",delConfirm:"Remove this GTT from the app? Cancel it in your broker app too.",
    extra:g?[{label:"It triggered",run:()=>{setTimeout(()=>sellForm({price:g.lim,units:g.units,reason:"system",fromGtt:true}),0);}}]:null});}
function settingsForm(S){
  I.form({title:"PKP settings",fields:[{k:"symbol",label:"ETF (NSE symbol)",value:S.symbol},{k:"sip",label:"Monthly SIP amount (₹)",type:"number",value:S.sip},
      {k:"sipDay",label:"SIP day of the month (1–31)",type:"number",step:"1",value:S.sipDay||inferSipDay(model().T),hint:"Weekends move to the next Monday."},
      {k:"dipBase",label:"Buy-in-dips base amount (₹, × BID number)",type:"number",value:S.dipBase},
      {k:"bids",label:"BID levels below average, % (comma separated)",value:S.bids.map(b=>Math.round(b*1000)/10).join(", ")},
      {k:"bookPct",label:"Book profit above % of base investment",type:"number",value:S.bookPct*100}],
    onSubmit:v=>{const b=String(v.bids).split(/[,\s]+/).filter(Boolean).map(x=>-Math.abs(parseFloat(x))/100);if(!b.length||b.some(x=>!ok(x)))return "Check the BID levels.";
      if(!(v.sip>0)||!(v.dipBase>0)||!(v.bookPct>0))return "Amounts must be above zero.";
      if(!(v.sipDay>=1&&v.sipDay<=31))return "SIP day must be 1 to 31.";
      I.setSettings(KEY,{symbol:String(v.symbol).trim().toUpperCase().replace(/^NSE:/,""),sip:v.sip,sipDay:Math.round(v.sipDay),dipBase:v.dipBase,bids:b,bookPct:v.bookPct/100});draw();refresh();}});}

/* ---------- drawing ---------- */
const ord=n=>n+(n%10===1&&n!==11?"st":n%10===2&&n!==12?"nd":n%10===3&&n!==13?"rd":"th");
function quick(){return `<section class="quick"><button type="button" id="qBuy">+ Buy</button><button type="button" class="sellbtn" id="qSell">− Sell</button><p class="small muted">At your discretion, outside the SIP and BID plan</p></section>`;}
function month(M){
  const t=I.ist(),ym=t.iso.slice(0,7),buys=M.T.filter(x=>x.type==="buy"&&x.date.slice(0,7)===ym),N=M.sipNext,sells=M.T.filter(x=>x.type==="sell"&&x.date.slice(0,7)===ym);
  const mName=new Date(t.iso+"T00:00:00").toLocaleDateString("en-IN",{month:"long"});
  const gap=M.nb?M.nb.price/M.cmp*100-100:NaN,hit=ok(gap)&&gap>=0,up=M.tgtPrice/M.cmp*100-100,canSell=M.eligible>0;
  return `<section class="card hero"><div class="when">${esc(mName)} · ${esc(M.S.symbol)} ${price(M.cmp)}${ok(M.q&&M.q.chg)?` <span class="${tone(M.q.chg)}">${pct(M.q.chg,1)}</span>`:""}</div>
   <div class="big">${canSell?`Book profit: sell ${M.eligible} unit${M.eligible>1?"s":""}`:hit?`BID ${M.next} is live: buy ${M.nextQty}`:N.done?"SIP done · next "+esc(wd(N.date)):N.late?"SIP overdue · due "+esc(dshort(N.due)):N.days===0?"SIP due today":"Next SIP "+esc(wd(N.date))}</div>
   <div class="grp"><b><span class="chip buy">SIP</span>${inr(M.S.sip)} a month · on the ${ord(M.sipDay)}</b>
     ${buys.map(l=>`<div class="ord"><span class="s">Bought ${esc(dshort(l.date))}</span><span class="q">${l.units} × ${price(l.price)}</span><span class="d">${l.sip?"SIP":"BID "+l.bid+" buy"}</span><span class="d2">${inr(l.amount)}</span></div>`).join("")}
     <div class="ord"><span class="s">${N.done?"Next SIP":"SIP"} · ${esc(wd(N.date))}</span><span class="q">${ok(M.sipQty)?M.sipQty:"—"} × ${price(M.cmp)}</span><span class="d">${N.late?"overdue since "+esc(dshort(N.due))+" · ":N.days>0?"in "+N.days+" day"+(N.days>1?"s":"")+" · ":""}${N.days>0?"AMO on "+esc(wd(N.amo))+" evening":"place an AMO tonight"} · at today's price</span><span class="d2">${ok(M.sipQty)?"≈ "+inr(M.sipQty*M.cmp):""}</span>
         ${N.done?"":`<button class="fill" type="button" id="fSip">Record SIP buy</button>`}</div>
   </div>
   <div class="grp"><b><span class="chip avg">Buy in dips</span>next is BID ${M.next}</b>
     ${M.nb?`<div class="ord"><span class="s">${hit?"Buy now":"Wait for"} ${price(M.nb.price)}</span><span class="q">${ok(M.nextQty)?M.nextQty:"—"} units</span>
       <span class="d">${hit?"price is at or below the BID level":ok(gap)?`needs a further ${pct(-gap)} fall`:"waiting for the price"}</span><span class="d2">${inr(M.nb.amt)}</span>
       <button class="fill" type="button" id="fBid">Record BID ${M.next} buy</button></div>`:`<div class="none">Add a buy to start the ladder.</div>`}
   </div>
   <div class="grp"><b><span class="chip sell">Profit booking</span>above ${inr(M.min)}</b>
     <div class="ord"><span class="s">${canSell?"Sell "+M.eligible+" units":"Not yet"}</span><span class="q">${ok(M.tgtUnits)?M.tgtUnits:"—"} @ ${price(M.tgtPrice)}</span>
       <span class="d">${canSell?"notional profit is above the threshold":ok(up)?`target is ${pct(up,1)} above the price`:""}</span><span class="d2">notional ${signInr(M.pl)}</span>
       <button class="fill" type="button" id="fSell">Record a sale</button></div>
     ${M.gtt?`<div class="gtt ${M.gtt.st}"><div class="row"><span><b>GTT sell</b><div class="sub">at the profit-booking target</div></span><span class="r">${price(M.gtt.sug.trig)}<div class="sub">${M.gtt.sug.units} units</div></span></div>
       <div class="gmsg">${esc(M.gtt.msg)}</div><div class="gb"><button class="fill" type="button" id="gSet">${M.gtt.g?(M.gtt.todo?"Update GTT":"Edit GTT"):"GTT placed"}</button>${M.gtt.g?`<button class="fill" type="button" id="gFill">It triggered</button>`:""}</div></div>`:""}
     ${sells.length?`<div class="none">Sold this month: ${sells.map(x=>`${x.units} on ${esc(dshort(x.date))} @ ${price(x.price)}`).join(", ")}</div>`:""}
   </div></section>`;}
function stats(M){
  const vsAvg=M.cmp/M.avg*100-100;
  return `<section class="card"><h2>Holding <small>${M.units} units</small></h2>
   <div class="kpis">
    <div><b>${inr(M.value)}</b><span>Market value</span></div>
    <div><b class="${tone(M.pl)}">${signInr(M.pl)}</b><span>Notional · <span class="${tone(M.plp)}">${pct(M.plp,1)}</span></span></div>
    <div><b>${inr(M.base)}</b><span>Base investment</span></div>
    <div><b>${price(M.avg)}</b><span>Average · price <span class="${tone(vsAvg)}">${pct(vsAvg,1)}</span></span></div>
    <div><b class="up">${inr(M.booked)}</b><span>Profit booked · ${pct(M.abs)}</span></div>
    <div><b>${pct(M.xr)}</b><span>XIRR${ok(M.appr)?" · ETF "+pct(M.appr,1)+" since start":""}</span></div>
   </div></section>`;}
function ladder(M){
  if(!M.units)return "";let put=false,h="";
  M.bids.forEach(b=>{if(!put&&ok(M.cmp)&&M.cmp>b.price){h+=`<div class="rung cmp"><span>Price now</span><span class="mono">${price(M.cmp)}</span></div>`;put=true;}
    const cls=b.n<=M.level?"done":b.n===M.next?"next":"";
    h+=`<div class="rung ${cls}"><b>${pct(b.pct*100,0).replace(".00","")}</b><span>BID ${b.n} · ${inr(b.amt)}${cls==="done"?" · done":cls==="next"?" · next":""}</span><span class="p">${price(b.price)}</span></div>`;});
  if(!put)h+=`<div class="rung cmp"><span>Price now</span><span class="mono">${price(M.cmp)}</span></div>`;
  return `<section class="card"><h2>Buy-in-dips ladder <small>from average ${price(M.avg)}</small></h2><div class="ladder">${h}</div>
   <p class="small muted" style="margin-top:8px">Levels move with your average price. A profit booking resets the ladder to BID 1.</p></section>`;}
function bookedC(M){
  const mm={};M.T.filter(x=>x.type==="sell").forEach(x=>{const k=x.date.slice(0,7);mm[k]=(mm[k]||0)+x.profit;});
  const months=Object.keys(mm).sort();if(!months.length)return "";const mx=Math.max(...months.map(k=>Math.abs(mm[k])),1);
  return `<section class="card"><h2>Profit booked by month <small>${inr(M.booked)} in all</small></h2>
   <div class="bars">${months.map(k=>`<div title="${k}: ${inr(mm[k])}"><i style="height:${(Math.abs(mm[k])/mx*80).toFixed(0)}%"></i><span>${new Date(k+"-01T00:00:00").toLocaleDateString("en-IN",{month:"short",year:"2-digit"})}</span></div>`).join("")}</div></section>`;}
let all=false;
function ledger(M){
  const L=M.T.slice().reverse(),show=all?L:L.slice(0,12);
  return `<section class="card"><h2>Transactions <small>tap to edit</small></h2>
   <div class="rows">${show.map(x=>`<button class="rowbtn" type="button" data-tx="${esc(x.id)}"><span><b>${esc(dshort(x.date))}</b> <span class="tag ${x.type==="sell"?"ok":""}">${x.type==="sell"?(x.reason&&x.reason!=="system"?"sell · discretionary":"sell"):x.bid>0?"buy · BID "+x.bid:"buy"}</span>
     <div class="sub">${x.units} × ${price(x.price)} · holding ${x.hold} · avg ${price(x.avg)}</div></span>
     <span class="r">${x.type==="sell"?`<span class="up">${signInr(x.profit)}</span><div class="sub">profit</div>`:`${inr(x.amount)}<div class="sub ${tone(M.cmp-x.price)}">${ok(M.cmp)?"lot "+signInr((M.cmp-x.price)*x.units):""}</div>`}</span></button>`).join("")}</div>
   ${L.length>12?`<button class="more" id="lAll" type="button">${all?"Show fewer":"Show all "+L.length}</button>`:""}
   <div class="acts"><button type="button" id="aBuy">+ Buy</button><button type="button" class="ghost" id="aSell">+ Sale</button></div></section>`;}
function setup(M){return `<details class="card sec"><summary>Settings &amp; data</summary>
   <dl class="kv"><dt>ETF</dt><dd>${esc(M.S.symbol)}</dd><dt>SIP</dt><dd>${inr(M.S.sip)} on the ${ord(M.sipDay)}${M.S.sipDay?"":" (from your buys)"}</dd><dt>Dip base</dt><dd>${inr(M.S.dipBase)} × BID</dd><dt>BID levels</dt><dd>${M.S.bids.map(b=>Math.round(b*100)+"%").join(" ")}</dd><dt>Book profit above</dt><dd>${pct(M.S.bookPct*100)} of base</dd></dl>
   <div class="acts"><button type="button" class="ghost" id="eSet">Edit settings</button></div>
   <p class="small muted" style="margin-top:12px">${I.hasSync()?"Records sync between your phones (encrypted).":"Sync is off: records stay on this phone. Turn on Sync from the home screen."}</p>
   <div class="acts"><button type="button" class="ghost" id="dImp">Import file</button><button type="button" class="ghost" id="dExp">Download backup</button>${I.hasSync()?`<button type="button" class="ghost" id="dSync">Sync now</button>`:""}</div></details>`;}
function empty(){return `<section class="card empty"><b>No records yet</b><p class="small muted">Import your investments file once (it holds everything copied from the old sheet), or start with your first buy.</p>
   <div class="acts"><button type="button" id="dImp">Import file</button><button type="button" class="ghost" id="aBuy">+ Buy</button></div></section>`;}

function draw(){
  const M=model();
  $("out").innerHTML=M.T.length?quick()+month(M)+stats(M)+ladder(M)+bookedC(M)+ledger(M)+setup(M):empty();
  const on=(id,f)=>{const e=$(id);if(e)e.onclick=f;};
  on("fSip",()=>buyForm({title:"SIP buy",price:ok(M.cmp)?M.cmp:"",units:M.sipQty||"",bid:M.level}));
  on("fBid",()=>buyForm({title:"BID "+M.next+" buy",price:M.nb?Math.round(M.nb.price*100)/100:"",units:M.nextQty||"",bid:M.next}));
  on("fSell",()=>sellForm({price:ok(M.cmp)?M.cmp:"",units:M.eligible||M.tgtUnits||"",reason:"system"}));
  on("qBuy",()=>buyForm({price:ok(M.cmp)?M.cmp:"",units:M.sipQty||"",title:"Discretionary buy"}));on("qSell",()=>sellForm({price:ok(M.cmp)?M.cmp:""}));
  on("gSet",gttForm);on("gFill",()=>{const g=M.gtt&&M.gtt.g;if(g)sellForm({price:g.lim,units:g.units,reason:"system",fromGtt:true});});
  on("aBuy",()=>buyForm({price:ok(M.cmp)?M.cmp:"",units:M.sipQty||""}));on("aSell",()=>sellForm({price:ok(M.cmp)?M.cmp:""}));
  on("lAll",()=>{all=!all;draw();});on("eSet",()=>settingsForm(M.S));
  on("dImp",()=>I.pickImport((e,done)=>{if(e){showErr(e.message);return;}showErr("");$("st").textContent="Imported "+done.join(" and ").toUpperCase()+" records.";draw();refresh();}));
  on("dExp",()=>I.exportData());on("dSync",()=>syncNow(true));
  document.querySelectorAll("[data-tx]").forEach(r=>r.onclick=()=>{const x=I.load(KEY).tx[r.dataset.tx];if(!x)return;(x.type==="sell"?sellForm:buyForm)({id:r.dataset.tx,...x});});
  status();}
function status(){const t=I.ist();$("mkt").className="pill"+(t.open?" open":"");$("mkt").querySelector("span").textContent=t.open?"NSE open · live":"NSE closed";
  $("st").textContent=qAt?"Price "+I.ago(qAt):"";}
function showErr(m){$("err").hidden=!m;$("err").textContent=m||"";}
async function syncNow(loud){try{const r=await I.sync(KEY);if(r.ok&&r.changed)draw();if(loud)$("st").textContent=r.ok?"Synced.":r.msg;}catch(e){if(loud)showErr("Sync failed: "+e.message);}}
async function refresh(){const S={...DEF,...(I.load(KEY).settings||{})};
  $("refresh").disabled=true;$("st").textContent="Getting live price…";
  try{const r=await I.quotes([S.symbol]);Q=r.quotes;qAt=Date.now();showErr(r.missing.length?"No live price for "+S.symbol+".":"");draw();}
  catch(e){showErr("Live price: "+e.message);status();}
  finally{$("refresh").disabled=false;}}
$("refresh").onclick=refresh;
draw();
(async()=>{await syncNow(false);refresh();})();
setInterval(()=>{if(document.visibilityState==="visible"&&I.ist().open)refresh();},60000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&Date.now()-qAt>60000)refresh();});
</script>
</body></html>
