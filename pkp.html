  <div class="bar"><span class="st" id="st"></span><button id="qBuy" class="b-buy" type="button">+ Buy</button><button id="qSell" class="b-sell" type="button">− Sell</button><button id="refresh" class="b-ref" type="button" aria-label="Refresh price" title="Refresh price">↻</button></div>

<script src="invest.js?v=20261024b"></script>
<script>
"use strict";
const I=Invest,{esc,inr,price,pct,signInr,tone,ok,r2,dshort}=I;
const KEY="pkp",$=id=>document.getElementById(id);
/* the old PKP tab's settings: SIP amount, dip base amount, BID levels below the average price, profit-booking threshold */
const DEF={symbol:"JUNIORBEES",sip:5000,dipBase:5000,bids:[-0.05,-0.10,-0.15,-0.20,-0.25,-0.30,-0.35,-0.40,-0.45,-0.55,-0.60],bookPct:0.01,sipDay:1};
const today=()=>I.ist().iso;
let Q=I.quotesCache(),qAt=0;

/* ---------- the numbers (same formulas as the PKP tab) ---------- */
function model(){
  const s=I.load(KEY),S={...DEF,...(s.settings||{})},q=Q[S.symbol]&&ok(Q[S.symbol].price)?Q[S.symbol]:null;
  if(q)qAt=Math.max(qAt,q.at||0);
  const T=Object.entries(s.tx).map(([id,x])=>({id,...x})).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.seq||0)-(b.seq||0));
  let units=0,base=0,level=0,booked=0;const flows=[];
  T.forEach(x=>{
    if(x.type==="buy"){x.sip=!ok(x.bid)||x.bid<=level;units+=x.units;base+=x.amount;if(ok(x.bid))level=x.bid;flows.push([x.date,-x.amount]);}
    else{const avg=units?base/units:0;x.profit=x.units>=units?(x.price-avg)*x.units:x.units*x.price;booked+=x.profit;units-=x.units;if(units<=0){units=0;base=0;}level=0;flows.push([x.date,x.units*x.price]);}
    x.hold=units;x.avg=units?base/units:NaN;x.level=level;});
  const cmp=q?q.price:NaN,avg=units?base/units:NaN,value=units*cmp,pl=units?value-base:0,min=base*S.bookPct;
  const bids=S.bids.map((p,i)=>({n:i+1,pct:p,amt:S.dipBase*(i+1),price:avg*(1+p)}));
  const next=Math.min(level+1,bids.length),nb=bids[next-1];
  const nextQty=nb?Math.ceil(nb.amt/nb.price):NaN;
  const eligible=pl>min?Math.floor(pl/cmp):0,tgtPrice=(base+min)/units,tgtUnits=pl>min?Math.floor(pl/cmp):Math.floor(min/tgtPrice);
  const xr=ok(cmp)&&units?I.xirr([...flows,[today(),value]]):NaN;
  const first=T.find(x=>x.type==="buy");
  /* Two GTTs, both kept in the app so it can ask about them:
     sell GTT at the profit-booking target, buy GTT at the next BID (buy-in-dip) level.
     Once the price has touched a GTT's trigger since the day it was placed, the app asks: did it fill?
     Yes → record the trade (a buy moves the BID counter on; a sale resets it to BID 1) and clear that GTT.
     No → nothing is recorded; the GTT is cleared so the app asks you to place the next one. */
  const mk=(g,sug,side)=>{if(!g&&!sug)return null;let st="warn",todo=true,msg,hitAt=NaN,ask=false;
    const buy=side==="buy",touch=g?I.touched(q,g.date,buy?"low":"high"):NaN;
    if(g&&ok(touch)&&(buy?touch<=g.trig:touch>=g.trig)){st="bad";ask=true;hitAt=touch;
      msg=`${buy?"Low":"High"} ${price(touch)} reached your trigger ${price(g.trig)}. Did the GTT fill?`;}
    else if(!sug){msg=buy?"All BID levels are done; remove this GTT.":"Nothing to sell; remove this GTT.";}
    else if(!g&&ok(cmp)&&(buy?cmp<=sug.trig:cmp>=sug.trig)){todo=false;msg=buy?`Price is already at BID ${sug.bid}: buy with an AMO; a GTT isn't needed now.`:`Price is already above the target: book the profit with an AMO sell; a GTT isn't needed now.`;}
    else if(!g){msg=`not placed yet · ${buy?"buy at BID "+sug.bid:"sell at the target"}`;}
    else if(buy&&g.bid!==sug.bid){msg=`GTT is for BID ${g.bid}; the next level is BID ${sug.bid} at ${price(sug.trig)}.`;}
    else if(Math.abs(g.trig-sug.trig)>0.005){msg=`Your average changed: move it from ${price(g.trig)} to ${price(sug.trig)}, limit ${price(sug.lim)}.`;}
    else if(g.units!==sug.units){msg=`GTT is for ${g.units} units; it should be ${sug.units}.`;}
    else{st="ok";todo=false;msg=`placed ${dshort(g.date)} · matches`;}
    return {side,g,sug,st,todo,ask,msg,hitAt};};
  const gtt=units&&ok(tgtPrice)||S.gtt?mk(S.gtt||null,units&&ok(tgtPrice)?{trig:r2(tgtPrice),lim:r2(tgtPrice*0.998),units:tgtUnits}:null,"sell"):null;
  const nbx=units?bids[level]:null;/* undefined once every BID is used */
  const gttB=nbx||S.gttBuy?mk(S.gttBuy||null,nbx?{trig:r2(nbx.price),lim:r2(nbx.price*1.002),units:Math.ceil(nbx.amt/nbx.price),bid:nbx.n}:null,"buy"):null;
  const sipDay=S.sipDay||1;
  return {s,S,q,T,sipDay,sipNext:nextSip(T,sipDay),units,base,avg,cmp,value,pl,plp:base?pl/base*100:NaN,booked,abs:base?booked/base*100:NaN,xr,min,bids,level,next,nb,nextQty,eligible,tgtPrice,tgtUnits,
    gtt,gttB,sipQty:Math.ceil(S.sip/cmp),appr:first&&ok(cmp)?(cmp/first.price-1)*100:NaN};}

/* ---------- next SIP date ---------- */
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const NSE_HOLIDAYS=I.NSE_HOLIDAYS;
const closed=d=>d.getDay()===0||d.getDay()===6||NSE_HOLIDAYS.has(iso(d));
const toTrading=d=>{while(closed(d))d.setDate(d.getDate()+1);return d;};
const prevTrading=d=>{d=new Date(d);do d.setDate(d.getDate()-1);while(closed(d));return d;};
function onDay(y,m,day){const last=new Date(y,m+1,0).getDate();return toTrading(new Date(y,m,Math.min(day,last)));}
function nextSip(T,day){const t=I.ist().iso,y=+t.slice(0,4),m=+t.slice(5,7)-1,ym=t.slice(0,7);
  const done=T.some(x=>x.type==="buy"&&x.sip&&x.date.slice(0,7)===ym);
  let d=done?onDay(y,m+1,day):onDay(y,m,day),late=false;
  if(!done&&iso(d)<t){late=true;d=toTrading(new Date(t+"T00:00:00"));}
  const amo=prevTrading(d),ti=t,amoToday=iso(amo)===ti||(late||iso(d)===ti);
  return {amoToday,date:iso(d),done,late,due:iso(onDay(y,m,day)),amo:iso(amo),days:Math.round((new Date(iso(d)+"T00:00:00")-new Date(t+"T00:00:00"))/864e5)};}
const wd=s=>new Date(s+"T00:00:00").toLocaleDateString("en-IN",{weekday:"short"})+" "+dshort(s);

/* ---------- forms ---------- */
function buyForm(pre){pre=pre||{};const M=model();
  I.form({title:pre.id?"Edit buy":pre.title||"Record a buy",note:pre.id?"":pre.fromGtt||pre.fromSip?"Put in the actual fill price from your broker app if it was different.":"BID level: 0 for a plain SIP; the BID number when you buy at a dip level. It sets the next BID.",
    fields:[{k:"date",label:"Date",type:"date",value:pre.date||today()},{k:"price",label:"Price",type:"number",value:pre.price},{k:"units",label:"Units",type:"number",step:"1",value:pre.units},
      {k:"bid",label:"BID level after this buy",type:"select",value:ok(pre.bid)?pre.bid:M.level,options:[[0,"0 · no dip level"],...M.bids.map(b=>[b.n,"BID "+b.n+" ("+pct(b.pct*100)+")"])]}],
    onSubmit:v=>{if(!(v.price>0)||!(v.units>0))return "Price and units must be above zero.";
      const amt=pre.id&&ok(pre.amount)&&pre.price===v.price&&pre.units===v.units?pre.amount:Math.round(v.price*v.units*100)/100;
      I.upsert(KEY,"tx",pre.id,{date:v.date,type:"buy",price:v.price,units:Math.round(v.units),bid:+v.bid,amount:amt,seq:pre.seq||Date.now()});
      if(pre.fromGtt)I.setSettings(KEY,{gttBuy:null});if(pre.fromSip)I.setSettings(KEY,{sipAmo:null});draw();},
    onDelete:pre.id?()=>{I.remove(KEY,"tx",pre.id);draw();}:null});}
const REASONS=[["system","Profit booking (rule or GTT)"],["cash","Discretionary · needed the cash"],["view","Discretionary · changed my view"],["other","Discretionary · other"]];
function sellForm(pre){pre=pre||{};const M=model();
  I.form({title:pre.id?"Edit sale":pre.title||(pre.reason==="system"?"Record a profit booking":"Sell"),note:pre.id?"":"A partial sale books the whole amount as profit and keeps the base investment, like the sheet. Selling all units closes the holding.",
    fields:[{k:"date",label:"Date",type:"date",value:pre.date||today()},{k:"price",label:"Sell price",type:"number",value:pre.price},{k:"units",label:"Units sold",type:"number",step:"1",value:pre.units,hint:`You hold ${M.units} units.`},
      {k:"reason",label:"Reason",type:"select",value:pre.reason||(pre.id?"system":"view"),options:REASONS}],
    onSubmit:v=>{if(!(v.price>0)||!(v.units>0))return "Price and units must be above zero.";const u=Math.round(v.units);
      if(!pre.id&&u>M.units)return `You hold ${M.units} units.`;
      if(!pre.id&&v.reason!=="system"){const pl=M.units*v.price-M.base;
        if(pl<=M.min&&!confirm(`At ${price(v.price)} the notional profit is ${signInr(pl)}, below the ${inr(M.min)} booking threshold. The plan would keep holding.\n\nSell anyway?`))return "Not sold.";}
      I.upsert(KEY,"tx",pre.id,{date:v.date,type:"sell",price:v.price,units:u,reason:v.reason,seq:pre.seq||Date.now()});
      if(pre.fromGtt)I.setSettings(KEY,{gtt:null});draw();},
    onDelete:pre.id?()=>{I.remove(KEY,"tx",pre.id);draw();}:null});}
const GK={sell:"gtt",buy:"gttBuy"};
function gttForm(side){const M=model(),x=side==="buy"?M.gttB:M.gtt;if(!x)return;const g=x.g,s=x.sug||g,buy=side==="buy";
  const fields=[{k:"trig",label:"Trigger price",type:"number",value:g?g.trig:s.trig},{k:"lim",label:"Limit price",type:"number",value:g?g.lim:s.lim,
      hint:buy?"A little above the trigger so it fills; you still get the lower price if it's there.":"A little below the trigger so it fills; you still get the higher price if it's there."},
    {k:"units",label:"Units",type:"number",step:"1",value:g?g.units:s.units}];
  if(buy)fields.push({k:"bid",label:"BID level it buys",type:"select",value:g?g.bid:s.bid,options:M.bids.map(b=>[b.n,"BID "+b.n+" ("+pct(b.pct*100)+")"])});
  fields.push({k:"date",label:"Placed on",type:"date",value:g?g.date:today()});
  I.form({title:(buy?"Buy GTT · BID ":"Sell GTT · ")+(buy?(g?g.bid:s.bid):M.S.symbol),
    note:x.sug?(buy?`Next dip level now: BID ${x.sug.bid} · trigger ${price(x.sug.trig)} · limit ${price(x.sug.lim)} · ${x.sug.units} units. It moves when your average changes, so update the GTT after every buy.`
      :`Profit-booking target now: trigger ${price(x.sug.trig)} · limit ${price(x.sug.lim)} · ${x.sug.units} units. It moves after every buy, so update the GTT then.`):"",
    fields,
    onSubmit:v=>{if(!(v.trig>0)||!(v.lim>0)||!(v.units>0))return "Fill in trigger, limit and units.";if(!buy&&v.units>M.units)return `You hold ${M.units} units.`;
      const rec={trig:v.trig,lim:v.lim,units:Math.round(v.units),date:v.date||today()};if(buy)rec.bid=+v.bid;
      I.setSettings(KEY,{[GK[side]]:rec});draw();},
    onDelete:g?()=>{I.setSettings(KEY,{[GK[side]]:null});draw();}:null,delLabel:"Remove",delConfirm:"Remove this GTT from the app? Cancel it in your broker app too."});}
/* the price touched the trigger: record the fill (Yes) or clear it so the next GTT can be placed (No) */
function gttFilled(side){const M=model(),x=side==="buy"?M.gttB:M.gtt;if(!x||!x.g)return;const g=x.g;
  if(side==="buy")buyForm({title:"BID "+g.bid+" bought by GTT",date:today(),price:g.trig,units:g.units,bid:g.bid,fromGtt:true});
  else sellForm({title:"Profit booked by GTT",date:today(),price:g.trig,units:g.units,reason:"system",fromGtt:true});}
function gttMissed(side){if(!confirm(side==="buy"?"No buy recorded; the BID counter stays as it is.\n\nClear this GTT so the app shows the next one to place?":"No sale recorded.\n\nClear this GTT so the app shows the next one to place?"))return;
  I.setSettings(KEY,{[GK[side]]:null});draw();}
function settingsForm(S){
  I.form({title:"PKP settings",fields:[{k:"symbol",label:"ETF (NSE symbol)",value:S.symbol},{k:"sip",label:"Monthly SIP amount (₹)",type:"number",value:S.sip},
      {k:"sipDay",label:"SIP day of the month (1–31)",type:"number",step:"1",value:S.sipDay||1,hint:"Weekends and NSE holidays move to the next trading day."},
      {k:"dipBase",label:"Buy-in-dips base amount (₹, × BID number)",type:"number",value:S.dipBase},
      {k:"bids",label:"BID levels below average, % (comma separated)",value:S.bids.map(b=>Math.round(b*1000)/10).join(", ")},
      {k:"bookPct",label:"Book profit above % of base investment",type:"number",value:S.bookPct*100}],
    onSubmit:v=>{const b=String(v.bids).split(/[,\s]+/).filter(Boolean).map(x=>-Math.abs(parseFloat(x))/100);if(!b.length||b.some(x=>!ok(x)))return "Check the BID levels.";
      if(!(v.sip>0)||!(v.dipBase>0)||!(v.bookPct>0))return "Amounts must be above zero.";
      if(!(v.sipDay>=1&&v.sipDay<=31))return "SIP day must be 1 to 31.";
      I.setSettings(KEY,{symbol:String(v.symbol).trim().toUpperCase().replace(/^NSE:/,""),sip:v.sip,sipDay:Math.round(v.sipDay),dipBase:v.dipBase,bids:b,bookPct:v.bookPct/100});draw();refresh();}});}

/* ---------- drawing ---------- */
const ord=n=>n+(n%10===1&&n!==11?"st":n%10===2&&n!==12?"nd":n%10===3&&n!==13?"rd":"th");
const TABS=[["ladder","Ladder"],["hist","History"],["booked","Booked"]];
let tab=I.rememberTab(KEY,"ladder");
function month(M){
  const t=I.ist(),ym=t.iso.slice(0,7),buys=M.T.filter(x=>x.type==="buy"&&x.date.slice(0,7)===ym),N=M.sipNext,sells=M.T.filter(x=>x.type==="sell"&&x.date.slice(0,7)===ym);
  const mName=new Date(t.iso+"T00:00:00").toLocaleDateString("en-IN",{month:"long"});
  const gap=M.nb?M.nb.price/M.cmp*100-100:NaN,hit=ok(gap)&&gap>=0,up=M.tgtPrice/M.cmp*100-100,canSell=M.eligible>0;
  const askB=M.gttB&&M.gttB.ask,askS=M.gtt&&M.gtt.ask;
  const sa=M.S.sipAmo,saAsk=sa&&I.sessionStarted(sa.session);
  const big=saAsk?"Did your SIP AMO buy?":askB?`Did your BID ${M.gttB.g.bid} GTT buy?`:askS?"Did your sell GTT book the profit?":canSell?`Book profit: sell ${M.eligible} unit${M.eligible>1?"s":""}`:hit?`BID ${M.next} is live: buy ${M.nextQty}`:N.late&&!sa?"SIP overdue · due "+dshort(N.due):!sa&&(N.days===0||N.amoToday)?"SIP due · place the AMO":M.gttB&&M.gttB.todo&&M.gttB.sug?`Set the BID ${M.gttB.sug.bid} GTT`:M.gtt&&M.gtt.todo&&M.gtt.sug&&M.gtt.sug.units>0?"Set the sell GTT":"Nothing to do today";
  const amoTxt=N.done?`${ym2(t.iso)} done · AMO ${wd(N.amo)} eve`:N.days>0&&!N.amoToday?`AMO ${wd(N.amo)} evening`:"AMO tonight at today's close";
  const rows=[
    sipRow(M,N,amoTxt),
    M.nb?plan(M.gttB,"Dip",`BID ${M.next} · ${price(M.nb.price)}`,`${ok(M.nextQty)?M.nextQty:"—"} units`,
      hit?"at this level now":ok(gap)?`${pct(-gap)} away`:"",inr(M.nb.amt),hit?["Bought",`id="fBid"`]:null):"",
    M.units?plan(M.gtt,"Sell",price(M.tgtPrice),`${ok(M.tgtUnits)?M.tgtUnits:"—"} unit${M.tgtUnits===1?"":"s"}`,
      canSell?"above the target now":ok(up)?`${pct(up)} away`:"",`P/L ${signInr(M.pl)}`,canSell?["Sold",`id="fSell"`]:null):""].join("");
  return `<section class="card hero"><div class="when">${esc(mName)} · ${esc(M.S.symbol)} ${price(M.cmp)}${ok(M.q&&M.q.chg)?` <span class="${tone(M.q.chg)}">${pct(M.q.chg,1)}</span>`:""}</div>
   <div class="big">${esc(big)}</div>${rows}</section>`;}
/* a Dip or Sell row with its GTT folded in: a small chip shows the GTT's state and opens it;
   when the price touched the trigger the row asks Yes / No instead */
function plan(x,label,what,q,sub,amt,btn){const kind=label==="Dip"?"dip":"book";
  if(!x)return I.todo(kind,label,what,q,esc(sub),amt,btn);const k=x.side==="buy"?"b":"s";
  if(x.ask)return I.todo(kind+" ask",label,what,q,`<span class="dn">${esc(x.msg)}</span>`,amt,null)+
    `<div class="gask"><button type="button" id="gY${k}">${x.side==="buy"?"Yes, bought":"Yes, sold"}</button><button type="button" class="ghost" id="gN${k}">No</button></div>`;
  const placeable=x.g||(x.sug&&x.sug.units>0&&x.todo);
  const chip=!placeable?"":x.st==="ok"?`<button type="button" class="gchip ok" id="gS${k}" title="${esc(x.msg)}">GTT ✓</button>`
    :`<button type="button" class="gchip" id="gS${k}" title="${esc(x.msg)}">${x.g?"GTT · update":"GTT · set"}</button>`;
  return I.todo(kind,label,what,q,esc(sub)+(chip?" "+chip:""),amt,btn);}
/* SIP: "AMO placed" the evening before; once that session opens it asks whether the AMO bought */
function sipRow(M,N,amoTxt){const sa=M.S.sipAmo;
  if(sa&&M.T.some(x=>x.type==="buy"&&x.sip&&x.date>=sa.placed)){setTimeout(()=>{I.setSettings(KEY,{sipAmo:null});draw();},0);return "";}/* recorded some other way */
  if(sa){const q=`${sa.units} × ${price(sa.lim)}`;
    if(!I.sessionStarted(sa.session))return I.todo("sip done","SIP",esc(wd(sa.session)),q,"AMO placed · goes in at 9:15",inr(sa.units*sa.lim),["Undo",`id="sUndo"`]);
    const lo=I.touched(M.q,sa.session,"low"),hint=ok(lo)?(lo<=sa.lim?` · low ${price(lo)} reached your limit`:` · low ${price(lo)} didn't reach your limit`):"";
    return I.todo("sip ask","SIP",esc(wd(sa.session)),q,`<span class="dn">Did it buy?</span>${esc(hint)}`,inr(sa.units*sa.lim),null)+
      `<div class="gask"><button type="button" id="sYes">Yes, bought</button><button type="button" class="ghost" id="sNo">No</button></div>`;}
  const due=N.amoToday||N.late||N.days===0;
  return I.todo("sip"+(N.done?" done":""),"SIP",esc(wd(N.date)),`${ok(M.sipQty)?M.sipQty:"—"} units`,
    esc((N.late?"overdue · ":"")+amoTxt),ok(M.sipQty)?"≈ "+inr(M.sipQty*M.cmp):"",due?[I.ist().open?"Placed":"AMO placed",`id="fSip"`]:null);}
const ym2=iso=>new Date(iso+"T00:00:00").toLocaleDateString("en-IN",{month:"short"});
function stats(M){
  return I.sum([["Value",inr(M.value),"",`${M.units} units`],["P / L",signInr(M.pl),tone(M.pl),pct(M.plp,1)],["XIRR",pct(M.xr),"",`booked ${inr(M.booked)}`]]);}
let ladAll=false;
function ladder(M){
  if(!M.units)return `<p class="nothing">No holding yet.</p>`;let put=false,h="";
  /* the done levels, the next one and three after it; the rest on request */
  const cut=ladAll?M.bids.length:Math.min(M.bids.length,M.next+3);
  M.bids.slice(0,cut).forEach(b=>{if(!put&&ok(M.cmp)&&M.cmp>b.price){h+=`<div class="rung cmp"><span>Price now</span><span class="mono">${price(M.cmp)}</span></div>`;put=true;}
    const cls=b.n<=M.level?"done":b.n===M.next?"next":"";
    h+=`<div class="rung ${cls}"><b>${pct(b.pct*100,0).replace(".00","")}</b><span>BID ${b.n} · ${inr(b.amt)}${cls==="done"?" · done":cls==="next"?" · next":""}</span><span class="p">${price(b.price)}</span></div>`;});
  if(!put&&(ladAll||cut===M.bids.length))h+=`<div class="rung cmp"><span>Price now</span><span class="mono">${price(M.cmp)}</span></div>`;
  return `<p class="line">Below your average <b>${price(M.avg)}</b> · a profit booking resets to BID 1</p><div class="ladder">${h}</div>
   ${M.bids.length>cut||ladAll?`<button class="more" type="button" id="ladAll">${ladAll?"Show fewer":"Show all "+M.bids.length+" levels"}</button>`:""}`;}
function bookedC(M){
  const mm={};M.T.filter(x=>x.type==="sell").forEach(x=>{const k=x.date.slice(0,7);mm[k]=(mm[k]||0)+x.profit;});
  const months=Object.keys(mm).sort();if(!months.length)return `<p class="nothing">No profit booked yet.</p>`;const mx=Math.max(...months.map(k=>Math.abs(mm[k])),1);
  return `<p class="line">Booked <b class="up">${inr(M.booked)}</b> · ${pct(M.abs)} of base</p>
   <div class="bars">${months.map(k=>`<div title="${k}: ${inr(mm[k])}"><i style="height:${(Math.abs(mm[k])/mx*80).toFixed(0)}%"></i><span>${new Date(k+"-01T00:00:00").toLocaleDateString("en-IN",{month:"short",year:"2-digit"})}</span></div>`).join("")}</div>
   ${bookedList(M)}`;}
/* every sale, newest first, like History: tap one to correct or delete it */
let bAll=false;
function bookedList(M){const L=M.T.filter(x=>x.type==="sell").reverse(),show=bAll?L:L.slice(0,12);
  return `<div class="rows" style="margin-top:12px">${show.map(x=>`<button class="rowbtn" type="button" data-tx="${esc(x.id)}"><span><b>${esc(dshort(x.date))}</b> <span class="tag ok">${x.reason&&x.reason!=="system"?"own call":"booked"}</span>
     <div class="sub">${x.units} × ${price(x.price)} = ${inr(x.units*x.price)}</div></span>
     <span class="r"><span class="${tone(x.profit)}">${signInr(x.profit)}</span><div class="sub">profit</div></span></button>`).join("")}</div>
   ${L.length>12?`<button class="more" id="bAll" type="button">${bAll?"Show fewer":"Show all "+L.length}</button>`:""}`;}
let all=false;
function ledger(M){
  const L=M.T.slice().reverse(),show=all?L:L.slice(0,12);
  return `<div class="rows">${show.map(x=>`<button class="rowbtn" type="button" data-tx="${esc(x.id)}"><span><b>${esc(dshort(x.date))}</b> <span class="tag ${x.type==="sell"?"ok":""}">${x.type==="sell"?(x.reason&&x.reason!=="system"?"sell · own call":"sell"):x.sip?"SIP":"BID "+x.bid}</span>
     <div class="sub">${x.units} × ${price(x.price)} · holding ${x.hold}</div></span>
     <span class="r">${x.type==="sell"?`<span class="up">${signInr(x.profit)}</span><div class="sub">profit</div>`:`${inr(x.amount)}<div class="sub ${tone(M.cmp-x.price)}">${ok(M.cmp)?signInr((M.cmp-x.price)*x.units):""}</div>`}</span></button>`).join("")}</div>
   ${L.length>12?`<button class="more" id="lAll" type="button">${all?"Show fewer":"Show all "+L.length}</button>`:""}`;}
function details(M){return `<section class="card">${I.tabs(TABS,tab)}<div class="panel">${tab==="hist"?ledger(M):tab==="booked"?bookedC(M):ladder(M)}</div></section>`;}
function setup(M){return `<details class="card sec more"><summary>More · settings, data</summary>
   <dl class="kv"><dt>ETF</dt><dd>${esc(M.S.symbol)}</dd><dt>SIP</dt><dd>${inr(M.S.sip)} on the ${ord(M.sipDay)}</dd><dt>Dip base</dt><dd>${inr(M.S.dipBase)} × BID</dd><dt>BID levels</dt><dd>${M.S.bids.map(b=>Math.round(b*100)+"%").join(" ")}</dd><dt>Book profit above</dt><dd>${pct(M.S.bookPct*100)} of base</dd></dl>
   <div class="acts"><button type="button" class="ghost" id="eSet">Edit settings</button></div>
   <p class="small muted" style="margin-top:12px">${I.hasSync()?"Records sync between your phones (encrypted).":"Sync is off: records stay on this phone. Turn on Sync from the home screen."}</p>
   <div class="acts"><button type="button" class="ghost" id="dImp">Import file</button><button type="button" class="ghost" id="dExp">Download backup</button>${I.hasSync()?`<button type="button" class="ghost" id="dSync">Sync now</button>`:""}</div></details>`;}
function empty(){return `<section class="card empty"><b>No records yet</b><p class="small muted">Import your investments file once (it holds everything copied from the old sheet), or start with your first buy.</p>
   <div class="acts"><button type="button" id="dImp">Import file</button><button type="button" class="ghost" id="aBuy">+ Buy</button></div></section>`;}

function draw(){
  const M=model();
  $("out").innerHTML=M.T.length?month(M)+I.fundBar(M.units&&M.gttB&&M.gttB.sug&&(M.gttB.g||M.nb&&M.nb.price/M.cmp>0.97)?M.gttB.sug.units*M.gttB.sug.lim:NaN)+stats(M)+details(M)+setup(M):empty();
  const on=(id,f)=>{const e=$(id);if(e)e.onclick=f;};
  on("fSip",()=>{I.setSettings(KEY,{sipAmo:{units:M.sipQty,lim:r2(M.cmp),placed:today(),session:I.ist().open?today():I.orderSession()}});draw();});
  on("sUndo",()=>{I.setSettings(KEY,{sipAmo:null});draw();});
  on("sNo",()=>{if(!confirm("Nothing recorded. Clear this AMO so you can place it again?"))return;I.setSettings(KEY,{sipAmo:null});draw();});
  on("sYes",()=>{const sa=M.S.sipAmo;if(sa)buyForm({title:"SIP buy",date:sa.session,price:sa.lim,units:sa.units,bid:M.level,fromSip:true});});
  on("fBid",()=>buyForm({title:"BID "+M.next+" buy",price:M.nb?Math.round(M.nb.price*100)/100:"",units:M.nextQty||"",bid:M.next}));
  on("fSell",()=>sellForm({price:ok(M.cmp)?M.cmp:"",units:M.eligible||M.tgtUnits||"",reason:"system"}));
  on("qBuy",()=>buyForm({price:ok(M.cmp)?M.cmp:"",units:M.sipQty||"",title:"Discretionary buy"}));on("qSell",()=>sellForm({price:ok(M.cmp)?M.cmp:""}));
  ["b","s"].forEach(k=>{const side=k==="b"?"buy":"sell";on("gS"+k,()=>gttForm(side));on("gY"+k,()=>gttFilled(side));on("gN"+k,()=>gttMissed(side));});
  on("kFund",()=>I.fundForm(draw));
  on("aBuy",()=>buyForm({price:ok(M.cmp)?M.cmp:"",units:M.sipQty||""}));
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;I.saveTab(KEY,tab);draw();});
  on("lAll",()=>{all=!all;draw();});on("bAll",()=>{bAll=!bAll;draw();});on("ladAll",()=>{ladAll=!ladAll;draw();});on("eSet",()=>settingsForm(M.S));
  on("dImp",()=>I.pickImport((e,done)=>{if(e){showErr(e.message);return;}showErr("");$("st").textContent="Imported "+done.join(" and ").toUpperCase()+" records.";draw();refresh();}));
  on("dExp",()=>I.exportData());on("dSync",()=>syncNow(true));
  document.querySelectorAll("[data-tx]").forEach(r=>r.onclick=()=>{const x=I.load(KEY).tx[r.dataset.tx];if(!x)return;(x.type==="sell"?sellForm:buyForm)({id:r.dataset.tx,...x});});
  status();}
function status(){const t=I.ist();$("mkt").className="pill"+(t.open?" open":"");$("mkt").querySelector("span").textContent=t.open?"NSE open · live":"NSE closed";
  $("st").textContent=qAt?"Price "+I.ago(qAt):"";}
function showErr(m){$("err").hidden=!m;$("err").textContent=m||"";}
async function syncNow(loud){try{const r=await I.sync(KEY);let o=null;try{o=await I.sync("etf");}catch(e){}/* the other page's records feed the shared Kite fund */
  if(r.ok&&(r.changed||o&&o.changed))draw();if(loud)$("st").textContent=r.ok?"Synced.":r.msg;}catch(e){if(loud)showErr("Sync failed: "+e.message);}}
async function refresh(){const S={...DEF,...(I.load(KEY).settings||{})};
  $("refresh").disabled=true;$("st").textContent="Getting live price…";
  try{const r=await I.quotes([S.symbol,I.LIQ]);Q=r.quotes;qAt=Date.now();showErr(r.missing.includes(S.symbol)?"No live price for "+S.symbol+".":"");draw();}
  catch(e){showErr("Live price: "+e.message);status();}
  finally{$("refresh").disabled=false;}}
$("refresh").onclick=refresh;
draw();
(async()=>{await syncNow(false);refresh();})();
setInterval(()=>{if(document.visibilityState==="visible"&&I.ist().open)refresh();},60000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&Date.now()-qAt>60000)refresh();});
</script>
</body></html>
