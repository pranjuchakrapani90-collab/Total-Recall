<title>Fingerstyle Solo · Guitar Studio</title>

<style>
:root{
  --bg:#f4f7fb; --paper:#fff; --ink:#172033; --muted:#697386; --line:#e5e7eb;
  --brass:#7c3aed; --brass-soft:#f5f3ff; --steel:#4f46e5; --steel-soft:#eef0ff; --root:#ea580c; --good:#059669; --good-soft:#ecfdf5;
  --thumb:#2563eb; --mel:#c2410c; --fill:#8b93a3;
  --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--body)}
[hidden]{display:none!important}
header.top{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;padding:22px 16px}
.hin{max-width:980px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.toprow{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.backlink{font-size:13px;color:#fff;opacity:.9;text-decoration:none}
.eyebrow{font:600 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:#e0e7ff}
h1{font:750 clamp(26px,5vw,36px)/1.1 var(--body);margin:4px 0 0}
.stats{display:flex;gap:16px;flex-wrap:wrap}
.stat{text-align:right}.stat b{display:block;font:700 24px/1 var(--mono)}.stat span{font-size:12px;color:#e0e7ff}
.stat.met b{color:#a7f3d0}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 110px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.card h2{font:700 22px/1.2 var(--body);margin:0}
.card h3{font:650 16px/1.3 var(--body);margin:0}
.num{font:500 12px var(--mono);color:var(--muted)}
.lead,.card p{margin:0;color:var(--muted);max-width:68ch}
.pdesc{color:var(--ink)!important}
button{font:650 14px var(--body);cursor:pointer;border:0;border-radius:10px;background:var(--steel-soft);color:#3730a3;padding:9px 14px}
button:disabled{opacity:.45;cursor:default}
.play{background:var(--steel);color:#fff}
.play.on{background:var(--brass)}
.big{padding:12px 18px;font-size:15px}
.good{background:var(--good);color:#fff}
.linkb{background:none;padding:0;color:var(--steel);text-decoration:underline;font-weight:500}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:600 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:6px 9px;border-radius:999px;background:var(--steel-soft);color:#3730a3}
.chip.t{background:var(--brass-soft);color:#5b21b6}.chip.g{background:var(--good-soft);color:var(--good)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.goal .gbar{height:10px;border-radius:6px;background:var(--steel-soft);overflow:hidden}
.goal .gbar i{display:block;height:100%;width:0;background:var(--good);transition:width .5s}
.levels{display:flex;flex-direction:column;gap:10px}
.lvl{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.lvl.lock{opacity:.55}
.lvl.cur{border-color:var(--steel);box-shadow:0 0 0 1px var(--steel)}
.lvl.fin{border-left:5px solid var(--good)}
.lvh{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.lvh b{font-size:16px}.lvh span{font-size:12px;color:var(--muted)}
.lvl p{margin:4px 0 8px;font-size:14px}
.lessons{display:flex;flex-wrap:wrap;gap:8px}
.les{font-size:13px;padding:7px 11px;border-radius:999px;background:var(--bg);color:var(--ink)}
.les.ok{background:var(--good-soft);color:var(--good)}
.les.next{background:var(--steel);color:#fff}
.tip{background:var(--brass-soft);border-radius:10px;padding:10px 12px;color:var(--ink)!important;font-size:14px}
.box{background:var(--steel-soft);border-radius:10px;padding:10px 12px}
.ctl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.ctl b{font:700 15px var(--mono);color:var(--ink);min-width:3ch}
.ctl input[type=range]{width:160px}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
input{accent-color:var(--steel)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* tab */
.tabscroll{overflow-x:auto}
.tab{display:flex;flex-wrap:wrap;row-gap:6px;font:600 13px var(--mono)}
.tbar{display:flex;position:relative;padding:16px 4px 0 2px;border-radius:8px;cursor:pointer}
.tbar::before,.tbar::after{content:"";position:absolute;top:25px;height:90px;border-left:2px solid var(--line)}
.tbar::before{left:24px}.tbar::after{right:0}
.tbar.nc::before{left:0}.tbar.nc .clef{display:none}
.tbar.sel{background:var(--brass-soft);box-shadow:inset 0 0 0 2px var(--brass)}
.tab.hassel .tbar:not(.sel){opacity:.4}
.bno{position:absolute;top:0;right:6px;font:700 11px var(--mono);color:var(--muted)}
.chd{position:absolute;top:0;left:26px;font:700 12px var(--body);color:var(--brass)}
.clef{display:flex;flex-direction:column;justify-content:space-between;align-items:center;height:96px;margin:6px 6px 38px 0;width:16px;font:800 19px/1 var(--body);flex:none}
.col{display:grid;grid-template-rows:repeat(6,18px) 16px 16px;flex:none;width:clamp(15px,calc((min(100vw,940px) - 108px) / var(--n,8)),36px);border-radius:4px}
.c{position:relative;text-align:center;line-height:18px}
.c::before{content:"";position:absolute;left:-1px;right:-1px;top:50%;border-top:1px solid var(--line)}
.c i{position:relative;font-style:normal;background:var(--paper);padding:0 1px;letter-spacing:-.5px}
.c i.b{color:var(--thumb)}.c i.m{color:var(--mel);font-weight:800}.c i.f{color:var(--fill)}
.c i sup{font-size:8px;color:var(--brass);margin-right:1px}
.cnt{font:500 10px/16px var(--mono);text-align:center;color:#c4c9d4}
.col.bt .cnt{color:#8c94a3;font-weight:700}
.fg{font:700 10px/16px var(--mono);text-align:center;color:var(--thumb);white-space:nowrap;overflow:visible;letter-spacing:-1px}
.col.on{background:var(--steel-soft)}
.col.tick{background:#eef0ff}.col.tick .cnt{color:var(--steel)}
.barsbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.barsbar button{padding:7px 11px;font-size:13px}
.barsbar b{color:var(--brass);font-size:14px}
/* now bar */
.nowbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 18px #141e3714}
#nbPlay{min-width:96px}
.nbtxt{display:flex;flex-direction:column;flex:1;min-width:0;line-height:1.3;overflow:hidden}
.nbinfo{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nbgoal{font:600 12px var(--mono);color:var(--muted);white-space:nowrap}
.nbgoal.met{color:var(--good)}
.nbtempo{display:flex;align-items:center;gap:6px;font:600 13px var(--mono);flex:none}
.nbtempo button{padding:6px 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:30;background:var(--good);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px);text-align:center}
.navf{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.studio{display:inline-flex;gap:4px;margin-top:12px;background:#ffffff2e;border-radius:12px;padding:4px;flex-wrap:wrap}
.studio a{color:#fff;text-decoration:none;font:650 14px var(--body);padding:8px 14px;border-radius:9px;white-space:nowrap}
.studio a.on{background:#fff;color:#3730a3}
.studio a:not(.on):hover{background:#ffffff1f}

<script>
"use strict";
/* ===================== Chords =====================
   Frets from low E to high e (null = not played). r = root bass [string, fret], a = alternate bass. */
const OPEN={1:64,2:59,3:55,4:50,5:45,6:40};
const X=null;
const CH={
  C:{f:[X,3,2,0,1,0],r:[5,3],a:[4,2]}, G:{f:[3,2,0,0,0,3],r:[6,3],a:[4,0]}, Am:{f:[X,0,2,2,1,0],r:[5,0],a:[4,2]},
  Em:{f:[0,2,2,0,0,0],r:[6,0],a:[4,2]}, D:{f:[X,X,0,2,3,2],r:[4,0],a:[5,0]}, Dm:{f:[X,X,0,2,3,1],r:[4,0],a:[5,0]},
  E:{f:[0,2,2,1,0,0],r:[6,0],a:[4,2]}, A:{f:[X,0,2,2,2,0],r:[5,0],a:[4,2]}, E7:{f:[0,2,0,1,0,0],r:[6,0],a:[4,0]},
  A7:{f:[X,0,2,0,2,0],r:[5,0],a:[4,2]}, D7:{f:[X,X,0,2,1,2],r:[4,0],a:[5,0]}, G7:{f:[3,2,0,0,0,1],r:[6,3],a:[4,0]},
  C7:{f:[X,3,2,3,1,0],r:[5,3],a:[4,2]}, Fmaj7:{f:[X,X,3,2,1,0],r:[4,3],a:[5,0]},
  // closed (barre) shapes
  F:{f:[1,3,3,2,1,1],r:[6,1],a:[4,3],cl:1}, "G(3)":{f:[3,5,5,4,3,3],r:[6,3],a:[4,5],cl:1}, "Am(5)":{f:[5,7,7,5,5,5],r:[6,5],a:[4,7],cl:1},
  Bb:{f:[X,1,3,3,3,1],r:[5,1],a:[4,3],cl:1}, "C(3)":{f:[X,3,5,5,5,3],r:[5,3],a:[4,5],cl:1}, "D(5)":{f:[X,5,7,7,7,5],r:[5,5],a:[4,7],cl:1},
  "Dm(5)":{f:[X,5,7,7,6,5],r:[5,5],a:[4,7],cl:1}, Bm:{f:[X,2,4,4,3,2],r:[5,2],a:[4,4],cl:1},
};
const fretOn=(c,s)=>c.f[6-s];
const cname=n=>n.replace(/\(\d+\)/,"");

/* ===================== The course =====================
   Pattern lessons: "beat:parts" steps, beats counted from 1; parts joined by "+".
   B = root bass, A = alternate bass, 1–4 = that string of the chord, W = walking bass note to the next chord,
   techniques: 3h hammer-on from open (or 2 frets below), 2p pull-off to open, 3/ slide up 2 frets, <12>4 natural harmonic, Bm muted bass.
   Song lessons: melody "note:beats" per bar ("|" between bars), chords per bar ("," = two chords in a bar), style bass | alt | full. */
const LEVELS=[
 {n:"Thumb and fingers",d:"Your thumb (p) owns the bass strings and your fingers own the top three: i on the G string, m on the B, a on the high e. Every later level is built on this division of labour.",ls:[
  {id:"1a",t:"Thumb on the bass",w:"Hold each chord and let your thumb play its root on every beat. The fingers rest lightly on the top three strings.",tip:"Rest your thumb on the next string after each stroke (a rest stroke) so the bass is even and full.",meter:4,prog:"C|Am|Em|G",pat:"1:B 2:B 3:B 4:B",tempo:[50,90]},
  {id:"1b",t:"p, i, m, a one at a time",w:"Thumb plays the root on beat 1, then the fingers pluck one string each on beats 2, 3 and 4: i on G, m on B, a on high e.",tip:"Keep each finger over its own string. Only the tip moves, curling into the palm.",meter:4,prog:"C|Am|Em|G",pat:"1:B 2:3 3:2 4:1",tempo:[50,90]},
  {id:"1c",t:"The pinch",w:"Thumb and ring finger pluck together on beat 1 (a pinch), then i and m answer, then i again.",tip:"Squeeze thumb and a towards each other like picking up a coin; both notes must start at exactly the same moment.",meter:4,prog:"C|G|Am|Em",pat:"1:B+1 2:3 3:2 4:3",tempo:[50,90]},
  {id:"1d",t:"Bass, then the chord together",w:"Thumb on beat 1, then i, m and a pluck the top three strings together on beat 2. Thumb plays the alternate bass on 3, fingers again on 4.",tip:"The three fingers move as one hand: think of closing a gentle fist.",meter:4,prog:"C|Am|D|G",pat:"1:B 2:3+2+1 3:A 4:3+2+1",tempo:[50,90]},
  {id:"1e",t:"p-i-m-a in eighth notes",w:"The basic arpeggio: thumb, then i, m, a one after the other in even eighth notes, twice in each bar (the second time from the alternate bass).",tip:"Say it out loud: thumb-i-m-a, thumb-i-m-a. Let every note ring into the next.",meter:4,prog:"C|Am|Em|G",pat:"1:B 1.5:3 2:2 2.5:1 3:A 3.5:3 4:2 4.5:1",tempo:[50,90]},
 ]},
 {n:"Arpeggio patterns",d:"The rolling patterns behind ballads, film songs and classical studies. The left hand holds the chord; the right hand keeps a steady loop.",ls:[
  {id:"2a",t:"Up and back: p-i-m-a-m-i",w:"Six eighth notes to a bar of 3/4: thumb, then up through i-m-a and back down m-i. The classic waltz arpeggio.",tip:"Feel the bar as ONE-two-three with the thumb on ONE.",meter:3,prog:"Am|Dm|E|Am",pat:"1:B 1.5:3 2:2 2.5:1 3:2 3.5:3",tempo:[50,100]},
  {id:"2b",t:"Falling: p-a-m-i",w:"Thumb, then the fingers come down from the high e: a, m, i. Twice a bar.",tip:"Starting with a feels odd at first. Plant a on its string before the thumb plays.",meter:4,prog:"Am|C|G|Em",pat:"1:B 1.5:1 2:2 2.5:3 3:A 3.5:1 4:2 4.5:3",tempo:[50,90]},
  {id:"2c",t:"Rolling: p-i-m-i-a-i-m-i",w:"Eight eighth notes with i returning between every other finger. A smooth, flowing pattern heard under countless songs.",tip:"i works twice as hard here. Keep it relaxed and close to the string.",meter:4,prog:"C|Am|Fmaj7|G",pat:"1:B 1.5:3 2:2 2.5:3 3:1 3.5:3 4:2 4.5:3",tempo:[50,90]},
  {id:"2d",t:"Pinch and roll",w:"The rolling pattern with a pinch (thumb + a) on beats 1 and 3, which puts a little melody on top of the arpeggio.",tip:"Let the pinched top note sing slightly louder than the rest.",meter:4,prog:"C|Am|Fmaj7|G",pat:"1:B+1 1.5:3 2:2 2.5:3 3:A+1 3.5:3 4:2 4.5:3",tempo:[50,90]},
  {id:"2e",t:"Triplet arpeggio",w:"Three notes to every beat: thumb, i, m, then a, m, i, and so on: twelve notes to the bar in a rolling triplet feel.",tip:"Count 1-tri-let 2-tri-let; the thumb lands on 1 and 3.",meter:4,prog:"Em|C|G|D",pat:"1:B 1.333:3 1.667:2 2:1 2.333:2 2.667:3 3:A 3.333:3 3.667:2 4:1 4.333:2 4.667:3",tempo:[40,80]},
 ]},
 {n:"Travis picking",d:"The thumb alternates between two bass strings like a steady heartbeat while the fingers play off-beats on top. The engine of folk and country fingerstyle.",ls:[
  {id:"3a",t:"Alternating thumb",w:"Thumb only: root on beats 1 and 3, the alternate bass string on 2 and 4. Nothing else.",tip:"This must become automatic. Practise it while talking or looking away.",meter:4,prog:"C|G|Am|Em",pat:"1:B 2:A 3:B 4:A",tempo:[50,100]},
  {id:"3b",t:"Basic Travis pattern",w:"The thumb keeps alternating on every beat; the fingers fill the gaps: a pinch with m on beat 1, then i, m, i, m on the off-beats.",tip:"Never let the fingers drag the thumb. If it wobbles, go back to the thumb alone.",meter:4,prog:"C|G|Am|Em",pat:"1:B+2 1.5:3 2:A 2.5:2 3:B 3.5:3 4:A 4.5:2",tempo:[50,100]},
  {id:"3c",t:"Travis with the high e",w:"The same pattern with the ring finger pinching the high e on beats 1 and 3, which adds a melody voice.",tip:"Listen for three layers: bass, middle and the top note.",meter:4,prog:"C|Am|D|G",pat:"1:B+1 1.5:3 2:A 2.5:2 3:B+1 3.5:3 4:A 4.5:2",tempo:[50,100]},
  {id:"3d",t:"Changing chords mid-bar",w:"Two chords in every bar, two beats each, without the thumb losing its place.",tip:"Change the left hand on the off-beat before the new chord, so the thumb lands on the new root on time.",meter:4,prog:"C,G|Am,Em|Fmaj7,C|D7,G",pat:"1:B+2 1.5:3 2:A 2.5:2 3:B+2 3.5:3 4:A 4.5:2",tempo:[50,90]},
  {id:"3e",t:"Syncopated Travis",w:"The finger notes land just before the beat on 2-and and 4-and, giving the bouncing, pushing sound of country picking.",tip:"Keep the thumb rock solid; only the fingers move around it.",meter:4,prog:"G|C|D7|G",pat:"1:B+1 2:A 2.5:2 3:B 3.5:3 4:A 4.5:1",tempo:[50,100]},
 ]},
 {n:"Bass and melody",d:"Two voices at once: a tune on the top strings played by the fingers, and a bass line under it played by the thumb. All tunes here are traditional or classical, free for anyone to play.",ls:[
  {id:"4a",t:"Twinkle Twinkle Little Star",song:1,w:"The tune on the top strings with the thumb playing the chord root on beats 1 and 3 (traditional, 1761).",tip:"Let the bass ring under the melody; fingers and thumb are independent.",meter:4,key:"A",style:"bass",
   mel:"A3:1 A3:1 E4:1 E4:1|F#4:1 F#4:1 E4:2|D4:1 D4:1 C#4:1 C#4:1|B3:1 B3:1 A3:2|E4:1 E4:1 D4:1 D4:1|C#4:1 C#4:1 B3:2|E4:1 E4:1 D4:1 D4:1|C#4:1 C#4:1 B3:2|A3:1 A3:1 E4:1 E4:1|F#4:1 F#4:1 E4:2|D4:1 D4:1 C#4:1 C#4:1|B3:1 B3:1 A3:2",
   ch:"A|D,A|D,A|E,A|A,D|A,E|A,D|A,E|A|D,A|D,A|E,A",tempo:[60,100]},
  {id:"4b",t:"Ode to Joy",song:1,w:"Beethoven's theme (1824) on the B and high e strings, with the root in the bass on beats 1 and 3.",tip:"The melody stays in one place: open e, frets 1 and 3 on the e, frets 1 and 3 on the B.",meter:4,key:"C",style:"bass",
   mel:"E4:1 E4:1 F4:1 G4:1|G4:1 F4:1 E4:1 D4:1|C4:1 C4:1 D4:1 E4:1|E4:1.5 D4:.5 D4:2|E4:1 E4:1 F4:1 G4:1|G4:1 F4:1 E4:1 D4:1|C4:1 C4:1 D4:1 E4:1|D4:1.5 C4:.5 C4:2",
   ch:"C|G7|C|C,G7|C|G7|C|G7,C",tempo:[60,110]},
  {id:"4c",t:"Walking bass between chords",w:"Bass and chord on beat 1, the chord on top on 2 and 3, and a walking note on beat 4 that steps into the next chord's root.",tip:"The walking note pulls the ear to the next chord. Play it a little stronger.",meter:4,key:"C",prog:"C|Am|Fmaj7|G|C|Em|Am|G",pat:"1:B+2 2:3+1 3:A 4:W",tempo:[50,90]},
  {id:"4d",t:"Ode to Joy, alternating bass",song:1,w:"The same tune with the thumb alternating on every beat underneath: two independent parts.",tip:"Learn two bars at a time with bar practice; it is the hardest step so far.",meter:4,key:"C",style:"alt",
   mel:"E4:1 E4:1 F4:1 G4:1|G4:1 F4:1 E4:1 D4:1|C4:1 C4:1 D4:1 E4:1|E4:1.5 D4:.5 D4:2|E4:1 E4:1 F4:1 G4:1|G4:1 F4:1 E4:1 D4:1|C4:1 C4:1 D4:1 E4:1|D4:1.5 C4:.5 C4:2",
   ch:"C|G7|C|C,G7|C|G7|C|G7,C",tempo:[50,100]},
 ]},
 {n:"Full arrangements",d:"Melody, bass and chord together: the complete fingerstyle sound. The thumb plays the bass, the fingers play the tune and fill in chord notes underneath it.",ls:[

    return ns.map((n,k)=>({name:n,c:CH[n],b:bi*meter+k*seg,d:seg}));});

function walkNote(cur,next,key){ // a bass note one scale step from the next root, on the side we are coming from

function patternEvents(L){
  const meter=L.meter,bars=chordsOf(L.prog,meter),ev=[];

      const seg=segs.find(g=>at>=g.b-1e-6&&at<g.b+g.d-1e-6)||segs[0];

        if(!seg)return;const c=seg.c;

        if(p==="A"||p==="Am"){const[s,f]=c.a;ev.push({b:at,d:p==="Am"?.25:dur,s,f,m:midiOf(s,f),role:"b",tech:p==="Am"?"pm":null});return;}
        if(p==="W"){const bars2=bars[bi+1]&&bars[bi+1][0]||bars[0][0];const w=walkNote(seg,bars2,L.key||"C");ev.push({b:at,d:dur,s:w.s,f:w.f,m:w.m,role:"b",acc:1});return;}
        const mm=/^(\d)([hp\/])?$/.exec(p);if(!mm)return;let s=+mm[1],f=fretOn(c,s);
        if(f==null){for(const t of [3,2,1]){if(fretOn(c,t)!=null){s=t;f=fretOn(c,t);break;}}}
        const tech=mm[2];
        if(tech==="h"){const from=f>=2?(c.cl?f-2:0):0;if(f===0){ev.push({b:at,d:dur,s,f,m:midiOf(s,f),role:"f"});return;}
          ev.push({b:at,d:r12(dur/2),s,f:from,m:midiOf(s,from),role:"f"});ev.push({b:r12(at+dur/2),d:r12(dur/2),s,f,m:midiOf(s,f),role:"f",tech:"h"});return;}
        if(tech==="p"){if(f===0){ev.push({b:at,d:dur,s,f,m:midiOf(s,f),role:"f"});return;}const to=c.cl?Math.max(0,f-2):0;
          ev.push({b:at,d:r12(dur/2),s,f,m:midiOf(s,f),role:"f"});ev.push({b:r12(at+dur/2),d:r12(dur/2),s,f:to,m:midiOf(s,to),role:"f",tech:"p"});return;}
        if(tech==="/"){const from=Math.max(0,f-2);if(f<2){ev.push({b:at,d:dur,s,f,m:midiOf(s,f),role:"f"});return;}
          ev.push({b:at,d:r12(dur/2),s,f:from,m:midiOf(s,from),role:"f"});ev.push({b:r12(at+dur/2),d:r12(dur/2),s,f,m:midiOf(s,f),role:"f",tech:"/"});return;}

function placeMelody(m,c,maxS,cl){ // the string and fret for a melody note, preferring notes inside the chord shape

function songEvents(L){
  const meter=L.meter,bars=chordsOf(L.ch,meter),mbars=L.mel.split("|").map(x=>x.trim().split(/\s+/)),ev=[];let altK=0;
  const segAt=(bi,x)=>(bars[bi]||[]).find(g=>x>=g.b-1e-6&&x<g.b+g.d-1e-6);
  mbars.forEach((toks,bi)=>{
    const t0=bi*meter;let t=0;const mel=[];
    toks.forEach(tok=>{const[nm,dd]=tok.split(":"),d=Number(dd);if(nm!=="r")mel.push({m:noteName(nm),b:t0+t,d});t=r12(t+d);});

    mel.forEach(n=>{const g=segAt(bi,n.b),c=g&&g.c,lim=c?(L.style==="alt"?Math.min(c.r[0],c.a[0]):c.r[0])-1:5;

      ev.push({b:n.b,d:n.d,s:p.s,f:p.f,m:n.m,role:"m"});});
    for(let beat=0;beat<meter;beat++){
      const at=t0+beat,g=segAt(bi,at);if(!g)continue;const c=g.c,isStart=Math.abs(g.b-at)<1e-6;
      const sounding=mel.find(n=>n.b<=at+1e-6&&n.b+n.d>at+1e-6),onset=mel.find(n=>Math.abs(n.b-at)<1e-6);
      const top=sounding?sounding.s:0;

      if(L.style==="alt"){if(isStart)altK=0;addBass(altK%2?c.a:c.r);altK++;}
      else if(L.style==="bass"){if(isStart||(meter===4&&beat===2))addBass(c.r);}
      else{ // full: bass on the chord's first beat, chord notes under the melody on the other beats
        if(isStart)addBass(c.r);
        else{const lo=c.r[0];const strs=[];for(let s=lo-1;s>top;s--)if(fretOn(c,s)!=null)strs.push(s);
          strs.sort((a,b)=>a-b);const pick=strs.slice(0,onset?1:2);
          pick.forEach(s=>ev.push({b:at,d:1,s,f:fretOn(c,s),m:midiOf(s,fretOn(c,s)),role:"f"}));}

function finish(ev){ // one note per string per moment; fingers: thumb on bass, i-m-a on G-B-e

async function enc(o,code){const iv=crypto.getRandomValues(new Uint8Array(12)),c=await crypto.subtle.encrypt({name:"AES-GCM",iv},await keyOf(code),new TextEncoder().encode(JSON.stringify(o)));return JSON.stringify({v:1,iv:b64(iv),data:b64(c)});}
async function dec(blob,code){const x=JSON.parse(blob||"{}"),p=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(x.iv)},await keyOf(code),unb64(x.data));return JSON.parse(new TextDecoder().decode(p));}
function payload(){const done={};Object.keys(st.doneT).forEach(id=>{if(st.done[id])done[id]={d:st.done[id],t:st.doneT[id]};});
  return {v:1,done,off:st.offT,tempo:st.tempo,tUpd:st.tUpd,days:{...st.odays,[st.dev]:st.days}};}
function merge(R){
  let ch=false;
  Object.entries(R.done||{}).forEach(([id,x])=>{if(!st.doneT[id]||x.t>st.doneT[id]){st.doneT[id]=x.t;st.done[id]=x.d;ch=true;}});
  Object.entries(R.off||{}).forEach(([id,t])=>{if(!st.offT[id]||t>st.offT[id]){st.offT[id]=t;ch=true;}});
  Object.keys(st.offT).forEach(id=>{if(st.done[id]&&(st.offT[id]||0)>(st.doneT[id]||0)){delete st.done[id];ch=true;}});
  if((R.tUpd||0)>st.tUpd){st.tempo={...R.tempo};st.tUpd=R.tUpd;ch=true;}
  Object.entries(R.days||{}).forEach(([dev,days])=>{const tgt=dev===st.dev?st.days:(st.odays[dev]=st.odays[dev]||{});
    Object.entries(days||{}).forEach(([k,v])=>{if(v>(tgt[k]||0)){tgt[k]=v;ch=true;}});});
  return ch;
}
function setSync(state,msg){SY.state=state;SY.msg=msg||"";if(state==="ok")SY.last=new Date();
  const b=document.getElementById("syncBadge");if(b){b.textContent=state==="busy"?"☁ Syncing…":state==="ok"?"☁ Synced":state==="err"?"☁ Sync problem":"☁ Sync off";b.title=SY.msg;}
  const t=document.getElementById("syncState");if(t)t.innerHTML=syncText();}
function syncText(){if(!syncCode())return "Sync is off. Progress stays on this device.";if(SY.state==="err")return `Couldn't sync: ${SY.msg.replace(/</g,"&lt;")}. It will retry automatically.`;if(SY.state==="busy")return "Syncing…";
  return SY.last?`Synced at ${SY.last.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})}. Lessons, tempos and minutes appear on your other devices.`:"Sync is on.";}
function scheduleSync(){if(!syncCode())return;clearTimeout(SY.timer);SY.timer=setTimeout(cloudSync,1500);}
async function cloudSync(){
  const code=syncCode();if(!code){setSync("off");return false;}if(SY.busy){SY.again=true;return false;}
  SY.busy=true;setSync("busy");let ch=false;
  try{const url=SYNC_URL+(SYNC_URL.indexOf("?")>=0?"&":"?")+"mode=sync",headers={"Content-Type":"application/json","X-Total-Recall-Sync":code+"#fingerstyle"};
    const r=await fetch(url,{method:"POST",headers,body:JSON.stringify({state:{app:"fingerstyle"}}),cache:"no-store"});if(!r.ok)throw new Error("the sync bridge answered HTTP "+r.status);
    const data=await r.json();if(data.error)throw new Error(data.error);
    if(data.blob)ch=merge(await dec(data.blob,code));
    if(ch)save(true);
    const w=await fetch(url,{method:"PUT",headers,body:await enc(payload(),code),cache:"no-store"});if(!w.ok)throw new Error("upload failed with HTTP "+w.status);
    setSync("ok");
  }catch(e){setSync("err",String(e&&e.message||e));}
  finally{SY.busy=false;if(SY.again){SY.again=false;scheduleSync();}}
  if(ch&&!play)render();
  return ch;
}
function syncCard(){const on=!!syncCode();return `<section class="card"><div class="row between"><h3>Device sync</h3><span class="num">same code as Total Recall</span></div>
  <p id="syncState">${syncText()}</p>
  ${on?`<div class="row"><button type="button" data-syncnow="1">Sync now</button><button type="button" class="linkb" data-syncoff="1">Turn sync off on this device</button></div>`
  :`<div class="row"><input type="password" id="syncIn" placeholder="Your Total Recall sync code" autocomplete="off" style="flex:1;min-width:0;font:500 14px var(--body);border:1px solid var(--line);border-radius:8px;padding:8px"><button type="button" class="play" data-syncon="1">Turn on sync</button></div>
    <p>If you set the code in Total Recall or Melodic Lead on this device, sync is already on here.</p>`}</section>`;}

/* ===================== Audio ===================== */
let ctx=null,MASTER=null;const cache={};
function audio(){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:"interactive"});ctx.resume().catch(()=>{});return ctx;}
function out(){if(!MASTER||MASTER.context!==ctx){const g=ctx.createGain(),mk=ctx.createGain(),lim=ctx.createDynamicsCompressor();
  mk.gain.value=2.2;lim.threshold.value=-6;lim.knee.value=4;lim.ratio.value=20;lim.attack.value=.001;lim.release.value=.1;
  g.connect(mk).connect(lim).connect(ctx.destination);MASTER=g;}return MASTER;}
function pluckBuf(m){const k=m+"@"+ctx.sampleRate;if(cache[k])return cache[k];
  const sr=ctx.sampleRate,len=Math.floor(sr*2.4),buf=ctx.createBuffer(1,len,sr),d=buf.getChannelData(0);
  const N=Math.max(2,Math.round(sr/(440*Math.pow(2,(m-69)/12)))),dl=new Float32Array(N);let p=0;
  for(let i=0;i<N;i++){const r=Math.random()*2-1;dl[i]=.55*r+.45*p;p=dl[i];}
  let x=0;for(let i=0;i<len;i++){const v=dl[x],nx=dl[(x+1)%N];dl[x]=.9975*.5*(v+nx);d[i]=v;x=(x+1)%N;}
  return cache[k]=buf;}
function note(e,t,dur){
  const g=ctx.createGain(),vol=e.role==="m"?.62:e.role==="b"?.5:.3,soft=e.tech==="h"||e.tech==="p"||e.tech==="/"?.6:1;
  if(e.tech==="harm"){const o=ctx.createOscillator(),o2=ctx.createOscillator(),g2=ctx.createGain();o.type="sine";o2.type="sine";
    o.frequency.value=440*Math.pow(2,(e.m-69)/12);o2.frequency.value=o.frequency.value*2;g2.gain.value=.15;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.32,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+2.2);
    o.connect(g);o2.connect(g2).connect(g);g.connect(out());o.start(t);o2.start(t);o.stop(t+2.3);o2.stop(t+2.3);return;}
  const s=ctx.createBufferSource();s.buffer=pluckBuf(e.m);
  g.gain.setValueAtTime(vol*soft,t);const end=e.tech==="pm"?.18:dur;g.gain.setTargetAtTime(0,t+Math.max(end,.08),e.tech==="pm"?.03:.06);
  if(e.tech==="pm"){const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=900;s.connect(lp).connect(g);}else s.connect(g);
  g.connect(out());s.start(t);s.stop(t+Math.min(2.4,end+.6));
}
function click(t,acc){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=acc?1900:1500;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(acc?.5:.32,t+.001);g.gain.exponentialRampToValueAtTime(.0001,t+.05);
  o.connect(g).connect(out());o.start(t);o.stop(t+.06);}

/* ===================== Playback ===================== */
let play=null,view={k:"home"},sel=null;
const tempoOf=L=>st.tempo[L.id]||L.tempo[0];
const spb=()=>60/play.tempo;
function slice(E){if(!sel)return E;const s=sel.a*E.meter,en=Math.min((sel.b+1)*E.meter,E.total);
  return {...E,ev:E.ev.map((e,k)=>({...e,k})).filter(e=>e.b>=s-1e-6&&e.b<en-1e-6).map(e=>({...e,b:e.b-s})),total:en-s,off:s};}
function start(){
  const L=byId(view.id);if(!L)return;audio();stop();
  const E0=eventsOf(L);E0.ev.forEach((e,k)=>e.k=k);const E=slice(E0),ci=st.set.countin?E.meter:0;
  play={L,E,tempo:tempoOf(L),t0:ctx.currentTime+.12,ci,i:0,cyc:0,cb:-ci,vis:[],lf:performance.now(),off:E.off||0};
  play.timer=setInterval(sched,25);sched();play.raf=requestAnimationFrame(draw);setBar();
  try{if(navigator.wakeLock)navigator.wakeLock.request("screen").then(l=>{play&&(play.wake=l);}).catch(()=>{});}catch(e){}
}
function stop(){if(!play)return;flush(true);scheduleSync();clearInterval(play.timer);cancelAnimationFrame(play.raf);try{play.wake&&play.wake.release();}catch(e){}
  play=null;document.querySelectorAll(".col.on,.col.tick").forEach(c=>c.classList.remove("on","tick"));setBar();}
const bt=b=>play.t0+(b+play.ci)*spb();
function sched(){
  if(!play)return;const hz=ctx.currentTime+.15,E=play.E;
  for(;;){
    const base=play.cyc*E.total,tn=play.i<E.ev.length?bt(base+E.ev[play.i].b):Infinity,tc=bt(play.cb);
    const t=Math.min(tn,tc);if(t>hz)break;
    if(tc<=tn){if(play.cb<0||st.set.click)click(tc,(((play.cb%E.meter)+E.meter)%E.meter)===0);play.cb++;
      if(play.cb>=base+E.total&&play.i>=E.ev.length){if(st.set.loop||sel){play.cyc++;play.i=0;}else{const p=play;setTimeout(()=>{if(play===p)stop();},(tc-ctx.currentTime)*1000+400);play.cb=Infinity;}}
      continue;}
    const e=E.ev[play.i++];note(e,tn,e.d*spb()*1.4);play.vis.push([tn,e]);
  }
}
function draw(){if(!play)return;let hit=null;
  while(play.vis.length&&play.vis[0][0]<=ctx.currentTime){hit=play.vis.shift()[1];}
  if(hit){document.querySelectorAll(".col.on").forEach(c=>c.classList.remove("on"));const c=document.querySelector(`.col[data-s="${slotOf(hit.b+play.off)}"]`);if(c){c.classList.add("on");follow(c);}}
  let b=(ctx.currentTime-play.t0)/spb()-play.ci;if(b>=0&&(st.set.loop||sel))b=b%play.E.total;
  const g=b>=0&&b<play.E.total?Math.floor((b+play.off)*play.sub+1e-6):null;
  if(g!==play.tg){play.tg=g;document.querySelectorAll(".col.tick").forEach(c=>c.classList.remove("tick"));if(g!=null){const c=document.querySelector(`.col[data-s="${g}"]`);if(c)c.classList.add("tick");}}
  play.raf=requestAnimationFrame(draw);}
let lastRow=null;
function follow(el){const row=el.closest(".tbar"),r=row.getBoundingClientRect(),bot=window.innerHeight-80;
  if(row!==lastRow&&(r.top<10||r.bottom>bot)){lastRow=row;window.scrollTo({top:window.scrollY+r.top-70,behavior:"smooth"});}}
let SUB=2;const slotOf=b=>Math.round(b*SUB);

/* ----- time played: counts towards the shared daily goal ----- */
function flush(){if(!play)return;const now=performance.now();let s=Math.min(90,(now-play.lf)/1000);play.lf=now;if(s<=0)return;
  const k=dkey(new Date());st.days[k]=Math.round(((st.days[k]||0)+s)*10)/10;save(true);}
const mmss=s=>{s=Math.floor(s);return Math.floor(s/60)+":"+pad(s%60);};
let toastDay=null;
setInterval(()=>{if(play&&performance.now()-play.lf>15000)flush();paintGoal();},1000);
function paintGoal(){const k=dkey(new Date()),g=goalMin()*60;let s=daySec(k);if(play)s+=Math.min(90,(performance.now()-play.lf)/1000);const met=s>=g;
  const nb=document.getElementById("nbGoal");nb.textContent=met?`✓ ${mmss(s)} played`:`⏱ ${mmss(s)} / ${mmss(g)}`;nb.classList.toggle("met",met);
  document.getElementById("hToday").textContent=`${Math.floor(s/60)}/${goalMin()}`;document.getElementById("hTodayS").classList.toggle("met",met);
  const gb=document.getElementById("goalBar");if(gb)gb.style.width=Math.min(100,s/g*100)+"%";
  const gt=document.getElementById("goalTxt");if(gt)gt.innerHTML=met?`<b>Goal reached:</b> ${mmss(s)} played today in Guitar Studio.`:`<b>${mmss(s)}</b> played today across Guitar Studio. <b>${Math.ceil((g-s)/60)} min</b> to go.`;
  if(met&&play&&toastDay!==k){toastDay=k;const t=document.getElementById("toast");t.hidden=false;setTimeout(()=>t.hidden=true,5000);}}

/* ===================== Rendering ===================== */
function gridOf(ev){for(const s of [2,3,4,6,12])if(ev.every(e=>Math.abs(e.b*s-Math.round(e.b*s))<1e-3))return s;return 12;}
function cntLbl(pos,meter,sub){const beat=Math.floor(pos+1e-6),f=pos-beat,b=String(beat%meter+1);
  if(f<1e-6)return b;if(sub===3)return Math.abs(f-1/3)<1e-3?"tri":"let";if(Math.abs(f-.5)<1e-3)return "&";if(sub===4)return Math.abs(f-.25)<1e-3?"e":"a";return "";}
function tabHTML(E){
  const sub=gridOf(E.ev);SUB=sub;const per=E.meter*sub,nb=Math.ceil(E.total/E.meter-1e-6),at={};
  E.ev.forEach(e=>{const k=Math.round(e.b*sub);(at[k]=at[k]||[]).push(e);});
  const labels={};E.ch.forEach(c=>{if(Math.abs(c.b%E.meter)<1e-6||true)(labels[Math.floor(c.b/E.meter+1e-6)]=labels[Math.floor(c.b/E.meter+1e-6)]||[]).push(cname(c.name));});
  let h="";
  for(let br=0;br<nb;br++){const on=sel&&br>=sel.a&&br<=sel.b;
    h+=`<div class="tbar${on?" sel":""}" style="--n:${per}" data-bar="${br}" title="Tap to loop this bar">${labels[br]?`<span class="chd">${labels[br].join(" – ")}</span>`:""}<span class="bno">${br+1}</span><div class="clef" aria-hidden="true"><b>T</b><b>A</b><b>B</b></div>`;
    for(let i=0;i<per;i++){const g=br*per+i,es=at[g]||[],pos=g/sub;
      h+=`<div class="col${i%sub===0?" bt":""}" data-s="${g}">`;
      for(let s=1;s<=6;s++){const e=es.find(x=>x.s===s);
        h+=`<div class="c">${e?`<i class="${e.role}">${e.tech==="h"?"<sup>h</sup>":e.tech==="p"?"<sup>p</sup>":e.tech==="/"?"<sup>/</sup>":e.tech==="pm"?"<sup>pm</sup>":""}${e.tech==="harm"?`‹${e.f}›`:e.f}</i>`:""}</div>`;}
      h+=`<div class="cnt">${cntLbl(pos,E.meter,sub)}</div><div class="fg">${es.filter(e=>e.fg).sort((a,b)=>b.s-a.s).map(e=>e.fg).join("")}</div></div>`;}
    h+="</div>";}
  return h;
}
function fixClefs(){document.querySelectorAll(".tab").forEach(t=>{let last=null;[...t.children].forEach(b=>{b.classList.toggle("nc",b.offsetTop===last);last=b.offsetTop;});});}
window.addEventListener("resize",()=>setTimeout(fixClefs,100));
function header(){document.getElementById("hLevel").textContent=curLevel()+1;document.getElementById("hDone").textContent=Object.keys(st.done).length;}
function goalCard(){return `<div class="card goal"><div class="row between"><h3>Daily goal · ${goalMin()} min</h3><span class="num">all of Guitar Studio</span></div>
  <div class="gbar"><i id="goalBar"></i></div><p id="goalTxt"></p></div>`;}

      ${next?`<button type="button" data-open="${next.id}"${unlockedLv(next.lv)||next.lv===L.lv?"":" disabled"}>${next.id} ▸</button>`:""}</div></section>`;

function render(){
  stop();const v=document.getElementById("view");
  if(view.k==="lesson"){const L=byId(view.id);v.innerHTML=lessonView(L);}else v.innerHTML=homeView();
  header();setBar();paintGoal();requestAnimationFrame(fixClefs);
}
function setBar(){const nb=document.getElementById("nowbar"),L=view.k==="lesson"&&byId(view.id);nb.hidden=!L;document.body.style.paddingBottom=L?"80px":"0";
  if(!L)return;const b=document.getElementById("nbPlay");b.textContent=play?"■ Stop":"▶ Play";b.classList.toggle("on",!!play);
  document.getElementById("nbInfo").textContent=play?(sel?(sel.a===sel.b?`Looping bar ${sel.a+1}`:`Looping bars ${sel.a+1}–${sel.b+1}`):`Playing ${L.id}`):`Lesson ${L.id}${sel?` · bar${sel.a===sel.b?" "+(sel.a+1):"s "+(sel.a+1)+"–"+(sel.b+1)}`:""}`;
  document.getElementById("nbT").textContent=tempoOf(L);
  if(play)play.sub=SUB;}
function open(id){view={k:"lesson",id};sel=null;st.last=id;save();render();window.scrollTo({top:0});}
function setSel(s){const wasPlaying=!!play;sel=s;render();if(wasPlaying)start();}
document.addEventListener("click",e=>{
  const o=e.target.closest("[data-open]");if(o){open(o.dataset.open);return;}
  if(e.target.closest("[data-home]")){view={k:"home"};sel=null;render();window.scrollTo({top:0});return;}
  if(e.target.closest("#nbPlay")){play?stop():start();return;}
  const td=e.target.closest("[data-tdelta]");if(td){const L=byId(view.id);st.tempo[L.id]=Math.max(30,Math.min(160,tempoOf(L)+Number(td.dataset.tdelta)));st.tUpd=Date.now();save();
    const r=document.getElementById("tempo");if(r){r.value=tempoOf(L);document.getElementById("tempoV").textContent=tempoOf(L);}if(play){const was=true;stop();start();}else setBar();return;}
  const d=e.target.closest("[data-done]");if(d){st.done[d.dataset.done]=dkey(new Date());st.doneT[d.dataset.done]=Date.now();save();const L=byId(d.dataset.done),nx=ALL[ALL.indexOf(L)+1];
    if(nx&&unlockedLv(nx.lv))open(nx.id);else{view={k:"home"};render();}return;}
  const u=e.target.closest("[data-undone]");if(u){delete st.done[u.dataset.undone];st.offT[u.dataset.undone]=Date.now();save();render();return;}
  if(e.target.closest("[data-syncnow]")){cloudSync();return;}
  if(e.target.closest("[data-syncoff]")){try{localStorage.removeItem(SYNC_KEY);}catch(x){}setSync("off");render();return;}
  if(e.target.closest("[data-syncon]")){const v=(document.getElementById("syncIn").value||"").trim();if(v.length<8){setSync("err","use a sync code of at least 8 characters");return;}try{localStorage.setItem(SYNC_KEY,v);}catch(x){}cloudSync().then(render);return;}
  const bb=e.target.closest("[data-bars]");if(bb){const L=byId(view.id),E=eventsOf(L),n=Math.ceil(E.total/E.meter-1e-6),op=bb.dataset.bars;
    if(op==="all")setSel(null);else if(op==="add")setSel(sel?{a:sel.a,b:Math.min(n-1,sel.b+1)}:{a:0,b:Math.min(n-1,1)});
    else{const x=sel?Math.min(n-1,sel.b+1):0;setSel({a:x,b:x});}return;}
  const tb=e.target.closest(".tbar");if(tb){const b=Number(tb.dataset.bar);
    if(e.shiftKey&&sel)setSel({a:Math.min(sel.a,b),b:Math.max(sel.b,b)});else if(sel&&sel.a===b&&sel.b===b)setSel(null);else setSel({a:b,b});return;}
});
document.addEventListener("input",e=>{if(e.target.id==="tempo"){const L=byId(view.id);st.tempo[L.id]=Number(e.target.value);st.tUpd=Date.now();document.getElementById("tempoV").textContent=e.target.value;document.getElementById("nbT").textContent=e.target.value;save();}});
document.addEventListener("change",e=>{const t=e.target;if(t.id==="tempo"&&play){stop();start();}
  if(["click","countin","loop"].includes(t.id)){st.set[t.id]=t.checked;save();}});
document.addEventListener("keydown",e=>{if(e.key!==" "||["INPUT","BUTTON"].includes(e.target.tagName)||view.k!=="lesson")return;e.preventDefault();play?stop():start();});
document.addEventListener("visibilitychange",()=>{if(document.hidden)stop();else cloudSync();});
setInterval(()=>{if(!document.hidden&&!play)cloudSync();},60000);
const q=new URLSearchParams(location.search).get("lesson");
if(q&&byId(q))view={k:"lesson",id:q};
render();
cloudSync();
</script>
</body></html>
