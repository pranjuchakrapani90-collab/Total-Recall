<style>

<script>
"use strict";
/* ===================== The course: chords, levels and lessons live in fs-course.js (shared with the hub) ===================== */
const {TUNINGS,CH,LEVELS,ALL,EX}=FSC,FING=FSC.FING||{},lvNo=FSC.lvNo||(li=>li+1);
let TUNE=TUNINGS.std.o; // open-string pitches for the lesson being built
const X=null;
const fretOn=(c,s)=>c.f[6-s];
const cname=n=>n.replace(/\(.*?\)/,"");
const byId=id=>EX.find(x=>x.id===id)||ALL.find(x=>x.id===id);
const lessonOf=x=>ALL.find(l=>l.id===(x.pid||x.id));

/* ===================== Building the notes ===================== */
const KEYS=new Proxy({},{get:(o,k)=>{const R={C:0,"C#":1,Db:1,D:2,Eb:3,E:4,F:5,"F#":6,Gb:6,G:7,Ab:8,A:9,Bb:10,B:11}[String(k).replace(/m$/,"")];
  if(R==null)return undefined;const st=/m$/.test(k)?[0,2,3,5,7,8,10]:[0,2,4,5,7,9,11];return st.map(x=>(R+x)%12);}});
const fg=(s,role)=>role==="b"?"p":s===1?"a":s===2?"m":"i";
const midiOf=(s,f)=>TUNE[s]+f;
function noteName(tok){const m=/^([A-G])(#|b)?(\d)$/.exec(tok);const pc={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]==="#"?1:m[2]==="b"?-1:0);return (Number(m[3])+1)*12+pc;}
const r12=x=>Math.round(x*12)/12;
function chordsOf(spec,meter){ // per bar: [{c,name,b,d}]
  return spec.split("|").map(x=>x.trim()).map((x,bi)=>{if(x==="-")return [];const ns=x.split(",").map(s=>s.trim()),seg=meter/ns.length;
    return ns.map((n,k)=>({name:n,c:CH[n],b:bi*meter+k*seg,d:seg}));});
}
function walkNote(cur,next,key){ // a bass note one scale step from the next root, on the side we are coming from
  const nr=midiOf(...next.c.r),cr=midiOf(...cur.c.r),sc=KEYS[key]||KEYS.C,inK=m=>sc.includes(((m%12)+12)%12);
  let m=nr+(cr>nr?1:-1);for(let k=0;k<3&&!inK(m);k++)m+=(cr>nr?1:-1);
  let best=null;for(const s of [6,5,4]){const f=m-TUNE[s];if(f>=0&&f<=5&&(!best||f<best.f))best={s,f,m};}if(best)return best;
  return {s:next.c.r[0],f:next.c.r[1],m:nr};
}
function scanEvents(L){ // hold the shape, pluck its strings one at a time: low to high and back down
  const meter=L.meter,bars=chordsOf(L.prog,meter),ev=[],step=L.step||1,total=bars.length*meter;let prev=null,i=0;
  for(let t=0;t<total-1e-6;t=r12(t+step)){const seg=bars.flat().find(g=>t>=g.b-1e-6&&t<g.b+g.d-1e-6);if(!seg||!seg.c)continue;
    if(seg!==prev&&(!prev||prev.name!==seg.name))i=0;prev=seg;
    const up=[6,5,4,3,2,1].filter(s=>fretOn(seg.c,s)!=null),seq=up.concat(up.slice(1,-1).reverse()),s=seq[i++%seq.length],f=fretOn(seg.c,s);
    ev.push({b:t,d:step,s,f,m:midiOf(s,f),role:s>=4?"b":"f"});}
  return {ev:finish(ev),ch:bars.flat(),total,meter};}
function patternEvents(L){
  if(L.scan)return scanEvents(L);
  const meter=L.meter,bars=chordsOf(L.prog,meter),ev=[];
  const parse=p=>p.split(/\s+/).map(st=>{const[b,parts]=st.split(":");return {b:r12(Number(b)-1),parts:parts.split("+")};});
  bars.forEach((segs,bi)=>{
    const pl=L.pat.split("|"),steps=parse(L.pat2&&bi%2===1?L.pat2:pl[bi%pl.length].trim()),t0=bi*meter;
    steps.forEach((st,k)=>{
      const nb=k+1<steps.length?steps[k+1].b:meter,dur=r12(nb-st.b),at=t0+st.b;
      const seg=segs.find(g=>at>=g.b-1e-6&&at<g.b+g.d-1e-6)||segs[0];
      st.parts.forEach(p=>{
        let m;
        if((m=/^<(\d+)>(\d)$/.exec(p))){const fr=+m[1],s=+m[2],up={12:12,7:19,5:24}[fr];ev.push({b:at,d:Math.max(dur,1),s,f:fr,m:TUNE[s]+up,role:s>=4?"b":"f",tech:"harm"});return;}
        if((m=/^(\d)@(\d+)(!)?$/.exec(p))){const s=+m[1],f=+m[2];ev.push({b:at,d:dur,s,f,m:midiOf(s,f),role:m[3]?"m":s>=4?"b":"f"});return;} // an exact string and fret
        if(!seg)return;const c=seg.c;
        if(p==="B"||p==="Bm"){const[s,f]=c.r;ev.push({b:at,d:p==="Bm"?.25:dur,s,f,m:midiOf(s,f),role:"b",tech:p==="Bm"?"pm":null});return;}
        if(p==="A"||p==="Am"){const[s,f]=c.a;ev.push({b:at,d:p==="Am"?.25:dur,s,f,m:midiOf(s,f),role:"b",tech:p==="Am"?"pm":null});return;}
        if(p==="W"){const bars2=bars[bi+1]&&bars[bi+1][0]||bars[0][0];const w=walkNote(seg,bars2,L.key||"C");ev.push({b:at,d:dur,s:w.s,f:w.f,m:w.m,role:"b",acc:1});return;}
        const mm=/^(\d)([hp\/])?$/.exec(p);if(!mm)return;let s=+mm[1],f=fretOn(c,s);
        if(f==null){for(const t of [3,2,1]){if(fretOn(c,t)!=null){s=t;f=fretOn(c,t);break;}}}
        const tech=mm[2];
        if(tech==="h"){const from=f>=2?(c.cl?f-2:0):0;if(f===0){ev.push({b:at,d:dur,s,f,m:midiOf(s,f),role:"f"});return;}
          ev.push({b:at,d:r12(dur/2),s,f:from,m:midiOf(s,from),role:"f"});ev.push({b:r12(at+dur/2),d:r12(dur/2),s,f,m:midiOf(s,f),role:"f",tech:"h"});return;}
        if(tech==="p"){if(f===0){ev.push({b:at,d:dur,s,f,m:midiOf(s,f),role:"f"});return;}const to=c.cl?Math.max(0,f-2):0;
          ev.push({b:at,d:r12(dur/2),s,f,m:midiOf(s,f),role:"f"});ev.push({b:r12(at+dur/2),d:r12(dur/2),s,f:to,m:midiOf(s,to),role:"f",tech:"p"});return;}
        if(tech==="/"){const from=Math.max(0,f-2);if(f<2){ev.push({b:at,d:dur,s,f,m:midiOf(s,f),role:"f"});return;}
          ev.push({b:at,d:r12(dur/2),s,f:from,m:midiOf(s,from),role:"f"});ev.push({b:r12(at+dur/2),d:r12(dur/2),s,f,m:midiOf(s,f),role:"f",tech:"/"});return;}
        ev.push({b:at,d:dur,s,f,m:midiOf(s,f),role:s===1&&st.parts.length===2&&st.parts.includes("B")?"m":"f"});
      });
    });
  });
  const total=bars.length*meter;
  return {ev:finish(ev),ch:bars.flat(),total,meter};
}
function placeMelody(m,c,maxS,cl){ // the string and fret for a melody note, preferring notes inside the chord shape
  let best=null;
  for(let s=1;s<=Math.min(5,maxS);s++){const f=m-TUNE[s];if(f<0||f>(cl?10:5))continue;
    const inShape=c&&fretOn(c,s)===f,cost=(inShape?0:1.6)+(s-1)*.45+f*.06;if(!best||cost<best.cost)best={s,f,cost};}
  if(!best)for(let s=1;s<=6;s++){const f=m-TUNE[s];if(f>=0&&f<=12){best={s,f};break;}}
  return best;
}
function songEvents(L){
  const meter=L.meter,bars=chordsOf(L.ch,meter),mbars=L.mel.split("|").map(x=>x.trim().split(/\s+/)),ev=[];let altK=0;
  const segAt=(bi,x)=>(bars[bi]||[]).find(g=>x>=g.b-1e-6&&x<g.b+g.d-1e-6);
  mbars.forEach((toks,bi)=>{
    const t0=bi*meter;let t=0;const mel=[];
    toks.forEach(tok=>{const[nm,dd]=tok.split(":"),d=Number(dd);if(nm!=="r")mel.push({m:noteName(nm)+(L.tr||0),b:t0+t,d});t=r12(t+d);});
    // melody first: above the bass strings used in this chord
    mel.forEach(n=>{const g=segAt(bi,n.b),c=g&&g.c,lim=c?(L.style==="alt"?Math.min(c.r[0],c.a[0]):c.r[0])-1:5;
      let p=placeMelody(n.m,c,lim,c&&c.cl);if(!p)p=placeMelody(n.m,c,5);n.s=p.s;n.f=p.f;
      ev.push({b:n.b,d:n.d,s:p.s,f:p.f,m:n.m,role:"m"});});
    for(let beat=0;beat<meter;beat++){
      const at=t0+beat,g=segAt(bi,at);if(!g)continue;const c=g.c,isStart=Math.abs(g.b-at)<1e-6;
      const sounding=mel.find(n=>n.b<=at+1e-6&&n.b+n.d>at+1e-6),onset=mel.find(n=>Math.abs(n.b-at)<1e-6);
      const top=sounding?sounding.s:0;
      const addBass=([s,f])=>{if(sounding&&sounding.s===s)return;ev.push({b:at,d:1,s,f,m:midiOf(s,f),role:"b"});};
      if(L.style==="alt"){if(isStart)altK=0;addBass(altK%2?c.a:c.r);altK++;}
      else if(L.style==="mel"){} // the melody alone
      else if(L.style==="one"){if(isStart)addBass(c.r);} // the root once, where each chord starts
      else if(L.style==="bass"){if(isStart||(meter===4&&beat===2))addBass(c.r);}
      else{ // full: bass on the chord's first beat, chord notes under the melody on the other beats
        if(isStart)addBass(c.r);
        else{const lo=c.r[0];const strs=[];for(let s=lo-1;s>top;s--)if(fretOn(c,s)!=null)strs.push(s);
          strs.sort((a,b)=>a-b);const pick=strs.slice(0,onset?1:2);

function sessionPlan(nx){const day=Math.floor(Date.now()/864e5),done=ALL.filter(x=>lDone(x)&&x.id!==nx.pid);
  const tech=done.filter(x=>!x.song&&!x.task),songs=done.filter(x=>x.song);
  const warm=tech.length?tech[day%tech.length]:ALL[0],out=[];
  if(warm.id!==nx.id)out.push({min:2,L:warm,h:"Warm up",why:"A pattern you already play, at a comfortable tempo, to wake up the thumb and fingers."});
  out.push({min:songs.length?6:8,L:nx,main:1,h:nx.task?"This week's project":"New lesson",why:nx.task?"Work through the steps; it may take several sessions.":nx.free?"Hold the shape and pluck string by string at whatever tempo suits you.":"Start slow with Climb on and loop the hardest bar first."});
  if(songs.length){const r=songs[(day*7+3)%songs.length];out.push({min:2,L:r,h:"Keep a piece alive",why:"Play a finished piece once through without stopping, as a performance."});}
  return out;}
function homeView(){
  const nx=nextLesson(),S=sessionPlan(nx),pr=PR();

    <div class="row" style="margin:6px 0 10px"><button type="button" data-open="wu.all">🔥 Warm-up · full chord chain</button><button type="button" data-open="wu.p1">Part 1</button><button type="button" data-open="wu.p2">Part 2</button><button type="button" data-open="wu.p3">Part 3</button></div>
    <ol class="sess">${S.map(x=>`<li><span class="sm">${x.min} min</span><div><b>${x.h}</b><br><span>${x.why}</span></div><button type="button" class="${x.main?"play":""}" data-open="${x.L.id}">${(x.L.pid||x.L.id)} ${x.L.t}${x.L.vt&&x.L.pid!==x.L.id?` · ${x.L.vt}`:""} ▸</button></li>`).join("")}</ol>
    <p>Every lesson has a goal tempo. With <b>Climb</b> on, the tempo rises 4 bpm after every two clean loops until it reaches the goal. Each lesson is a set of exercises: the pattern in every open key (barre lessons in all 12 keys), songs in stages and then in a second key. Mark an exercise done when you can play it three times in a row at the goal; when all of a lesson's exercises are done the lesson is complete, and finishing a level opens the next.</p></section>
  ${syncCard()}

    return `<div class="lvl${un?"":" lock"}${fin?" fin":""}${cur?" cur":""}"><div class="lvh"><b>Level ${lvNo(li)}: ${L.n}</b><span>${fin?"✓ complete":un?`${L.ls.filter(x=>lDone(ALL.find(l=>l.id===x.id))).length} of ${L.ls.length} lessons done`:"🔒 finish the level before"}</span></div>
      <p>${L.d}</p><div class="lessons">${L.ls.map(y=>{const x=ALL.find(l=>l.id===y.id),d=lDone(x),k=x.ex.filter(exDone).length;return `<button type="button" class="les${d?" ok":x.id===nx.pid?" next":""}" ${un?`data-open="${x.id}"`:"disabled"}>${d?"✓ ":""}${x.id} ${x.t}${x.ex.length>1?` <small>${k}/${x.ex.length}</small>`:""}</button>`;}).join("")}</div></div>`;}).join("")}</div></section>`;

/* hear it → sing it → see it → play it, on tunes you already know (Eli Koskoff's melody exercise) */
function earSong(L){const o={Twinkle:"1 1 5 5 6 6 5",Ode:"3 3 4 5 5 4 3 2",Amazing:"5 1 3 1 3 2 1 6 5"},k=Object.keys(o).find(x=>L.t.includes(x));
  const how="Before you read the tab, hum the root of the key and call it 'one', sing the first phrase by scale numbers, picture where those notes sit on the top strings, then try to play the phrase first time. Check it against the tab afterwards.";
  return k?`${how} It starts <b>${o[k]}</b>: sing that before you play.`:`${how} Work the numbers out by singing up the scale from the root.`;}
function taskView(L){const Lv=LEVELS[L.lv],all=ALL.indexOf(lessonOf(L)),prev=ALL[all-1],next=ALL[all+1];
  return `<section class="card"><div class="num">Level ${lvNo(L.lv)} · ${Lv.n}</div><h2>${L.t}</h2>

function howTo(L){const lo=L.tempo[0],hi=L.tempo[1];
  if(L.chain)return `<details class="how" open><summary>How to use the warm-up</summary><ol>
    <li>Pick a part for a short warm-up (about a minute at 70 bpm), or the full chain when you have more time.</li>
    <li>Press Play. Each chord gets ${L.rep} bars: thumb on the root on beat 1, then i, m, a on the G, B and high e strings. The next chord follows by itself; the bar under Play tells you which chord is coming.</li>
    <li>Choose your tempo with the slider or − / +. Slow enough that every change lands on beat 1 is the right speed; it never climbs on its own.</li>
    <li>When a part runs through with no gaps at the changes and every string ringing, mark it done. Keep using it as a warm-up afterwards.</li></ol></details>`;
  if(L.scan)return `<details class="how" open><summary>How to practise this lesson</summary><ol>
    <li>Look at the diagram and place the fingers one at a time, then lift the whole hand off and place the shape again, all fingers together. Five times.</li>
    <li>Press Play. Pluck the strings one by one with the tab: thumb on the bass strings, i-m-a on the top three. Stop on any note that buzzes or sounds dead, fix the finger, carry on.</li>
    <li>Choose your own tempo with the slider or the − / + buttons. It stays where you leave it; nothing climbs on its own.</li>
    <li>When every string rings clean and you can find the shape without looking, mark the exercise done and move to the next chord.</li></ol></details>`;
  const a=L.song?["Sing or hum the tune first, then play the melody notes alone (the orange numbers) until they are secure.","Add the thumb: loop two bars with bar practice, slowly, until the bass never stops under the melody."]
    :["Play the pattern on the first chord only, looping bar 1, until the right hand runs without thinking.","Then the whole progression: change chords without breaking the rhythm."];
  return `<details class="how"><summary>How to practise this lesson</summary><ol>${a.map(x=>`<li>${x}</li>`).join("")}
    <li>Turn on <b>Climb</b>: start at ${lo} bpm and let the tempo rise 4 bpm every two loops. If it gets messy, drop back 8 bpm and climb again.</li>
    <li>At ${hi} bpm, play it three times in a row without a mistake, then mark it done.</li></ol></details>`;}
/* chord box: dots with left-hand finger numbers, X = not played, O = open */
function chordBox(n){const c=CH[n];if(!c)return "";const fn=FING[n]||[],fs=c.f.filter(x=>x!=null&&x>0),hi=Math.max(4,...fs),lo=hi>5?Math.min(...fs):1,W=118,x=i=>16+i*17,y=k=>30+k*22;
  let g=`<text x="${W/2}" y="13" text-anchor="middle" font-weight="700" font-size="14" fill="currentColor">${esc2(cname(n))}</text>`;
  g+=`<line x1="${x(0)}" y1="${y(0)}" x2="${x(5)}" y2="${y(0)}" stroke="currentColor" stroke-width="${lo===1?4:1}"/>`;
  for(let k=1;k<=4;k++)g+=`<line x1="${x(0)}" y1="${y(k)}" x2="${x(5)}" y2="${y(k)}" stroke="currentColor" stroke-opacity=".45"/>`;
  for(let i=0;i<6;i++){g+=`<line x1="${x(i)}" y1="${y(0)}" x2="${x(i)}" y2="${y(4)}" stroke="currentColor" stroke-opacity=".7"/>`;const f=c.f[i];
    if(f==null)g+=`<text x="${x(i)}" y="${y(0)-5}" text-anchor="middle" font-size="11" fill="currentColor">✕</text>`;
    else if(f===0)g+=`<circle cx="${x(i)}" cy="${y(0)-8}" r="4" fill="none" stroke="currentColor"/>`;
    else{const yy=y(f-lo+.5);g+=`<circle cx="${x(i)}" cy="${yy}" r="7.5" fill="var(--thumb)"/>${fn[i]?`<text x="${x(i)}" y="${yy+4}" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">${fn[i]}</text>`:""}`;}}
  if(lo>1)g+=`<text x="${x(5)+8}" y="${y(.5)+4}" font-size="10" fill="currentColor">${lo}fr</text>`;
  ["E","A","D","G","B","e"].forEach((t,i)=>g+=`<text x="${x(i)}" y="${y(4)+14}" text-anchor="middle" font-size="9" fill="currentColor" opacity=".6">${t}</text>`);
  return `<svg class="cbox" viewBox="0 0 ${W} ${y(4)+20}" width="${W}" role="img" aria-label="${esc2(cname(n))} chord shape">${g}</svg>`;}
/* the lesson's exercises: one button each, ticked when done */
function exTabs(L,P){if(P.ex.length<2)return "";const k=P.ex.filter(exDone).length;
  return `<div class="extabs"><div class="num">Exercise ${P.ex.indexOf(P.ex.find(e=>e.id===L.id))+1} of ${P.ex.length} · ${k} done${lDone(P)?" · lesson complete ✓":""}</div><div class="row" style="flex-wrap:wrap;gap:6px;margin:6px 0 10px">${P.ex.map((e,i)=>`<button type="button" data-open="${e.id}" class="${e.id===L.id?"play":exDone(e)?"good":""}">${exDone(e)?"✓ ":""}${esc2(e.vt||"Exercise "+(i+1))}</button>`).join("")}</div>
    ${P.ex.length>1&&!lDone(P)?`<button type="button" class="linkb" data-lessondone="${P.id}">✓ Mark the whole lesson complete</button>`:""}</div>`;}
const esc2=x=>String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function lessonView(L){
  if(L.task)return taskView(L);

    ${L.tune?`<p class="tip">🎛 <b>Retune first:</b> ${L.tune==="dd"?"low string down to D (D A D G B E)":"D A D G A D, low to high"}. Tune back to standard afterwards.</p>`:""}
    ${howTo(L)}

    ${L.prog&&/maj7|sus|add|[m\d]?[679](?![\d])/.test(L.prog)?`<p class="tip">🧩 <b>The last word matters.</b> In a chord like ${(L.prog.match(/[A-G][#b]?(?:maj7|m7|sus\d|add\d|m?[679])/)||["Fmaj7"])[0]}, the last part of the name (the 7, the 6, the sus) is the note that gives the chord its sound. Find it in the shape, one or two frets from the plain triad, and let it ring clearly in the arpeggio.</p>`:""}
    ${/^6/.test(L.id)?`<p class="tip">🎨 <b>Colour, then theory.</b> Once the pattern flows, lift one fretting finger off the barre so an open string rings through the arpeggio, or let a neighbouring scale note ring on top. The chord underneath is still the same major or minor triad; you've just added colour (an add9 or add11). Keep what sounds good, then name it afterwards by writing down its notes.</p>`:""}
    <div class="row"><label class="ctl">Tempo <input type="range" id="tempo" min="${L.free?20:30}" max="160" step="1" value="${tempoOf(L)}"> <b id="tempoV">${tempoOf(L)}</b> bpm</label>
      <label class="chk"><input type="checkbox" id="click"${st.set.click?" checked":""}> Metronome</label>

    <div class="navf">${prev?`<button type="button" data-open="${prev.id}">◂ ${prev.id}</button>`:"<span></span>"}<button type="button" class="linkb" data-home="1">All levels</button>
      ${exDone(L)?`<button type="button" data-undone="${L.id}">Mark as not done</button>`:`<button type="button" class="good big" data-done="${L.id}">${L.chain?"✓ Clean changes all the way through":L.free?"✓ Every string rings clean":`✓ I can play it at ${L.tempo[1]} bpm`}</button>`}
      ${next?`<button type="button" data-open="${next.id}"${unlockedLv(next.lv)||next.lv===L.lv?"":" disabled"}>${next.id} ▸</button>`:""}</div></section>`;
}
