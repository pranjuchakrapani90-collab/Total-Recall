<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1c1b19">
<title>ETF Shop · Pranju OS</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="icon" href="icon-192.png" sizes="192x192"><link rel="apple-touch-icon" href="apple-touch-icon.png">

</head><body class="tr-inv">
<header><div class="hin">
  <a class="backlink" href="./#f-invest">← Investments</a>
  <div class="ttl"><h1>ETF Shop</h1><span class="pill" id="mkt"><i></i><span>NSE</span></span></div>
</div></header>
<main class="wrap">
  <div class="bar"><span class="st" id="st"></span><button id="qBuy" class="b-buy" type="button">+ Buy</button><button id="qSell" class="b-sell" type="button">− Sell</button><button id="refresh" class="b-ref" type="button" aria-label="Refresh prices" title="Refresh prices">↻</button></div>
  <div id="err" class="err" hidden></div>
  <div id="out"></div>
</main>
<script src="gsync.js?v=20261020"></script>
<script src="invest.js?v=20261022c"></script>
<script>
"use strict";
const I=Invest,{esc,inr,price,pct,signInr,tone,ok,r2,dshort}=I;
const KEY="etf",$=id=>document.getElementById(id);
/* the rules of the old sheet's Orders tab (Order Calc), kept as editable settings */
const DEF={parts:40,reserve:0.2,minFall:-0.10,twoFall:-0.15,avgFall:-0.06,maxLots:4,target:0.075,trail:0.02,buffer:0.005,check:-0.30,dividend:0,universe:[]};
const today=()=>I.ist().iso;
let Q=I.quotesCache(),qAt=Math.max(0,...Object.values(Q).map(q=>q.at||0)),missing=[];

/* ---------- the numbers ---------- */
function model(){
  const s=I.load(KEY),S={...DEF,...(s.settings||{})},U={};(S.universe||[]).forEach(u=>U[u.code]=u);
  const lots=Object.entries(s.lots).map(([id,l])=>({id,...l})),open=lots.filter(l=>!ok(l.sellPrice)),sold=lots.filter(l=>ok(l.sellPrice));
  sold.forEach(l=>{l.p=(l.sellPrice-l.price)*l.qty;l.ch=l.qty*(l.price+l.sellPrice)*0.0012+16;l.tax=(l.p-l.ch)*0.2*1.04;l.net=l.p-l.ch-l.tax;l.g=l.net-l.net*(S.dividend||0);
    l.pp=l.p/(l.price*l.qty)*100;l.days=I.days(l.date,l.sellDate);});
  const cap=Object.entries(s.cap).map(([id,c])=>({id,...c})).sort((a,b)=>a.date<b.date?-1:1);
  const added=cap.filter(c=>c.amount>0).reduce((a,c)=>a+c.amount,0),withdrawn=-cap.filter(c=>c.amount<0).reduce((a,c)=>a+c.amount,0);
  const growth=sold.reduce((a,l)=>a+l.g,0),capital=added-withdrawn+growth,invested=open.reduce((a,l)=>a+l.price*l.qty,0),cash=capital-invested,tranche=Math.round(capital/S.parts);
  const qOf=c=>Q[c]&&ok(Q[c].price)?Q[c]:null;
  /* each open lot: gain and the trailing stop */
  open.forEach(l=>{const q=qOf(l.code);l.close=q?q.price:NaN;l.chg=q?q.chg:NaN;l.gain=l.close/l.price-1;l.value=l.qty*l.close;
    l.tgt=r2(l.price*(1+S.target));
    if(q&&l.gain>=0){l.high=Math.max(l.close,I.highSince(q,l.date));l.armed=l.high>=l.price*(1+S.target);
      if(l.armed){l.stop=r2(l.high*(1-S.trail));l.signal=l.close<=l.stop?"SELL":"TRAILING";}}});
  const sells=open.filter(l=>l.signal==="SELL").sort((a,b)=>b.gain-a.gain).map(l=>({l,qty:l.qty,lim:r2(l.close*(1-S.buffer))}));
  const trailing=open.filter(l=>l.signal==="TRAILING").sort((a,b)=>b.gain-a.gain);
  /* GTT stop-loss: what the broker GTT should be (trigger = trailing stop) against what was placed */
  const gtts=open.filter(l=>(l.armed&&!(l.signal==="SELL"&&!l.gtt))||l.gtt).map(l=>{const g=l.gtt||null,sug=l.armed?{trig:l.stop,lim:r2(l.stop*(1-S.buffer)),qty:l.qty}:null;let st="warn",todo=true,msg;
    if(l.signal==="SELL"&&g){st="bad";msg=`Price ${price(l.close)} is at or below the stop. If your GTT triggered, record the sale.`;}
    else if(!g){msg=`No GTT yet. Place: trigger ${price(sug.trig)} · limit ${price(sug.lim)} · ${sug.qty} units.`;}
    else if(!sug){todo=false;msg=`GTT ${price(g.trig)} is your own stop. The app's trailing stop starts once the high reaches ${price(l.tgt)}.`;}
    else if(g.trig>sug.trig+0.005){st="bad";msg=`GTT ${price(g.trig)} is tighter than the stop ${price(sug.trig)}: a small dip can sell this winner early. Lower it to ${price(sug.trig)}, limit ${price(sug.lim)}.`;}
    else if(g.trig<sug.trig-0.005){msg=`Raise GTT from ${price(g.trig)} to ${price(sug.trig)}, limit ${price(sug.lim)} (new high ${price(l.high)}).`;}
    else if(g.qty!==l.qty){msg=`GTT is for ${g.qty} units; the lot has ${l.qty}.`;}
    else {st="ok";todo=false;msg=`GTT matches the stop · set ${dshort(g.date)}.`;}
    return {l,g,sug,st,msg,todo};}).sort((a,b)=>(b.todo-a.todo)||(b.l.gain-a.l.gain));
  /* each ETF held */
  const by={};open.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.t||0)-(b.t||0)).forEach(l=>{(by[l.code]=by[l.code]||[]).push(l);});
  const groupOf=c=>U[c]?U[c].group:"Not in universe",held=Object.entries(by).map(([code,L])=>{const q=qOf(code),last=L[L.length-1];
    const close=q?q.price:NaN,h52=q?I.high52(q):NaN;
    return {code,L,last,close,chg:q?q.chg:NaN,fallLast:close/last.price-1,fall52:close/h52-1,group:groupOf(code),mode:U[code]?U[code].mode:"hold",
      inv:L.reduce((a,l)=>a+l.price*l.qty,0),val:L.reduce((a,l)=>a+l.qty*close,0)};});
  const groupLots={};held.forEach(h=>groupLots[h.group]=(groupLots[h.group]||0)+h.L.length);
  const checks=[];
  held.forEach(h=>{h.status=!ok(h.close)?"":h.mode!=="buy"?"Exit only":!(h.fallLast<=S.avgFall)?"":groupLots[h.group]>=S.maxLots?"Max lots":!(h.chg>0)?"Wait for green":h.fall52<=S.check?"Check price":"AVERAGE";
    if(h.status==="Check price")checks.push(h);});
  let avg=null,avgMsg="";
  const avgC=held.filter(h=>h.status==="AVERAGE").sort((a,b)=>a.fallLast-b.fallLast);
  if(cash<tranche)avgMsg="Cash is below one tranche";
  else if(avgC[0]){const h=avgC[0],lim=r2(h.close*(1+S.buffer));avg={h,lim,qty:Math.round(tranche/lim)};}
  /* new-buy candidates from the universe */
  const heldGroups=new Set(held.map(h=>h.group));
  const cands=(S.universe||[]).map(u=>{const q=qOf(u.code);if(!q)return null;const h52=I.high52(q),fall=q.price/h52-1;
    const st=u.mode!=="buy"?"":heldGroups.has(u.group)?"Group held":!(fall<=S.minFall)?"":!(q.chg>0)?"Wait for green":fall<=S.check?"Check price":"BUY";
    return {...u,close:q.price,chg:q.chg,fall,h52,status:st};}).filter(Boolean);
  cands.filter(c=>c.status==="Check price").forEach(c=>checks.push(c));
  const buyC=cands.filter(c=>c.status==="BUY").sort((a,b)=>a.fall-b.fall),free=Math.max(0,cash-S.reserve*capital);
  const n=!buyC.length||free<tranche?0:(buyC[0].fall<=S.twoFall&&free>=2*tranche?2:1);
  const buys=[];buyC.forEach(c=>{if(buys.length<n&&!buys.some(b=>b.c.group===c.group)){const lim=r2(c.close*(1+S.buffer));buys.push({c,lim,qty:Math.round(tranche/lim)});}});
  const buyMsg=!buyC.length?"no ETF qualifies":free<tranche?"cash would dip into the "+Math.round(S.reserve*100)+"% reserve":"";
  return {s,S,U,open,sold,cap,added,withdrawn,growth,capital,invested,cash,tranche,free,sells,trailing,gtts,held,avg,avgMsg,buys,buyMsg,checks,cands};}

/* ---------- entry forms ---------- */
const codes=()=>{const s=I.load(KEY);return [...new Set([...((s.settings&&s.settings.universe)||[]).map(u=>u.code),...Object.values(s.lots).map(l=>l.code)])].sort();};
const sym=x=>String(x||"").trim().toUpperCase().replace(/^NSE:/,"");
/* the stored record of a lot, without its edit time, so edits keep fields like the GTT */
const lotRec=id=>{const r=I.load(KEY).lots[id];if(!r)return null;const {t,...x}=r;return x;};
const later=f=>setTimeout(f,0);
const REASONS=[["system","Rule exit (tonight's order or GTT)"],["cash","Discretionary · needed the cash"],["view","Discretionary · changed my view"],["other","Discretionary · other"]];
const isDisc=l=>!!l.reason&&l.reason!=="system";
function buyForm(pre){pre=pre||{};
  I.form({title:pre.id?"Edit lot":pre.code?"Bought "+pre.code:"Add a buy",note:pre.id?"":pre.disc?"A buy at your discretion, outside tonight's orders. Record it once the order fills.":"Record it once the order fills.",
    fields:[{k:"code",label:"ETF (NSE symbol)",value:pre.code||"",list:codes()},{k:"date",label:"Buy date",type:"date",value:pre.date||today()},
      {k:"price",label:"Buy price",type:"number",value:pre.price},{k:"qty",label:"Quantity",type:"number",step:"1",value:pre.qty},
      {k:"why",label:"Why",type:"select",value:pre.dbuy||pre.disc?"disc":"system",options:[["system","Tonight's order (rule)"],["disc","Discretionary"]]}],
    onSubmit:v=>{const c=sym(v.code);if(!c)return "Enter the symbol.";if(!(v.price>0)||!(v.qty>0))return "Price and quantity must be above zero.";
      const r={...(pre.id?lotRec(pre.id)||{}:{}),code:c,date:v.date,price:v.price,qty:Math.round(v.qty)};if(v.why==="disc")r.dbuy=true;else delete r.dbuy;
      I.upsert(KEY,"lots",pre.id,r);draw();},
    onDelete:pre.id?()=>{I.remove(KEY,"lots",pre.id);draw();}:null,delConfirm:"Delete this lot? Use this only for a wrong entry, not a sale.",
    extra:pre.id?[{label:"Sell",run:()=>{later(()=>sellForm(pre.code,pre.id,{reason:"view"}));}},{label:"GTT",run:()=>{later(()=>gttForm(pre.id));}}]:null});}
/* step 1 of a discretionary sell: which ETF */
function pickSell(){const M=model();
  const H=M.held.slice().sort((a,b)=>a.code<b.code?-1:1);if(!H.length){alert("Nothing to sell.");return;}
  I.form({title:"Sell",note:"A sale at your discretion, outside tonight's orders. Pick the ETF, then the lot.",ok:"Next",
    fields:[{k:"code",label:"ETF",type:"select",value:H[0].code,options:H.map(h=>[h.code,`${h.code} · ${h.L.length} lot${h.L.length>1?"s":""}${ok(h.last.gain)?" · newest "+pct(h.last.gain*100,1):""}`])}],
    onSubmit:v=>{later(()=>sellForm(v.code,null,{reason:"view"}));}});}
/* record a sale: any lot of the ETF (newest first, LIFO default), whole or part */
function sellForm(code,lotId,pre){pre=pre||{};const M=model(),S=M.S;
  const L=M.open.filter(l=>l.code===code).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.t||0)-(a.t||0));if(!L.length)return;
  const first=L.find(l=>l.id===lotId)||L[0];
  I.form({title:"Sell "+code,note:`Newest lot sells first (LIFO) unless you pick another. ${ok(first.close)?"Price now "+price(first.close)+".":""}`,ok:"Record sale",
    fields:[{k:"lot",label:"Lot",type:"select",value:first.id,options:L.map((l,i)=>[l.id,`${i?"":"newest · "}${dshort(l.date)} · ${l.qty} @ ${price(l.price)}${ok(l.gain)?" · "+pct(l.gain*100,1):""}`])},
      {k:"units",label:"Units",type:"number",step:"1",req:false,value:pre.units||"",hint:"Blank sells the whole lot. Fewer units splits the lot and keeps the rest."},
      {k:"price",label:"Sell price",type:"number",value:ok(pre.price)?pre.price:ok(first.close)?first.close:""},
      {k:"date",label:"Sell date",type:"date",value:pre.date||today()},
      {k:"reason",label:"Reason",type:"select",value:pre.reason||"view",options:REASONS}],
    onSubmit:v=>{const l=L.find(x=>x.id===v.lot);if(!l)return "Pick a lot.";
      const u=ok(v.units)?Math.round(v.units):l.qty;if(!(u>0)||u>l.qty)return `This lot has ${l.qty} units.`;if(!(v.price>0))return "Enter the sell price.";
      if(v.reason!=="system"&&l.signal!=="SELL"){const g=v.price/l.price-1;
        const msg=g<0?`At ${price(v.price)} this lot is ${pct(g*100,1)}: you'd book a loss. The system never sells below cost.`
          :!l.armed?`At ${price(v.price)} this lot is ${pct(g*100,1)}, below the ${pct(S.target*100)} the system waits for before trailing.`
          :`Its trailing stop is still running (sell if ≤ ${price(l.stop)}). The system would keep holding.`;
        if(!confirm(msg+"\n\nSell anyway?"))return "Not sold. The lot is unchanged.";}
      const base=lotRec(l.id),sold={...base,qty:u,sellPrice:v.price,sellDate:v.date,reason:v.reason};delete sold.gtt;
      if(u===l.qty)I.upsert(KEY,"lots",l.id,sold);
      else{I.upsert(KEY,"lots",l.id,{...base,qty:l.qty-u});sold.split=l.id;I.upsert(KEY,"lots",null,sold);}
      draw();}});}
function soldForm(l){
  I.form({title:"Sold "+l.code,fields:[{k:"code",label:"ETF",value:l.code},{k:"date",label:"Buy date",type:"date",value:l.date},{k:"price",label:"Buy price",type:"number",value:l.price},
      {k:"qty",label:"Quantity",type:"number",step:"1",value:l.qty},{k:"sellDate",label:"Sell date",type:"date",value:l.sellDate},{k:"sellPrice",label:"Sell price",type:"number",value:l.sellPrice},
      {k:"reason",label:"Reason",type:"select",value:l.reason||"system",options:REASONS}],
    onSubmit:v=>{I.upsert(KEY,"lots",l.id,{...lotRec(l.id),code:sym(v.code),date:v.date,price:v.price,qty:Math.round(v.qty),sellPrice:v.sellPrice,sellDate:v.sellDate,reason:v.reason});draw();},
    onDelete:()=>{I.remove(KEY,"lots",l.id);draw();},delConfirm:"Delete this sale completely?",
    extra:[{label:"Undo sale",run:()=>{const r=lotRec(l.id);delete r.sellPrice;delete r.sellDate;delete r.reason;delete r.split;I.upsert(KEY,"lots",l.id,r);draw();}}]});}
/* the GTT stop-loss placed in the broker app for a lot */
function gttForm(id){const M=model(),l=M.open.find(x=>x.id===id);if(!l)return;const g=l.gtt,sug=l.armed?{trig:l.stop,lim:r2(l.stop*(1-M.S.buffer)),qty:l.qty}:null;
  I.form({title:"GTT · "+l.code,note:sug?`App's stop now: trigger ${price(sug.trig)} · limit ${price(sug.lim)} · ${sug.qty} units. Raise it whenever the app shows a higher stop; never lower it.`
      :`This lot hasn't reached its ${price(l.tgt)} trail start yet, so the app has no stop for it. A GTT here is your own stop.`,
    fields:[{k:"trig",label:"Trigger price",type:"number",value:g?g.trig:sug?sug.trig:""},{k:"lim",label:"Limit price",type:"number",value:g?g.lim:sug?sug.lim:""},
      {k:"qty",label:"Units",type:"number",step:"1",value:g?g.qty:l.qty},{k:"date",label:"Set on",type:"date",value:today()}],
    onSubmit:v=>{if(!(v.trig>0)||!(v.lim>0)||!(v.qty>0))return "Fill in trigger, limit and units.";if(v.lim>v.trig)return "For a stop-loss sell, keep the limit at or below the trigger.";if(v.qty>l.qty)return `The lot has ${l.qty} units.`;
      I.upsert(KEY,"lots",id,{...lotRec(id),gtt:{trig:v.trig,lim:v.lim,qty:Math.round(v.qty),date:v.date}});draw();},
    onDelete:g?()=>{const r=lotRec(id);delete r.gtt;I.upsert(KEY,"lots",id,r);draw();}:null,delLabel:"Remove",delConfirm:"Remove this GTT from the app? Cancel it in your broker app too.",
    extra:g?[{label:"It triggered",run:()=>{later(()=>sellForm(l.code,id,{price:g.lim,units:g.qty<l.qty?g.qty:"",reason:"system"}));}}]:null});}
function moneyForm(c){c=c||{};
  I.form({title:c.id?"Edit money entry":"Money in / out",fields:[{k:"kind",label:"Type",type:"select",value:c.amount<0?"out":"in",options:[["in","Added to the shop"],["out","Withdrawn"]]},
      {k:"date",label:"Date",type:"date",value:c.date||today()},{k:"amount",label:"Amount (₹)",type:"number",value:c.amount?Math.abs(c.amount):""}],
    onSubmit:v=>{if(!(v.amount>0))return "Enter an amount.";I.upsert(KEY,"cap",c.id,{date:v.date,amount:v.kind==="out"?-v.amount:v.amount});draw();},
    onDelete:c.id?()=>{I.remove(KEY,"cap",c.id);draw();}:null});}
function settingsForm(S){const P=x=>r2(x*100);
  I.form({title:"Rules",note:"Percentages as numbers, e.g. 7.5 for 7.5%.",fields:[
    {k:"parts",label:"Parts of capital (tranches)",type:"number",step:"1",value:S.parts},
    {k:"target",label:"Profit that starts the trailing stop %",type:"number",value:P(S.target)},
    {k:"trail",label:"Trailing stop below highest close %",type:"number",value:P(S.trail)},
    {k:"avgFall",label:"Average when fallen from last buy %",type:"number",value:P(S.avgFall)},
    {k:"minFall",label:"New buy: minimum fall from 52W high %",type:"number",value:P(S.minFall)},
    {k:"twoFall",label:"Buy 2 ETFs when top pick has fallen %",type:"number",value:P(S.twoFall)},
    {k:"reserve",label:"Cash reserve kept for averaging %",type:"number",value:P(S.reserve)},
    {k:"maxLots",label:"Maximum lots per index group",type:"number",step:"1",value:S.maxLots},
    {k:"buffer",label:"Limit price buffer from close %",type:"number",value:P(S.buffer)},
    {k:"check",label:"Check price when fall from 52W high is deeper than %",type:"number",value:P(S.check)},
    {k:"dividend",label:"Share of each net profit paid to yourself %",type:"number",value:P(S.dividend||0)}],
    onSubmit:v=>{const o={};for(const k in v){if(!ok(v[k]))return "Fill in every value.";o[k]=["parts","maxLots"].includes(k)?Math.round(v[k]):v[k]/100;}I.setSettings(KEY,o);draw();}});}
function uniForm(u){u=u||{};const S={...DEF,...(I.load(KEY).settings||{})};
  I.form({title:u.code?"Edit "+u.code:"Add an ETF",fields:[{k:"code",label:"NSE symbol",value:u.code||""},{k:"group",label:"Index group",value:u.group||"",list:[...new Set(S.universe.map(x=>x.group))]},
      {k:"mode",label:"Buying",type:"select",value:u.mode||"buy",options:[["buy","Buy and average"],["hold","Hold only (duplicate index)"]]}],
    onSubmit:v=>{const c=sym(v.code);if(!c||!v.group)return "Symbol and group are needed.";const L=S.universe.filter(x=>x.code!==u.code&&x.code!==c);L.push({code:c,group:v.group,mode:v.mode});I.setSettings(KEY,{universe:L});draw();},
    onDelete:u.code?()=>{I.setSettings(KEY,{universe:S.universe.filter(x=>x.code!==u.code)});draw();}:null,delLabel:"Remove"});}

/* ---------- drawing ---------- */
const TABS=[["hold","Holdings"],["watch","Watchlist"],["booked","Booked"]];
let tab=I.rememberTab(KEY,"hold");
function tonight(M){
  const t=I.ist(),gt=M.gtts.filter(x=>x.todo),tot=M.sells.length+(M.avg?1:0)+M.buys.length;
  const when=t.weekend?"Weekend · AMO for Monday":t.open?"Market open · live":t.afterClose?`${t.wd} evening · AMO limit orders`:`${t.wd} morning · before the open`;
  const big=tot?`${tot} order${tot>1?"s":""}${t.open?" right now":t.weekend?" for Monday":" tonight"}`:t.open?"No signals right now":"Nothing to place tonight";
  const fill=(k,c,q,p)=>["Filled",`data-fill="${k}" data-c="${esc(c)}" data-q="${q}" data-p="${p}"`];
  const rows=[
    ...M.sells.map(o=>I.todo("sell","Sell",esc(o.l.code),`${o.qty} × ${price(o.lim)}`,`bought ${price(o.l.price)} · ${pct(o.l.gain*100,1)} · stop ${price(o.l.stop)}`,inr(o.qty*o.lim),fill("sell",o.l.id,o.qty,o.lim))),
    ...(M.avg?[M.avg]:[]).map(o=>I.todo("avg","Average",esc(o.h.code),`${o.qty} × ${price(o.lim)}`,`${pct(o.h.fallLast*100)} from last buy · ${o.h.L.length} lot${o.h.L.length>1?"s":""}`,inr(o.qty*o.lim),fill("avg",o.h.code,o.qty,o.lim))),
    ...M.buys.map(o=>I.todo("buy","Buy",esc(o.c.code),`${o.qty} × ${price(o.lim)}`,`${pct(o.c.fall*100)} from 52W high · ${esc(o.c.group)}`,inr(o.qty*o.lim),fill("buy",o.c.code,o.qty,o.lim))),
    ...gt.map(x=>{const l=x.l,s=x.sug;return I.todo("gt "+x.st,"GTT",esc(l.code),s?price(s.trig):"",esc(!x.g&&s?"not placed yet":x.msg),s?`limit ${price(s.lim)} · ${s.qty}`:"",[x.g?"Update":"Placed",`data-gtt="${esc(l.id)}"`]);})];
  const why=[];if(!M.sells.length&&!M.avg&&!M.buys.length){if(M.buyMsg)why.push("No new buy: "+M.buyMsg);else if(M.avgMsg)why.push(M.avgMsg);}
  if(M.checks.length)why.push(`Check price first: ${M.checks.map(c=>esc(c.code)+" "+pct((ok(c.fall52)?c.fall52:c.fall)*100)).join(", ")} looks too deep`);
  if(t.open&&tot)why.push("Final after the 3:30 PM close.");
  return `<section class="card hero"><div class="when">${esc(when)}</div><div class="big">${esc(big)}</div>
    ${rows.join("")||`<div class="nothing">No sell, average or buy signal.</div>`}
    ${why.length?`<p class="foot">${why.map(esc).join("<br>")}</p>`:""}</section>`;}
function summary(M){
  const val=M.open.reduce((a,l)=>a+(ok(l.value)?l.value:l.price*l.qty),0),pl=val-M.invested,dep=M.invested/M.capital*100;
  return I.sum([["Value",inr(val),"",`${M.open.length} lots · ${M.held.length} ETFs`],["P / L",signInr(pl),tone(pl),pct(pl/M.invested*100,1)],["Cash",inr(M.cash),"",ok(dep)?dep.toFixed(0)+"% invested":""]]);}
function holdings(M){
  const G=M.held.slice().sort((a,b)=>(b.last.gain||-9)-(a.last.gain||-9));
  if(!G.length)return `<p class="nothing">No open lots.</p>`;
  return G.map(x=>{const g=x.last.gain*100,pl=x.val-x.inv,gtt=x.L.some(l=>l.gtt);
     return `<details class="hold"><summary><span><b>${esc(x.code)}</b> <span class="tag">${x.L.length}</span>${gtt?` <span class="tag ok">GTT</span>`:""}${x.mode!=="buy"?` <span class="tag">hold</span>`:""}
       <div class="sub muted">newest <span class="${tone(g)}">${pct(g,1)}</span> · day <span class="${tone(x.chg)}">${pct(x.chg,1)}</span></div></span>
       <span class="r mono"><span class="${tone(pl)}">${ok(pl)?signInr(pl):"—"}</span><div class="sub">${inr(x.val)}</div></span></summary>
       <table class="lots"><tr><th>Bought</th><th>Price</th><th>Qty</th><th>Gain</th></tr>
       ${x.L.map(l=>`<tr class="tap" data-lot="${esc(l.id)}"><td>${esc(dshort(l.date))}</td><td>${price(l.price)}</td><td>${l.qty}</td><td class="${tone(l.gain)}">${pct(l.gain*100,1)}${l.gtt?` · GTT ${price(l.gtt.trig)}`:""}</td></tr>`).join("")}
       <tr><td>Now</td><td>${price(x.close)}</td><td></td><td class="${tone(pl)}">${pct(pl/x.inv*100,1)}</td></tr></table>
       <p class="small muted" style="margin:-4px 0 10px">Trailing starts at ${price(x.last.tgt)} · ${pct(x.fall52*100,1)} from 52W high · tap a lot to edit or sell.</p></details>`;}).join("");}
let showAll=false;
function watch(M){
  const L=M.cands.filter(c=>ok(c.fall)).sort((a,b)=>a.fall-b.fall),show=showAll?L:L.slice(0,10);
  if(!L.length)return `<p class="nothing">Waiting for live prices.</p>`;
  return `<p class="line">Fall from the 52-week-high close · buy zone below <b>${pct(M.S.minFall*100)}</b></p>
   <div class="rows">${show.map(c=>{const zone=c.fall<=M.S.minFall;
     return `<div class="row"><span><b>${esc(c.code)}</b> ${c.status==="BUY"?`<span class="tag ok">buy</span>`:c.mode!=="buy"?`<span class="tag">hold</span>`:zone&&c.status==="Group held"?`<span class="tag">group held</span>`:""}
       <div class="sub">${esc(c.group)}</div></span>
       <span class="r"><span class="${zone?"dn":""}">${pct(c.fall*100,1)}</span><div class="sub">${price(c.close)} · <span class="${tone(c.chg)}">${pct(c.chg,1)}</span></div></span></div>`;}).join("")}</div>
   ${L.length>10?`<button class="more" type="button" id="wAll">${showAll?"Show fewer":"Show all "+L.length}</button>`:""}`;}
let soldAll=false;
function booked(M){
  if(!M.sold.length)return `<p class="nothing">Nothing sold yet.</p>`;
  const mm={};M.sold.forEach(l=>{const k=l.sellDate.slice(0,7);mm[k]=(mm[k]||0)+l.p;});
  const months=Object.keys(mm).sort().map(k=>({m:k,p:mm[k]})),mx=Math.max(...months.map(m=>Math.abs(m.p)),1);
  const S=M.sold.slice().sort((a,b)=>a.sellDate<b.sellDate?1:-1),show=soldAll?S:S.slice(0,6);
  const gross=M.sold.reduce((a,l)=>a+l.p,0),ch=M.sold.reduce((a,l)=>a+l.ch,0),tax=M.sold.reduce((a,l)=>a+l.tax,0);
  const flows=M.cap.map(c=>[c.date,-c.amount]);flows.push([I.ist().iso,M.added-M.withdrawn+M.growth]);const xr=I.xirr(flows);
  const disc=M.sold.filter(isDisc);
  return `<p class="line">Gross <b class="up">${inr(gross)}</b> · net <b>${inr(M.growth)}</b> · <b>${pct(xr)}</b> a year</p>
   <div class="bars">${months.map(m=>`<div title="${m.m}: ${inr(m.p)}"><i class="${m.p<0?"neg":""}" style="height:${(Math.abs(m.p)/mx*80).toFixed(0)}%"></i><span>${new Date(m.m+"-01T00:00:00").toLocaleDateString("en-IN",{month:"short"})}</span></div>`).join("")}</div>
   <div class="rows" style="margin-top:6px">${show.map(l=>`<button class="rowbtn" type="button" data-sold="${esc(l.id)}"><span><b>${esc(l.code)}</b>${isDisc(l)?` <span class="tag">own call</span>`:""}<div class="sub">${esc(dshort(l.sellDate))} · ${l.days} d · ${l.qty} × ${price(l.sellPrice)}</div></span><span class="r"><span class="${tone(l.p)}">${signInr(l.p)}</span><div class="sub">${pct(l.pp,1)}</div></span></button>`).join("")}</div>
   ${S.length>6?`<button class="more" type="button" id="sAll">${soldAll?"Show fewer":"Show all "+S.length}</button>`:""}
   <p class="small muted" style="margin-top:8px">Charges ${inr(ch)} · tax ${inr(tax)}${disc.length?` · own-call sells ${disc.length}, net ${signInr(disc.reduce((a,l)=>a+l.net,0))}`:""}</p>`;}
function details(M){return `<section class="card">${I.tabs(TABS,tab)}<div class="panel">${tab==="watch"?watch(M):tab==="booked"?booked(M):holdings(M)}</div></section>`;}
function setup(M){const S=M.S;
  return `<details class="card sec more"><summary>More · money, rules, data</summary>
   <p class="small"><b>Money in / out</b> <button class="more" type="button" id="aMoney">+ add</button></p><div class="rows">${M.cap.map(c=>`<button class="rowbtn" type="button" data-cap="${esc(c.id)}"><span>${esc(dshort(c.date))}</span><span class="r ${c.amount<0?"dn":""}">${signInr(c.amount)}</span></button>`).join("")||`<p class="small muted">None yet.</p>`}</div>
   <p class="small muted" style="margin-top:6px">Capital ${inr(M.capital)} · tranche ${inr(M.tranche)} · booked growth ${inr(M.growth)}</p>
   <p class="small" style="margin-top:14px"><b>Rules</b> <button class="more" type="button" id="eRules">edit</button></p>
   <ol class="rules">
    <li>Check once a day after 4 PM on closing prices; place AMO limit orders.</li>
    <li>Capital split into ${S.parts} parts: one buy or one averaging = one tranche (${inr(M.tranche)}); profits compound into it.</li>
    <li>Sell: once a lot's highest close since buying is ${pct(S.target*100)} above cost, trail ${pct(S.trail*100)} below that high; sell the whole lot when the close reaches the stop. LIFO, no daily limit.</li>
    <li>Average: at most one a day, the ETF most fallen ≥ ${pct(-S.avgFall*100)} below its last buy and closing green; not above ${S.maxLots} lots per index group, not for hold-only ETFs, not with cash below a tranche.</li>
    <li>New buy: ≥ ${pct(-S.minFall*100)} below the 52-week-high close, closing green, index group not held. Two buys when the top pick is ≥ ${pct(-S.twoFall*100)} down and cash allows. Keep ${pct(S.reserve*100)} of capital as reserve.</li>
    <li>GTT: while a lot's stop is on, keep a GTT sell in the broker app at trigger = the stop, limit ${pct(S.buffer*100)} below, for the lot's units. Raise it when the stop rises; never lower it.</li>
    <li>Discretionary buys and sells are allowed but tagged, so booked profit shows how they compare with rule exits.</li>
    <li>Limit prices ${pct(S.buffer*100)} from the close. Falls deeper than ${pct(-S.check*100)} are flagged for a price check.</li>
   </ol>
   <p class="small" style="margin-top:14px"><b>Universe</b> · ${S.universe.length} ETFs <button class="more" type="button" id="aUni">+ add</button></p>
   <div class="uni rows">${S.universe.map(u=>`<button class="rowbtn" type="button" data-uni="${esc(u.code)}"><span><b>${esc(u.code)}</b><div class="sub">${esc(u.group)}</div></span><span class="r"><span class="tag ${u.mode==="buy"?"ok":""}">${u.mode==="buy"?"buy":"hold only"}</span></span></button>`).join("")}</div>
   ${dataBox()}
  </details>`;}
function dataBox(){return `<p class="small" style="margin-top:14px"><b>Data</b></p>
   <p class="small muted" id="syncMsg">${I.hasSync()?"Records sync between your phones (encrypted).":"Sync is off: records stay on this phone. Turn on Sync from the home screen."}</p>
   <div class="acts"><button type="button" class="ghost" id="dImp">Import file</button><button type="button" class="ghost" id="dExp">Download backup</button>${I.hasSync()?`<button type="button" class="ghost" id="dSync">Sync now</button>`:""}</div>`;}
function empty(){return `<section class="card empty"><b>No records yet</b><p class="small muted">Import your investments file once (it holds everything copied from the old sheets), or start adding buys.</p>
   <div class="acts"><button type="button" id="dImp">Import file</button><button type="button" class="ghost" id="aBuy">+ Buy</button><button type="button" class="ghost" id="aMoney">Money in</button></div></section>`;}

function draw(){
  const M=model(),has=M.open.length||M.sold.length||M.cap.length;
  $("out").innerHTML=has?tonight(M)+I.fundBar([...M.buys,...(M.avg?[M.avg]:[])].reduce((a,b)=>a+b.qty*b.lim,0)||NaN)+summary(M)+details(M)+setup(M):empty();
  const on=(id,f)=>{const e=$(id);if(e)e.onclick=f;};
  on("kFund",()=>I.fundForm(draw));
  on("aBuy",()=>buyForm());on("qBuy",()=>buyForm({disc:true}));on("qSell",pickSell);on("aMoney",()=>moneyForm());on("eRules",()=>settingsForm(M.S));on("aUni",()=>uniForm());
  on("wAll",()=>{showAll=!showAll;draw();});on("sAll",()=>{soldAll=!soldAll;draw();});
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;I.saveTab(KEY,tab);draw();});
  on("dImp",()=>I.pickImport((e,done)=>{if(e){showErr(e.message);return;}showErr("");$("st").textContent="Imported "+done.join(" and ").toUpperCase()+" records.";draw();refresh();}));
  on("dExp",()=>I.exportData());on("dSync",()=>syncNow(true));
  document.querySelectorAll("[data-fill]").forEach(b=>b.onclick=()=>{const k=b.dataset.fill,p=+b.dataset.p,q=+b.dataset.q;
    if(k==="sell"){const l=I.load(KEY).lots[b.dataset.c];if(l)sellForm(l.code,b.dataset.c,{price:p,reason:"system"});}else buyForm({code:b.dataset.c,price:p,qty:q});});
  document.querySelectorAll("[data-gtt]").forEach(b=>b.onclick=()=>gttForm(b.dataset.gtt));
  document.querySelectorAll("[data-lot]").forEach(r=>r.onclick=()=>{const l=I.load(KEY).lots[r.dataset.lot];if(l)buyForm({id:r.dataset.lot,...l});});
  document.querySelectorAll("[data-sold]").forEach(r=>r.onclick=()=>{const l=I.load(KEY).lots[r.dataset.sold];if(l)soldForm({id:r.dataset.sold,...l});});
  document.querySelectorAll("[data-cap]").forEach(r=>r.onclick=()=>{const c=I.load(KEY).cap[r.dataset.cap];if(c)moneyForm({id:r.dataset.cap,...c});});
  document.querySelectorAll("[data-uni]").forEach(r=>r.onclick=()=>{const u=M.S.universe.find(x=>x.code===r.dataset.uni);if(u)uniForm(u);});
  status();}

function status(){const t=I.ist();$("mkt").className="pill"+(t.open?" open":"");$("mkt").querySelector("span").textContent=t.open?"NSE open · live":"NSE closed";
  $("st").textContent=qAt?"Prices "+I.ago(qAt)+(missing.length?" · no price for "+missing.join(", "):""):"";}
function showErr(m){$("err").hidden=!m;$("err").textContent=m||"";}
async function syncNow(loud){try{const r=await I.sync(KEY);let o=null;try{o=await I.sync("pkp");}catch(e){}/* the other page's records feed the shared Kite fund */
  if(r.ok&&(r.changed||o&&o.changed))draw();if(loud)$("st").textContent=r.ok?"Synced.":r.msg;}catch(e){if(loud)showErr("Sync failed: "+e.message);}}
async function refresh(){
  const M=model(),syms=[...new Set([...M.S.universe.map(u=>u.code),...M.open.map(l=>l.code),I.LIQ])];
  $("refresh").disabled=true;$("st").textContent="Getting live prices…";
  try{const r=await I.quotes(syms);Q=r.quotes;missing=r.missing;qAt=Date.now();showErr("");draw();}
  catch(e){showErr("Live prices: "+e.message+(qAt?" Showing prices from "+I.ago(qAt)+".":""));status();}
  finally{$("refresh").disabled=false;}}
$("refresh").onclick=refresh;
draw();
(async()=>{await syncNow(false);refresh();})();
setInterval(()=>{if(document.visibilityState==="visible"&&I.ist().open)refresh();},60000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&Date.now()-qAt>60000)refresh();});
</script>
</body></html>
