<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1c1b19">
<title>Money Book · Pranju OS</title>
<!-- its own manifest, so "Add to home screen" from here puts a Money Log icon on the phone that opens straight into a new entry -->
<link rel="manifest" href="money.webmanifest"><link rel="icon" href="money-192.png" sizes="192x192"><link rel="apple-touch-icon" href="money-192.png">
<meta name="apple-mobile-web-app-title" content="Money Log">
<link rel="stylesheet" href="invest.css?v=20261024b">
<link rel="stylesheet" href="tr-theme.css?v=20261020">
<style>
.hero .tot{font:750 30px/1.15 var(--mono);margin:6px 0 10px}
.acc2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acc2 button{all:unset;cursor:pointer;background:var(--soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.acc2 button span{font:600 11px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.acc2 button b{font:700 19px/1.25 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc2 button small{font-size:11.5px;color:var(--muted)}
.acc2 button.unset b{color:var(--muted);font:600 14px/1.4 var(--body)}
.today{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.today div{min-width:0}
.today span{display:block;font:600 11px/1.3 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.today b{display:block;font:700 18px/1.3 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.today small{display:block;font-size:11.5px;color:var(--muted)}
.review{border-left:4px solid var(--warn);background:var(--warn-soft)}
.review h2{color:var(--warn)}
.day{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 2px;font:700 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.day:first-child{margin-top:0}
.day b{font:650 13px var(--mono);letter-spacing:0;text-transform:none;color:var(--ink)}
.ent{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:8px 0;border-top:1px solid var(--soft)}
.day+.ent{border-top:0}
.ent .n{font-weight:620;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ent .s{font-size:12px;color:var(--muted)}
.ent .a{font:650 14.5px var(--mono);text-align:right;align-self:center;white-space:nowrap}
.ent .a.in{color:var(--up)}.ent .a.mv{color:var(--muted);font-weight:500}
.ent .a.inv{color:#4a6fa5}
.more{display:block;margin:10px auto 0;background:var(--soft);color:var(--ink)}
.cats{display:flex;flex-direction:column;gap:7px}
.cat{display:grid;grid-template-columns:100px 1fr auto;gap:10px;align-items:center;font-size:13px}
.cat i{display:block;height:8px;border-radius:4px;background:var(--acc)}
.cat b{font:600 13px var(--mono)}
/* entry sheet */
.seg{display:flex;gap:4px;background:var(--soft);border-radius:12px;padding:4px}
.seg button{flex:1;background:none;color:var(--muted);padding:9px 4px;font-size:13.5px;border-radius:9px;white-space:nowrap}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px #1c1b1922}
.seg.k button.on[data-v="out"]{color:var(--dn)}.seg.k button.on[data-v="in"]{color:var(--up)}
.amt{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:14px;padding:4px 12px;background:#fff}
.amt span{font:700 26px var(--mono);color:var(--muted)}
.amt input{all:unset;flex:1;min-width:0;font:750 30px/1.3 var(--mono);padding:6px 0;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:7px 11px;font:600 13px var(--body);border-radius:999px;background:var(--soft);color:var(--ink)}
.chips button.on{background:var(--acc);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lbl{font:600 12px var(--body);color:var(--muted);margin-bottom:-4px}
.raw{font:12px/1.4 var(--mono);color:var(--muted);background:var(--soft);border-radius:10px;padding:8px 10px;word-break:break-word}
.big{font:750 28px/1.2 var(--mono)}.big.out{color:var(--dn)}.big.in{color:var(--up)}
.tag{display:inline-block;font:700 10.5px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:6px;background:var(--acc-soft);color:var(--acc);vertical-align:3px;margin-left:6px}
.twin{background:var(--acc-soft);color:var(--acc);border-radius:10px;padding:8px 10px;font-size:13px;margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:90;box-shadow:0 8px 24px #0004;max-width:calc(100% - 32px)}
.bars{overflow:visible}.bars div{flex:1 1 0;min-width:0}.bars span{height:12px;line-height:12px}
.rbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.rbtns .ok{grid-column:1/-1;padding:13px}
.install{display:flex;gap:10px;align-items:center}
.install img{width:44px;height:44px;border-radius:11px;flex:0 0 auto}
.install p{margin:0;flex:1;font-size:13px}
</style>
</head><body class="tr-inv">
<header><div class="hin">
  <a class="backlink" href="./#f-invest">← Investments</a>
  <div class="ttl"><h1>Money Book</h1></div>
</div></header>
<main class="wrap">
  <div class="bar"><span class="st" id="st"></span><button id="qAdd" class="b-buy" type="button">+ Log</button><button id="qYono" class="ghost" type="button">YONO file</button><button id="sync" class="b-ref" type="button" aria-label="Sync" title="Sync">↻</button></div>
  <div id="err" class="err" hidden></div>
  <div id="out"></div>
</main>
<script src="gsync.js?v=20261020"></script>
<script src="invest.js?v=20261025"></script>
<script src="money.js?v=20261025"></script>
<script>
"use strict";
const I=Invest,M=Money,{esc,inr,ok,r2}=I,KEY=M.KEY,$=id=>document.getElementById(id);
const KINDS=[["out","Spent"],["in","Received"],["atm","ATM ↓"],["dep","Deposit ↑"]];
let showDays=10,deferredInstall=null;
const kindOf=x=>x.kind==="move"?(x.to==="wallet"?"atm":"dep"):x.kind;
const fromKind=(k,acct)=>k==="atm"?{kind:"move",acct:"bank",to:"wallet"}:k==="dep"?{kind:"move",acct:"wallet",to:"bank"}:{kind:k,acct,to:undefined};
const dayName=iso=>{const t=M.now().date,y=new Date(new Date(t+"T00:00:00")-864e5),yi=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
  const d=new Date(iso+"T00:00:00"),s=d.toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"});return iso===t?"Today · "+s:iso===yi?"Yesterday · "+s:s;};
function toast(m){const o=document.querySelector(".toast");if(o)o.remove();const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}
function lastAcct(){try{return localStorage.getItem("money-acct")||"wallet";}catch(e){return "wallet";}}
function setLastAcct(a){try{localStorage.setItem("money-acct",a);}catch(e){}}

/* ---------- the numbers ---------- */
function model(){const S=M.summary(),today=M.now().date,mon=today.slice(0,7),N=M.names();
  const spend=S.T.filter(M.isSpend),inc=S.T.filter(x=>x.kind==="in"&&!M.NOT_SPEND.has(x.cat));
  const sum=(L,f)=>L.filter(f).reduce((a,x)=>a+x.amt,0);
  const tSpent=sum(spend,x=>x.date===today),tIn=sum(inc,x=>x.date===today),mSpent=sum(spend,x=>x.date.slice(0,7)===mon),mIn=sum(inc,x=>x.date.slice(0,7)===mon);
  const dom=+today.slice(8,10),byCat={};spend.filter(x=>x.date.slice(0,7)===mon).forEach(x=>{const c=x.cat||"Other";byCat[c]=(byCat[c]||0)+x.amt;});
  const mInv=sum(S.T,x=>x.kind==="out"&&x.cat==="Investment"&&x.date.slice(0,7)===mon);
  return {...S,N,today,tSpent,tIn,mSpent,mIn,mInv,avg:mSpent/dom,byCat:Object.entries(byCat).sort((a,b)=>b[1]-a[1]),pend:M.list("pend").sort((a,b)=>M.ord(a)<M.ord(b)?-1:1)};}

/* ---------- drawing ---------- */
function accTile(b,name){const cp=b.cp;
  if(!b.set)return `<button type="button" class="unset" data-bal="${b.acct}"><span>${esc(name)}</span><b>Set balance</b><small>tap to enter what you have</small></button>`;
  return `<button type="button" data-bal="${b.acct}"><span>${esc(name)}</span><b class="${b.val<0?"dn":""}">${inr(b.val)}</b><small>${cp?"checked "+I.dshort(cp.date):"no balance check yet"}</small></button>`;}
function hero(m){return `<section class="card hero"><div class="when">Money now</div><div class="tot">${m.any?inr(m.total):"—"}</div>
  <div class="acc2">${accTile(m.wallet,m.N.wallet)}${accTile(m.bank,m.N.bank)}</div></section>`;}
function todayCard(m){return `<section class="card"><div class="today">
  <div><span>Spent today</span><b class="${m.tSpent?"dn":""}">${inr(m.tSpent)}</b>${m.tIn?`<small class="up">+${inr(m.tIn)} in</small>`:""}</div>
  <div><span>This month</span><b>${inr(m.mSpent)}</b><small>${inr(m.avg)} a day</small></div>
  <div><span>Received</span><b class="${m.mIn?"up":""}">${inr(m.mIn)}</b><small>${m.mInv?"invested "+inr(m.mInv):"this month"}</small></div></div></section>`;}
function reviewCard(m){if(!m.pend.length)return "";const n=m.pend.length,amt=m.pend.reduce((a,x)=>a+(x.kind==="in"?x.amt:-x.amt),0);
  return `<section class="card review"><h2>${n} from YONO to approve <small>${I.dshort(m.pend[0].date)}${m.pend[n-1].date!==m.pend[0].date?" – "+I.dshort(m.pend[n-1].date):""}</small></h2>
  <p class="small">Remarks are drafted from the statement and from what you approved before. Check each one, or take them as drafted.</p>
  <div class="acts"><button type="button" id="rvOne">Review one by one</button><button type="button" class="ghost" id="rvAll">Approve all ${n}</button></div></section>`;}
function entRow(x,N){const acc=x.kind==="move"?(x.to==="wallet"?N.bank+" → "+N.wallet:N.wallet+" → "+N.bank):(x.acct==="bank"?N.bank:N.wallet);
  const cls=x.kind==="in"?"in":x.kind==="move"?"mv":x.cat==="Investment"?"inv":"",sign=x.kind==="in"?"+":x.kind==="move"?"":"−";
  const sub=[x.time,x.cat,acc,x.src==="yono"?"YONO":""].filter(Boolean).join(" · ");
  return `<button type="button" class="ent" data-tx="${esc(x.id)}"><span style="min-width:0"><div class="n">${esc(x.note||x.cat||(x.kind==="move"?"Transfer":"—"))}</div><div class="s">${esc(sub)}</div></span><span class="a ${cls}">${sign}${inr(x.amt,x.amt%1?2:0)}</span></button>`;}
function listCard(m){if(!m.T.length)return `<section class="card empty"><b>No entries yet</b><p class="small muted">Set your wallet and bank balances above, then log cash spends with + Log and bring in online ones with a YONO statement file.</p></section>`;
  const byDay={};m.T.forEach(x=>(byDay[x.date]=byDay[x.date]||[]).push(x));const ds=Object.keys(byDay).sort().reverse(),shown=ds.slice(0,showDays);
  return `<section class="card"><h2>Entries <small>${m.T.length}</small></h2>${shown.map(d=>{const L=byDay[d].slice().reverse(),sp=L.filter(M.isSpend).reduce((a,x)=>a+x.amt,0);
    return `<div class="day"><span>${esc(dayName(d))}</span><b>${sp?"spent "+inr(sp):""}</b></div>${L.map(x=>entRow(x,m.N)).join("")}`;}).join("")}
   ${ds.length>showDays?`<button type="button" class="more" id="more">Show earlier days</button>`:""}</section>`;}
function catsCard(m){if(!m.byCat.length)return "";const max=m.byCat[0][1];
  return `<section class="card"><h2>This month by category <small>${inr(m.mSpent)}</small></h2><div class="cats">${m.byCat.map(([c,v])=>`<div class="cat"><span>${esc(c)}</span><span><i style="width:${Math.max(2,v/max*100).toFixed(1)}%"></i></span><b>${inr(v)}</b></div>`).join("")}</div></section>`;}
function barsCard(m){const t=new Date(m.today+"T00:00:00"),L=[];for(let i=29;i>=0;i--){const d=new Date(t-i*864e5),iso=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    L.push([iso,d.getDate(),m.T.filter(x=>x.date===iso&&M.isSpend(x)).reduce((a,x)=>a+x.amt,0)]);}
  const max=Math.max(...L.map(x=>x[2]));if(!(max>0))return "";
  return `<section class="card"><h2>Last 30 days <small>spent per day</small></h2><div class="bars">${L.map(([iso,d,v])=>`<div title="${iso}: ${inr(v)}"><i style="height:${(v/max*100).toFixed(1)}%"></i><span>${d%5===0||iso===m.today?d:""}</span></div>`).join("")}</div></section>`;}
/* the card goes away on a phone once the Money Log icon has been used there */
const APP_KEY="money-log-icon";if(/[?&]app/.test(location.search))try{localStorage.setItem(APP_KEY,"1");}catch(e){}
window.addEventListener("appinstalled",()=>{try{localStorage.setItem(APP_KEY,"1");}catch(e){}draw();});
function installCard(){let has=false;try{has=!!localStorage.getItem(APP_KEY);}catch(e){}if(has)return "";
  return `<section class="card"><div class="install"><img src="money-192.png" alt=""><p><b>Money Log on your home screen</b><br><span class="muted">One tap opens a new entry. Do this once on each phone.</span></p><button type="button" class="ghost" id="inst">Add</button></div></section>`;}
function draw(){const m=model();
  $("out").innerHTML=reviewCard(m)+hero(m)+todayCard(m)+listCard(m)+catsCard(m)+barsCard(m)+installCard()+
    `<p class="small muted" style="text-align:center;margin:10px 0">${I.hasSync()?"Synced between your phones (encrypted).":"Sync is off: entries stay on this phone."} ATM withdrawals and deposits move money between wallet and bank; they aren't spending. Nor are Investment and Self transfer.</p>`;
  document.querySelectorAll("[data-bal]").forEach(b=>b.onclick=()=>balForm(b.dataset.bal));
  document.querySelectorAll("[data-tx]").forEach(b=>b.onclick=()=>{const x=I.load(KEY).tx[b.dataset.tx];if(x)entry({id:b.dataset.tx,...x});});
  const on=(id,f)=>{const e=$(id);if(e)e.onclick=f;};
  on("more",()=>{showDays+=14;draw();});on("rvOne",()=>review(0));on("rvAll",approveAll);on("inst",install);}

/* ---------- log an entry (the quick sheet) ---------- */
function recentNotes(){const seen=new Set(),out=[];M.entries().reverse().forEach(x=>{const n=(x.note||"").trim();if(n&&!seen.has(n.toLowerCase())&&out.length<60){seen.add(n.toLowerCase());out.push(n);}});return out;}
function chipsHtml(k,cur){const L=k==="in"?M.IN_CATS:k==="out"?M.OUT_CATS:[];return L.map(c=>`<button type="button" data-c="${esc(c)}" class="${c===cur?"on":""}">${esc(c)}</button>`).join("");}
function sheet(html){let d=$("mSheet");if(d)d.remove();d=document.createElement("dialog");d.id="mSheet";d.className="sheet";d.innerHTML=`<form method="dialog">${html}</form>`;document.body.appendChild(d);
  d.addEventListener("cancel",()=>d.remove());d.addEventListener("click",e=>{if(e.target===d){d.close();d.remove();}});return d;}
function segWire(d,sel,on){d.querySelectorAll(sel+" button").forEach(b=>b.onclick=e=>{e.preventDefault();d.querySelectorAll(sel+" button").forEach(x=>x.classList.toggle("on",x===b));on(b.dataset.v);});}
function entry(pre,again){pre=pre||{};const N=M.names(),n=M.now(),edit=!!pre.id;let k=pre.kind?kindOf(pre):"out",acct=pre.acct&&pre.kind!=="move"?pre.acct:lastAcct(),cat=pre.cat||"";
  const d=sheet(`<h3>${edit?"Edit entry":"Log money"}</h3>
    <div class="seg k" id="sK">${KINDS.map(([v,l])=>`<button type="button" data-v="${v}" class="${v===k?"on":""}">${l}</button>`).join("")}</div>
    <div class="seg" id="sA">${M.ACCTS.map(([v])=>`<button type="button" data-v="${v}" class="${v===acct?"on":""}">${esc(N[v])}</button>`).join("")}</div>
    <label class="amt"><span>₹</span><input id="eAmt" inputmode="decimal" autocomplete="off" placeholder="0" value="${ok(pre.amt)?pre.amt:""}"></label>
    <div class="chips" id="eCat"></div>
    <label class="fld"><span>Remark</span><input id="eNote" list="eNotes" autocomplete="off" value="${esc(pre.note||"")}" placeholder="e.g. Mess lunch, Sethia Brothers"><datalist id="eNotes">${recentNotes().map(x=>`<option value="${esc(x)}">`).join("")}</datalist></label>
    <div class="two"><label class="fld"><span>Date</span><input id="eDate" type="date" value="${pre.date||n.date}"></label><label class="fld"><span>Time</span><input id="eTime" type="time" value="${pre.time!=null&&edit?pre.time:n.time}"></label></div>
    ${pre.raw?`<div class="raw">${esc(pre.raw)}</div>`:""}
    <p class="ferr" hidden></p>
    <div class="fbtns">${edit?`<button type="button" class="danger" id="eDel">Delete</button>`:`<button type="button" class="ghost" id="eNext">Save + next</button>`}<span></span><button type="button" class="ghost" id="eX">Cancel</button><button type="submit">Save</button></div>`);
  const showCats=()=>{$("eCat").innerHTML=chipsHtml(k,cat);$("eCat").hidden=k==="atm"||k==="dep";$("sA").hidden=k==="atm"||k==="dep";
    $("eCat").querySelectorAll("button").forEach(b=>b.onclick=e=>{e.preventDefault();cat=cat===b.dataset.c?"":b.dataset.c;showCats();});};
  segWire(d,"#sK",v=>{if((v==="in")!==(k==="in"))cat="";k=v;showCats();});segWire(d,"#sA",v=>{acct=v;});showCats();
  const err=d.querySelector(".ferr"),close=()=>{d.close();d.remove();};
  const save=()=>{const amt=parseFloat(String($("eAmt").value).replace(/[,₹\s]/g,""));if(!(amt>0)){err.hidden=false;err.textContent="Enter the amount.";return false;}
    const note=$("eNote").value.trim();if(!note&&!cat&&k!=="atm"&&k!=="dep"){err.hidden=false;err.textContent="Add a remark or pick a category.";return false;}
    const r={...pre,...fromKind(k,acct),amt:r2(amt),cat:k==="atm"||k==="dep"?"":cat,note:note||(k==="atm"?"ATM withdrawal":k==="dep"?"Cash deposit":""),date:$("eDate").value||n.date,time:$("eTime").value||"",src:pre.src||"hand"};
    delete r.id;delete r.t;if(r.to===undefined)delete r.to;if(k!=="atm"&&k!=="dep")setLastAcct(acct);
    I.upsert(KEY,"tx",pre.id,r);draw();
    if(!edit){const m=model();toast(`Saved ${inr(r.amt,r.amt%1?2:0)} · spent today ${inr(m.tSpent)}`);}return true;};
  d.querySelector("form").onsubmit=e=>{e.preventDefault();if(save())close();};
  $("eX").onclick=close;
  if($("eNext"))$("eNext").onclick=()=>{if(save()){close();setTimeout(()=>entry({},true),50);}};
  if($("eDel"))$("eDel").onclick=()=>{if(confirm("Delete this entry?")){I.remove(KEY,"tx",pre.id);close();draw();}};
  d.showModal();setTimeout(()=>{if(!edit)$("eAmt").focus();},60);}

/* ---------- balance check ---------- */
function balForm(acct){const N=M.names(),b=M.balance(acct),n=M.now();
  I.form({title:N[acct]+" balance",note:b.set?`The book says ${inr(b.val,2)}. Enter what you actually have (count the cash, or the balance YONO shows). From now on, entries move it.`:`Enter what you have now. From then on, every entry moves it.`,
    fields:[{k:"amt",label:acct==="wallet"?"Cash in hand (₹)":"Balance (₹)",type:"number",value:b.set?r2(b.val):""},
      ...(b.set?[{k:"gap",label:"If it differs from the book",type:"select",value:"fix",options:[["fix","Just correct the balance"],["log","Log the difference as unaccounted"]]}]:[]),
      {k:"name",label:"Name shown",value:N[acct],req:false,hint:acct==="bank"?"e.g. SBI":"e.g. Wallet"},
      {k:"date",label:"As on",type:"date",value:n.date}],ok:"Save",
    onSubmit:v=>{if(!ok(v.amt))return "Enter the amount.";const t=v.date===n.date?n.time:"23:59";
      if(b.set&&v.gap==="log"&&Math.abs(v.amt-b.val)>=0.5){const g=r2(b.val-v.amt);I.upsert(KEY,"tx",null,{kind:g>0?"out":"in",acct,amt:Math.abs(g),cat:"Other",note:"Unaccounted",date:v.date,time:t,src:"hand"});}
      I.upsert(KEY,"bal",null,{acct,amt:r2(v.amt),date:v.date,time:t});
      if(v.name&&v.name!==N[acct])I.setSettings(KEY,{[acct+"Name"]:v.name.trim()});draw();}});}

/* ---------- YONO statement ---------- */
function loadXlsx(){return window.XLSX?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=res;s.onerror=()=>rej(new Error("couldn't load the spreadsheet reader (are you online?)"));document.head.appendChild(s);});}
function pickYono(){const i=document.createElement("input");i.type="file";i.accept=".xls,.xlsx,.csv,.txt,.htm,.html,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv";
  i.onchange=async()=>{const f=i.files&&i.files[0];if(!f)return;$("st").textContent="Reading "+f.name+"…";
    try{await loadXlsx();const wb=XLSX.read(new Uint8Array(await f.arrayBuffer()),{type:"array",cellDates:true});
      let rows=null,lastErr=null;for(const n of wb.SheetNames){try{rows=M.readStatement(XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:""}));break;}catch(e){lastErr=e;}}
      if(!rows)throw lastErr||new Error("No sheet in the file.");
      const r=M.importRows(rows);showErr("");draw();
      $("st").textContent=`${f.name}: ${r.added} new${r.dup?`, ${r.dup} already in`:""}${r.cp?` · bank ${inr(r.cp.amt,2)} on ${I.dshort(r.cp.date)}`:""}`;
      if(r.added)review(0);else toast("Nothing new in this statement.");}
    catch(e){showErr("YONO file: "+e.message);$("st").textContent="";}};
  i.click();}
/* one statement row at a time, like WhatsApp Review: edit the draft, then approve, discard or skip */
function review(at){const P=M.list("pend").sort((a,b)=>M.ord(a)<M.ord(b)?-1:1);if(!P.length){const d=$("mSheet");if(d){d.close();d.remove();}draw();return;}
  const i=Math.max(0,Math.min(at,P.length-1)),p=P[i],N=M.names();let k=kindOf(p),cat=p.cat||"";const twin=M.handTwin(p);
  const d=sheet(`<div class="wah" style="display:flex;justify-content:space-between;align-items:baseline"><h3>YONO review</h3><span class="small muted">${i+1} of ${P.length}</span></div>
    <div><span class="big ${p.kind==="in"?"in":p.kind==="out"?"out":""}">${p.kind==="in"?"+":p.kind==="out"?"−":""}${inr(p.amt,p.amt%1?2:0)}</span>${p.learned?`<span class="tag">as last time</span>`:""}<div class="small muted">${esc(dayName(p.date))}${p.ref?" · ref "+esc(p.ref):""}</div></div>
    <div class="raw">${esc(p.raw)}</div>
    ${twin?`<p class="twin">You logged this by hand already (“${esc(twin.note||twin.cat)}”). Approving links the two; it won't be counted twice.</p>`:""}
    <div class="seg k" id="sK">${KINDS.map(([v,l])=>`<button type="button" data-v="${v}" class="${v===k?"on":""}">${l}</button>`).join("")}</div>
    <div class="chips" id="eCat"></div>
    <div class="two" style="grid-template-columns:1fr 110px"><label class="fld"><span>Remark</span><input id="eNote" list="eNotes" autocomplete="off" value="${esc(p.note||"")}"><datalist id="eNotes">${recentNotes().map(x=>`<option value="${esc(x)}">`).join("")}</datalist></label>
    <label class="fld"><span>Time (optional)</span><input id="eTime" type="time" value="${esc(p.time||"")}"></label></div>
    <p class="ferr" hidden></p>
    <div class="rbtns"><button type="submit" class="ok">Approve ✓</button><button type="button" class="danger" id="rDel">Discard</button><button type="button" class="ghost" id="rSkip">Skip</button><button type="button" class="ghost" id="eX">Close</button></div>`);
  const showCats=()=>{$("eCat").innerHTML=chipsHtml(k,cat);$("eCat").hidden=k==="atm"||k==="dep";
    $("eCat").querySelectorAll("button").forEach(b=>b.onclick=e=>{e.preventDefault();cat=cat===b.dataset.c?"":b.dataset.c;showCats();});};
  segWire(d,"#sK",v=>{if((v==="in")!==(k==="in"))cat="";k=v;showCats();});showCats();
  const close=()=>{d.close();d.remove();draw();};
  d.querySelector("form").onsubmit=e=>{e.preventDefault();const mv=fromKind(k,"bank"),r=M.approve(p.id,{...mv,cat:k==="atm"||k==="dep"?"":(cat||"Other"),note:$("eNote").value.trim()||p.note,time:$("eTime").value||""});
    if(r==="linked")toast("Linked to your hand entry");d.remove();review(i);};
  $("rDel").onclick=()=>{M.discard(p.id);d.remove();review(i);};
  $("rSkip").onclick=()=>{d.remove();if(i+1<P.length)review(i+1);else{draw();toast("Skipped ones stay waiting.");}};
  $("eX").onclick=close;d.showModal();}
function approveAll(){const P=M.list("pend");if(!P.length)return;
  if(!confirm(`Approve all ${P.length} as drafted? Ones without a category go in as Other. You can still edit any entry later.`))return;
  let linked=0;P.sort((a,b)=>M.ord(a)<M.ord(b)?-1:1).forEach(p=>{if(M.approve(p.id,{cat:p.kind==="move"?"":(p.cat||"Other")})==="linked")linked++;});
  draw();toast(`Approved ${P.length}${linked?` · ${linked} linked to hand entries`:""}`);}

/* ---------- home-screen icon ---------- */
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;});
async function install(){if(deferredInstall){deferredInstall.prompt();try{await deferredInstall.userChoice;}catch(e){}deferredInstall=null;return;}
  const url=location.origin+location.pathname,inApp=matchMedia("(display-mode: standalone)").matches;
  I.form({title:"Money Log on the home screen",note:(inApp?"Open this page in the Chrome browser (not inside the Pranju OS app): "+url+" . Then ":"In Chrome, ")+"open the ⋮ menu (top right) and tap “Add to Home screen” → “Install”. The new Money Log icon opens straight into a new entry. Do the same on your other phone.",
    fields:[],ok:"OK",onSubmit:()=>{},extra:navigator.clipboard?[{label:"Copy link",run:()=>{navigator.clipboard.writeText(url).then(()=>toast("Link copied"),()=>{});}}]:null});}

/* ---------- sync ---------- */
function showErr(m){$("err").hidden=!m;$("err").textContent=m||"";}
async function syncNow(loud){try{const r=await I.sync(KEY);if(r.ok&&r.changed)draw();if(loud){$("st").textContent=r.ok?"Synced.":r.msg;}}catch(e){if(loud)showErr("Sync failed: "+e.message);}}
$("qAdd").onclick=()=>entry();$("qYono").onclick=pickYono;$("sync").onclick=()=>syncNow(true);
draw();
if(/[?&]add/.test(location.search)){entry();history.replaceState(null,"",location.pathname);}
syncNow(false);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")syncNow(false);});
</script>
