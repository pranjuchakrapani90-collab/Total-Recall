<style>
:root{--bg:#f4f7fb;--paper:#fff;--ink:#172033;--muted:#697386;--line:#e5e7eb;--steel:#0f766e;--steel-soft:#e6f4f2;--brass:#b45309;--brass-soft:#fef3e2;--good:#059669;--good-soft:#ecfdf5;
  --body:system-ui,-apple-system,"Segoe UI",sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--body)}
header{background:linear-gradient(135deg,#0f766e,#1e3a5f);color:#fff;padding:22px 16px 26px}
.hin{max-width:980px;margin:0 auto}
.backlink{font-size:13px;color:#fff;opacity:.9;text-decoration:none}
.eyebrow{font:600 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:#d5ece8;margin-top:12px}
h1{font:750 clamp(28px,6vw,40px)/1.1 var(--body);margin:6px 0 4px}
header p{margin:0;color:#d5ece8;max-width:60ch}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:16px}
.goal{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.goal h2{font:700 17px var(--body);margin:0}
.gtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.gtop b{font:700 20px var(--mono)}
.gbar{height:10px;border-radius:6px;background:var(--steel-soft);overflow:hidden}
.gbar i{display:block;height:100%;background:var(--good);width:0}
.gweek{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.gd{display:flex;flex-direction:column;align-items:center;padding:6px 0;border-radius:8px;background:var(--bg);font-size:11px;color:var(--muted)}
.gd b{font:700 15px var(--mono);color:var(--ink)}
.gd.part{background:var(--brass-soft)}.gd.met{background:var(--good-soft)}.gd.met b{color:var(--good)}
.sections{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media(max-width:980px){.sections{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:720px){.sections{grid-template-columns:1fr}}
a.sec{display:flex;flex-direction:column;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px;color:inherit;text-decoration:none;box-shadow:0 5px 18px #141e3710;transition:transform .15s,box-shadow .15s,border-color .15s;position:relative;overflow:hidden}
a.sec:hover,a.sec:focus-visible{transform:translateY(-2px);box-shadow:0 10px 26px #141e371c;border-color:var(--steel);outline:none}
a.sec::before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:var(--steel)}
a.sec.fs::before{background:var(--brass)}
a.sec.sv::before{background:#1e3a5f}.sv .tag{background:#e8eef6;color:#1e3a5f}.sv .go b{background:#1e3a5f}
.ico{font-size:34px;line-height:1}
.sec h2{font:750 24px/1.15 var(--body);margin:0}
.sec p{margin:0;color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font:600 11px/1 var(--body);letter-spacing:.05em;text-transform:uppercase;padding:6px 8px;border-radius:999px;background:var(--steel-soft);color:#115e59}
.fs .tag{background:var(--brass-soft);color:#92400e}
.now{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.now div{background:var(--bg);border-radius:10px;padding:8px 10px}
.now b{display:block;font:700 18px var(--mono)}
.now span{font-size:11px;color:var(--muted)}
.go{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.go span{font-size:13px;color:var(--muted)}
.go b{background:var(--steel);color:#fff;border-radius:10px;padding:10px 16px;font-size:15px;white-space:nowrap}
.fs .go b{background:var(--brass)}

.gweek{grid-template-columns:repeat(6,1fr)}
.gd small{font-size:10px;text-align:center;line-height:1.2;padding:0 2px}
.gd b{font-size:14px}

.gonext{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff;background:#0f766e;border-radius:14px;padding:14px 16px}
.gonext .gi{font-size:22px}.gonext small{display:block;font:600 11px/1.2 var(--body);letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.gonext b{display:block;font:700 17px/1.25 var(--body)}.gonext .ar{margin-left:auto;font-size:20px}.gonext.fin{background:var(--good)}
.gweek{grid-template-columns:repeat(3,minmax(0,1fr))!important}
.months{display:flex;flex-direction:column;gap:18px;margin-top:6px}
.mh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.mh b{font:700 15px var(--body)}.mh span{font-size:12px;color:var(--muted)}
.dow,.dg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow i{font:600 10.5px var(--body);font-style:normal;color:#9a978e;text-align:center}
.dc{aspect-ratio:1/1;border-radius:8px;background:#f0eee8;display:flex;align-items:center;justify-content:center;font:600 13px var(--body);color:var(--muted)}
.dc.pad{background:none}.dc.fut{background:none;border:1px dashed #e6e3db;color:#c9c5ba}
.dc.l1{background:#ddeeeb;color:#285e57}.dc.l2{background:#a9d6cf;color:#0f4c45}.dc.l3{background:#5fb3a6;color:#fff}.dc.l4{background:#0f766e;color:#fff;font-weight:750}
.dc.td{box-shadow:0 0 0 2px var(--ink)}
.mleg{display:flex;align-items:center;justify-content:flex-end;gap:4px;font-size:11.5px;color:var(--muted)}
.mleg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.linkb{align-self:flex-start;background:none;border:0;padding:4px 0;color:var(--muted);font:13px var(--body);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.apps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:4px 0}
a.app{display:flex;flex-direction:column;align-items:center;gap:7px;text-decoration:none;color:var(--ink);min-width:0}
a.app i{display:grid;place-items:center;width:58px;height:58px;border-radius:18px;background:linear-gradient(150deg,#6d6af0,#4f46e5 48%,#3c32c4);box-shadow:inset 0 1px 0 #ffffff40,inset 0 -2px 0 #00000026,0 3px 8px #3c32c440}
a.app svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
a.app:active i{transform:scale(.93)}
a.app span{font:550 12.5px/1.2 var(--body);text-align:center}
details.more>summary{cursor:pointer;list-style:none;text-align:center;font:600 14px var(--body);color:var(--muted);padding:10px;border:1px dashed var(--line);border-radius:12px}
details.more>summary::-webkit-details-marker{display:none}
details.more[open]>summary{margin-bottom:14px}
.nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.nums div{background:var(--bg);border-radius:10px;padding:8px 10px}.nums b{display:block;font:700 18px var(--mono)}.nums span{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:13px;margin:0}
</style><link rel="stylesheet" href="tr-theme.css?v=20261020"></head><body class="tr-est">
<header><div class="hin">
  <a class="backlink" href="./">← Pranju OS</a>
  <div class="eyebrow">APDCL estimates · SoR 2021-22</div>
  <h1>Estimate Studio</h1>
</div></header>
<main class="wrap">
  <section class="goal" aria-label="Trainer progress">
    <div class="gtop"><h2>Structures mastered</h2><span><b id="tMas">0</b> of 44</span></div>
    <div class="gbar"><i id="tBar"></i></div>
    <a id="goNext" class="gonext" href="estimates.html"><span class="gi">🔌</span><span><small id="goSm">Next in the trainer</small><b id="goN">Start with the building blocks</b></span><span class="ar">▸</span></a>
    <div class="gweek" id="levels"></div>
  </section>
  <nav class="apps" aria-label="Sections">
    <a class="app" href="estimates.html"><i><svg viewBox="0 0 24 24"><path d="M12 3v18M5.5 6.5h13M7.5 10.5h9M9 21h6M6.5 6.5v2M17.5 6.5v2"/></svg></i><span>BoQ Trainer</span></a>
    <a class="app" href="bom-kits.html"><i><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 4V2.8h6V4M8.5 9.5h7M8.5 13h7M8.5 16.5h4.5"/></svg></i><span>BoM Kits</span></a>
    <a class="app" href="sld-survey.html"><i><svg viewBox="0 0 24 24"><path d="M12 21s-6-5.6-6-10.5a6 6 0 0 1 12 0C18 15.4 12 21 12 21z"/><circle cx="12" cy="10.5" r="2.2"/></svg></i><span>Line Survey</span></a>
    <a class="app" href="tc.html"><i><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7.5"/><path d="M12 13l3.5-3.5M8 5.5 6.8 3.8M16 5.5l1.2-1.7M9.5 18h5"/></svg></i><span>T&amp;C Handbook</span></a>
  </nav>
  <details class="more"><summary>Kits and surveys</summary>
    <section class="goal">
      <div class="nums"><div><b id="kScaled">0</b><span>kits with units set</span></div><div><b id="kDep">0</b><span>kits as deposit work</span></div><div><b id="sProj">0</b><span>surveys</span></div><div><b id="sPts">0</b><span>points marked</span></div></div>
      <p class="muted small" id="sNext">No survey yet.</p>
    </section>
  </details>
</main>
<script>
"use strict";
const NUL=document.createElement("div"),$=id=>document.getElementById(id)||NUL;
const get=k=>{try{return JSON.parse(localStorage.getItem(k)||"null");}catch(e){return null;}};
const pad=n=>String(n).padStart(2,"0"),dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
// Pole-to-BoQ Trainer: a structure counts as mastered at a best score of 90%
const LV=[["blk", "Building blocks", [["stay11", "One stay (guy) — 11 kV"], ["earth", "One pole earthing"], ["strain", "One 11 kV strain (dead-end) set"], ["fdnN", "Setting an intermediate pole"], ["fdnC", "Concreting a special pole"], ["polerep", "Replacing one damaged LT pole (vehicle / accident)"]]], ["lt", "LT lines", [["abcI", "LT ABC intermediate pole"], ["abcD", "LT ABC dead-end pole"], ["abcT", "LT ABC tapping / junction pole"], ["lt1I", "LT 1-ph 2-wire, vertical, in-line"], ["lt1D", "LT 1-ph 2-wire, vertical, dead-end"], ["lt3H", "LT 3-ph 4-wire, horizontal, tangent"], ["lt3V", "LT 3-ph 4-wire, vertical, in-line"], ["lt3D", "LT 3-ph 4-wire dead-end"], ["svc", "1-ph service connection"], ["abcconv", "Converting a bare LT pole to ABC (existing pole)"]]], ["hv", "11 kV lines", [["h1", "11 kV tangent pole"], ["h2", "11 kV small angle (up to 10°)"], ["h3", "11 kV angle 10°–60°, single pole"], ["h4", "11 kV dead-end on DP"], ["h5", "11 kV DP in-line (section point)"], ["h6", "11 kV sectionaliser DP with AB switch"], ["h7", "11 kV spur-line tapping DP"], ["h8", "11 kV + LT on one pole"], ["h9", "DO fuse set at a tap-off"], ["hgt11", "11 kV heightening pole (safety / elephant corridor)"]]], ["dtr", "DT substations", [["d1", "25 kVA DT on a single pole"], ["d2", "63 / 100 kVA DT on DP"], ["d3", "200 kVA DT on DP"], ["d4", "1-ph DT, phase-to-neutral"], ["aug", "DT augmentation 100 → 250 kVA"], ["tmpdt", "Temporary DT on an existing DP (O&M stock)"]]], ["ehv", "33 kV lines", [["v1", "33 kV tangent pole"], ["v2", "33 kV strain, 0°–10°, single pole"], ["v3", "33 kV dead-end"], ["rc33", "33 kV reconductoring to Wolf, per route-km (existing poles)"]]], ["sp", "Crossings & SS", [["guard", "Guarding at a road crossing"], ["rail", "Railway crossing with 11 kV XLPE cable"], ["ss33", "33/11 kV substation, Type A (1 × 3.15 MVA)"], ["ptr", "33/11 kV PTR bay"], ["ctpt", "11 kV CT-PT metering on a new DP (HT consumer)"], ["rail33", "Railway crossing with 33 kV XLPE cable"], ["vcb33r", "33 kV outdoor VCB replacement"], ["vcb11r", "11 kV outdoor VCB replacement"]]]];
const prog=get("p2b-prog")||{},mastered=k=>prog[k]&&prog[k].best>=0.9;
const all=LV.flatMap(l=>l[2]),nM=all.filter(s=>mastered(s[0])).length;
$("tMas").textContent=nM;$("tBar").style.width=(nM/all.length*100)+"%";
$("levels").innerHTML=LV.map(([id,name,ks])=>{const m=ks.filter(s=>mastered(s[0])).length,t=ks.some(s=>prog[s[0]]);
  return `<span class="gd${m===ks.length?" met":t?" part":""}" title="${name}: ${m} of ${ks.length} mastered"><b>${m}/${ks.length}</b><small>${name}</small></span>`;}).join("");
const lvl=LV.findIndex(l=>!l[2].every(s=>mastered(s[0])));
const nx=lvl<0?null:LV[lvl][2].find(s=>!mastered(s[0]));
if(lvl<0){$("goSm").textContent="All 44 mastered";$("goN").textContent="Review any structure";$("goNext").classList.add("fin");}
else if(nx){$("goNext").href="estimates.html#s="+nx[0];$("goSm").textContent=`Next in the trainer · ${LV[lvl][1]}`;$("goN").textContent=(prog[nx[0]]?"Retry: ":"")+nx[1];}

const sv=get("sld-survey-v1")||{},sp=Object.values(sv.projects||{}).filter(p=>!p.del).sort((a,b)=>b.upd-a.upd);

// BoM Kits and Line Survey
const bk=get("bomkits")||{},units=bk.units||{},mode=bk.mode||{};
$("kScaled").textContent=Object.values(units).filter(v=>+v&&+v!==1).length;
$("kDep").textContent=Object.values(mode).filter(v=>v==="dep").length;
$("sProj").textContent=sp.length;$("sPts").textContent=sp.reduce((a,p)=>a+(p.pts||[]).length,0);
if(sp[0])$("sNext").textContent=`Last survey: ${sp[0].name}, ${new Date(sp[0].upd).toLocaleDateString("en-IN",{day:"numeric",month:"short"})}`;
</script>
<script src="gsync.js?v=20261023"></script>
<script>
/* Estimate Studio home shows BoQ Trainer and Line Survey progress, which those pages sync when opened.
   Pull both here too (same merge rules as the pages), so this page shows the other phone's work straight away. */
(async function(){try{const G=window.GSync;if(!G||!G.code())return;const c=G.code();
  const get=k=>{try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}},put=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
  const [E,V]=await Promise.all([G.fetchSlot(c,"#estimates").catch(()=>null),G.fetchSlot(c,"#sldsurvey").catch(()=>null)]);let ch=false;
  if(E&&E.prog){const P=get("p2b-prog")||{};Object.entries(E.prog).forEach(([k,v])=>{const l=P[k];if(!l){P[k]=v;ch=true;return}
    const d={...(l.d||{})};Object.entries(v.d||{}).forEach(([dk,n])=>{if(!(d[dk]>=n)){d[dk]=n;ch=true}});
    const nb=Math.max(l.best||0,v.best||0),nn=Math.max(l.n||0,v.n||0);if(nb!==l.best||nn!==l.n)ch=true;P[k]={best:nb,n:nn,upd:Math.max(l.upd||0,v.upd||0),d}});
    if(ch)put("p2b-prog",P);}
  if(V&&V.projects){const D=get("sld-survey-v1")||{projects:{},cur:null};D.projects=D.projects||{};let c2=false;
    Object.values(V.projects).forEach(v=>{const l=D.projects[v.id];if(!l||(v.upd||0)>(l.upd||0)){D.projects[v.id]=v;c2=true}});if(c2){put("sld-survey-v1",D);ch=true;}}
  if(ch)location.reload();}catch(e){console.warn("Estimate Studio pull",e)}})();
</script>
