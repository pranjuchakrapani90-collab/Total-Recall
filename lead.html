<style>

<script>
"use strict";
/*ENGINE-START*/
/* ===================== Theory: strings, notes, the five CAGED shapes =====================
   Every shape is written once, in its own open-position key (C shape in C, A shape in A …), as [string, fret offset].
   Moving a shape up the neck adds the same number of frets to every note (n). Intervals are worked out from pitch. */
const OPEN={1:64,2:59,3:55,4:50,5:45,6:40};
const NM=["C","Db","D","Eb","E","F","F#","G","Ab","A","Bb","B"];
const IVN=["1","b2","2","b3","3","4","b5","5","b6","6","b7","7"];
const QN={maj:"major",min:"minor",dom:"7th"},QS={maj:"",min:"m",dom:"7"};
const QT={maj:[0,4,7],min:[0,3,7],dom:[0,4,7,10]};
const mod=(a,b)=>((a%b)+b)%b;
const r12=x=>Math.round(x*48)/48;
const STR={1:"high e",2:"B",3:"G",4:"D",5:"A",6:"low E"};
const SH={
 C:{k:0,rs:[5,2],v:{
  maj:{chord:[[5,3],[4,2],[3,0],[2,1],[1,0]],full:[[6,0],[6,3],[5,3],[4,2],[3,0],[2,1],[1,0],[1,3]]},
  min:{chord:[[5,3],[4,1],[3,0],[2,1]],full:[[6,-1],[6,3],[5,3],[4,1],[3,0],[2,1],[1,-1],[1,3]]},
  dom:{chord:[[5,3],[4,2],[3,3],[2,1],[1,0]],full:[[6,0],[6,3],[5,1],[5,3],[4,2],[3,0],[3,3],[2,1],[1,0],[1,3]]}}},
 A:{k:9,rs:[5,3],v:{
  maj:{chord:[[5,0],[4,2],[3,2],[2,2],[1,0]],full:[[6,0],[5,0],[5,4],[4,2],[3,2],[2,2],[1,0]],desc:[[6,0],[5,0],[4,-1],[4,2],[3,2],[2,2],[1,0]]},
  min:{chord:[[5,0],[4,2],[3,2],[2,1],[1,0]],full:[[6,0],[5,0],[5,3],[4,2],[3,2],[2,1],[1,0]]},
  dom:{chord:[[5,0],[4,2],[3,0],[2,2],[1,0]],full:[[6,0],[6,3],[5,0],[5,4],[4,2],[3,0],[3,2],[2,2],[1,0],[1,3]],desc:[[6,0],[6,3],[5,0],[4,-1],[4,2],[3,0],[3,2],[2,2],[1,0],[1,3]]}}},
 G:{k:7,rs:[6,3,1],v:{
  maj:{chord:[[6,3],[5,2],[4,0],[3,0],[2,0],[1,3]],full:[[6,3],[5,2],[4,0],[3,0],[2,0],[2,3],[1,3]]},
  min:{chord:[[6,3],[5,1],[4,0],[3,0],[2,3],[1,3]],full:[[6,3],[5,1],[4,0],[3,0],[3,3],[2,3],[1,3]]},
  dom:{chord:[[6,3],[5,2],[4,0],[3,0],[2,0],[1,1]],full:[[6,1],[6,3],[5,2],[4,0],[4,3],[3,0],[2,0],[2,3],[1,1],[1,3]]}}},
 E:{k:4,rs:[6,4,1],v:{
  maj:{chord:[[6,0],[5,2],[4,2],[3,1],[2,0],[1,0]],full:[[6,0],[6,4],[5,2],[4,2],[3,1],[2,0],[1,0],[1,4]],desc:[[6,0],[5,-1],[5,2],[4,2],[3,1],[2,0],[1,0],[1,4]]},
  min:{chord:[[6,0],[5,2],[4,2],[3,0],[2,0],[1,0]],full:[[6,0],[6,3],[5,2],[4,2],[3,0],[2,0],[1,0],[1,3]]},
  dom:{chord:[[6,0],[5,2],[4,0],[3,1],[2,0],[1,0]],full:[[6,0],[6,4],[5,2],[4,0],[4,2],[3,1],[2,0],[2,3],[1,0],[1,4]],desc:[[6,0],[5,-1],[5,2],[4,0],[4,2],[3,1],[2,0],[2,3],[1,0],[1,4]]}}},
 D:{k:2,rs:[4,2],v:{
  maj:{chord:[[4,0],[3,2],[2,3],[1,2]],full:[[6,2],[5,0],[4,0],[4,4],[3,2],[2,3],[1,2]],desc:[[6,2],[5,0],[4,0],[3,-1],[3,2],[2,3],[1,2]]},
  min:{chord:[[4,0],[3,2],[2,3],[1,1]],full:[[6,1],[5,0],[4,0],[4,3],[3,2],[2,3],[1,1]]},
  dom:{chord:[[4,0],[3,2],[2,1],[1,2]],full:[[6,2],[5,0],[5,3],[4,0],[4,4],[3,2],[2,1],[2,3],[1,2]],desc:[[6,2],[5,0],[5,3],[4,0],[3,-1],[3,2],[2,1],[2,3],[1,2]]}}},
};
const ORD=["C","A","G","E","D"];
const shName=(S,q)=>S+(q==="min"?"m":q==="dom"?"7":"")+" shape";
function span(S,q){const v=SH[S].v[q],o=[...v.chord,...v.full,...(v.desc||[])].map(x=>x[1]);return [Math.min(...o),Math.max(...o)];}
/* where a shape sits for a key: n = frets above its open position. near = a fret to stay close to (bring the chord to you) */
function posN(S,key,q,near){const [lo,hi]=span(S,q),n=mod(key-SH[S].k,12);
  const c=[n-12,n,n+12].filter(x=>x+lo>=0&&x+hi<=18);
  if(near==null)return c.includes(n)?n:c[c.length-1];
  return c.slice().sort((a,b)=>Math.abs(a+(lo+hi)/2-near)-Math.abs(b+(lo+hi)/2-near))[0];}
const nt=(s,f,key)=>({s,f,m:OPEN[s]+f,iv:IVN[mod(OPEN[s]+f-key,12)]});
function shapeNotes(S,key,q,n,form){const v=SH[S].v[q],L=v[form]||v.full;return L.map(([s,o])=>nt(s,n+o,key)).sort((a,b)=>a.m-b.m||b.s-a.s);}
const chordName=(key,q)=>NM[mod(key,12)]+QS[q];
/* a chord placed on the neck */

   txt:["Arpeggios cross a string on almost every note, so strict alternate picking (down-up-down-up) makes you jump over strings.","<b>Economy picking</b> is the fix: when the next note is on the next string in the same direction, keep the pick moving the same way. Going towards the floor you play ↓↓↓ in one smooth push; coming back up, ↑↑↑. On the same string you alternate as usual.","The arrows under every tab in this course show the strokes. Slow it down until the push is smooth, not two separate strokes."],
   how:["Mute the strings you aren't playing with the side of your picking hand.","Let the pick rest on the next string after each downstroke (a rest stroke).","Keep the volume of each note even. Listen for bumps where you change direction."]},
  /* Video extras (opt, never gate a level): Stitch Method, "The Clearest Triad Lesson" masterclass. Written in A (major unless noted). */
  {id:"f5",opt:1,maj:1,t:"The interval compass: every interval around one triad",rate:"lb",sc:"mj",reps:[[{k:9},{k:4},{k:2}],[{k:7},{k:11},{k:0}],[{k:6},{k:5},{k:1}]],lick:"<A:4> [4:7+3:6+2:5]@4 | <A:4> 4:7@1 4:8@1 4:9@1 4:7@1 | <A:4> 4:7@1 4:6@1 4:5@1 4:7@1 | <A:4> 3:6@1 3:7@1 3:8@1 3:6@1 | <A:4> 3:6@1 3:5@1 3:4@1 3:6@1 | <A:4> 2:5@1 2:4@1 2:5@1 2:6@1 | <A:4> 2:5@1 2:7@1 2:5@2 | <A:4> [4:7+3:6+2:5]@4",
   txt:["Take one major triad: A on the D, G and B strings (frets 7-6-5, the middle of the E-shape barre). Every interval in music sits <b>one or two frets</b> from one of its three notes, on the same string:","From the <b>1</b>: one fret up is the <b>b2</b>, two up the <b>2</b>; one fret down the <b>7</b>, two down the <b>b7</b>. From the <b>3</b>: one up the <b>4</b>, two up the <b>#4/b5</b>; one down the <b>b3</b>, two down the <b>2</b>. From the <b>5</b>: one down the <b>b5</b>, one up the <b>#5/b6</b>, two up the <b>6</b>.","Numbers above 7 are the same notes an octave up: subtract 7. A <b>9</b> is a 2, an <b>11</b> is a 4, a <b>13</b> is a 6. Each bar here walks one of those moves; the interval row under the tab names every note."],
   how:["Say the interval aloud as you play each note.","Some of these notes clash with the A chord on purpose; hear which ones are tense.","Then find the same moves from the triad in another CAGED shape."]},
  {id:"f6",opt:1,maj:1,t:"Bend the triad: one shape, twelve chords",rate:"lb",sc:"mj",reps:[[{k:9},{k:4},{k:2}],[{k:7},{k:11},{k:0}],[{k:6},{k:5},{k:1}]],lick:"<A:4> 4:7@.5 3:6 2:5 3:6 4:7@2 | <A:4> 4:6@.5 4:7 3:6 2:5 3:6 4:7 4:6@1 | <A:4> 4:7@.5 3:6 2:5 2:7 2:5 3:6 4:7@1 | <Am:4> 4:7@.5 3:5 2:5 3:5 4:7@2 | <Am7:4> 4:5@.5 4:7 3:5 2:5 3:5 4:7 4:5@1 | <Am7:4> 4:5@.5 4:7 4:9 3:5 3:7 2:5 3:7@1 | <A7:4> 4:5@.5 4:7 3:6 2:5 3:6 4:7 4:5@1 | <A7:4> 4:5@.5 4:7 4:9 3:6 2:5 3:6 4:9@1 | 4:7@.5 3:6 2:6 3:6 4:7@2 | 4:7@.5 3:5 2:4 3:5 4:7@2 | 4:7@.5 3:4 2:5 3:4 4:7@2 | 4:7@.5 3:7 2:5 3:7 4:7@2 | <A:4> [4:7+3:6+2:5]@4",
   txt:["Start from the major triad and move or add <b>one note</b> using the compass. Each bar is one chord's arpeggio: <b>A</b> 1-3-5 · <b>Amaj7</b> add the 7 (one fret below the 1) · <b>A6</b> add the 6 (two above the 5) · <b>Am</b> lower the 3 · <b>Am7</b> add the b7 (two below the 1) · <b>Am11</b> 1-b3-5-b7-9-11 · <b>A7</b> 1-3-5-b7 · <b>A9</b> add the 9 (two above the 1) · <b>Aaug</b> raise the 5 · <b>Adim</b> lower the 3 and the 5 · <b>Asus2</b> the 3 drops to the 2 · <b>Asus4</b> the 3 rises to the 4.","That's a chord formula: the recipe of intervals that makes each chord. You don't need a new shape for every chord. Find the major triad, then bend it into the formula.","The aug, dim and sus bars play without backing so you hear their own colour."],
   how:["Keep the hand where it is: everything is within a fret or two of the triad.","Name the chord before each bar starts.","Then play the formulas from the triad in another CAGED shape."]},
 ]},

 {id:"j",n:"Practice: jumping shapes",d:"Play one chord, see the next shape with your eyes, jump over it and land on the one after. Chords first, then full arpeggios. This is how you start seeing chords everywhere.",ls:[
  {id:"j1",t:"Connect all five shapes",g:"jump",step:1,mode:"chord",rate:"q",reps:kL([[0,7,9],[2,4,5],[10,3,11]],"maj"),
   txt:["Before jumping, walk: one chord up the neck through every shape in order, C → A → G → E → D → C, and back. The top of one shape is the bottom of the next.","Count four beats on each chord. On beats 2, 3 and 4, look ahead and see the next shape before your hand moves."],
   how:["Strum on beat 1 and hold.","Look at the next shape while this one rings.","Move on beat 1 of the next bar. No sliding or adjusting."]},
  {id:"j2",t:"Jump over a shape: major chords",g:"jump",step:2,mode:"chord",rate:"q",reps:kL([[11,0,7],[2,5,9],[4,10,3]],"maj"),
   txt:["Now the real exercise: <b>play a shape, see the next one, jump over it and land on the one after</b>. A shape → (see G) → E shape → (see D) → C shape, then back down.","Being able to see one thing while playing another is the key skill of a good improviser. It is how you keep an eye on the chords while your fingers do something else.","Count '1, 2, 3, chord': spend the three beats spotting where you're going, then land perfectly."],
   how:["Plan the route first, with the guitar silent.","Land every chord perfectly the first time. Correcting after landing doesn't count.","Do it backwards too: the reps go up and come back down."]},
  {id:"j3",t:"Jump over a shape: minor chords",g:"jump",step:2,mode:"chord",rate:"q",reps:kL([[4,0,9],[2,7,5],[11,10,1]],"min"),
   txt:["The same jumping exercise with minor shapes: Cm shape → (Am) → Gm shape → (Em) → Dm shape.","The minor shapes connect exactly like the major ones; only the 3s have dropped a fret."],
   how:["Find each minor shape's root strings before you jump.","Say the chord name each time ('E minor, G-minor shape').","Go up, then come back down."]},
  {id:"j4",t:"Jump over a shape: 7th chords",g:"jump",step:2,mode:"chord",rate:"q",reps:kL([[9,2,7],[4,0,5],[11,10,3]],"dom"),
   txt:["7th chord shapes connect in the same order. Their grips change a little more (some have only four or five strings), so the jump is harder to see.","An A7 played as a G7 shape at fret 2, jump to the D7 shape at fret 7, jump to the A7 shape at fret 12: lots of distance. Spot the roots first."],
   how:["Spot the root of the next shape, then the rest of the grip.","Strum only the strings the 7th grip uses.","Back down the neck the same way."]},
  {id:"j5",t:"Jumping full arpeggios: major",g:"jump",step:2,mode:"arp",rate:"e",reps:kL([[2,0,7],[9,5,4],[11,3,10]],"maj"),
   txt:["Same jumps, now with full arpeggios. In each shape: start on the <b>lowest note</b>, go all the way up and all the way down, walk back up to the root, strum the chord, then jump.","Every arpeggio has a different number of notes, so the shapes don't take the same time. That's fine. Keep the eighth notes steady and let the bar fill out."],
   how:["Plan all three shapes before you start.","While strumming the chord, look at the next shape and its lowest note.","Up the neck and back down."]},
  {id:"j6",t:"Jumping full arpeggios: minor",g:"jump",step:2,mode:"arp",rate:"e",reps:kL([[0,9,4],[2,7,5],[11,1,10]],"min"),
   txt:["C minor in the Am shape (fret 3), jump to the Em shape (fret 8), jump to the Cm shape (fret 13–15). Then back.","Some minor arpeggios start on the b3, below the root. That's normal: always start from the lowest note in the shape."],
   how:["Say each shape name before playing it.","Strum the minor chord between arpeggios.","Up and back."]},
  {id:"j7",t:"Jumping full arpeggios: 7th",g:"jump",step:2,mode:"arp",rate:"e",reps:kL([[9,2,7],[4,0,5],[11,10,3]],"dom"),
   txt:["The hardest version: full 7th arpeggios through jumping shapes. Say the intervals as you go: 'flat 7, 1, 3, 5, flat 7…'. Saying them is how you track them in real time.","Remember the shortcut: it's the major arpeggio with the b7 dropped in, two frets below each root."],
   how:["Major arpeggio first if you get lost, then add the b7s.","Slow is fine. Stopping is not; keep the beat.","Up and back."]},
 ]},
 {id:"t",n:"Practice: thick side, thin side",d:"Break every arpeggio into two overlapping halves: the thick side (low E to G) and the thin side (D to high e). Then you can come in anywhere, in either direction.",ls:[
  {id:"t1",t:"The thick side",g:"side",side:"thick",rate:"e",reps:kSh([[["E",5],["A",5],["C",3]],[["G",5],["D",5],["E",8]],[["A",7],["C",7],["D",3]]],"maj"),
   txt:["If you only ever practise an arpeggio from the low E to the high e, you'll freeze when a solo drops you in the middle of it. So split it.","The <b>thick side</b> runs from the <b>low E to the G string</b>. It's also where bass lines and riffs come from, as you'll see in the playbook."],
   how:["Up the thick side, then back down.","Stop on the G string, don't drift onto the B.","Each rep changes the shape: name it before playing."]},
  {id:"t2",t:"The thin side",g:"side",side:"thin",rate:"e",reps:kSh([[["E",5],["A",5],["C",3]],[["G",5],["D",5],["E",8]],[["A",7],["C",7],["D",3]]],"maj"),
   txt:["The <b>thin side</b> runs from the <b>D string to the high e</b>. It overlaps the thick side on the D and G strings: the overlap is your bridge between the two halves.","Most lead lines live on the thin side."],
   how:["Start on the D string.","Up to the high e and back.","Notice which notes on the D and G strings you also played on the thick side."]},
  {id:"t3",t:"Thick and thin together",g:"side",side:"both",rate:"e",reps:kSh([[["E",5],["A",5],["C",5]],[["G",5],["D",5],["E",8]],[["A",7],["C",7],["D",3]]],"maj"),
   txt:["Thick side up and down, then thin side up and down: the same arpeggio as two pieces. Mentally divide them, then put them back together.","When improvising you'll often enter the middle of a shape. Having practised both halves, you can flow either way."],
   how:["Thick side, up and back.","Thin side, up and back.","Picture where they overlap (D and G strings) the whole time."]},
  {id:"t4",t:"Thick and thin: minor",g:"side",side:"both",rate:"e",reps:kSh([[["E",5],["A",5],["C",5]],[["G",7],["D",5],["E",8]],[["A",7],["C",7],["D",3]]],"min"),
   txt:["The same split for every minor arpeggio. Take your least favourite minor shape and make friends with it: thick to thin, thin to thick."],
   how:["Name the chord and the shape first.","Thick side, then thin side.","Find the b3 on each side before you start."]},
  {id:"t5",t:"Thick and thin: 7th",g:"side",side:"both",rate:"e",reps:kSh([[["E",5],["A",5],["C",5]],[["G",7],["D",5],["E",8]],[["A",7],["C",7],["D",3]]],"dom"),
   txt:["7th arpeggios split the same way. Find the b7 on each side: there's usually one on the thick side and one on the thin side."],
   how:["Spot the b7s first.","Thick, then thin.","Say the intervals as you play."]},
  {id:"t6",t:"Come in from the middle",g:"middle",rate:"e",reps:kSh([[["E",5,"maj"],["A",5,"min"],["C",3,"maj"]],[["G",5,"dom"],["D",5,"maj"],["E",8,"min"]],[["A",7,"dom"],["C",7,"min"],["D",3,"maj"]]]),
   txt:["The test of this level: start on a 3 or a 5 in the <b>middle</b> of the shape (G or D string), run up to the top, all the way down to the bottom, and back up to where you started.","This is exactly what happens in a solo: you arrive in the middle of an arpeggio and have to know where to go."],
   how:["Find the starting note before you play: it's labelled in the chord line above the tab.","Up, all the way down, back to the start.","Change direction without hesitating."]},
 ]},
 {id:"b",n:"Practice: bring the chords to you",d:"Stay in one four- or five-fret area and find every chord of a progression there. Then keep the beat going through all their arpeggios.",ls:[
  {id:"b1",t:"A – D – E in one place: chords",g:"prog",mode:"chords",beats:8,tonic:9,prog:[[0,"maj","E"],[5,"maj","A"],[7,"maj","C"]],rate:"q",reps:kL([[9,7,0],[11,2,5],[4,10,1]],"maj"),
   txt:["Playing A at fret 5, D at fret 5 and then jumping up to E at fret 7 is a big no-no when you improvise. Your hand leaves the place where your ideas are.","Instead, <b>bring the chords to you</b>: E-shape A at fret 5, A-shape D at fret 5, and for E, ask 'what connects to the other side of the A shape?' The C shape: E chord around frets 4–7.","Use the shape connections and the root strings to find each chord. The first time it might take half an hour. That's fine; it gets faster every time."],
   how:["Find all three chords without moving your hand more than a fret or two.","Play eight beats on each chord.","When it feels easy, try the same three chords in another area of the neck."]},
  {id:"b2",t:"A – D – E in one place: arpeggios",g:"prog",mode:"arps",beats:8,tonic:9,prog:[[0,"maj","E"],[5,"maj","A"],[7,"maj","C"]],rate:"e",reps:kL([[9,7,0],[11,2,5],[4,10,1]],"maj"),
   txt:["Same chords, same place, now as continuous eighth notes through each chord's full arpeggio. Eight beats per chord.","<b>Start each chord on its root</b>, wherever the nearest root is, so you hear the chord change on the downbeat. Then go up or down, as you like."],
   how:["Keep the beat going through the changes, never stop.","If you hit a wrong note, keep going.","Listen: does the line clearly change chord on beat 1?"]},
  {id:"b3",t:"A – D – E higher up",g:"prog",mode:"arps",beats:8,tonic:9,prog:[[0,"maj","D"],[5,"maj","G"],[7,"maj","A"]],rate:"e",reps:kL([[9,7,0],[11,2,5],[4,10,1]],"maj"),
   txt:["The same progression in a different area: A as a D shape (frets 7–10), D as a G shape, E as an A shape. You should be able to bring the chords to you anywhere on the neck."],
   how:["Find the three shapes before starting.","Root first on every chord.","Eight beats each, steady."]},
  {id:"b4",t:"Am – G – D7: minor, major, 7th",g:"prog",mode:"arps",beats:8,tonic:9,prog:[[0,"min","E"],[10,"maj","D"],[5,"dom","A"]],rate:"e",reps:kL([[9,4,2],[7,11,0],[5,1,6]],"min"),
   txt:["Now a progression mixing all three chord types, all around the 5th fret: <b>Am</b> as an Em shape, <b>G</b> as a D shape, <b>D7</b> as an A7 shape.","Find G near fret 5: you know G is at fret 3 (E shape), and what connects above an E shape? The D shape. For D7: there's a D on the A string at fret 5, and the A string is the A7 shape's root string."],
   how:["Chords first (eight beats each) until the moves are automatic.","Then the arpeggios as written.","Start every chord on a root."]},
  {id:"b5",t:"Thick side first, thin side second",g:"prog",mode:"sides",beats:4,tonic:9,prog:[[0,"min","E"],[10,"maj","D"],[5,"dom","A"]],rate:"e",reps:kL([[9,4,2],[7,11,0],[5,1,6]],"min"),
   txt:["Through the progression twice: first time around only the <b>thick side</b> of each arpeggio, second time only the <b>thin side</b>.","This is the first taste of soloing with arpeggios: the progression's chords, played as melody, without leaving your spot."],
   how:["Thick side: low E to G string.","Thin side: D string to high e.","Same tempo, no stops."]},
  {id:"b6",t:"Any progression, anywhere",g:"prog",mode:"arps",beats:4,tonic:0,rate:"e",reps:[[{k:0,q:"maj",p:0,near:5},{k:9,q:"min",p:1,near:7},{k:7,q:"maj",p:2,near:9}],[{k:2,q:"maj",p:3,near:4},{k:4,q:"min",p:4,near:8},{k:5,q:"maj",p:5,near:10}],[{k:7,q:"maj",p:6,near:12},{k:9,q:"maj",p:7,near:5},{k:11,q:"min",p:8,near:6}]],
   txt:["The final practice session: a different progression in a different area of the neck every rep. The course chooses the shapes by proximity, the way you'll do it yourself: for each chord, the shape closest to where your hand already is.","Before pressing play, look at the chord names and try to find the shapes yourself. Then check against the fretboard."],
   how:["Read the progression (it's written in the rep).","Find each chord near the given fret, silently.","Play the arpeggios, root first, four beats each."]},
 ]},
 {id:"r",n:"Playbook: the rhythm section",d:"Plays 1–3. Music is a pyramid: drums at the bottom, then bass, then rhythm, then lead. We start where guitar starts, with bass lines and riffs made from arpeggios.",ls:[
  {id:"r1",t:"Play 1: one-chord bass groove (minor)",g:"groove",tonic:9,prog:[[0,"min","E"]],pats:[["0--0 1-2- 3-2- 1-0-","0--0 1-2- 3--4 -3-2"]],rate:"s",reps:kL([[9,7,11],[0,2,4],[5,10,1]],"min"),
   txt:["In jam band vamps, or when the band drops down behind a singer, someone plays a little bass line on one chord. On guitar you build it from the <b>thick side</b> of the chord's arpeggio.","Here: A minor, Em shape at fret 5. Root, b3, 5, octave, b3: syncopated, in sixteenths. Everyone else is holding the chord, and your line is made of the same ingredients, so it can't clash.","Come in on a root. The only interval you need to think about here is the 1."],
   how:["Play along with the backing chord turned on.","Lock the rhythm in first; play it on one note if you need to.","Then improvise your own groove from the same notes."]},
  {id:"r2",t:"Play 1: one-chord groove (major, 7th, D shape)",g:"groove",qr:1,tonic:7,prog:[[0,"maj","E"]],pats:[["0-0- 1-2. 3-.- 2-1-","0-0- 1-2. 3-4- 3-2-"]],rate:"s",reps:[[{k:7,q:"maj"},{k:9,q:"maj"},{k:5,q:"maj"}],[{k:11,q:"dom"},{k:9,q:"dom"},{k:4,q:"dom"}],[{k:5,q:"maj",S:"D"},{k:7,q:"maj",S:"D"},{k:10,q:"maj",S:"D"}]],
   txt:["Same idea on a major chord (G, E shape), then on 7th chords (B7 in the E7 shape: 1 3 5 b7 make a classic jam-band bass line), then on a <b>D-shape</b> chord, where the thick side starts on the 3: 3 5 1 3.","Pick the chord's root strings in advance, so you know where your groove can start."],
   how:["Find the thick side of each shape.","Play the written groove, then improvise for a few loops.","Try a groove that ends on the b7 for the 7th chords."]},
  {id:"r3",t:"Play 2: two-chord groove",g:"groove",tonic:9,prog:[[0,"min","E"],[10,"maj","E"]],pats:["0-1- 2-3- 4-3- 0---","0-1- 2-3- 4-3- 0---"],rate:"s",reps:kL([[9,4,2],[7,11,0],[5,1,6]],"min"),
   txt:["Two chords going back and forth: <b>Am to G</b>. In a bass role you <b>chase the root</b>: E-minor shape at fret 5 for Am, E shape at fret 3 for G.","The trick is the same theme on both chords: 1 b3 5 1 b3 1, then 1 3 5 1 3 1. A symmetrical groove, and only the 3 changes."],
   how:["Play the written groove.","Then make up your own theme and move it between the chords.","Get a looper or use the backing chords and groove for a few minutes."]},
  {id:"r4",t:"Play 2: multi-chord bass line",g:"groove",tonic:11,prog:[[0,"maj","E"],[10,"maj","E"]],pats:[["0--1 -2-3 -2-1 0-a-"],["0--1 -2-3 -2-1 0-a-"]],rate:"s",reps:kL([[11,9,7],[2,4,0],[5,10,1]],"maj"),
   txt:["B to A, both E shapes: the same groove shape slid two frets. Then try your own: look at the chord shape you're on, take its thick side, and make a line that starts on the root.","The 'a' in the line is the note just below the root in the shape, which is often the 5, a strong pickup into the next bar."],
   how:["Loop the written line.","Change one rhythm, keep the notes.","Change one note, keep the rhythm."]},
  {id:"r5",t:"Play 3: two chords, one riff (D shape)",g:"riff",tonic:7,prog:[[0,"maj","D"],[10,"maj","D"]],rh:"x--x --x- x-x- -x--",frag:[0,1,2,3,2,3],rate:"s",reps:kL([[7,9,2],[5,0,4],[10,11,3]],"maj"),
   txt:["A favourite rock move: play the first chord with a strong rhythm, then <b>hit the second chord once and finish the bar with a piece of its arpeggio</b>.","G (D shape at fret 5) to F (D shape at fret 3). The fragment comes from the thin side of the F arpeggio, played downwards from the top."],
   how:["Rhythm on chord 1, palm-mute lightly if you like.","One strum on chord 2, then the fragment.","Write your own fragment from the same arpeggio."]},
  {id:"r6",t:"Play 3: minor and 7th riffs",g:"riff",qr:1,tonic:2,prog:[[0,"min","E"],[10,"min","E"]],rh:"x-x- -x-x x--x --x-",frag:[0,1,2,3,4,3],rate:"s",reps:[[{k:2,q:"min"},{k:4,q:"min"},{k:9,q:"min"}],[{k:11,q:"dom",p7:1},{k:9,q:"dom",p7:1},{k:4,q:"dom",p7:1}],[{k:7,q:"min"},{k:0,q:"min"},{k:5,q:"dom",p7:1}]],
   txt:["The same play with minor chords (D minor to C minor, both E-minor shapes) and with 7th chords (B7 to A7, E7 shapes).","Use the 7th shapes you found easiest; this is rhythm guitar, so comfort wins."],
   how:["Rhythm on the first chord.","Hit, then arpeggio on the second.","Swap which chord gets the arpeggio."]},
 ]},
 {id:"p",n:"Playbook: chords into lines",d:"Plays 4–5. Make the chords disappear into pure arpeggios, then sew the arpeggios together by proximity: voice leading.",ls:[
  {id:"p1",t:"Play 4: make the chords disappear",g:"prog",mode:"dis",beats:4,dirs:[1,-1,1],tonic:7,R:8,prog:[[0,"min","C"],[5,"maj","E"],[10,"maj","A"]],rate:"e",reps:kL([[7,9,2],[0,4,5],[11,10,1]],"min"),
   txt:["A famous jam-band intro is just <b>G minor, C, F</b>, but the guitarist never plays the chords. He plays the <b>Cm-shape arpeggio</b> for Gm (thick to thin), the <b>E-shape</b> arpeggio for C (thin to thick), and the <b>A-shape</b> for F, all around frets 6–12.","It sounds like magic until you see it: it's exactly the 'bring the chords to you' practice, played as a composed line."],
   how:["Find the three shapes around fret 8.","Gm up from the root, C down from the top, F up again.","Then write your own: any 2–4 chords, chords replaced by arpeggios."]},
  {id:"p2",t:"Play 4: your own progression as arpeggios",g:"prog",mode:"dis",beats:4,tonic:0,R:5,prog:[[0,"maj"],[7,"maj"],[9,"min"],[5,"maj"]],rate:"e",reps:kL([[0,7,2],[9,4,5],[10,3,11]],"maj"),
   txt:["I – V – vi – IV, the most common progression in pop, with every chord replaced by its arpeggio, alternating up and down, all in one area of the neck.","Afterwards, make up your own direction pattern: up-up-down-down, or start each one from the 3."],
   how:["See all four shapes first.","Follow the directions in the tab.","Then compose your own version."]},
  {id:"p3",t:"Play 5: proximity playing",g:"prog",mode:"prox",beats:8,tonic:9,prog:[[0,"maj","E"],[5,"maj"]],R:6,rate:"e",reps:kL([[9,2,4],[7,0,11],[5,10,1]],"maj"),
   txt:["Arpeggio lines sound melodic when the chords <b>swing into each other</b>. The secret is called <b>voice leading</b>, or proximity playing: when the chord changes, don't jump to the new arpeggio's root; start on the <b>nearest note</b> of the new arpeggio to where you are.","Often it's a half step away: you end the A arpeggio on the G string fret 6 (C♯) and the D arpeggio is right there at fret 7 (D). One tiny step, and the change sounds sewn together."],
   how:["Play the line and listen to the moment of the chord change.","Find where you ended and the closest note of the next chord.","Make up your own line with the same rule."]},
  {id:"p4",t:"Play 5: proximity with minor chords",g:"prog",mode:"prox",beats:8,tonic:11,prog:[[0,"min"],[10,"min","D"]],R:8,rate:"e",reps:kL([[11,4,2],[9,7,0],[6,1,5]],"min"),

  {id:"p5",t:"Play 5: four chords, one line",g:"prog",mode:"prox",beats:4,tonic:9,prog:[[0,"min"],[8,"maj"],[3,"maj"],[10,"maj"]],R:6,rate:"e2",reps:kL([[9,4,2],[7,11,0],[5,1,6]],"min"),

  {id:"p6",t:"Guide tones through 7th chords",g:"prog",mode:"gt",beats:4,tonic:2,prog:[[0,"dom"],[5,"dom"],[0,"dom"],[7,"dom"]],R:7,rate:"e2",reps:kL([[2,9,4],[7,0,5],[10,3,11]],"dom"),
   txt:["The strongest notes to land on at a chord change are the <b>3 and the b7</b>, the notes that define a 7th chord. They're called <b>guide tones</b>.","In this line, every chord change lands on the nearest 3 or b7 of the new chord. It's a blues-style progression (I7 – IV7 – I7 – V7) and you'll hear how it spells out the changes."],

  {id:"s10",t:"Play 7: motif on a doubled chord",g:"motif",tonic:2,R:8,prog:[[0,"maj","G"],[7,"maj","C"],[5,"maj","C"],[5,"maj","C"]],roles:["p","p","m","m"],rate:"t2",reps:kL([[2,7,9],[4,0,5],[11,10,1]],"maj"),
   txt:["<b>D – A – G – G</b>: the G lasts two bars. That doubled chord is where motif runs live (Slash does this all the time). Solo with the D major pentatonic (the B minor box at fret 7) and when the G arrives, run the motif off the <b>C-shape G</b> right where your scale is. The D chord itself is the G shape at fret 7, the chord that sits inside pentatonic form 1.","First bar of G: groups going up. Second bar: coming down."],

  {id:"s11",t:"Play 8: the juice of 7th chords",g:"seventh",tonic:2,prog:[[0,"maj"],[5,"maj"],[7,"dom","D"],[0,"maj"]],R:8,boxNear:8,rate:"e2",reps:kL([[2,7,9],[4,0,5],[10,3,11]],"maj"),

  {id:"s20",opt:1,t:"The last word in the chord name",rate:"lx",sc:"dor",reps:[[{k:9},{k:4},{k:2}],[{k:7},{k:11},{k:0}],[{k:6},{k:5},{k:1}]],lick:"<Am7:4> 4:7@.5 4:9 3:7@1 3:5@.5 4:9@.5 4:7@1 | <C:4> 2:5@.5 3:5 4:5 4:7@1.5 2:5@1 | <D:4> 3:7@.5 2:7 1:5@1 2:7@.5 3:7@.5 2:7@1 | <C:4> 3:5@.5 2:5 3:5 4:9@2.5",
   txt:["Over <b>Am11 – C6 – D – Cmaj7</b>, the note to feature is usually <b>the last word in the chord's name</b>: the 9 and 11 of Am11 (B and D), the <b>6</b> of C6 (A), the <b>major 3</b> of D (F#), the <b>major 7</b> of Cmaj7 (B). A composer only writes Am11 or C6 because that note matters to the sound, so put it in the melody.","Find each note from the chord's major triad with the interval compass, and stay in one small area of the neck. A tight melody next to the chords sounds more composed than one that runs all over the fretboard.","The backing plays simple versions of the chords (Am7, C, D, C); your melody adds the extensions. The faint scale is A Dorian, the key's notes with the D chord's F#."],

/* ===================== Lead technique engine: licks written in A minor, bends and vibrato as pitch curves ===================== */
const KN=["C","C#","D","Eb","E","F","F#","G","G#","A","Bb","B"];

const SCL={mj:{n:"major scale",iv:[0,2,4,5,7,9,11]},dor:{n:"Dorian",iv:[0,2,3,5,7,9,10]},mp:{n:"minor pentatonic",iv:[0,3,5,7,10]},bl:{n:"blues scale",iv:[0,3,5,6,7,10]},nm:{n:"natural minor",iv:[0,2,3,5,7,8,10]}};
const LKEYS=[[9,4,2],[7,11,0],[6,5,1]]; // stage I, II, III: A E D · G B C · F# F C#

/* ===================== Licks: written once in A minor, moved to any key =====================
   token  = [prefix] string:fret [mods] [@duration]   (duration in beats, carries forward; 1/3 allowed)
   prefix : h hammer-on · p pull-off · ^ slide from the previous note (no new pick)
   mods   : b1 bend (½ ¼ 1 1½ as .5 .25 1 1.5) · br1 bend and release · pb1 pre-bend · pr1 pre-bend and release
            q1-0-1-0 square bend steps · c1-0-1-0 circular bend · ~ vibrato (~w wide, ~t triplet speed, ~s slow, ~c classical)
            m / a hybrid finger · ! accent · g ghost note · v.4 volume
   [3:7b1+2:5] notes together · r@2 rest · | bar line · <Am:4> backing chord for 4 beats (doesn't move time) */
function parseLick(src){
  const out=[],re=/<([A-G][#b]?)(m|7|m7)?:([\d.\/]+)>|\||(\^?)\[([^\]]+)\]((?:@[\d.\/]+)?)|r@([\d.\/]+)|([hp^]?)(\d):(\d+)([^\s@]*)((?:@[\d.\/]+)?)/g;
  const num=x=>x.includes("/")?x.split("/").reduce((a,b)=>Number(a)/Number(b)):Number(x);
  let m,dur=1;
  while((m=re.exec(src))){
    if(m[1]){out.push({k:"ch",root:"C C# D Eb E F F# G G# A Bb B".split(" ").indexOf(m[1].replace("Db","C#")),q:m[2]||"",d:num(m[3])});continue;}
    if(m[0]==="|"){out.push({k:"bar"});continue;}
    if(m[7]){out.push({k:"rest",d:num(m[7])});continue;}
    if(m[5]){if(m[6])dur=num(m[6].slice(1));out.push({k:"grp",slide:!!m[4],d:dur,ns:m[5].split("+").map(x=>tok(x.trim()))});continue;}
    if(m[12])dur=num(m[12].slice(1));
    out.push({k:"n",...mods(m[8],Number(m[9]),Number(m[10]),m[11]),d:dur});}
  function tok(x){const t=/^([hp^]?)(\d):(\d+)(.*)$/.exec(x);return mods(t[1],Number(t[2]),Number(t[3]),t[4]);}
  function mods(pre,s,f,ms){const o={s,f};if(pre==="h")o.tech="h";else if(pre==="p")o.tech="p";else if(pre==="^")o.tech="sl";
    let x;
    if((x=/(br|pr|pb|b)(\d*\.?\d+)/.exec(ms))){o.bt=x[1];o.bend=Number(x[2])*2;}
    if((x=/([qc])((?:\d*\.?\d+-?)+)/.exec(ms))){o.bt=x[1];o.steps=x[2].split("-").filter(Boolean).map(v=>Number(v)*2);o.bend=Math.max(...o.steps);}
    if((x=/~([wtsc]*)/.exec(ms))){const z=x[1];o.vib=z.includes("c")?{w:.3,hz:5.5,sym:1}:{w:z.includes("w")?1:.5,r:z.includes("t")?3:z.includes("s")?1:2};}
    if(/(^|[^\d.])m/.test(ms))o.fg="m";if(/a/.test(ms.replace(/pa|ma/g,"")))o.fg=o.fg||"a";
    if(ms.includes("!"))o.acc=1;if(/(^|[^\d.])g/.test(ms))o.gh=1;
    if((x=/v(\d*\.?\d+)/.exec(ms)))o.v=Number(x[1]);
    return o;}
  return out;}
/* a lick's fret range in A, so a key can be placed where it fits on the neck */
function lickRange(toks){let lo=99,hi=-1;toks.forEach(t=>{(t.k==="n"?[t]:t.k==="grp"?t.ns:[]).forEach(n=>{lo=Math.min(lo,n.f);hi=Math.max(hi,n.f+Math.ceil(n.bend||0));});});return [lo,hi];}
function shiftFor(L,k){const [lo,hi]=lickRange(parseLick(L.lick)),d0=mod(k-9,12),min=L.minF||1,max=21;
  const ok=[d0-12,d0].filter(d=>lo+d>=min&&hi+d<=max);if(ok.length)return ok.sort((a,b)=>Math.abs(a)-Math.abs(b))[0];
  return [d0-12,d0].sort((a,b)=>Math.max(0,min-lo-a,hi+a-max)-Math.max(0,min-lo-b,hi+b-max))[0];}
const LQS={"":"",m:"m","7":"7",m7:"m7"};
function chordTones(root,q){const r=45+mod(root-9,12),th=q.startsWith("m")?3:4,t=[r,r+7,r+12,r+12+th];if(q.includes("7"))t.push(r+10+12);return t;}

/* build the exercise: events on a beat grid */
function buildLick(L,R){
  const toks=parseLick(L.lick),d=shiftFor(L,R.k),key=mod(R.k,12),ev=[],bk=[],ch=[],dv=L.dyn?.5:.75;let b=0,last={};
  const put=(n,dd,extra)=>{const f=n.f+d,e={...nt(n.s,f,key),b:r12(b),d:dd,...extra};
    ["tech","bt","bend","steps","vib","fg","acc","gh","v"].forEach(k=>{if(n[k]!=null)e[k]=n[k];});
    if(e.tech==="sl"){const p=last[n.s];e.tech=p&&p.f>f?"\\":"/";}
    if(e.v==null)e.v=e.gh?.15:e.acc?1:dv;
    bendShape(e);last[n.s]=e;ev.push(e);return e;};
  toks.forEach(t=>{
    if(t.k==="ch"){const r=mod(t.root+d,12);bk.push({b:r12(b),d:t.d,m:chordTones(r,t.q)});ch.push({b:r12(b),name:KN[r]+LQS[t.q]});return;}
    if(t.k==="bar"){const r=mod(-b,4);if(r>1e-6&&r<4-1e-6)b=r12(b+r);return;}
    if(t.k==="rest"){b=r12(b+t.d);return;}
    if(t.k==="n"){put(t,t.d);b=r12(b+t.d);return;}
    if(t.k==="grp"){const hy=t.ns.some(n=>n.fg),ord=t.ns.slice().sort((x,y)=>y.s-x.s);
      ord.forEach((n,i)=>put(t.slide?{...n,tech:"sl"}:n,t.d,hy||t.slide?{}:{role:"c",st:i}));b=r12(b+t.d);}});
  const total=Math.max(4,Math.ceil(b/4-1e-6)*4);
  if(!ch.length)ch.push({b:0,name:`${KN[key]} ${L.maj?"major":"minor"}`});
  /* the scale around the lick, faint on the fretboard */
  const fs=ev.map(e=>e.f),lo=Math.max(0,Math.min(...fs)-1),hi=Math.max(...fs)+1,sc=SCL[L.sc||"mp"].iv,box=[];
  for(let s=1;s<=6;s++)for(let f=lo;f<=hi;f++)if(sc.includes(mod(OPEN[s]+f-key,12)))box.push({...nt(s,f,key),sc:1});
  const ghost=[];ev.forEach(e=>{if(e.bend>=1&&e.bend%1===0){const g=nt(e.s,e.f+e.bend,key);ghost.push({...g,gh:"ext"});}});
  return {ev,ch,bk,total,meter:4,box:{notes:box},ghost,shift:d,key,dyn:!!L.dyn,lead:true};}

/* pitch movement of one note: start offset, then glides (beats from the note's start), then vibrato */
function bendShape(e){const d=e.d,gl=x=>Math.min(x,d*.4);e.auto=[];e.pb=0;
  switch(e.bt){
    case "b":e.auto.push({at:0,to:e.bend,gl:e.bend<1?gl(.25):gl(.5)});break;
    case "br":e.auto.push({at:0,to:e.bend,gl:gl(.5)},{at:d*.55,to:0,gl:gl(.5)});break;
    case "pb":e.pb=e.bend;break;
    case "pr":e.pb=e.bend;e.auto.push({at:Math.min(.5,d*.3),to:0,gl:gl(.5)});break;
    case "q":{const st=d/e.steps.length;e.steps.forEach((v,i)=>e.auto.push({at:i*st,to:v,gl:Math.min(.08,st*.3)}));break;}
    case "c":{const st=d/e.steps.length;e.steps.forEach((v,i)=>e.auto.push({at:i*st,to:v,gl:st}));break;}}
  if(e.vib){const end=e.auto.length?e.auto[e.auto.length-1].at+e.auto[e.auto.length-1].gl:0;
    e.vib={...e.vib,del:Math.max(end,Math.min(.25,d*.2)),dn:e.bend&&e.bt==="b"?1:0};}
  if(!e.auto.length&&!e.pb&&!e.vib)delete e.auto;}
function semiAt(e,tb,sec){let cur=e.pb||0;
  for(const p of e.auto||[]){if(tb<p.at)break;if(tb<p.at+p.gl){const k=(tb-p.at)/Math.max(1e-3,p.gl);cur=cur+(p.to-cur)*(.5-.5*Math.cos(Math.PI*k));break;}cur=p.to;}
  const v=e.vib;if(v&&tb>v.del){const t=tb-v.del,amp=v.w*Math.min(1,t/.35),ph=v.hz?t*sec*v.hz:t*v.r;
    if(v.sym)cur+=amp/2*Math.sin(2*Math.PI*ph);else cur+=(v.dn?-1:1)*amp*(.5-.5*Math.cos(2*Math.PI*ph));}
  return cur;}

/* ===================== Technique levels: chapters 1–11 of a rock-lead technique book ===================== */
Object.assign(TEMPI,{ear:[50,60,70],le:[60,80,100],ls:[50,65,80],lb:[60,70,80],lt:[50,65,80],lv:[60,70,80],lx:[70,85,100]});
const LLEVELS=[
 {id:"La",n:"Core soloing techniques",d:"Clean alternate picking through the box, muting what you don't play, and slides: between notes, into notes and between positions.",ls:[
  {id:"La1",t:"Alternate picking through the box",rate:"le",sc:"mp",lick:"6:5@.5 6:8 5:5 5:7 4:5 4:7 3:5 3:7 | 2:5 2:8 1:5 1:8 1:5 2:8 2:5 3:7 | 3:5 4:7 4:5 5:7 5:5 6:8 6:5@1",
   txt:["Everything in rock lead sits on the <b>minor pentatonic box</b>: two notes per string, five notes per octave, and almost no wrong notes over a minor or blues backing.","Pick strictly <b>down–up</b> all the way through, even when you cross strings. Small, relaxed pick strokes are the goal: the tip of the pick should only just pass the string.","Each rep moves the box to another key, so your hand gets used to the bigger frets low on the neck and the tight frets up high."],
   how:["Index finger on the lower fret of every string, ring or pinky on the upper.","Keep the pick motion from the wrist, not the elbow.","Listen for every note the same volume and length."]},
  {id:"La2",t:"Muting the strings you aren't playing",rate:"le",sc:"mp",lick:"6:5@.5 4:5 5:5 3:5 4:5 2:5 3:5 1:5 | 1:8 3:7 2:8 4:7 3:7 5:7 4:7 6:8 | 6:5@2 r@2",
   txt:["Loud, driven guitar makes every untouched string ring. Good lead players kill that noise with <b>both hands</b>.","The <b>picking hand</b> rests its palm edge on the thicker strings below the one you play. The <b>fretting hand</b> lets the underside of the index finger lightly touch the thinner strings above.","This exercise skips a string every time, which is where noise sneaks in. If you hear anything ring after you leave a string, slow down and find which hand should be covering it."],
   how:["Play it once loudly with no muting to hear the problem.","Then add the palm on the low strings and the index finger on the high ones.","Stop the last note dead at the rest."]},
  {id:"La3",t:"Slides between notes",rate:"lb",sc:"mp",lick:"3:5@.5 ^3:7@1.5 2:5@1 2:8@1 | 2:8@.5 ^2:10@1.5 1:8@1 1:10@1 | 1:10@.5 ^1:8@.5 2:10@.5 ^2:8@.5 3:9@.5 ^3:7@.5 3:5@1 | 4:7@4",
   txt:["A <b>legato slide</b> is one pick stroke and two notes: pick the first, keep the finger pressed and glide to the second. The <b>/</b> and <b>\\</b> in the tab mean don't pick again.","Keep the same pressure all the way. Press too hard and the slide stalls; too lightly and the note dies halfway.","Slides are also your bus between box positions: three of these slides move you out of the first box into the next one up."],
   how:["Watch the target fret, not the fret you start on.","Arrive exactly on the count; don't drift into the note late.","Use the same finger for both notes of a slide."]},
  {id:"La4",t:"Sliding into a note",rate:"lb",sc:"mp",lick:"3:5@.25 ^3:7@.75 2:5@.5 2:8@.5 2:5@.5 3:7@1.5 | 2:6@.25 ^2:8@.75 1:5@.5 2:8@.5 2:5@.5 3:7@.5 3:5@1 | 4:5@.25 ^4:7@1.75 r@2",
   txt:["A <b>grace slide</b> starts a fret or two below the note and arrives almost at once. It's how a singer scoops up into a note, and it makes a plain line sound vocal.","The starting fret hardly sounds: it's a 16th note at most. What matters is that the target note lands on the beat.","One of these starts on a fret outside the scale. That's fine: a note you slide through only adds colour."],
   how:["Pick the lower fret slightly before the beat in your head.","Slide fast and stop dead on the target fret.","Add vibrato to the held notes once the slides are easy."]},
  {id:"La5",t:"Shifting position with slides",rate:"lb",sc:"mp",lick:"6:5@.5 6:8 5:5 5:7 ^5:10@1 4:7@.5 4:10@.5 | ^4:12@1 3:9@.5 3:12@.5 ^3:14@1 2:13@.5 2:15@.5 | 1:12@2 r@2",
   txt:["Staying in one box makes every solo sound the same. A slide on one string lets you walk diagonally up the neck, box to box, without a gap.","This run climbs from the first box to the fourth by sliding on the A, D and G strings, then lands high on the first string.","Learn which finger arrives on each slide: here it's the <b>ring finger</b> each time, which leaves the index ready for the next string."],
   how:["Say the box you're in as you slide into it.","Slide in time; the slide is part of the rhythm.","Repeat bars 1 and 2 on their own until the shifts are automatic."]},
  /* Ear lessons (opt): from Eli Koskoff, "The Ultimate Exercise to Freely Express Yourself on Guitar". Hear it → sing it → see it → play it.
     Written in A MAJOR (maj:1); they count towards reps but never hold a level shut, and the daily session gives one ear rep each time. */
  {id:"La6",opt:1,ear:1,maj:1,t:"Ear: sing the major scale by numbers",rate:"ear",sc:"mj",lick:"<A:4> 6:5@2 r@2 | <A:4> r@1 6:7@1 r@1 5:4@1 | <A:4> r@1 5:5@1 r@1 5:7@1 | <A:4> r@1 4:4@1 r@1 4:6@1 | <A:4> r@1 4:7@3 | <A:4> r@1 4:6@1 r@1 4:4@1 | <A:4> r@1 5:7@1 r@1 5:5@1 | <A:4> r@1 5:4@1 r@1 6:7@1 | <A:4> r@1 6:5@3",
   txt:["Free expression means playing what you hear in your head, and that starts with the ear, not the fingers. This is a daily ear rep: one octave of the <b>major scale</b> over a major chord, with a gap before every note.","In each gap, <b>sing the next note first</b> and say its number out loud ('one', 'two', 'three'…). Then play it to check. The number to sing is printed under each tab note. You don't need note names: think only in numbers and every key becomes the same.","The major scale is all <b>whole steps</b> (two frets) except <b>3→4</b> and <b>7→1</b>, which are <b>half steps</b> (one fret). Give each a sound you already know: the two-note <b>Jaws</b> theme for a half step, the opening riff of <b>“You Really Got Me”</b> for a whole step. Each rep changes key, so you calibrate a fresh 'one' with your voice every time."],
   how:["Hum the root against the backing chord until your voice sits on it, and call it 'one'.","Sing before you play, never after. If the fret doesn't match your voice, sing again before going on.","Listen hardest at 3–4 and 7–1: they should feel smaller. When it's easy, sing and play together up and down."]},
  /* Video extras (opt, never gate a level): from Brian Kelly, Zombie Guitar, "Step-by-Step Guide to Playing Beautiful, Melodic Guitar Solos" */
  {id:"La7",opt:1,t:"Find box 1 from either root, then widen it",rate:"le",sc:"mp",lick:"6:3@.5 6:5 5:3 5:5 5:7 4:5 4:7 3:5 | 3:7 3:9 2:8 2:10 1:8 1:10 1:8 2:10 | 2:8 3:9 3:7 3:5 4:7 4:5 5:7 5:5 | 5:3@.5 6:5@.5 6:3@1 6:5@2",
   txt:["Find <b>box 1</b> in any key from the chords' key: put your <b>index finger on the minor root</b> on the low E string, <i>or</i> your <b>pinky on the major root</b>. In A minor that's the index on fret 5 (A) or the pinky on fret 8 (C). Both land on the same box, because a minor key and its relative major (A minor and C major) share the same notes and the same shapes.","Then widen the box diagonally. Take a <b>lower extension</b> from the box below it (box 5) on the thick strings and an <b>upper extension</b> from the box above (box 2) on the thin strings. That gives you about eight frets of the same five notes. This run climbs that diagonal and comes back.","This is 'layer 1' of soloing: play only from the key and ignore the chords for now. Any note in this framework will sound right over the backing."],
   how:["Say 'minor root, index' and 'major root, pinky' each time a rep moves you to a new key.","Watch the frets jump: 3–5 on the low strings, 5–7 in the middle, 8–10 on top.","Afterwards, improvise for a minute in this framework without leaving it."]},
 ]},
 {id:"Lb",n:"String bending",d:"Whole-step, half-step and quarter-tone bends, bend and release, and the bigger bends, always checked against the pitch you're aiming for.",ls:[
  {id:"Lb1",t:"Bend to a reference pitch",rate:"lv",sc:"mp",lick:"3:9@1 3:7b1@2 r@1 | 2:10@1 2:8b1@2 r@1 | 1:10@1 1:8b1@2 r@1 | 3:9@1 3:7b1@3",
   txt:["A bend is only as good as where it ends. Every bend in this lesson is preceded by its <b>target note</b>: play the fret two higher, hear it, then bend up until the bent note matches.","Bend with <b>three fingers</b> on the string (ring finger bending, middle and index behind it pushing too) and turn the wrist as if turning a door handle. The fingers alone aren't strong enough.","On the G, B and high e strings you push the string up towards the ceiling."],
   how:["Sing the target note before you bend.","Stop the bend when the pitch matches. Overshooting is as wrong as falling short.","Let the thumb hook over the top of the neck for leverage."]},
  {id:"Lb2",t:"Whole-step bends in licks",rate:"lb",sc:"mp",lick:"1:5@.5 2:8@.5 2:5@.5 3:7b1@2.5 | 3:7b1@1 2:5@.5 2:8@.5 1:5@2 | 2:8b1@1.5 1:5@.5 2:8@.5 2:5@.5 3:7@1 | 4:7@4",
   txt:["The two most-used bends in rock both go up a <b>whole step</b> (two frets): the <b>4 up to the 5</b> on the G string, and the <b>b7 up to the root</b> on the B string.","Both land on strong notes of the key, which is why they sound so final. The fretboard shows the bend's target as an open circle.","The bent note here has a definite rhythm: it starts on the count, reaches pitch quickly, and holds."],
   how:["Reach pitch fast and hold it steady.","Don't let the bend sag while you hold it.","Mute the string below with the side of the bending finger."]},
  {id:"Lb3",t:"Half-step bends and the blue note",rate:"lb",sc:"bl",lick:"3:7b.5@1 3:7@1 3:5@1 4:7@1 | 3:5b.5@1 4:7@1 4:5@2 | 3:7b.5@.5 3:7@.5 3:5@.5 4:7@.5 3:7b1@2 | 4:7@4",
   txt:["A half-step bend moves one fret. From the <b>4</b> it reaches the <b>b5</b>, the 'blue note' that gives blues its tension. From the <b>b3</b> it reaches the major 3: the sound of minor and major rubbing together.","Half-step bends are harder to get in tune than whole steps because the movement is small. Check by playing the next fret first."],
   how:["Use the ring finger with the middle behind it.","Compare with the fret above until you can hear the half step without checking.","Make the difference between the half and whole bend obvious."]},
  {id:"Lb4",t:"Quarter-tone curls",rate:"lb",sc:"mp",lick:"1:8b.25@1 1:5@.5 2:8@.5 2:5@1 3:7@1 | 3:5b.25@.5 4:7@.5 4:5@1 5:7b.25@1 5:5@1 | 6:8b.25@.5 6:5@.5 r@3",
   txt:["A <b>curl</b> is a tiny bend, less than a fret, usually on the <b>b3</b>. It doesn't reach another note; it just pulls the pitch slightly sharp, between minor and major.","Blues players do this all the time, often without thinking. It's a small twist of the fingertip, not a full wrist bend.","On the thick strings you pull the string down towards the floor instead of pushing it up."],
   how:["Pick the note and nudge it sharp straight away.","Keep it small: if it sounds like the next fret, it's too far.","Try it on every b3 you play in solos."]},
  {id:"Lb5",t:"Bend and release",rate:"lb",sc:"mp",lick:"3:7br1@2 3:5@1 4:7@1 | 2:8br1@2 2:5@1 3:7@1 | 1:8br1@1 1:5@.5 2:8@.5 2:5@.5 3:7@.5 3:5@1 | 4:7@4",
   txt:["Bend up, then let the string back down to the fretted pitch without picking again. The release is a note in its own right, so it has to land in tune and in time.","Control the way down: the string wants to snap back. Keep the fingers pressing and lower it as slowly as you raised it.","In the tab, <b>(9)</b> shows the pitch you bend to and <b>r7</b> where you release to."],
   how:["Count: up on the beat, release halfway through the note.","Keep the string pressed on the way down so it keeps sounding.","Pick only once per bend."]},
  {id:"Lb6",t:"Bigger bends: one and a half steps",rate:"lv",sc:"mp",lick:"1:8@1 2:10b1.5@2 r@1 | 2:10b1.5@1.5 1:8@.5 1:5@.5 2:8@.5 2:5@1 | 3:7b1@4",
   txt:["A <b>1½-step bend</b> (three frets) takes the root up to the b3. It's a big, crying sound, and it's hard work: the string moves a long way.","Light strings help; strong technique helps more. Use all three fingers, and drive the movement from the wrist rotation.","Check the target first: it's the b3 on the high e string, right next door."],
   how:["Warm up with whole-step bends first.","Go slowly, and stop if the hand gets sore.","Expect this one to take weeks to get fully in tune."]},
  {id:"Lb7",opt:1,ear:1,maj:1,t:"Ear: hear an interval, see it, then play it",rate:"ear",sc:"mj",lick:"<A:4> 6:5@1 r@1 5:4@2 | <A:4> 6:5@1 5:4@1 6:5@1 5:4@1 | <A:4> 6:5@1 r@1 5:5@2 | <A:4> 6:5@1 5:5@1 6:5@1 5:5@1 | <A:4> 6:5@1 r@1 5:7@2 | <A:4> 6:5@1 5:7@1 6:5@1 5:7@1 | <A:4> 6:5@1 r@1 4:4@2 | <A:4> 6:5@1 4:4@1 6:5@1 4:4@1 | <A:4> 6:5@1 r@1 4:6@2 | <A:4> 6:5@1 4:6@1 6:5@1 4:6@1",
   txt:["Bending taught you to aim at a pitch you can already hear. Now jump straight from the root to one note: the <b>3rd</b>, <b>4th</b>, <b>5th</b>, <b>6th</b> and <b>7th</b>, two bars each. Play the root, <b>sing the target in the gap</b>, then play it to check; the second bar swaps between the two so the distance sinks in.","If you can't hear the jump yet, sing up the scale to it first (1-2-3), then sing just the jump (1… 3, 1… 3) until you don't need the steps in between. A tune you know helps too: pick one that starts with that jump and use it as your reference.","Then <b>see it before you play it</b>. From a root on the low E or A string every interval is a fixed shape: <b>3rd</b> next string, one fret back · <b>4th</b> next string, same fret · <b>5th</b> next string, two frets up (the power chord) · <b>6th</b> two strings over, one fret back · <b>7th</b> two strings over, one fret up. (Shapes that cross onto the B string move up one fret.) Play it as if it had to be right first time."],
   how:["Don't touch the guitar again until you've sung the target.","Say the number as you play it.","Learn them in this order. The 6th and 7th are big jumps; if one won't come, sing up the scale to it again."]},
 ]},
 {id:"Lc",n:"Legato",d:"Hammer-ons, pull-offs, rolls and trills: notes sounded by the fretting hand, for smooth, fast, vocal lines.",ls:[
  {id:"Lc1",t:"Hammer-ons",rate:"le",sc:"mp",lick:"6:5@.5 h6:8 5:5 h5:7 4:5 h4:7 3:5 h3:7 | 2:5 h2:8 1:5 h1:8@2.5",
   txt:["Pick the lower note, then bring a finger down hard on the higher fret so it sounds without picking. That's a <b>hammer-on</b>.","Hammer from the knuckle with the fingertip, right behind the fret. The hammered note should be nearly as loud as the picked one.","Only the first note on each string is picked here: the pick stroke rows show where."],
   how:["Lift the hammering finger only a little; speed comes from a short distance.","Keep the index finger pressed while you hammer.","Match the volumes of the two notes."]},
  {id:"Lc2",t:"Pull-offs",rate:"le",sc:"mp",lick:"1:8@.5 p1:5 2:8 p2:5 3:7 p3:5 4:7 p4:5 | 5:7 p5:5 6:8 p6:5@2.5",
   txt:["A <b>pull-off</b> is the reverse: both fingers down, pick the higher note, then flick the top finger off the string sideways so the lower note sounds.","Don't just lift the finger: that gives a weak, quiet note. Pull slightly down towards the floor, as if plucking the string with the fretting finger.","The lower finger must already be in place and pressing before you pull."],
   how:["Plant both fingers before you pick.","Flick down and away from the string.","Mute the next string with the pulling finger as it lands."]},
  {id:"Lc3",t:"Hammer-pull triplets",rate:"lt",sc:"mp",lick:"1:5@1/3 h1:8 p1:5 2:5 h2:8 p2:5 3:5 h3:7 p3:5 4:5 h4:7 p4:5 | 3:5 h3:7 p3:5 2:5 h2:8 p2:5 1:5 h1:8 p1:5 1:8@1",
   txt:["Pick, hammer, pull: three notes, one pick stroke. As triplets this is one of the most-used rock licks there is, and it rolls round smoothly.","Count 'one-tri-let, two-tri-let'. The picked note falls on each count, so the picking hand is only playing quarter notes."],
   how:["Accent the picked note slightly so the triplets keep their shape.","Keep the index finger anchored on its fret the whole time.","Speed up only when all three notes are even."]},
  {id:"Lc4",t:"Trills",rate:"ls",sc:"mp",lick:"3:5@.25 h3:7 p3:5 h3:7 p3:5 h3:7 p3:5 h3:7 3:5@2 | 2:5@.25 h2:8 p2:5 h2:8 p2:5 h2:8 p2:5 h2:8 2:5@2",
   txt:["A <b>trill</b> is a fast run of hammer-ons and pull-offs between two notes from a single pick. It builds stamina for every other legato move.","Start in time as 16th notes. Real trills are faster and looser, but the even version is what makes the fast one clean."],
   how:["Only the top finger moves.","Keep the volume up to the last note; it fades if the pull-offs get lazy.","Rest the hand between reps; trills tire the fingers quickly."]},
  {id:"Lc5",t:"Legato runs: one pick per string",rate:"ls",sc:"mp",lick:"6:5@.25 h6:8 5:5 h5:7 4:5 h4:7 3:5 h3:7 2:5 h2:8 1:5 h1:8 p1:5 2:8 p2:5 3:7 | p3:5 4:7 p4:5 5:7 p5:5 6:8 p6:5@2.5",
   txt:["Put the last three lessons together: pick only the first note on each string and let hammer-ons carry you up, pull-offs carry you down.","Played fast this is the fluid, horn-like sound of players like Satriani and Gilbert. Played slow it's just as useful for smooth melodies."],
   how:["Every string change gets one pick stroke, down going up and up coming down.","The fretting hand does most of the work; keep the pick light.","Make sure every note is equally loud."]},
 ]},
 {id:"Ld",n:"Vibrato",d:"Classical finger vibrato and modern rock wrist vibrato, narrow and wide, at speeds locked to the beat.",ls:[
  {id:"Ld1",t:"Classical vibrato",rate:"lv",sc:"nm",lick:"3:7~c@4 | 2:5~c@4 | 2:8~c@2 1:5~c@2 | 4:7~c@4",
   txt:["Classical guitarists rock the fingertip <b>along the string</b>, towards and away from the nut. The pitch moves a little either side of the note: subtle, warm, and fast.","It works best on nylon strings and for clean, melodic tones. On a rock guitar it's a gentle shimmer for ballads.","Your finger stays on the same spot of the string; the hand rocks from side to side."],
   how:["Press, then rock the whole hand gently along the neck.","Keep it even and fairly fast; this is colour, not drama.","Compare it with the rock vibrato in the next lesson."]},
  {id:"Ld2",t:"Rock vibrato: narrow and in time",rate:"lv",sc:"mp",lick:"3:7~s@4 | 3:7~@4 | 3:7~t@4 | 2:8~@2 1:5~@2",
   txt:["Rock vibrato is a <b>series of tiny bends</b>: push the string up and let it back, over and over, driven by rotating the wrist like the bend lesson.","The pitch only goes <b>above</b> the note, never below. Good vibrato is <b>in time</b>: here the cycles go in quarter notes, then 8ths, then triplets.","Width here is about a quarter tone, just enough to make the note sing."],
   how:["Pivot from the wrist with the thumb over the neck.","Lock each wave to the count of the click.","Return fully to the true pitch each time."]},
  {id:"Ld3",t:"Wide vibrato",rate:"lv",sc:"mp",lick:"2:8~w@4 | 1:5~w@4 | 1:8~w@2 1:5~w@2 | 3:7~w@4",
   txt:["Make each wave a full <b>half step</b>: the heavy, aggressive vibrato of blues-rock players. Wide vibrato sounds wrong if it's fast, so it's usually in 8ths or slower.","This is the same wrist rotation as before, just bigger. If it wobbles out of time, narrow it back down and build up."],
   how:["Check the width: the top of each wave should reach the next fret's pitch.","Keep the rhythm even; wide and uneven sounds out of control.","Try it on every finger, not just the ring finger."]},
  {id:"Ld4",t:"Vibrato on every finger",rate:"lv",sc:"mp",lick:"1:5~@2 2:8~@2 | 3:7~@2 3:5~@2 | 4:7~@2 4:5~@2 | 6:5~@4",
   txt:["Most players only have vibrato with the ring finger. In real solos the note you land on might be under any finger.","<b>Index finger</b> vibrato is the hardest: there is nothing behind it to help. Rotate the wrist and keep the finger firm.","On the D and low E strings, pull the string down towards the floor instead of pushing up."],
   how:["Say which finger you're using before each note.","Match the sound of the index-finger vibrato to the ring finger's.","Keep the other fingers off the string so they don't damp the note."]},
  {id:"Ld5",t:"Vibrato on the target note",rate:"lb",sc:"mp",lick:"1:5@.5 2:8 2:5 3:7 3:5 4:7~@1.5 | 3:5@.5 h3:7 2:5 2:8 1:5~@2 | 1:8@.5 1:5 2:8 2:5 3:7~w@2 | 4:7~@4",
   txt:["Vibrato belongs on the note a phrase is heading for: the long one at the end. Add it on every note and it means nothing.","Wait a moment before starting the vibrato. Hearing the note pure first and then the wave come in is what makes it sound expressive."],
   how:["Play the run evenly, then hold the last note.","Start the vibrato just after the note sounds.","Stop the vibrato together with the note, in time."]},
 ]},
 {id:"Le",n:"Advanced bending",d:"Pre-bends, pre-bend and release, pre-bend licks, and the square and circular bends that turn a bend into a rhythm.",ls:[
  {id:"Le1",t:"The pre-bend",rate:"lb",sc:"mp",lick:"3:7pb1@1 3:5@1 4:7@2 | 2:8pb1@1 2:5@1 3:7@2 | 1:8pb1@1 1:5@1 2:8@2 | 3:7pb1@1 3:5@1 4:7@2",
   txt:["Bend the string <b>before</b> you pick it, silently, then pick it already bent. The listener never hears the bend happen, only the note.","Because you can't hear the pitch until you pick, you have to know how far a whole step feels in your fingers. That's why we spent a whole level on bending in tune."],
   how:["Bend, then pick. Check the pitch against the fret two higher.","If it's out, adjust as fast as you can.","Mute the string with the pick hand while you prepare the bend."]},
  {id:"Le2",t:"Pre-bend and release",rate:"lb",sc:"mp",lick:"3:7pr1@2 3:5@1 4:7@1 | 2:8pr1@2 2:5@1 3:7@1 | 1:8pr1@2 1:5@1 2:8@1 | 2:8pr1@1 2:5@1 3:7@2",
   txt:["Pick the pre-bent note, then let it fall to the fretted pitch. It sounds like a note sighing downwards: a pure, vocal effect.","Shape the release: here it starts a little after the note and glides back. Slow releases sound sad; fast ones sound like a sob."],
   how:["Check the starting pitch, then release smoothly.","Keep the fingers pressed so the note doesn't die.","Make the released note arrive in tune."]},
  {id:"Le3",t:"Pre-bend licks",rate:"lb",sc:"mp",lick:"1:8pr1@1 p1:5@.5 2:8@.5 2:8pr1@1 p2:5@1 | 3:7pr1@1 p3:5@.5 4:7@.5 4:7@2 | 2:8pb1@.5 1:5@.5 2:8pr1@1 2:5@.5 3:7@.5 3:5@1 | 4:7~@4",
   txt:["Pre-bend, release, then pull off: three notes from one pick stroke, falling down the scale. It's one of the most recognisable sounds in rock lead.","The release must finish exactly when the pull-off starts, so think of it as one smooth movement down."],
   how:["Do bar 1 alone until the pull-off after the release is clean.","Keep the index finger planted before the release starts.","Add vibrato to the last note."]},
  {id:"Le4",t:"The square bend",rate:"lb",sc:"mp",lick:"3:7q1-0-1-0@4 | 2:8q1-0-1-0-1-0-1-0@4 | 1:8q1-0@2 1:5@.5 2:8@.5 2:5@1 | 3:7q1-0-1@3 4:7@1",
   txt:["Here the bend becomes a <b>rhythm</b>: up exactly on one count, down exactly on the next, with very fast moves in between. Drawn on a graph the pitch looks like a square wave, hence the name.","Pick only once. All the rhythm comes from the bending hand, so lock every movement to the click: quarter notes first, then 8ths."],
   how:["Move fast between the two pitches; hold still in between.","Count aloud: 'up, down, up, down'.","Both pitches must be in tune; check the bent one against the fret above."]},
  {id:"Le5",t:"The circular bend",rate:"lb",sc:"mp",lick:"3:7c1-0-1-0@4 | 2:8c1-0-1-0@4 | 3:7c1-0@2 2:5@1 3:7@1 | 4:7~@4",
   txt:["Now the opposite: bend up and down <b>continuously</b>, never stopping, so the pitch flows like a slow, deep wave. Each movement takes a whole beat.","It's like a very slow, very wide vibrato, and the hand moves in a smooth circle rather than in steps."],
   how:["Never stop moving: the top and bottom of each wave are only passing points.","Reach exactly a whole step at the top every time.","Compare it with the square bend: same notes, completely different feel."]},
 ]},
 {id:"Lf",n:"Unison bends and bend vibrato",d:"Bending one string to match another, broken unisons, vibrato on a held bend, and a mini solo built from bends.",ls:[
  {id:"Lf1",t:"Unison bends",rate:"lb",sc:"mp",lick:"[3:7b1+2:5]@4 | [2:8b1+1:5]@4 | [3:7b1+2:5]@2 [2:8b1+1:5]@2 | 4:7@4",
   txt:["Fret a note on the higher string and bend the lower string up to <b>the same pitch</b>, both ringing together. As the bend closes in you hear a fast wobble that slows and stops when they match.","That wobble is your tuner. If it speeds up again you've bent too far."],
   how:["Index finger on the higher string, ring finger bending the lower one.","Bend slowly the first few times and listen for the beating to stop.","Keep the fretted note pressed firmly; the bend tends to push it sharp."]},
  {id:"Lf2",t:"Broken unison bends",rate:"lb",sc:"mp",lick:"2:5@1 3:7b1@1 2:5@1 3:7b1@1 | 1:5@1 2:8b1@1 1:5@1 2:8b1@1 | 2:5@.5 3:7b1@.5 2:5@.5 3:7b1@.5 1:5@.5 2:8b1@.5 1:5@1 | 4:7@4",
   txt:["Play the two notes of a unison one after the other: fretted, then bent. It's a hard-edged, repetitive sound heard in countless rock solos.","Separated in time, you can't use the wobble to tune, so your ear has to compare the two notes directly."],
   how:["Keep both fingers down the whole time.","Bend fast so the bent note arrives in time.","At 8th notes, pick down on the fretted note, up on the bend."]},
  {id:"Lf3",t:"Bend vibrato",rate:"lv",sc:"mp",lick:"3:7b1~@4 | 2:8b1~@4 | 1:8b1~@2 1:5~@2 | 3:7b1~w@4",
   txt:["Hold a bend, then add vibrato by <b>releasing slightly</b> and pushing back up, again and again. The bent pitch is the top of the wave.","It's the hardest vibrato because the fingers are already carrying the string's tension. Done well, it's the most singing sound a guitar makes."],
   how:["Get the bend in tune and steady first.","Let it down only a little; wide drops sound out of tune.","Keep the waves in time with the click."]},
  {id:"Lf4",t:"Mini solo using bends",rate:"lx",sc:"mp",lick:"<Am:4> 1:5@.5 2:8@.5 2:8b1@1.5 2:5@.5 3:7@1 | <G:4> 2:8pr1@1 2:5@.5 3:7@.5 3:5@1 4:7@1 | <F:4> 3:7b1@1.5 2:5@.5 2:8b1@1 1:5@1 | <G:4> 1:8b.25@.5 1:5@.5 2:8@.5 2:5@.5 3:7br1@2 | <Am:4> [3:7b1+2:5]@2 2:5@.5 3:7@.5 3:5@1 | <G:4> 2:5@1 3:7b1@1 2:5@1 3:7b1@1 | <F:4> 1:8pr1@1 p1:5@.5 2:8@.5 2:5@.5 3:7@.5 3:5@1 | <Am:4> 4:7b.25@1 3:5@1 4:7~w@2",
   txt:["Eight bars over a backing (A minor, G, F, G) using every kind of bend from the last two levels: whole steps, pre-bend releases, curls, a bend and release, a unison and broken unisons.","Turn on the backing chords and play it as music: every bend should be in tune against the chords."],
   how:["Learn it two bars at a time with the bar loop.","Mark the bends you find hardest and loop those bars.","Play the last note with a slow, wide vibrato."]},
 ]},
 {id:"Lg",n:"Hybrid picking",d:"Pick plus middle and ring fingers: string skips, pinches, rolls and hybrid licks.",ls:[
  {id:"Lg1",t:"Pick and middle finger",rate:"le",sc:"mp",lick:"3:5@.5 1:5m 3:7 1:8m 3:5 1:5m 3:7 1:8m | 4:5@.5 2:5m 4:7 2:8m 4:5 2:5m 4:7@1 | 5:5@.5 3:5m 5:7 3:7m 6:5 4:5m 6:8@1 | 4:7@4",
   txt:["Hold the pick normally and use the <b>middle finger</b> (m) to pluck a higher string. Skipping a string with a pick means a big jump; with the finger it's no jump at all.","The pick plays downstrokes on the lower string; the finger plucks upwards on the higher one. Under the tab, <b>m</b> marks a middle-finger note."],
   how:["Rest the middle finger lightly on its string ready to pluck.","Pluck by curling the finger into the palm, not pulling away from the guitar.","Match the finger notes' volume to the picked notes."]},
  {id:"Lg2",t:"Pinches with middle and ring",rate:"le",sc:"mp",lick:"4:7@.5 [3:5m+2:5a]@.5 4:7@.5 [3:5m+2:5a]@.5 4:5@.5 [3:7m+2:8a]@.5 4:5@.5 [3:7m+2:8a]@.5 | 5:7@.5 [4:7m+3:5a]@.5 5:7@.5 [4:7m+3:5a]@.5 6:8@.5 [4:5m+3:5a]@.5 6:8@.5 [4:5m+3:5a]@.5 | 4:7@.5 [3:5m+2:5a]@.5 4:7@.5 [3:5m+2:5a]@.5 4:5@.5 [3:7m+2:8a]@.5 4:5@.5 [3:7m+2:8a]@.5 | [4:7+3:5m+2:5a]@4",
   txt:["Add the <b>ring finger</b> (a) and you can pluck two strings at once while the pick plays a bass note: a bass-and-chord pattern you can't play with a pick alone.","The pick takes the lowest string on the beat; middle and ring snap the two upper strings together on the 'and'."],
   how:["Keep the two fingers together so both strings sound as one.","Let the bass note ring under the pinch.","Finish by playing all three together."]},
  {id:"Lg3",t:"Hybrid rolls",rate:"lt",sc:"mp",lick:"4:7@1/3 3:5m 2:5a 4:7 3:5m 2:5a 4:5 3:7m 2:8a 4:5 3:7m 2:8a | 5:7 4:7m 3:5a 5:7 4:7m 3:5a 4:7 3:5m 2:5a 4:7@1",
   txt:["Pick, middle, ring, over and over across three strings: a <b>roll</b>. As triplets it sounds like a fingerstyle arpeggio but keeps the attack of the pick on the bass.","Country and rock players use rolls to make chords shimmer under a vocal."],
   how:["Fret the whole three-note shape at once and let it ring.","Pick down, then m, then a, evenly.","Change shape on the beat without a gap."]},
  {id:"Lg4",t:"Hybrid picking licks",rate:"le",sc:"mp",lick:"3:7@.5 1:5m 2:8 1:5m 3:5 1:5m 2:5 1:8m | 3:7@.5 1:8m 2:5 1:5m 3:7 2:8m 2:5@1 | 4:7@.5 2:5m 3:5 2:8m 4:5 2:5m 3:7 2:8m | [3:7+2:8m]@1 [3:5+2:5m]@1 4:7@2",
   txt:["Now pentatonic lines where the finger takes the higher, skipped notes. The skips make wide, bright intervals that sound nothing like box runs, and the finger gives them a snappy attack.","Mix in two-note double stops at the end, picked and plucked together."],
   how:["Keep the pick doing downstrokes on the picked notes.","Snap the finger notes slightly harder for the country 'pop'.","Loop each bar before joining them."]},
 ]},
 {id:"Lh",n:"Dynamics",d:"Accents, crescendos, ghost notes and loud–soft phrasing: playing with the volume knob in your hands.",ls:[
  {id:"Lh1",t:"Accents on the beat",rate:"le",sc:"mp",dyn:1,lick:"6:5!@.5 6:8 5:5! 5:7 4:5! 4:7 3:5! 3:7 | 2:5! 2:8 1:5! 1:8 1:5! 2:8 2:5! 3:7 | 3:5! 4:7 4:5! 5:7 5:5! 6:8 6:5!@1",
   txt:["Dynamics, meaning how loud or soft you play, are the easiest way to make a solo sound alive, and the most ignored. Start with <b>accents</b>: dig in on the beat, play the in-between notes lightly.","The accented notes are marked <b>&gt;</b>. Pick them harder and closer to the bridge; pick the others softly."],
   how:["Make the difference between loud and soft large.","Keep the timing exactly the same as the plain version.","Listen to the playback: you'll hear the beat in the line itself."]},
  {id:"Lh2",t:"Moving accents",rate:"ls",sc:"mp",dyn:1,lick:"6:5!@.25 6:8 5:5 5:7! 4:5 4:7 3:5! 3:7 2:5 2:8! 1:5 1:8 1:5! 2:8 2:5 3:7! | 3:5 4:7 4:5! 5:7 5:5 6:8! 6:5@2.5",
   txt:["Accent <b>every third</b> 16th note. The accents drift across the beat and you hear a groove of threes over a pulse of fours, a trick used everywhere from blues to metal.","Your foot taps the beat; your pick hand accents in threes. It feels odd at first: that's the point."],
   how:["Count the 16ths aloud and accent each '1' of a 1-2-3 count.","Keep strict alternate picking even when the accent falls on an upstroke.","Tap your foot on the beat."]},
  {id:"Lh3",t:"Crescendo and diminuendo",rate:"le",sc:"mp",dyn:1,lick:"6:5v.2@.5 6:8v.25 5:5v.3 5:7v.35 4:5v.45 4:7v.5 3:5v.6 3:7v.65 | 2:5v.75 2:8v.8 1:5v.9 1:8v1@2.5 | 1:8v1@.5 1:5v.9 2:8v.8 2:5v.7 3:7v.6 3:5v.5 4:7v.4 4:5v.35 | 5:7v.3 5:5v.25 6:8v.2 6:5v.15@2.5",
   txt:["Grow louder going up (<b>crescendo</b>), softer coming down (<b>diminuendo</b>). A line that swells as it climbs sounds like it's going somewhere.","Spread the change evenly: no sudden jumps. The dynamics row under the tab shows the level from <b>pp</b> (very soft) to <b>ff</b> (very loud)."],
   how:["Start barely touching the strings.","Arrive at full volume on the top note.","Come down just as smoothly."]},
  {id:"Lh4",t:"Ghost notes",rate:"ls",sc:"mp",dyn:1,lick:"4:7!@.25 4:7g 3:5 3:5g 3:7! 3:7g 3:5 4:7g 4:7! 4:7g 3:5 3:5g 3:7!@.5 3:5@.5 | 2:5!@.25 2:5g 2:8 2:8g 2:5! 2:5g 3:7 3:7g 3:5!@.5 3:5g 4:7@1 | 4:7!@.25 4:7g 3:5 3:5g 3:7! 3:7g 3:5 4:7g 4:7! 4:7g 3:5 3:5g 3:7!@.5 3:5@.5 | 4:7~@4",
   txt:["A <b>ghost note</b> is almost silent: the pick touches the string while the fretting hand barely presses. You feel it more than hear it. In the tab it's in brackets.","Ghost notes keep the picking hand moving in 16ths and give a line a funky, percussive groove between the real notes."],
   how:["For ghosts, relax the fretting finger until the note just clicks.","Accents loud, normal notes medium, ghosts nearly silent: three levels.","Keep the pick moving down-up constantly."]},
  {id:"Lh5",t:"Loud question, soft answer",rate:"lx",sc:"mp",dyn:1,lick:"<Am:4> 1:5!@.5 1:8! 1:5! 2:8!@1.5 1:5@1 | <Am:4> 3:7v.35@.5 3:5v.35 4:7v.3@3 | <G:4> 1:8!@.5 1:5! 2:8b1!@2 2:5@1 | <Am:4> 3:5v.35@.5 h3:7v.3@.5 4:7v.25~@3",
   txt:["Use dynamics to shape phrases: a loud phrase, then a quiet reply, like two people talking. The same notes played softly feel like an afterthought, played loudly like a statement.","It's also how to build a solo: start quieter than you think, so there's somewhere to go."],
   how:["Pick hard near the bridge for the loud phrases.","Pick softly over the neck for the quiet ones.","Leave the space between phrases empty."]},
 ]},
 {id:"Li",n:"Building a melodic solo",d:"Motifs, rhythm variations, target notes, call and response, and building a solo from low and sparse to high and intense.",ls:[
  {id:"Li1",t:"One motif, repeated",rate:"lx",sc:"mp",lick:"<Am:4> 2:5@.5 1:5@.5 2:8@1 r@2 | <G:4> 2:5@.5 1:5@.5 2:8@1 r@2 | <F:4> 2:5@.5 1:5@.5 2:8@1 r@2 | <G:4> 2:5@.5 1:5@.5 1:8~@3",
   txt:["Great solos are built from <b>motifs</b>: short ideas that come back. Listeners remember a solo because it repeats something they can hold on to.","This motif is three notes. Over each chord it sounds different, even though it's the same notes, because the harmony underneath changes. At the end it lifts to a new note."],
   how:["Turn on the backing chords.","Leave the rests completely silent.","Hear how the motif's mood changes over each chord."]},
  {id:"Li2",t:"Varying the rhythm",rate:"lx",sc:"mp",lick:"<Am:4> 2:5@.5 1:5@.5 2:8@1 r@2 | <G:4> r@.5 2:5@.5 1:5@.5 2:8@1.5 r@1 | <F:4> 2:5@1/3 1:5@1/3 2:8@1/3 2:5@1/3 1:5@1/3 2:8@1/3 r@2 | <G:4> 2:5@.25 1:5@.25 2:8@1.5 2:8b1@2",
   txt:["Keep the notes, change the rhythm: start it later, stretch it, double it up as triplets. Each version is new but clearly related.","This is how you get more out of fewer notes, and it's what separates melodic soloing from running up and down scales."],
   how:["Notice where each variation starts relative to the beat.","Sing each bar before you play it.","Invent a fifth version of your own."]},
  {id:"Li3",t:"Targeting chord tones",rate:"lx",sc:"mp",lick:"<Am:4> 1:8@.5 1:5@.5 2:8@.5 2:5@1.5 2:8@1 | <C:4> 1:8@2 1:5@.5 2:8@.5 2:5@1 | <G:4> 2:8@2 2:5@.5 3:7@.5 2:5@1 | <Am:4> 1:5~@4",
   txt:["Each chord has its own notes (A minor: A C E, C: C E G, G: G B D). A solo sounds as if it follows the chords when you <b>land on one of those notes as the chord changes</b>.","Here every bar starts on a chord tone of its chord: E over Am, C over C, G over G, A over Am. The notes in between can be anything in the scale."],
   how:["Find the target note for each chord before you play.","Land the target exactly on beat 1.","Try ending each bar so the next target is one step away."]},
  {id:"Li4",t:"Call and response",rate:"lx",sc:"mp",lick:"<Am:4> 3:5@.5 3:7@.5 2:5@.5 2:8@.5 1:5@2 | <G:4> r@2 1:5@.5 2:8@.5 2:5@1 | <F:4> 3:5@.5 3:7@.5 2:5@.5 2:8@.5 1:8b1@2 | <Am:4> r@1 1:5@.5 2:8@.5 2:5@.5 3:7@.5 3:5@.5 4:7@.5",
   txt:["A <b>call</b> rises and stops on a note that wants to go on; the <b>response</b> answers and comes home to the root. It's how blues singers and their bands talk to each other.","The second call goes higher than the first, and its answer goes further, so the solo grows."],
   how:["Leave the gaps empty: they're part of the conversation.","End every response on the root.","Make up your own answers to the same calls."]},
  {id:"Li5",t:"Building the solo",rate:"lx",sc:"mp",lick:"<Am:4> 4:7@1 3:5@1 4:7@2 | <G:4> 4:5@1 4:7@1 3:5@2 | <F:4> 3:5@.5 3:7@.5 2:5@1 3:7b1@2 | <G:4> 2:5@.5 2:8@.5 1:5@.5 2:8@.5 2:5@1 3:7@1 | <Am:4> 1:5@.5 1:8@.5 2:10@.5 1:8@.5 1:10@1 1:8@1 | <G:4> 1:10@.5 1:12@.5 1:10b1@1 1:8@.5 1:10@1.5 | <F:4> 1:12@.25 1:10@.25 1:8@.25 2:10@.25 1:12@.25 1:10@.25 1:8@.25 2:10@.25 1:13b1@2 | <Am:4> 1:12b1~w@4",
   txt:["Eight bars that grow: <b>low and sparse</b> at the start, then a little higher and busier, then high on the neck with fast notes and bends, ending on a big held note.","Tension in a solo comes from three things: going higher, playing more notes, and playing louder. Save all three for the end."],
   how:["Play the first bars almost lazily.","Let the bend in bar 6 and the 16ths in bar 7 be the peak.","Hold the last note with a wide vibrato until the bar ends."]},
  {id:"Li6",opt:1,ear:1,maj:1,t:"Ear: hear it, sing it, see it, play it",rate:"ear",sc:"mj",lick:"<A:4> r@4 | <A:4> 6:5@1 5:4@1 4:4@1 5:7@1 | <A:4> r@4 | <A:4> 6:5@1 5:5@1 4:6@1 5:7@1 | <A:4> r@4 | <A:4> 5:7@1 4:4@1 5:7@1 5:4@1 | <A:4> r@4 | <A:4> 5:4@1 6:7@1 6:5@2",
   txt:["This is improvising in slow motion: every step between your head and your hands, one at a time. Four short melodies, each after an empty bar. In the empty bar, read the next melody's numbers (under the tab), <b>hear</b> it in your head, <b>sing</b> it with its numbers, <b>see</b> where each note sits on the neck, and only then <b>play</b> it.","To pin down a note you're unsure of, use more than one route. In 1-3-6-5, the last note is a whole step down from 6 <i>and</i> a 5th up from the root: when both routes agree, you know it. The more connections you hear, the surer you are.","The harder way round is the real goal: hum a short phrase of your own, or a tune you know by heart, work out its numbers by singing, picture it, then play it first time. When it goes wrong, ask which step failed (hearing, naming, seeing or playing) and practise that one."],
   how:["Don't play during the empty bars.","Melodies 1 and 2 are the two from the video: 1-3-6-5 and 1-4-7-5.","Five to ten minutes of this every day beats an hour once a week."]},
  {id:"Li7",opt:1,t:"Layer 2: add the two notes the box leaves out",rate:"le",sc:"nm",lick:"<Am:4> 5:5@.5 5:7 4:5 4:7 3:4 3:5 3:7 2:5 | <F:4> 2:6@.5 2:8 1:5 1:7 1:8@2 | <G:4> 1:7@.5 1:5 2:8 2:6 2:5 3:7 3:5 3:4 | <Am:4> 4:7@2 r@2",
   txt:["The pentatonic is five of the key's seven notes. Add the other two, the <b>2</b> and the <b>b6</b> (B and F in A minor), and you have the full <b>natural minor</b>, which is the same seven notes as the relative major. Nothing is out of key; you just have more melodic choices.","The pentatonic sounds rock and blues. With the two extra notes the same run turns <b>melodic</b>: listen to how the F sounds over the F chord and the B over the G chord.","Add the two notes wherever they fall in the shape you're in. Here they're on the G and B strings, right inside box 1."],
   how:["Play the run once with the B and F left out, then as written, and hear the difference.","Lean on the F in bar 2: it's the root of the chord underneath.","Then improvise with all seven notes over the loop."]},
  {id:"Li8",opt:1,t:"Layer 3: destinations and the path between them",rate:"lx",sc:"nm",lick:"<C:4> 3:7b1@2 2:5@1 3:7@1 | <G:4> 3:5@1 3:4@3 | <F:4> 3:4@.5 4:7@3.5 | <F:4> 4:3@.5 4:5 4:7 3:5 4:7 4:5 4:3 4:5 | <Am:4> 4:7~@4",
   txt:["Pick a <b>destination</b> for each chord, one of its chord tones, and let the key's scale be the <b>path</b> between them. Here: <b>E</b> over C, <b>B</b> over G, <b>A</b> over F. Three of the seven notes sound best over any one chord, and a different three over the next.","Approach a destination with a bend: bar 1 bends D up to E, so the line starts with tension and settles onto the chord tone (tension, then release).","When a chord lasts longer (F gets two bars), fill it with its <b>add9 arpeggio, 1-2-3-5</b> (F G A C), up and back down, timed to land on a chord tone of the next chord: the A of A minor. Chord tones are always under your fingers. Use whichever CAGED shape of the chord you're nearest."],
   how:["Name the destination before each chord arrives.","Land the destination on beat 1 and hold it.","Then make your own: keep the destinations, change the path."]},
 ]},
 {id:"Lj",n:"Single-string improvisation",d:"The pentatonic along one string: pick it, slide it, bend it, then improvise a whole phrase on one string.",ls:[
  {id:"Lj1",t:"Pentatonic along one string",rate:"le",sc:"mp",keys:[[9,0,2],[11,4,1],[3,10,8]],lick:"3:2@.5 3:5 3:7 3:9 3:12 3:14@1.5 | 3:14@.5 3:12 3:9 3:7 3:5 3:2@1.5 | 2:3@.5 2:5 2:8 2:10 2:13 2:15@1.5 | 2:15@.5 2:13 2:10 2:8 2:5 2:3@1.5",
   txt:["Boxes are vertical. A <b>single string</b> is horizontal: the same scale laid out along the neck, in steps of two and three frets. It frees you to move anywhere.","Learn the gaps: on one string the minor pentatonic is three frets, two, two, three, two. Say the intervals as you go."],
   how:["Shift with the index or middle finger and keep the hand relaxed.","Look ahead to the next fret before you move.","Do the same on every string once this is easy."]},
