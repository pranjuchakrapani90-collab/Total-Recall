/* history */

/* sheet */

.tile .v{font:750 24px/1.15 var(--body);margin-top:4px;white-space:nowrap}

.band{display:inline-block;font:700 11px/1 var(--body);padding:4px 7px;border-radius:99px;white-space:nowrap}
.band.g{background:var(--good-soft);color:var(--good)}.band.w{background:var(--warn-soft);color:var(--warn)}.band.b{background:var(--bad-soft);color:var(--bad)}.band.n{background:var(--soft);color:var(--muted)}

<script>
"use strict";
/* ============================================================================
   Health Studio (14 Nov 2026; before that this page was "Weight & calories")
   Four things are tracked: weight, blood pressure, pulse, and distance walked. Waist is optional, about weekly.
   - Weight, BP, pulse and waist are typed in from the weighing machine, the BP machine and a tape.
   - Walking is NOT typed: it is worked out from the GPS points Travel Studio already collects (walk.js), counting
     only stretches at walking pace. Riding in a vehicle is left out.
   - The calorie counter and food log were removed on 14 Nov 2026 at the owner's request; the first time this page
     opens it deletes the saved calories, meals and "My foods" (and the deletion spreads to the other phone).
   Saved data, one object: {v:2, days:{date:{w,waist,t}}, bp:{id:{ms,s,d,p,t,del}}, walk:{date:{km,min,steps,n,v,done,t}},
   settings:{sex,age,height,goal,walkGoal,t}}. Phones merge record by record, newest edit wins. Synced through the
   app's encrypted sync code in its own slot "#health"; nothing personal is in this repo.
   - Daily weight jumps around (water, salt, food in the gut), so progress is read from a smoothed TREND
     (exponential moving average, 10% per day), not from any single morning.
   - "Where you stand" compares your numbers with published adult reference bands (listed at the foot of the page
     with their sources). They are general bands, not a diagnosis.
   ============================================================================ */
const KEY="health-v1",SLOT="#health",ALPHA=0.1,MAINKEY="totalRecallPWA_v2",DEFW="https://total-recall-ticktick.pranjuchakrapani90.workers.dev",$=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ok=x=>typeof x==="number"&&isFinite(x);
const r1=x=>Math.round(x*10)/10;
const fmt=(x,d=1)=>ok(x)?x.toLocaleString("en-IN",{minimumFractionDigits:d,maximumFractionDigits:d}):"–";
const int=x=>ok(x)?Math.round(x).toLocaleString("en-IN"):"–";
const sgn=(x,d=1)=>ok(x)?(x>0?"+":x<0?"−":"±")+fmt(Math.abs(x),d):"–";
/* dates are local calendar days, "YYYY-MM-DD" */
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>iso(new Date());
const dt=s=>new Date(s+"T00:00:00");
const addDays=(s,n)=>{const d=dt(s);d.setDate(d.getDate()+n);return iso(d);};
const diffDays=(a,b)=>Math.round((dt(b)-dt(a))/864e5);
const dshort=s=>dt(s).toLocaleDateString("en-IN",{day:"numeric",month:"short"});
const dlong=s=>dt(s).toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
const clock=ms=>new Date(ms).toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"});
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;

/* ---------- store ---------- */
const get=()=>{try{return JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){return null;}};
/* Calories, meals and "My foods" are gone for good. Anything of that kind found in saved data (this phone's, or
   arriving from a phone still on the old page) is stripped; the record's edit time is moved up so the stripped
   version wins on every phone. */
function clean(s){let ch=false;const now=Date.now(),o={v:2,days:{},bp:{...(s.bp||{})},walk:{...(s.walk||{})},settings:s.settings||null,foods:{}};
  Object.entries(s.days||{}).forEach(([d,r])=>{if(!r)return;const n={t:r.t||0};if(ok(r.w))n.w=r.w;if(ok(r.waist))n.waist=r.waist;
    if("kcal" in r||"items" in r){n.t=now;ch=true;}o.days[d]=n;});
  Object.entries(s.foods||{}).forEach(([id,f])=>{if(f&&f.del&&!("k" in f)&&!("n" in f))o.foods[id]=f;else{o.foods[id]={del:true,t:now};ch=true;}});
  if(o.settings&&("act" in o.settings||"pace" in o.settings)){const {act,pace,...rest}=o.settings;o.settings={...rest,t:now};ch=true;}
  if(s.v!==2)ch=true;return {s:o,ch};}
function load(){const raw=get()||{v:2,days:{},settings:null},c=clean(raw);if(c.ch&&get())try{localStorage.setItem(KEY,JSON.stringify(c.s));}catch(e){}return c.s;}
let pushT=0;
function save(s){try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){}clearTimeout(pushT);pushT=setTimeout(()=>sync(false),1200);}
function setDay(date,patch){const s=load(),o={...(s.days[date]||{}),...patch,t:Date.now()};Object.keys(o).forEach(k=>{if(o[k]===null)delete o[k];});s.days[date]=o;save(s);}
function setBp(id,rec){const s=load();s.bp[id]={...(s.bp[id]||{}),...rec,t:Date.now()};save(s);}
function setSettings(p){const s=load();s.settings={...(s.settings||{}),...p,t:Date.now()};save(s);}
const newer=(a,b)=>!a||(b&&(b.t||0)>(a.t||0));
function merge(a0,b0){const a=clean(a0).s,b=clean(b0).s,o={v:2,days:{...a.days},bp:{...a.bp},walk:{...a.walk},settings:null,foods:{...a.foods}};
  ["days","bp","walk","foods"].forEach(k=>Object.entries(b[k]||{}).forEach(([id,r])=>{if(r&&newer(o[k][id],r))o[k][id]=r;}));
  const sa=a.settings,sb=b.settings;o.settings=!sa?sb||null:!sb?sa:((sb.t||0)>(sa.t||0)?sb:sa);return o;}

/* ---------- sync ---------- */
const hasSync=()=>!!(window.GSync&&GSync.code&&GSync.code());
const canon=x=>window.GSync&&GSync.canon?GSync.canon(x):JSON.stringify(x);
let syncing=false,syncMsg="";
async function sync(loud){
  if(!hasSync()){syncMsg="On this phone only · turn on ☁ Sync from the home screen to share between phones";status();return;}
  if(syncing)return;syncing=true;syncMsg="Syncing…";status();
  try{const local=load(),remote=await GSync.fetchSlot(GSync.code(),SLOT),m=remote?merge(local,remote):local,ch=canon(m)!==canon(local);
    if(ch)localStorage.setItem(KEY,JSON.stringify(m));
    if(!remote||canon(m)!==canon(remote))await GSync.putSlot(GSync.code(),SLOT,m);
    syncMsg="Synced "+new Date().toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"});if(ch)draw();}
  catch(e){syncMsg="Sync unavailable: "+e.message;}
  finally{syncing=false;status();}}
function status(){$("st").textContent=syncMsg+(walkMsg?(syncMsg?" · ":"")+walkMsg:"");}

/* ---------- reference bands (adults in general; sources at the foot of the page) ----------
   Blood pressure, per reading: 2025 AHA/ACC categories (unchanged from 2017).
   Home average: 135/85 or more is the home-measurement line for high blood pressure (ISH 2020, ESH).
   Pulse at rest: 60 to 100 a minute (AHA).  BMI and waist: consensus cut-offs for Asian Indians (Misra et al, 2009).
   Activity: at least 150 minutes a week of moderate activity such as brisk walking (WHO 2020). */
function bpBand(s,d){
  if(s>=180||d>=120)return {k:"b",t:"Very high",x:"180/120 or above"};
  if(s<90||d<60)return {k:"w",t:"Low",x:"below 90/60"};
  if(s>=140||d>=90)return {k:"b",t:"High · stage 2",x:"140/90 or above"};
  if(s>=130||d>=80)return {k:"w",t:"High · stage 1",x:"130–139 or 80–89"};
  if(s>=120)return {k:"w",t:"Elevated",x:"120–129 and under 80"};
  return {k:"g",t:"Normal",x:"under 120/80"};}
function pulseBand(p){return p>100?{k:"b",t:"Fast",x:"over 100 at rest"}:p<60?{k:"w",t:"Slow",x:"under 60 at rest"}:{k:"g",t:"Normal",x:"60–100 at rest"};}
function bmiBand(b){return b<18.5?{k:"w",t:"Underweight",x:"under 18.5"}:b<23?{k:"g",t:"Normal",x:"18.5–22.9"}:b<25?{k:"w",t:"Overweight",x:"23–24.9"}:{k:"b",t:"Obese",x:"25 or above"};}
function waistBand(w,sex){const lim=sex==="f"?80:90;return w>=lim?{k:"b",t:"Above the line",x:lim+" cm or more"}:{k:"g",t:"Within the line",x:"under "+lim+" cm"};}
const band=b=>b?`<span class="band ${b.k}">${esc(b.t)}</span>`:"";

/* ---------- model ---------- */
function model(){
  const s=load(),S=s.settings||{},T=today();
  const wDays=Object.keys(s.days).filter(d=>d<=T&&ok(s.days[d].w)).sort().map(d=>({d,w:s.days[d].w}));
  let tr=null,prev=null;wDays.forEach(r=>{if(tr===null)tr=r.w;else{const n=Math.max(1,diffDays(prev,r.d)),a=1-Math.pow(1-ALPHA,n);tr+=a*(r.w-tr);}prev=r.d;r.tr=tr;});
  const trendOn=d=>{let v=null;for(const r of wDays){if(r.d>d)break;v=r.tr;}return v;};
  const last=wDays[wDays.length-1]||null,cur=last?last.tr:null;
  const waists=Object.keys(s.days).filter(d=>d<=T&&ok(s.days[d].waist)).sort().map(d=>({d,v:s.days[d].waist}));
  const bp=Object.entries(s.bp).filter(([,r])=>r&&!r.del&&ok(r.ms)).map(([id,r])=>({id,...r,date:iso(new Date(r.ms))})).sort((a,b)=>a.ms-b.ms);
  const bpBy={};bp.forEach(r=>(bpBy[r.date]=bpBy[r.date]||[]).push(r));
  /* one value a day for charts and averages: that day's mean */
  const bpDays=Object.keys(bpBy).sort().map(d=>{const a=bpBy[d],P=a.filter(r=>ok(r.p));return {d,s:avg(a.filter(r=>ok(r.s)).map(r=>r.s)),di:avg(a.filter(r=>ok(r.d)).map(r=>r.d)),p:P.length?avg(P.map(r=>r.p)):null,n:a.length};});
  const walk=Object.keys(s.walk).filter(d=>d<=T&&s.walk[d]&&!s.walk[d].none).sort().map(d=>({d,...s.walk[d]}));
  const walkOn=d=>s.walk[d]&&!s.walk[d].none?s.walk[d]:null;
  const goalKm=ok(S.walkGoal)?S.walkGoal:null;
  /* a week = the 7 days ending on the given day */
  const week=end=>{const st=addDays(end,-6),inW=d=>d>=st&&d<=end,B=bp.filter(r=>inW(r.date)),W=walk.filter(r=>inW(r.d));
    return {st,end,nBp:B.length,s:avg(B.filter(r=>ok(r.s)).map(r=>r.s)),d:avg(B.filter(r=>ok(r.d)).map(r=>r.d)),p:avg(B.filter(r=>ok(r.p)).map(r=>r.p)),
      km:W.reduce((a,r)=>a+(r.km||0),0),min:W.reduce((a,r)=>a+(r.min||0),0),wDays:W.length,met:goalKm?W.filter(r=>r.km>=goalKm).length:null,
      w0:trendOn(addDays(st,-1)),w1:trendOn(end),nW:wDays.filter(r=>inW(r.d)).length};};
  const wk=week(T),pw=week(addDays(T,-7));
  /* walking-goal streak: days in a row up to yesterday (today counts once met) */
  let streak=0;if(goalKm){let d=T;if(walkOn(d)&&walkOn(d).km>=goalKm){streak++;}d=addDays(d,-1);while(walkOn(d)&&walkOn(d).km>=goalKm){streak++;d=addDays(d,-1);}}
  const bmi=ok(cur)&&ok(S.height)?cur/Math.pow(S.height/100,2):null;
  return {s,S,T,wDays,trendOn,last,cur,waists,bp,bpBy,bpDays,walk,walkOn,goalKm,wk,pw,streak,bmi};}

/* ---------- views ---------- */
let range=Number(localStorage.getItem("health-range")||30)||30;
function draw(){
  const M=model();
  $("out").innerHTML=todayCard(M)+standCard(M)+weekCard(M)+chartCard(M)+recentCard(M)+footCard();
  wire(M);charts(M);}
function todayCard(M){

    s.querySelector("#eSave").onclick=()=>{const w=parseFloat(s.querySelector("#eW").value);if(!(w>=20&&w<=300))return fail(s,"Enter the weight in kg.");setDay(d,{w:r1(w)});close();draw();};});}
function waistForm(){const d=today(),r=load().days[d]||{};
  sheet(`<h3>Waist · ${dshort(d)}</h3><p class="small muted">Tape around the bare waist just above the hip bones, level all round, after breathing out normally.</p><div class="fld"><label>Waist (cm)</label><input id="eWa" type="number" inputmode="decimal" step="0.5" value="${ok(r.waist)?r.waist:""}"></div><div class="err" hidden style="margin-top:10px"></div>
   <div class="acts"><button type="button" id="eSave">Save</button><button class="plain" type="button" id="eCancel">Cancel</button></div>`,(s,close)=>{
    s.querySelector("#eCancel").onclick=close;
    s.querySelector("#eSave").onclick=()=>{const w=parseFloat(s.querySelector("#eWa").value);if(!(w>=40&&w<=200))return fail(s,"Enter the waist in cm.");setDay(d,{waist:r1(w)});close();draw();};});}
/* one BP reading: the three numbers on the machine. id given = edit that reading */
function bpForm(id){const old=id?load().bp[id]:null,when=old?new Date(old.ms):new Date(),local=new Date(when.getTime()-when.getTimezoneOffset()*60000).toISOString().slice(0,16);
  sheet(`<h3>${old?"Change reading":"BP &amp; pulse"}</h3><p class="small muted">Sit with your back supported for 5 minutes, arm resting at heart level, no tea, food or smoking in the last 30 minutes.</p>
   <div class="three"><div class="fld"><label>Upper (SYS)</label><input id="eS" type="number" inputmode="numeric" value="${old&&ok(old.s)?old.s:""}"></div><div class="fld"><label>Lower (DIA)</label><input id="eD" type="number" inputmode="numeric" value="${old&&ok(old.d)?old.d:""}"></div><div class="fld"><label>Pulse</label><input id="eP" type="number" inputmode="numeric" value="${old&&ok(old.p)?old.p:""}"></div></div>
   <div class="fld"><label>When</label><input id="eT" type="datetime-local" value="${local}"></div><div class="err" hidden style="margin-top:10px"></div>
   <div class="acts"><button type="button" id="eSave">Save</button><button class="plain" type="button" id="eCancel">Cancel</button>${old?`<span class="sp"></span><button class="danger" type="button" id="eDel">Delete</button>`:""}</div>`,(s,close)=>{
    s.querySelector("#eCancel").onclick=close;
    if(old)s.querySelector("#eDel").onclick=()=>{setBp(id,{del:true});close();draw();};
    s.querySelector("#eSave").onclick=()=>{const v=q=>Math.round(parseFloat(s.querySelector(q).value)),S=v("#eS"),D=v("#eD"),P=v("#eP"),ms=new Date(s.querySelector("#eT").value).getTime();
      if(!(S>=60&&S<=280))return fail(s,"Enter the upper number (SYS).");if(!(D>=30&&D<=180))return fail(s,"Enter the lower number (DIA).");if(D>=S)return fail(s,"The lower number should be smaller than the upper one.");
      if(s.querySelector("#eP").value!==""&&!(P>=30&&P<=220))return fail(s,"Check the pulse.");if(!isFinite(ms)||ms>Date.now()+3600000)return fail(s,"Check the time.");
      setBp(id||("b"+ms.toString(36)+Math.random().toString(36).slice(2,5)),{ms,s:S,d:D,p:ok(P)?P:null,del:false});close();draw();};});}
function dayForm(d){const M=model(),r=M.s.days[d]||{},B=M.bpBy[d]||[],k=M.walkOn(d);
  sheet(`<h3>${dlong(d)}</h3><div class="two"><div class="fld"><label>Weight (kg)</label><input id="eW" type="number" inputmode="decimal" step="0.1" value="${ok(r.w)?r.w:""}"></div><div class="fld"><label>Waist (cm)</label><input id="eWa" type="number" inputmode="decimal" step="0.5" value="${ok(r.waist)?r.waist:""}"></div></div>
   <div class="rh" style="padding-left:0">BP readings</div>${B.length?B.map(x=>`<div class="rd"><span>${int(x.s)}/${int(x.d)}${ok(x.p)?" · pulse "+int(x.p):""} <small>${clock(x.ms)}</small></span><button type="button" data-b="${esc(x.id)}">Change</button></div>`).join(""):`<p class="small muted">None on this day.</p>`}
   ${k?`<p class="small muted" style="margin-top:10px">Walked ${fmt(k.km,2)} km in ${int(k.min)} min (from GPS; not editable).</p>`:""}
   <div class="acts"><button type="button" id="eSave">Save</button><button class="plain" type="button" id="eCancel">Cancel</button></div>`,(s,close)=>{
    s.querySelector("#eCancel").onclick=close;s.querySelectorAll("button[data-b]").forEach(b=>b.onclick=()=>{close();bpForm(b.dataset.b);});
    s.querySelector("#eSave").onclick=()=>{const w=parseFloat(s.querySelector("#eW").value),wa=parseFloat(s.querySelector("#eWa").value);setDay(d,{w:w>=20&&w<=300?r1(w):null,waist:wa>=40&&wa<=200?r1(wa):null});close();draw();};});}
function walkSheet(M){const k=M.walkOn(M.T);
  sheet(`<h3>Walking today</h3>${k&&k.bouts&&k.bouts.length?k.bouts.map(b=>`<div class="rd"><span>${clock(b.from)} – ${clock(b.to)}</span><span>${int(b.m)} m · ${fmt(b.min,0)} min</span></div>`).join(""):`<p class="small muted">${esc(walkState||"No walks found in today's GPS points yet.")}</p>`}
   <p class="small muted" style="margin-top:10px">${k?int(k.n)+" GPS points read today. ":""}Only stretches at walking pace count; rides do not. Walking indoors is not seen by GPS.</p>
   <div class="acts"><button type="button" id="eAgain">Work out again</button><button class="plain" type="button" id="eCancel">Close</button></div>`,(s,close)=>{s.querySelector("#eCancel").onclick=close;s.querySelector("#eAgain").onclick=()=>{close();refreshWalk(true);};});}
function settingsForm(){
  const M=model(),S=M.S||{};
  sheet(`<h3>Goals &amp; profile</h3>
   <div class="two"><div class="fld"><label>Sex</label><select id="fSex"><option value="m">Male</option><option value="f"${S.sex==="f"?" selected":""}>Female</option></select></div>
   <div class="fld"><label>Height (cm)</label><input id="fH" type="number" inputmode="decimal" value="${ok(S.height)?S.height:""}"></div></div>
   <div class="two"><div class="fld"><label>Goal weight (kg)</label><input id="fG" type="number" inputmode="decimal" step="0.1" value="${ok(S.goal)?S.goal:""}"></div>
   <div class="fld"><label>Walking goal (km a day)</label><input id="fK" type="number" inputmode="decimal" step="0.5" value="${ok(S.walkGoal)?S.walkGoal:""}"></div></div>
   <p class="small muted" style="margin-top:8px">Height is used for BMI and for turning walked distance into steps. Sex decides the waist line (90 cm men, 80 cm women).</p>
   <div class="err" hidden style="margin-top:10px"></div>
   <div class="acts"><button type="button" id="fSave">Save</button><button class="plain" type="button" id="fCancel">Cancel</button></div>`,(s,close)=>{
    s.querySelector("#fCancel").onclick=close;
    s.querySelector("#fSave").onclick=()=>{const v=id=>parseFloat(s.querySelector(id).value),h=v("#fH"),g=v("#fG"),k=v("#fK");
      if(s.querySelector("#fH").value!==""&&!(h>=120&&h<=230))return fail(s,"Enter your height in cm.");if(s.querySelector("#fG").value!==""&&!(g>=30&&g<=250))return fail(s,"Check the goal weight.");if(s.querySelector("#fK").value!==""&&!(k>0&&k<=40))return fail(s,"Check the walking goal.");
      const hCh=ok(h)&&h!==S.height;setSettings({sex:s.querySelector("#fSex").value,height:ok(h)?h:null,goal:ok(g)?r1(g):null,walkGoal:ok(k)?k:null});close();draw();if(hCh)refreshWalk(true);};});}
function exportData(){const o={kind:"pranju-os-health",exported:today(),data:load()};const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:"application/json"}));a.download="health-backup-"+o.exported+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
function importData(){const i=document.createElement("input");i.type="file";i.accept="application/json,.json";
  i.onchange=async()=>{const f=i.files&&i.files[0];if(!f)return;try{const o=JSON.parse(await f.text());if(!o||o.kind!=="pranju-os-health")throw new Error("This isn't a Pranju OS health backup.");
    save(merge(load(),o.data||{}));draw();alert("Restored. Calories and meals in an old backup are not brought back.");}catch(e){alert(e.message);}};i.click();}

/* ---------- walking: read Travel Studio's GPS points and work out each day ----------
   Sources for a day, all merged: points still on the Worker (today, and finished days Travel Studio has not filed
   yet) and the day's GPX files in Travel Studio's archive (on this phone, or fetched from Google Drive).
   A finished day is worked out once and kept; today is worked out again every few minutes while this page is open. */
let walkMsg="",walkState="",walkBusy=false;
const istDay=ms=>new Date(ms+19800000).toISOString().slice(0,10);
function mainDb(){try{return JSON.parse(localStorage.getItem(MAINKEY)||"null")||{};}catch(e){return {};}}
function workerUrl(){let u=null;try{u=localStorage.getItem("totalRecallTickTickUrl");}catch(e){}return u||window.TOTAL_RECALL_TICKTICK_URL||DEFW;}
async function liveApi(token,params){const u=workerUrl(),r=await fetch(u+(u.indexOf("?")>=0?"&":"?")+"mode=live"+(params||""),{headers:{"X-Live-Token":token},cache:"no-store"});
  let d={};try{d=await r.json();}catch(e){}if(!r.ok||d.error)throw new Error(d.error||"the Worker answered HTTP "+r.status);return d;}
function gpxLocal(id){return new Promise(res=>{let q;try{q=indexedDB.open("TotalRecallTravelFiles_v1",1);}catch(e){return res(null);}
  /* the archive is made by Travel Studio, never here: if it does not exist yet, back out without creating it */
  q.onupgradeneeded=()=>{try{q.transaction.abort();}catch(e){}};
  q.onerror=()=>res(null);q.onsuccess=()=>{try{const g=q.result.transaction("files","readonly").objectStore("files").get(id);g.onsuccess=()=>res(g.result?g.result.gpx:null);g.onerror=()=>res(null);}catch(e){res(null);}};});}
async function gpxFor(meta){let t=await gpxLocal(meta.id);if(t!==null&&t!==undefined)return t;
  if(meta.driveId&&window.PosDrive&&PosDrive.download){try{return await (await PosDrive.download(meta.driveId)).text();}catch(e){}}return null;}
async function refreshWalk(force){
  if(walkBusy||!window.PosWalk)return;walkBusy=true;walkMsg="Reading GPS…";status();
  try{
    const db=mainDb(),token=db.travelLive&&db.travelLive.token||"",metas=Object.values(db.travelFiles||{}),T=istDay(Date.now());
    let live={};
    if(token){try{((await liveApi(token,"")).days||[]).forEach(x=>{if(x.n>0)live[x.day]=x;});}catch(e){walkState="Could not reach live GPS: "+e.message;}}
    else if(!metas.length)walkState="Travel Studio has no GPS yet. Set up GPSLogger in Travel Studio to count walking.";
    const s0=load(),height=s0.settings&&s0.settings.height,out={};
    for(let i=0;i<35;i++){
      const d=istDay(Date.now()-i*864e5),old=s0.walk[d];
      if(!force&&old&&old.done&&old.v===PosWalk.VERSION)continue;
      let pts=[],got=false;
      if(live[d]){try{pts=pts.concat(PosWalk.fromLive((await liveApi(token,"&day="+d)).points||[]));got=true;}catch(e){}}
      for(const m of metas.filter(f=>Array.isArray(f.dates)&&f.dates.indexOf(d)>=0)){const t=await gpxFor(m);if(t){pts=pts.concat(PosWalk.parseGpx(t));got=true;}}
      if(!got){if(d<T&&i>2&&!old)out[d]={none:true,done:true,v:PosWalk.VERSION,t:Date.now()};continue;}
      const seen={};pts=pts.filter(p=>istDay(p.ms)===d&&!seen[p.ms]&&(seen[p.ms]=1));
      const r=PosWalk.day(pts,{height});
      const rec={km:r.km,min:r.min,steps:r.steps,n:r.n,v:r.v,h:height||0,done:d<T,bouts:d===T?r.bouts.slice(-20):undefined};
      if(!old||old.km!==rec.km||old.min!==rec.min||old.n!==rec.n||old.done!==rec.done||old.v!==rec.v||old.h!==rec.h||(d===T&&JSON.stringify(old.bouts||[])!==JSON.stringify(rec.bouts||[])))out[d]={...rec,t:Date.now()};
    }
    if(Object.keys(out).length){const s=load();Object.assign(s.walk,out);save(s);draw();}
    if(!walkState&&token&&!live[T])walkState="No GPS points from the phone yet today.";else if(live[T])walkState="";
    walkMsg="Walking updated "+clock(Date.now());
  }catch(e){walkMsg="Walking not updated: "+e.message;}
  finally{walkBusy=false;status();}}

/* ---------- start ---------- */
let rz=0;window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>charts(model()),150);});
let lastSync=0;const resume=()=>{if(document.visibilityState!=="visible"||Date.now()-lastSync<5000)return;lastSync=Date.now();sync(false);refreshWalk(false);};
document.addEventListener("visibilitychange",resume);window.addEventListener("pageshow",resume);
setInterval(()=>{if(document.visibilityState==="visible")refreshWalk(false);},180000);
$("bSet").onclick=()=>settingsForm();
draw();status();lastSync=Date.now();sync(false);refreshWalk(false);
</script>
