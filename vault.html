<!doctype html>
<html lang="en"><head><meta charset="utf-8"><script src="pos-guard.js"></script><script src="drive.js?v=20261102t"></script><script src="vault.js?v=20261102a"></script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1c1b19">
<title>Vault · Pranju OS</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="tr-theme.css?v=20261020">
<style>
/* Vault (1 Nov 2026): the Gemini document vault (master_document_vault.json in Drive), browsable by domain and
   searchable, each record linking to its source file in Drive. Data handling lives in vault.js. */
*{box-sizing:border-box}html,body{margin:0}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;background:var(--tr-bg);color:var(--tr-ink)}
body>header{padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;position:sticky;top:0;z-index:20;background:var(--tr-head);color:var(--tr-head-ink)}
.hin,main{max-width:760px;margin:0 auto}
.backlink{font-size:13px;text-decoration:none;color:var(--tr-head-mute)}
h1{margin:4px 0 8px;font-size:22px}
main{padding:14px 16px 120px}
.muted{color:var(--tr-muted)}
.btn{border:1px solid var(--tr-line);background:var(--tr-paper);color:var(--tr-ink);border-radius:10px;padding:8px 13px;font:600 13px system-ui,sans-serif;cursor:pointer}
.btn:disabled{opacity:.45}
input{font:inherit;width:100%;padding:11px 13px;border:1px solid var(--tr-line);border-radius:12px;background:#fff;color:var(--tr-ink)}
.stat{display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:13px;margin:0 0 12px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:12px -16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;border:1px solid var(--tr-line);background:var(--tr-paper);color:var(--tr-ink);border-radius:999px;padding:6px 11px;font:600 12.5px system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.chips button.on{background:var(--tr-acc);border-color:var(--tr-acc);color:#fff}
.chips b{font-weight:500;opacity:.7;margin-left:3px}
.it{border:1px solid var(--tr-line);border-radius:12px;background:var(--tr-paper);padding:11px 13px;margin:0 0 8px}
.it h3{margin:0;font-size:15px;line-height:1.35}
.meta{font-size:12px;color:var(--tr-muted);margin-top:3px}
.ai{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;background:#fff7ed;color:#9a3412;margin-left:4px}
.x{font-size:13.5px;margin-top:7px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.x.short{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.row{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.row a{font:600 13px system-ui,sans-serif;color:var(--tr-acc);text-decoration:none}
.row button{border:0;background:none;color:var(--tr-muted);font:600 13px system-ui,sans-serif;padding:0;cursor:pointer}
.msg{padding:12px 14px;border-radius:12px;background:var(--tr-paper);border:1px solid var(--tr-line);font-size:14px;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}td,th{padding:5px 4px;border-bottom:1px solid var(--tr-line);text-align:right}td:first-child,th:first-child{text-align:left}
.msg.err{background:#fff7ed;border-color:#fed7aa;color:#9a3412}
mark{background:var(--tr-acc-soft);color:inherit;border-radius:3px}
</style></head><body>
<header><div class="hin"><a class="backlink" href="index.html">← Pranju OS</a><h1>Vault</h1>
<input id="q" type="search" placeholder="Search the document vault" autocomplete="off" enterkeyhint="search"></div></header>
<main>
<div class="stat"><span id="st" class="muted">Loading…</span><button class="btn" id="refresh" type="button">Check for newer</button></div>
<div id="note"></div>
<details class="it" id="covBox"><summary style="cursor:pointer;font-weight:700">Coverage — how much of your Drive is reviewed</summary><div id="cov" style="margin-top:10px"><button class="btn" type="button" id="covGo">Count my Drive files</button></div></details>
<div class="chips" id="chips"></div>
<div id="list"></div>
<p class="muted" style="font-size:12px;margin-top:18px">Records are Gemini's summaries of your Drive files. Figures can be wrong or contradict each other — open the source file before using a number in a letter or estimate.</p>
</main>
<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)},data=null,dom="",open={},LIM=60,more=0;
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function mark(s,w){s=esc(s);w.forEach(function(x){if(x.length<2)return;s=s.replace(new RegExp("("+x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"),"<mark>$1</mark>")});return s}
function when(iso){if(!iso)return "";var d=new Date(iso);return isNaN(d)?String(iso):d.toLocaleString("en-IN",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"})}
function status(){if(!data){$("st").textContent="Not downloaded yet";return}
  var m=data.meta;$("st").textContent=m.count.toLocaleString("en-IN")+" documents"+(m.batch!==""?" · batch "+m.batch:"")+" · Gemini wrote it "+when(m.modified)+(PosVault.checkedAt()?" · Drive checked "+when(new Date(PosVault.checkedAt()).toISOString()):"")}
function chips(){if(!data){$("chips").innerHTML="";return}var d=data.meta.domains,ks=Object.keys(d).sort(function(a,b){return d[b]-d[a]});
  $("chips").innerHTML='<button type="button" data-d="" class="'+(dom?"":"on")+'">All<b>'+data.meta.count+'</b></button>'+ks.map(function(k){
    return '<button type="button" data-d="'+esc(k)+'" class="'+(dom===k?"on":"")+'">'+esc(PosVault.domainLabel(k))+'<b>'+d[k]+'</b></button>'}).join("")}
function render(){if(!data){$("list").innerHTML="";return}
  var q=$("q").value.trim(),w=q.toLowerCase().split(/\s+/).filter(Boolean);
  var rows=q?PosVault.search(q,2000):data.entries.slice().sort(function(a,b){return a.t.localeCompare(b.t)});
  if(dom)rows=rows.filter(function(e){return e.d===dom});
  var n=LIM*(1+more);
  $("list").innerHTML=(rows.length?"":'<p class="muted">Nothing matches.</p>')+rows.slice(0,n).map(function(e){var o=open[e.id];
    return '<div class="it"><h3>'+mark(e.t,w)+'</h3><div class="meta">'+esc(PosVault.domainLabel(e.d))+'<span class="ai">AI summary</span></div>'+
      (e.x?'<div class="x'+(o?"":" short")+'">'+mark(o?e.x.split(" · ").join("\n"):e.x,w)+'</div>':'')+
      '<div class="row"><a href="'+esc(e.u)+'" target="_blank" rel="noopener">Open in Drive ↗</a>'+(e.x&&e.x.length>160?'<button type="button" data-o="'+esc(e.id)+'">'+(o?"Less":"All details")+'</button>':'')+'</div></div>'}).join("")+
    (rows.length>n?'<button class="btn" type="button" id="more">Show more ('+(rows.length-n)+' left)</button>':'')}
function err(e){var m=String(e&&e.message||e),c=e&&e.code;
  $("note").innerHTML='<div class="msg err">'+esc(m)+(c==="need_full"||c==="not_connected"?' <a href="index.html#travel">Open Travel Trace</a>':'')+'</div>'}
async function go(force){$("refresh").disabled=true;$("note").innerHTML=!data?'<div class="msg">Checking Drive for the newest vault… (it is about 2 MB the first time)</div>':'<div class="msg">Checking Drive for a newer vault…</div>';
  try{data=await PosVault.ensure(force);$("note").innerHTML=""}catch(e){err(e)}
  $("refresh").disabled=false;status();chips();render()}
$("q").addEventListener("input",function(){more=0;render()});
$("chips").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;dom=b.getAttribute("data-d");more=0;chips();render()});
$("list").addEventListener("click",function(e){var b=e.target.closest("button[data-o]");if(b){var id=b.getAttribute("data-o");open[id]=!open[id];render();return}
  if(e.target.id==="more"){more++;render()}});
async function cov(){var c=$("cov");c.innerHTML='<span class="muted">Counting every file in your Drive…</span>';
  try{var r=await PosVault.coverage(function(n){c.innerHTML='<span class="muted">Counting every file in your Drive… '+n.toLocaleString("en-IN")+'</span>'}),pc=function(n){return r.total?Math.round(n*100/r.total)+"%":"–"},lg=data&&data.log;
    var ty=Object.keys(r.byType).sort(function(a,b){return r.byType[b].total-r.byType[a].total});
    c.innerHTML='<div><b>'+r.total.toLocaleString("en-IN")+'</b> files in your Drive (not counting Pranju OS\'s own files)'+(r.junk?' · plus '+r.junk.toLocaleString("en-IN")+' WhatsApp temp/thumbnail files (.tmp, .thumb) left out':'')+'</div>'+
      '<table><tr><th></th><th>Files</th><th>Share</th></tr>'+
      '<tr><td>Have a vault record</td><td>'+r.records+'</td><td>'+pc(r.records)+'</td></tr>'+
      '<tr><td>Logged as reviewed, no record</td><td>'+r.logged+'</td><td>'+pc(r.logged)+'</td></tr>'+
      '<tr><td>Not looked at yet</td><td>'+r.none+'</td><td>'+pc(r.none)+'</td></tr></table>'+
      '<table><tr><th>Type</th><th>All</th><th>Record</th><th>Logged</th><th>Not yet</th></tr>'+ty.map(function(k){var b=r.byType[k];return '<tr><td>'+esc(k)+'</td><td>'+b.total+'</td><td>'+b.records+'</td><td>'+b.logged+'</td><td>'+b.none+'</td></tr>'}).join("")+'</table>'+
      '<div class="muted" style="font-size:12px">Vault: '+data.meta.records+' records → '+data.meta.count+' different files'+(data.meta.claimed!==""?' (Gemini says '+esc(data.meta.claimed)+')':'')+
      (lg?' · Log: '+lg.ids.length+' file ids, run '+esc(lg.lastRun)+', '+esc(lg.dossiers)+' dossiers':' · reviewed log not read')+'</div>'+
      (r.missing.length?'<p style="margin:12px 0 4px;font-weight:700">Newest files not looked at yet</p>'+r.missing.slice(0,40).map(function(f){return '<div style="font-size:13px;padding:4px 0;border-bottom:1px solid var(--tr-line)"><a href="https://drive.google.com/file/d/'+esc(f[0])+'/view" target="_blank" rel="noopener" style="color:var(--tr-ink);text-decoration:none">'+esc(f[1])+'</a> <span class="muted">'+esc(String(f[3]).slice(0,10))+'</span></div>'}).join(""):'')}
  catch(e){c.innerHTML='<div class="msg err">'+esc(e.message)+'</div>'}}
$("cov").addEventListener("click",function(e){if(e.target.id==="covGo")cov()});
$("refresh").addEventListener("click",function(){go(true)});
/* 2 Nov 2026: always ask Drive on open (only file details; the 2 MB file downloads only when Gemini wrote a new one) */
PosVault.load().then(function(d){data=d;status();chips();render();go(true)});
})();
</script>
</body></html>
